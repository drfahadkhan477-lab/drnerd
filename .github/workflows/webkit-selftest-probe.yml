name: webkit-selftest-probe (measurement, not for merge)

# TEMPORARY. verify-selftest.js loses its page in WebKit ("the browser CRASHED
# the page"). Round 1 measured 15 crashes in 24 runs, every one a
# "trap invalid opcode in libWPEWebKit" (a WebKit release assertion) in the
# web process or its ThreadedCompositor thread, with WebKit at ~150 MB and
# 12 GB free: not memory. Round 2 runs the same suite against copies of the
# build with one compositing ingredient of the figure viewer switched off each,
# to find which one the assertion needs. Round 2 (12 runs each): baseline 2,
# no backdrop-filter 3, no will-change 5, no animation/transition 0 crashes.
# Round 3 splits motion into the overlay's fade-in and the image's opacity
# transition, at 24 runs each. Only the probe's copy of the build is
# altered. Deleted before this branch is merged.

on:
  push:
    branches: [claude/pensive-bell-fapazl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: selftest in WebKit, ${{ matrix.variant }}, shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-motion, no-overlay-fade, no-img-transition]
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SYSTOLE_ENGINE: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: install
        run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: build the synthetic app, then switch one ingredient off
        run: |
          node scripts/synthetic-export.js build/synthetic/export.html
          node scripts/assemble-app.js build/synthetic/export.html --refs build/synthetic/refs --ref-images build/synthetic/refs-images --out build/synthetic/systole.html
          case "${{ matrix.variant }}" in
            no-motion)      CSS='*,*::before,*::after{animation:none!important;transition:none!important}' ;;
            no-overlay-fade)   CSS='#peek,#peek *{animation:none!important}' ;;
            no-img-transition) CSS='.figv-scroll img{transition:none!important}' ;;
            *)              CSS='' ;;
          esac
          if [ -n "$CSS" ]; then
            node -e 'const fs=require("fs"),f="build/synthetic/systole.html",s=fs.readFileSync(f,"utf8"),i=s.lastIndexOf("</head>");if(i<0)process.exit(2);fs.writeFileSync(f,s.slice(0,i)+"<style id=\"probe\">"+process.argv[1]+"</style>"+s.slice(i))' "$CSS"
            grep -c 'id="probe"' build/synthetic/systole.html
          fi
          grep -m1 "model name" /proc/cpuinfo
      - name: run verify-selftest four times
        run: |
          set +e
          crashes=0
          for i in 1 2 3 4; do
            sudo dmesg -C 2>/dev/null
            node tests/verify-selftest.js build/synthetic/systole.html > /tmp/out.txt 2>&1
            code=$?
            trap_line=$(sudo dmesg | grep -m1 "traps:" | sed -E 's/.*traps: //; s/ ip:.*//')
            [ -n "$trap_line" ] && crashes=$((crashes+1))
            echo "=== ${{ matrix.variant }} shard ${{ matrix.shard }} iteration $i: exit $code; trap: ${trap_line:-none}; $(grep -E 'passed, [0-9]+ failed' /tmp/out.txt)"
            grep -E "^  FAIL" /tmp/out.txt | head -5
          done
          echo "=== RESULT ${{ matrix.variant }} shard ${{ matrix.shard }}: $crashes crash(es) in 4"
          exit 0
