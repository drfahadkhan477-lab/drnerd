# Systole CI — the honest subset.
#
# ACTIONS ARE PINNED TO COMMIT SHAS, NOT TO TAGS. A tag is a moveable label:
# whoever controls the action's repository can repoint @v4 at different code,
# and every job here would run it on the next push without a diff to notice.
# Two external reviews asked for this and were right.
#
# It sat unpinned for a while because a pin to a SHA nobody has checked fails
# every job on its first run, which is worse than the risk it removes, and the
# tags could not be resolved from where the workflow was being edited. They can
# be now, so each SHA below was resolved AND verified to be a commit object
# (not an annotated tag object, which would not work) before being written in.
#
# TO UPDATE ONE, resolve the tag and confirm the object type first:
#
#   git ls-remote https://github.com/actions/checkout refs/tags/v4
#   git ls-remote https://github.com/actions/checkout 'refs/tags/v4^{}'
#
# If the second command prints nothing the tag is lightweight and the first
# SHA is the commit; if it prints a different SHA, that peeled one is the
# commit and the one to use. Keep the human-readable version in the trailing
# comment — it is the only thing that makes the pin auditable at a glance.
#
# READ THIS BEFORE TRUSTING A GREEN CHECKMARK. Of the 6447 checks in
# `node scripts/verify.js` plus 134 more under `--pwa`, this workflow runs 6364.
# The other 217 all drive something this workflow cannot have: the real
# bank. The app is built here, but around an invented bank (the
# synthetic-browser job), because the real one is the ACCSAP 12 export — the
# licensed question bank, deliberately never committed to this repository or
# to any secret GitHub holds. What needs the real bank itself (its corrected
# answer keys, its content flags, search quality over its library, how long
# it takes to load) and the split build under --pwa are measured only on a
# machine with the export, so there is no way to run those 217 checks here.
# See docs/BUILD.md and the comment at the top of scripts/build.js for why,
# and README.md for how to run the full suite yourself, against your own copy.
#
# What runs here needs no source file, and is genuinely worth having on every
# push. Most of it needs no browser either; the memorizer-browser job drives
# the Memorizer — a second app that carries no licensed content — in Chromium,
# WebKit and Firefox, and the synthetic-browser job drives this app in Chromium:
#
#   syntax       every .js and .py file in the repo parses, and the two
#                listing commands (which patch chain steps exist, which test
#                suites exist) don't crash. Cheap, and it catches a real class
#                of mistake — a chain step registered under one name and
#                shipped under another, a patch script with a stray syntax
#                error nobody would notice until running the full chain by
#                hand.
#
#   logic        the 87 suites that are pure Node with no Playwright and no
#                built artifact at all. It started at nine and this sentence
#                still said nine at eighteen, because the list was maintained
#                by hand and nothing read it; the count is now checked in
#                verify-stats against the suites this file actually invokes,
#                so it cannot drift again. Broadly they cover:
#
#                  the arithmetic  — verify-fsrs (when a card comes back),
#                    verify-physio-pure (valve events as real pressure
#                    crossings), verify-leads-pure (Einthoven and Goldberger,
#                    exact to floating point), verify-calib-pure (which says
#                    nothing rather than something wrong on sparse data),
#                    verify-figzoom-pure (zoom-about-a-point, where drift is
#                    invisible by eye), verify-rhythms-pure (an arrhythmia in
#                    the picker that nothing knows how to draw)
#                  the untrusted input — verify-worker (the Cloudflare Worker,
#                    driven directly as a request handler), verify-zip (an
#                    imported archive cannot spend more memory than the device
#                    has), verify-vision-pure, verify-memory-pure,
#                    verify-profile-pure, verify-refassets-pure
#                  the project's own discipline — verify-engine (the browser
#                    engine stays a flag), verify-leakguard, verify-release,
#                    verify-contentrules, verify-oracle, and verify-stats
#                    (that the counts quoted in this comment, the README and
#                    BUILD.md are the counts the tests actually produced —
#                    this file said both "1052" and "1210" for one quantity
#                    until that check existed).
#                Across every job, 6364 real checks, up
#                from 89: the physiology and the 12-lead geometry were pure
#                arithmetic behind a Playwright harness they never needed,
#                which meant the most mathematically load-bearing code in the
#                project was invisible here. It no longer is.
#
#   build-guard  scripts/build.js must still refuse to run without a source
#                file, with a clear message, and exit non-zero. This is
#                asserting the ABSENCE of a feature on purpose — if that
#                guard were ever loosened to "warn and continue anyway," this
#                is what would notice before a build silently shipped without
#                the fellow's own realized intent.
#
#   synthetic-browser  the app's own browser suites, on the real app built
#                around an invented bank; see the job for which suites and
#                why the rest are left out.
#
# Adding the other 217 checks to this file is possible — GitHub Actions
# supports encrypted repository secrets, and a workflow could decode the
# export from one, build the app, and run the rest — but that means the
# licensed export living, encrypted, inside GitHub's infrastructure rather
# than only on your own devices. That is a real, deliberate choice about
# where a copy of paid content lives, not a technical detail, and it is not
# made here. If you want that tier, say so explicitly and it can be added.

name: verify (source-independent subset)

on:
  # A push to a branch that has a pull request used to run this whole
  # workflow twice, once as `push` and once as `pull_request`: two sets of
  # the same twelve-minute jobs for every commit. A branch is now tested as
  # its pull request; `push` is for master, where a merge is tested as it
  # lands. tests/verify-testpublic-pure.js holds this shape.
  push:
    branches: [master]
  pull_request:
  # The `full` job's own `if:` asks for this event, and GitHub only offers the
  # "Run workflow" button for a workflow that declares it on the default
  # branch. Without this line the job could never be selected.
  workflow_dispatch:

# Read-only, for every job. Nothing here writes to the repository, comments,
# or publishes; each job checks out and runs Node. Without this block the jobs
# get the repository's default token, which may be read-write — and nothing
# could notice that while GitHub was unable to parse this file at all.
permissions:
  contents: read

# A newer push to a pull request makes the run still going for the one before
# it pointless, so it is cancelled. Master is never cancelled: every merge is
# tested to the end.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    name: syntax — every file parses, both listings work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: every .js file parses
        run: |
          set -e
          find scripts src tests tools memorizer -name '*.js' -print0 \
            | xargs -0 -n1 node --check
      - name: every .py tool parses
        run: |
          set -e
          find tools -name '*.py' -print0 \
            | xargs -0 -n1 python3 -m py_compile
      - name: the patch chain lists without crashing
        run: npm run steps
      - name: the verify suite list lists without crashing
        run: npm run suites
      - name: Memorizer builds into one file (it needs no licensed source)
        run: |
          set -e
          node scripts/build-memorizer.js --out "$RUNNER_TEMP/memorizer"
          test -s "$RUNNER_TEMP/memorizer/index.html"
          node --check "$RUNNER_TEMP/memorizer/sw.js"

  logic:
    name: logic — every suite that needs no browser and no build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: FSRS-5–derived scheduling (89 checks)
        run: node tests/verify-fsrs.js
      - name: the scheduler against ts-fsrs, on our own weights (15 checks)
        run: node tests/verify-oracle.js
      - name: the Cloudflare Worker request handler (73 checks)
        run: node tests/verify-worker.js
      - name: the cardiac cycle's physics (23 checks)
        run: node tests/verify-physio-pure.js
      - name: the 12-lead's geometry and morphology (47 checks)
        run: node tests/verify-leads-pure.js
      - name: the ZIP reader's memory ceiling (12 checks)
        run: node tests/verify-zip.js
      - name: the calibration arithmetic (26 checks)
        run: node tests/verify-calib-pure.js
      - name: the figure viewer's zoom arithmetic (16 checks)
        run: node tests/verify-figzoom-pure.js
      - name: a figure that fails to load must still appear (14 checks)
        run: node tests/verify-figfade-pure.js
      - name: the palette patches' quoted contrast figures are real (19 checks)
        run: node tests/verify-palette-pure.js
      - name: the home strip's rotation never repeats and excludes vfib (32 checks)
        run: node tests/verify-herorhythm-pure.js
      - name: a corpus with no figures in it still builds (15 checks)
        run: node tests/verify-refimg-pure.js
      - name: every anchor into the shell markup still matches (10 checks)
        run: node tests/verify-shellanchor-pure.js
      - name: the Pencil width curve, without a canvas (38 checks)
        run: node tests/verify-pencil-pure.js
      - name: the Living Diagram's timing and view-cycling, without a screen (31 checks)
        run: node tests/verify-livingdiagram-pure.js
      - name: the conduction pathway fires in order, against real timing (25 checks)
        run: node tests/verify-conductionwave-pure.js
      - name: the coronary tree's branch geometry and flow-glow curve (29 checks)
        run: node tests/verify-coronarytree-pure.js
      - name: the engine is a flag, not thirty-four hardcoded copies of one (96 checks)
        run: node tests/verify-engine.js
      - name: the licensed question bank cannot be committed (40 checks)
        run: node tests/verify-leakguard.js
      - name: a Claude Code session cannot read the licensed export (24 checks)
        run: node tests/verify-claude-guard.js
      - name: the Claude Code subagents cannot edit files (47 checks)
        run: node tests/verify-claude-agents.js
      - name: the Claude Code skills are found and cite only what exists (37 checks)
        run: node tests/verify-claude-skills.js
      - name: a study file is checked by Memorizer's own import code (26 checks)
        run: node tests/verify-study-file-check.js
      - name: the built file cuts into the app and its payloads losslessly, and the app carries none of the bank (45 checks)
        run: node tests/verify-app-slots-pure.js
      - name: the app assembles from app/systole.html as the chain builds it (24 checks)
        run: node tests/verify-assemble-pure.js
      - name: a piece carved out of the shell loses nothing, and the committed app/ is whole (68 checks)
        run: node tests/verify-carve-pure.js
      - name: the synthetic export builds the real app, and is marked so its run is never recorded (26 checks)
        run: node tests/verify-synthetic-pure.js
      - name: each heart sound and murmur is on the valve events physio measures, with the shape and pitch of its lesion (58 checks)
        run: node tests/verify-lab-pure.js
      - name: the study plan fits the time, puts the most forgotten first and the weak chapters next, and never throws on damaged data (39 checks)
        run: node tests/verify-plan-pure.js
      - name: questions on one topic are gathered into a run by their distinctive words, never across chapters, never as a pair (27 checks)
        run: node tests/verify-topicrun-pure.js
      - name: a spoken answer is understood as speech recognition delivers it, a doubtful one is asked again, and the session ends with a summary (29 checks)
        run: node tests/verify-voice-pure.js
      - name: every icon the app names is drawn by the one sprite in the page, and no symbol is defined anywhere else (7 checks)
        run: node tests/verify-icons-pure.js
      - name: each pressure tracing shows what it is named for, measured from the curve, and the drill offers what is due and the look-alikes (99 checks)
        run: node tests/verify-drills-pure.js
      - name: the release gate never claims more than it measured (59 checks)
        run: node tests/verify-release.js
      - name: a structurally broken question is caught, a sound one is left alone (24 checks)
        run: node tests/verify-contentrules.js
      - name: an inference is not read back as something the fellow said (20 checks)
        run: node tests/verify-memory-pure.js
      - name: text inside a figure is data, never an instruction (23 checks)
        run: node tests/verify-vision-pure.js
      - name: a torn store costs the profile line, never the turn (20 checks)
        run: node tests/verify-profile-pure.js
      - name: imported figures survive a note list that has not loaded (36 checks)
        run: node tests/verify-refassets-pure.js
      - name: every arrhythmia the picker offers has something that draws it (23 checks)
        run: node tests/verify-rhythms-pure.js
      - name: nothing in src/ uses syntax an iPad cannot parse (13 checks)
        run: node tests/verify-ipad-pure.js
      - name: the newer copy survives and a refused write is not lost (56 checks)
        run: node tests/verify-store-pure.js
      - name: the counts in the docs are the counts the tests produced (60 checks)
        run: node tests/verify-stats.js
      - name: a stem that points at a picture is caught, and the count is honest (36 checks)
        run: node tests/verify-figaudit.js
      - name: a dead suite is diagnosed by what killed it, not by what it last printed (32 checks)
        run: node tests/verify-cause-pure.js
      - name: nothing a model says can become something the page runs (39 checks)
        run: node tests/verify-md-pure.js
      - name: a big square is 0.2 s, on every canvas the panel is given (66 checks)
        run: node tests/verify-ecg12-pure.js
      - name: a splash that cannot load the bank says which failure it was (51 checks)
        run: node tests/verify-loader-pure.js
      - name: a split build cannot be half of one build and half of another (52 checks)
        run: node tests/verify-provenance-pure.js
      - name: a deploy landing under a running app leaves a pair that is noticed (49 checks)
        run: node tests/verify-swupdate-pure.js
      - name: no native dialog arrives unmeant, and an icon is not a name (18 checks)
        run: node tests/verify-ui-pure.js
      - name: the corpus checker holds every floor it claims (17 checks)
        run: node tests/verify-refscheck-pure.js
      - name: the echo tables and the echo arithmetic (59 checks)
        run: node tests/verify-echo-pure.js
      - name: Echo Studio computes only what was measured (58 checks)
        run: node tests/verify-echoui-pure.js
      - name: echo-patch's anchors still exist where it runs (24 checks)
        run: node tests/verify-echoanchor-pure.js
      - name: the notes search ranks, quotes and escapes (41 checks)
        run: node tests/verify-notesearch-pure.js
      - name: the heart loads a mesh baked at build time, and refuses any other copy (36 checks)
        run: node tests/verify-heartbake-pure.js
      - name: the split build ships src/ without its comments, and nothing else changes (28 checks)
        run: node tests/verify-stripcomments-pure.js
      - name: the note figures load after the home screen, one unit at a time (29 checks)
        run: node tests/verify-refimgdefer-pure.js
      - name: a reference unit adds only what is new and high yield, and what it writes the importer reads and check-refs passes, under titles someone could search by, each passage once (66 checks)
        run: node tests/verify-refsmerge-pure.js
      - name: word order counts in the ranker — the note holding the phrase outranks one holding its words scattered, and questions rank as before (9 checks)
        run: node tests/verify-phrase-pure.js
      - name: an older ACC bank imports by layout, answer keys map back to their questions, a question is kept only with its answer, what the bank has is skipped, a page that fails says which rule failed it, no word of it is printed, a key its own commentary contradicts is refused, a question with no explanation says so, a merged build carries exactly the staging, a bold heading naming no "Question" starts one, every figure type is served as an image, and an unanswered explanation is probed letter by letter (176 checks)
        run: node tests/verify-olderacc-pure.js
      - name: extraction refuses an unsafe id, an image whose bytes are not its mime, damaged base64, and a bank that breaks the content schema, and a refusal leaves the last good content untouched (30 checks)
        run: node tests/verify-extract-pure.js
      - name: the code-only deploy's package — packed, read back and checked by the page's own code; every bad package refused, naming why, quoting nothing; the reference notes travel in it too, and the written schema names the version the code enforces (28 checks)
        run: node tests/verify-bankpack-pure.js
      - name: npm test runs every suite this workflow runs, from this file's own list, and a failure, a missing suite or a missing browser fails it, and a pure-only run says what it left out (33 checks)
        run: node tests/verify-testpublic-pure.js
      - name: each build in its own workspace, suite tags read from each suite's code, a JSON report that carries no output text, a doctor that says what to fix, and a clean that cannot reach the export (42 checks)
        run: node tests/verify-devtools-pure.js
      - name: Memorizer — every word of a PDF taught once, headings kept with their body, topics as sections, highlights never figures, a boxed table named by its own title, the Cloudflare zip read back (250 checks)
        run: node tests/verify-memorizer-chunk-pure.js
      - name: Memorizer — held to your PDF, only one section sent, a bad reply never a pass, the protocol cached (89 checks)
        run: node tests/verify-memorizer-prompts-pure.js
      - name: Memorizer — teach, memorise, then drill; every miss typed, one card, and kept until it graduates; review rounds interleaved (142 checks)
        run: node tests/verify-memorizer-session-pure.js
      - name: Memorizer — the built-in coach needs no key, invents nothing, asks multiple-choice questions that test reasoning, explains them, makes the cards to memorise, and re-teaches by the kind of miss (166 checks)
        run: node tests/verify-memorizer-coach-pure.js
      - name: Memorizer — Daylight by day, Clinical at night, Paper, Neuron, Ice, Butter, Mint Night, Graphite and Cyber Grape, and Systole's Contrast, readable at every contrast and brightness, on glass and aurora as well as solid, each drawing the brain in its own colours (53 checks)
        run: node tests/verify-memorizer-appearance-pure.js
      - name: Memorizer — the home screen's progress, streak, brain and its live impulses, pearl, the pearl's figure or table, and weak spots say true things (133 checks)
        run: node tests/verify-memorizer-home-pure.js
      - name: Memorizer — a whole textbook, its parts in order and its chapters found three ways (43 checks)
        run: node tests/verify-memorizer-book-pure.js
      - name: Memorizer — asking your book answers in its own sentences, with pages, or says nothing was found (38 checks)
        run: node tests/verify-memorizer-ask-pure.js
      - name: Memorizer — the on-device AI says nothing the book does not (68 checks)
        run: node tests/verify-memorizer-ground-pure.js
      - name: Memorizer — search by meaning, its measured floor, and its merge with search by words (14 checks)
        run: node tests/verify-memorizer-vec-pure.js
      - name: Memorizer — a lesson laid out to be remembered — clinical headings, number tiles, the section at a glance, nothing twice (31 checks)
        run: node tests/verify-memorizer-sheet-pure.js
      - name: Memorizer — figures made from the book, every word the lesson's (17 checks)
        run: node tests/verify-memorizer-figure-pure.js
      - name: Memorizer — the Coach as an agent — it picks a tool, remembers the topic, and uses a model's plan only when it names a real tool, names what is still weak, and runs a message as steps, each decided by what the last found — and, with the on-device model, a loop whose answer holds to what its tools found, the new tools, and what it remembers (76 checks)
        run: node tests/verify-memorizer-agent-pure.js
      - name: Memorizer — studying beyond the drill — recall and figure cards from the book, section checks days apart, timed practice, confidence, cases, an exam plan, teach-back, corrections, notes, the mastery map, the week and the streak (110 checks)
        run: node tests/verify-memorizer-study-pure.js
      - name: Memorizer — where a unit came from — a real SHA-256 of its bytes, a duplicate recognised, an import report that counts what happened (31 checks)
        run: node tests/verify-memorizer-provenance-pure.js
      - name: Memorizer — a study pack written with Claude, its prompt carrying the chapter and its reply held to the book before any of it is used (105 checks)
        run: node tests/verify-memorizer-pack-pure.js
      - name: Memorizer — a study file, markdown or a saved HTML page, made a unit — every question read, an unmarked answer never guessed, its points and questions held to the unit's own text, a deleted section's diagrams with it (52 checks)
        run: node tests/verify-memorizer-studyimport-pure.js
      - name: Memorizer — what the misses say — the pairs taken for one another, each missed item's attempts in order, a lapse named (13 checks)
        run: node tests/verify-memorizer-misses-pure.js
      - name: Memorizer — one study format for both Claude prompts — spec.js's rules in each word for word, the enforced counts, the study-file prompt's example read and passed, the doc generated, a decision flowchart's yes and no not read as claims (44 checks)
        run: node tests/verify-memorizer-spec-pure.js
      - name: Memorizer — explain it first — on a later day the lesson waits for what you remember, the gaps taught first (8 checks)
        run: node tests/verify-memorizer-recall-pure.js
      - name: Memorizer — the review's layout rules — a lesson's first five points, a unit's one next step and why (14 checks)
        run: node tests/verify-memorizer-layout-pure.js

  # ── Memorizer in a real browser ────────────────────────────────────────────
  #
  # A BROWSER JOB THAT NEEDS NO STAND-IN, because Memorizer carries no
  # licensed content: scripts/build-memorizer.js builds it from this
  # repository alone, and both suites generate their own documents — a PDF
  # written byte by byte, and pasted notes — so nothing of anyone's is read.
  # Until this job existed the Memorizer's pure suites ran on every push and
  # its whole-app suites never did: the glue between the modules (pdf.js's
  # output reaching the chunker, a session surviving a reload, a failed save
  # being said) was proven only when someone remembered to run it.
  #
  # NETWORK: verify-memorizer fetches pdf.js, and the text reader for scanned
  # pages, from jsDelivr at pinned versions and checks them against their
  # integrity hashes, as the app does. verify-memorizer-hardening uses pasted
  # notes only and fails any request that leaves the page other than to the
  # stubbed model. verify-memorizer-studyimport fetches nothing: its HTML pages
  # are written in the suite. verify-memorizer-offline fetches the pinned
  # readers from jsDelivr, as verify-memorizer does.
  #
  # IN WEBKIT TOO, because the device this is for is an iPad and an iPad is
  # WebKit. Every suite here launches through tests/_engine.js, so the engine
  # is SYSTOLE_ENGINE and nothing else changes between the three entries. The
  # Chromium entry keeps its name exactly, so nothing that looks a check up
  # by name loses it. fail-fast is off: an engine failure must not cancel
  # the other engines. Firefox uses the same suites and assertions. Each
  # suite runs even when the one before it failed (!cancelled()), so one run
  # shows every failure on an engine, not only the first; the job is still red.
  #
  # Playwright's WebKit on Linux is WebKitGTK, not Safari on iPadOS. It shares
  # the engine, the JavaScript core and IndexedDB, which is what these suites
  # exercise; it is not a substitute for opening the app on the iPad.
  memorizer-browser:
    name: memorizer-browser — the whole app, in ${{ matrix.label }}, on documents made for the test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            label: Chromium
          - engine: webkit
            label: WebKit
          - engine: firefox
            label: Firefox
    env:
      SYSTOLE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: install the pinned test tools, and the browser
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.engine }}
      - if: ${{ !cancelled() }}
        name: Memorizer — a real PDF through lesson, drill, exam, review, reload, figures and scanned pages (483 checks)
        run: node tests/verify-memorizer.js
      - if: ${{ !cancelled() }}
        name: Memorizer — a double tap lands once, a failed save stores nothing half-way and says so, a late reply is dropped, a dialog holds focus (64 checks)
        run: node tests/verify-memorizer-hardening.js
      - if: ${{ !cancelled() }}
        name: Memorizer — a saved HTML page and the Import Study dialog — options and answers read right, a modal that closes every way, too large refused, and no half-imported unit (69 checks)
        run: node tests/verify-memorizer-studyimport.js
      - if: ${{ !cancelled() }}
        name: Memorizer — Prepare for offline with the app's service worker — nothing ready before, every pinned reader kept after, served from the cache byte for byte while the network answers otherwise, and with the network cut (12 checks)
        run: node tests/verify-memorizer-offline.js
      - if: ${{ !cancelled() }}
        name: Memorizer — your data and what the page may do — the backup reminder on the app's own backup, an orphan that would spoil a backup removed, the policy keeping requests to the app's own hosts, the AI model's files read back and checked (18 checks)
        run: node tests/verify-memorizer-data.js
      - if: ${{ !cancelled() }}
        name: the code-only deploy in a real browser — the loader shows the import screen and never asks the host for content, a refused package changes nothing, a good one launches the app on blob figures, the notes are served from the package, a replacement is whole or not at all, and a normal build is untouched (25 checks)
        run: node tests/verify-bankstore.js
      - if: ${{ !cancelled() }}
        name: the Lab, built and driven — the audio played is the heart sound asked, nothing names an answer early, progress is stored and survives a reload, and the heart map is drawn from the map (67 checks)
        run: node tests/verify-lab.js

  # ── the app itself, built around an invented bank ───────────────────────────
  #
  # The real app cannot be built here: its bank is the licensed export. Since
  # scripts/assemble-app.js (step 2 of retiring the patch chain, docs/BUILD.md)
  # it can be built from app/systole.html around ANY export, so this job builds
  # it around scripts/synthetic-export.js: invented questions, figures and
  # reference notes in the real ones' shape and sizes, held to that by
  # tests/verify-synthetic-pure.js. Everything else in the file is the real
  # app: every module, every patch's result, the real CSS and code.
  #
  # The browser suites run on that build, except the ones whose subject is the
  # real bank itself, which this job cannot honestly run:
  #
  #   keys        the six corrected answers, checked against the real options
  #   retrieval   search quality, measured on the real 295-note library
  #   splash      reads the splash while the real 27 MB bank is still parsing;
  #               a small bank renders first and the splash is already gone
  #
  # and bankstore, which the memorizer-browser job above already runs. The
  # step labels are the counts the record holds for each suite, from the real
  # build. When this job was added every suite here ran exactly that number on
  # this build too, apart from two that had just gained a check.
  #
  # The build is marked synthetic, and scripts/verify.js will not write
  # tests/test-stats.json for a marked build: these numbers are never the
  # record. Chromium only: WebKit takes minutes to parse even this build.
  synthetic-browser:
    name: synthetic-browser — the real app, built around an invented bank, in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: install the pinned test tools, the browser, and what verify-figreview needs
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m pip install Pillow==12.3.0 numpy==2.4.6
      - name: build the app from app/systole.html around the synthetic export
        run: |
          node scripts/synthetic-export.js build/synthetic/export.html
          node scripts/assemble-app.js build/synthetic/export.html --refs build/synthetic/refs --ref-images build/synthetic/refs-images --out build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the single-file build is stable and works offline (27 checks)
        run: node tests/verify-stage0.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the tutor, its tools, and the 3D heart it sits beside (44 checks)
        run: node tests/verify-apex.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: FSRS-5 scheduling replaces SM-2 (25 checks)
        run: node tests/verify-stage2.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: Apex can read figures and remembers who it teaches (31 checks)
        run: node tests/verify-stage3.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: Pencil feel, the hero heart, the rhythm library (79 checks)
        run: node tests/verify-polish.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: grounded mode answers only from your references (24 checks)
        run: node tests/verify-braunwald.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the 12-lead morphology falls out of one dipole (25 checks)
        run: node tests/verify-leads.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the cardiac cycle is computed, not drawn, and keeps its own clock (44 checks)
        run: node tests/verify-physio.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: nine palettes, two axes, unthemed semantics (41 checks)
        run: node tests/verify-theme.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the welcome bar, the progress bar, three layouts (66 checks)
        run: node tests/verify-home.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the photographed heart paints before the app parses (14 checks)
        run: node tests/verify-splash-heart.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: every canvas backs itself at high device-pixel density (8 checks)
        run: node tests/verify-crisp.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: one modular type scale and one spacing scale, still held (12 checks)
        run: node tests/verify-type.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the worked reference notes obey the guide, and are retrievable (39 checks)
        run: node tests/verify-references.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a free provider with real vision, wired to its own wire shape (53 checks)
        run: node tests/verify-gemini.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: Apex still knows you next time, and you can see what it kept (46 checks)
        run: node tests/verify-memory.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: an imported chapter brings its figures, and keeps them (32 checks)
        run: node tests/verify-assets.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the figure Apex is reasoning from is one you can see (41 checks)
        run: node tests/verify-chatfigs.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the home screen opens with something worth knowing (69 checks)
        run: node tests/verify-pearl.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a retrieved note is material to teach from, never an instruction (54 checks)
        run: node tests/verify-boundary.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the panel keeps what you typed, and sends a window not an archive (32 checks)
        run: node tests/verify-chat.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the big stores live in a database, and nothing is ever in neither place (39 checks)
        run: node tests/verify-store.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: going back never re-grades a question or re-schedules a card (24 checks)
        run: node tests/verify-quiznav.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the progress card counts up in step with the bar it sits beside (27 checks)
        run: node tests/verify-homeprog.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the "I have N minutes" card plans a review session of that size, in order, most-forgotten first, and rating in it moves the schedule (15 checks)
        run: node tests/verify-planscreen.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the Topic runs card asks three to five questions about one thing, in one chapter, each holding the words it says they share, from what you missed (13 checks)
        run: node tests/verify-topicrunscreen.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the Voice card reads a session aloud, scores a spoken letter as a tap would, rates it, skips and stops on command, and ends when you leave (21 checks)
        run: node tests/verify-voicescreen.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the exam date is set on the plan card, counted down from the calendar, kept across a reload, and refused when it is not a real day (17 checks)
        run: node tests/verify-examdate.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the Study cards draw the app's own numbers, every icon resolves, and the voice dock runs and stops a session (26 checks)
        run: node tests/verify-studyvisuals.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the chapter grid staggers in, and its bar fills instead of arriving drawn (21 checks)
        run: node tests/verify-chapters.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: render() throwing shows a real screen, never a blank or frozen one (7 checks)
        run: node tests/verify-failsafe.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a restored backup appears now, not only after the next launch (19 checks)
        run: node tests/verify-backup.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the semantic colour names alias the legacy hue names, not just resemble them (119 checks)
        run: node tests/verify-tokens.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: confidence is an option not a gate, and a tagged miss updates one row (28 checks)
        run: node tests/verify-calibrate.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a figure can be examined, and still has four ways out (44 checks)
        run: node tests/verify-figzoom.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: focus mode reclaims the bar’s space, and never the progress or the confidence row (25 checks)
        run: node tests/verify-focus.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: an older copy of the app cannot silently eat a newer one’s saved data (17 checks)
        run: node tests/verify-schema.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the on-device self-test reports honestly, and can actually fail (27 checks)
        run: node tests/verify-selftest.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: every screen fits, at every frame a real device produces (26 checks)
        run: node tests/verify-layout.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the review sheet records the box in original pixels, not preview pixels (35 checks)
        run: node tests/verify-figreview.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a suite that reads after a screen change reads the new screen, not the old one (21 checks)
        run: node tests/verify-render.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the policy contains an injection without breaking anything the app does (20 checks)
        run: node tests/verify-csp.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: Echo Studio routes, delegates and keeps the caret where it was (26 checks)
        run: node tests/verify-echo.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a figure that never rendered is told apart from one that rendered invisibly (10 checks)
        run: node tests/verify-figprobe.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the Coronary view draws the left bed collapsing in systole, on one scale (8 checks)
        run: node tests/verify-coronaryview.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the Living Diagram waits, stays off the quiz, wakes without a click-through, frees its GL (27 checks)
        run: node tests/verify-ambient.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: neutral controls turn to glass, colours that mean something do not, and High contrast and reduced motion are left alone (31 checks)
        run: node tests/verify-glass.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the notes search opens, keeps the caret, and opens a note with its figures (17 checks)
        run: node tests/verify-notesearch.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: the home hero beats on the rhythm, and the home screen spends no WebGL (31 checks)
        run: node tests/verify-heroart.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: Apex can take the whole page, and a numbered list stays numbered (19 checks)
        run: node tests/verify-apexpage.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a chapter you left is the chapter you come back to (27 checks)
        run: node tests/verify-resume.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: no figure is drawn wider than the pixels it has (9 checks)
        run: node tests/verify-figsharp.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: navigating the app does not spend WebGL contexts (25 checks)
        run: node tests/verify-heartreuse.js build/synthetic/systole.html
      - if: ${{ !cancelled() }}
        name: a reply can be stopped, and the last chunk is painted however the stream ends (27 checks)
        run: node tests/verify-flushguard.js build/synthetic/systole.html

  build-guard:
    name: build-guard — refuses to run without the licensed source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: build.js exits non-zero and explains why, with no source present
        run: |
          set +e
          output="$(node scripts/build.js 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::scripts/build.js exited 0 with no source file present — it must refuse to build."
            exit 1
          fi
          if ! echo "$output" | grep -q "deliberately not in this repository"; then
            echo "::error::scripts/build.js failed, but not with its documented refusal message — the guard may have changed shape."
            exit 1
          fi

  # ── the other 1552 checks, on a machine that has the export ────────────────
  #
  # Everything above runs on GitHub's runners and therefore cannot build the
  # app: scripts/build.js refuses without the ACCSAP 12 export, the export is
  # licensed, and it is deliberately not in this repository nor in any secret
  # GitHub holds. That is why the three jobs above are "the honest subset".
  #
  # This job closes that gap the only way it can be closed — by running on a
  # machine that already has the export, which means the owner's laptop acting
  # as a self-hosted runner. It is opt-in: with no runner registered it simply
  # never starts, and the jobs above are unaffected.
  #
  # ─ WHY IT PRINTS SO LITTLE ─────────────────────────────────────────────────
  #
  # A GitHub Actions log is shared infrastructure. Suite output quotes question
  # text — that is why tests/last-run.log is gitignored — so streaming a verify
  # run into a workflow log would upload the licensed corpus to Microsoft by a
  # route nobody thought of as uploading. The whole design of this job is that
  # constraint:
  #
  #   · release-check runs every step with stdio ['ignore','pipe','pipe'], so no
  #     subprocess writes to this log directly. What it does report about a step
  #     goes through safeDetail(), which rebuilds a line from facts it could
  #     parse — integers, and suite names checked against the registry verify.js
  #     actually runs — and emits nothing it could not. An unrecognised failure
  #     becomes an exit code and a pointer to the local log. (The first draft of
  #     this comment claimed the stdout was "ids and a verdict, nothing else".
  #     It was not: record() printed the failing subprocess's last three lines.)
  #   · build/release-report.md is NEVER echoed and NEVER uploaded as an
  #     artifact. It stays on the machine that produced it.
  #   · no actions/upload-artifact step exists here, on purpose. Adding one is
  #     how this leaks.
  #
  # So the log answers exactly one question — did it certify, and if not which
  # step failed — and the detail is read on the machine, where it already is.
  #
  # ─ WHY NOT pull_request ────────────────────────────────────────────────────
  #
  # A self-hosted runner executes whatever the workflow says, on real hardware
  # with the licensed corpus and the owner's home directory on it. On a
  # pull_request trigger, that is code from the PR's branch. This repository is
  # private and single-author, so the exposure is small — but the mitigation is
  # free, so this job runs only on pushes to master and on manual dispatch.
  # Do not add pull_request here without reading GitHub's own warning about
  # self-hosted runners and untrusted workflows.
  full:
    name: full — the browser suites, on a machine with the export
    runs-on: [self-hosted, systole]
    # MANUAL ONLY, UNTIL A RUNNER EXISTS AND HAS BEEN PROVEN.
    #
    # `push` was here first and was wrong. A job whose labels match no online
    # runner does not fail — it QUEUES, and GitHub only cancels a pending job
    # after about 24 hours, so every push to master would have left a check
    # pending on master for a day. timeout-minutes does not help: it bounds
    # execution, not the wait for a runner. The comment below said otherwise
    # and was simply incorrect.
    #
    # Opt-in has to mean nothing happens until someone asks. Once a runner is
    # registered and a dispatched run has gone green end to end, add
    #
    #     || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    #
    # and it becomes automatic. Not before: an unregistered runner turning
    # master's checks yellow is how a team learns to ignore them.
    #
    # master only. A manual run can name any branch or tag, and checkout would
    # then execute that ref here, beside the export. Anyone with write access
    # could dispatch it. The ref check keeps "manual" from meaning "any code".
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    # A queued run holding build/ while another starts is how two release
    # checks overwrite each other's artifacts. One at a time, and let the
    # running one finish rather than cancelling it mid-build.
    concurrency:
      group: systole-full
      cancel-in-progress: false
    # This bounds a run that HANGS; it does nothing about a run that never
    # starts, which is why the trigger above is manual. The first figure here
    # was written before the job had ever run, and the first real run was
    # cancelled by it with one of the three suite passes finished. It is
    # GitHub's own ceiling for a hosted job until a complete run says what a
    # run on the runner actually costs. Size it from that run, not from this
    # comment.
    timeout-minutes: 360
    # The steps below are POSIX sh. A Linux or macOS runner runs them in bash
    # anyway; a Windows runner defaults to PowerShell, where `if [ -z ... ]` is
    # a parse error and "$SYSTOLE_SOURCE" is an undefined variable rather than
    # the environment. Saying bash makes the job the same on all three.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # SYSTOLE_SOURCE is set in the runner's own environment (its .env file or
      # the service definition), never here and never as a repository secret —
      # a secret is a copy, and the rule is that the export has exactly one.
      - name: the licensed export is where the runner says it is
        run: |
          if [ -z "${SYSTOLE_SOURCE:-}" ]; then
            echo "SYSTOLE_SOURCE is not set on this runner."
            echo "Set it to the absolute path of the ACCSAP 12 export in the runner's environment."
            exit 1
          fi
          if [ ! -f "$SYSTOLE_SOURCE" ]; then
            echo "SYSTOLE_SOURCE points at something that is not a file."
            exit 1
          fi
          # Size and digest only — never the name, which can carry the title.
          echo "export present: $(wc -c < "$SYSTOLE_SOURCE") bytes"

      # The build also needs the reference corpus (docs/BUILD.md: "A full green
      # run therefore needs the real corpus, notes and figures both"). It is
      # gitignored, so a fresh checkout has none, and checkout's clean removes
      # whatever the last run staged. SYSTOLE_REFS names the directory on the
      # runner that holds refs/ and refs-images/, the same way SYSTOLE_SOURCE
      # names the export: in the runner's environment, never here.
      #
      # The counts are taken from content/ AFTER the copy, so they measure what
      # the build will read and not what the runner claims to have.
      - name: the reference corpus is where the runner says it is
        run: |
          if [ -z "${SYSTOLE_REFS:-}" ]; then
            echo "SYSTOLE_REFS is not set on this runner."
            echo "Set it to the directory holding refs/ and refs-images/ in the runner's environment."
            exit 1
          fi
          for d in refs refs-images; do
            if [ ! -d "$SYSTOLE_REFS/$d" ]; then
              echo "SYSTOLE_REFS has no $d directory."
              exit 1
            fi
          done
          mkdir -p content
          rm -rf content/refs content/refs-images
          cp -R "$SYSTOLE_REFS/refs" content/refs
          cp -R "$SYSTOLE_REFS/refs-images" content/refs-images
          notes=$(find content/refs -type f -name '*.md' | wc -l)
          images=$(find content/refs-images -type f | wc -l)
          if [ "$notes" -eq 0 ] || [ "$images" -eq 0 ]; then
            echo "the corpus staged empty: $notes note files, $images image files."
            exit 1
          fi
          # Counts only, never a name: a note's filename is its topic.
          echo "corpus staged: $notes note files, $images image files"

      # Without this the checkout has no node_modules, and scripts/verify.js
      # falls back to whatever playwright is installed globally on the runner.
      # The first complete runs here were on a global 1.63.0 while package.json
      # pins another, so they certified nothing about the pinned browsers.
      # `playwright install` is a no-op when the pinned builds are already in
      # the runner's browser cache.
      - name: the pinned playwright, from the lockfile
        run: |
          npm ci
          npx playwright install chromium webkit

      # NO SEPARATE leak-guard STEP HERE, and that is deliberate. The obvious
      # thing to write is `run: node scripts/leak-guard.js` before the gate. On
      # a fresh checkout it stages nothing, checks 0 files and exits 0 — it
      # would pass exactly as happily with the script deleted. release-check
      # runs leakguard as its own step, against something, which is the
      # difference between a gate and a decoration.

      # The gate itself. Exit 0 only if every step ran AND passed; INCOMPLETE
      # if something was skipped, which is not a pass. Its stdout is the
      # verdict and the failing step ids, and that is all this log will hold.
      - name: release-check
        # --silent: npm otherwise prints the expanded command, path and
        # filename included, before release-check.js can sanitise anything.
        run: npm run --silent release-check -- "$SYSTOLE_SOURCE"

      # Runs even when the gate failed, because "which step" is the one thing
      # worth having here and a failed run is when you want it. Still ids only:
      # the report is read on the machine.
      - name: where to look
        if: always()
        run: |
          echo "Full report (on this machine, not uploaded): build/release-report.md"
          echo "Failing suite output: tests/last-run.log"
