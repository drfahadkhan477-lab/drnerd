      - name: one circulation of elastance chambers, valves with leaflets and blood with mass, and Windkessel beds makes each lesion fall in its textbook ranges, keeps its blood, settles, opens a valve only on a forward gradient and passes nothing once it is shut, and hands the views one beat whose events are where its leaflets open and seal and whose loop has its corners on its own lines and moves under each PV intervention as the textbook says and whose leaks run backward and whose two heart sounds split as the textbook says, and gives the 3D heart each lesion read off its beat (149 checks)
