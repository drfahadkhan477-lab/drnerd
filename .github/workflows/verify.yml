  # ── the browser suites that need no build ──────────────────────────────────
  #
  # Two suites that drive a browser on pages they write themselves, so they
  # need neither the export nor the synthetic build: verify-bankstore (the
  # code-only deploy's loader, on an invented package) and verify-suitecache
  # (what the result cache learns of a page a browser loads from disk). This
  # job ran the Memorizer's browser suites too until Memorizer moved to its
  # own repository (drfahadkhan477-lab/Memorizer); it was memorizer-browser.
  #
  # IN WEBKIT TOO, because the device this is for is an iPad and an iPad is
  # WebKit. Every suite here launches through tests/_engine.js, so the engine
  # is SYSTOLE_ENGINE and nothing else changes between the two entries.
  # fail-fast is off: an engine failure must not cancel
  # the other engine. Firefox is no longer run here, to save a runner on every
  # push; it is still an engine (`--engine firefox`, SYSTOLE_ENGINE=firefox)
  # for a run by hand. Each
  # suite runs even when the one before it failed (!cancelled()), so one run
  # shows every failure on an engine, not only the first; the job is still red.
  #
  # Playwright's WebKit on Linux is WebKitGTK, not Safari on iPadOS. It shares
  # the engine, the JavaScript core and IndexedDB, which is what these suites
  # exercise; it is not a substitute for opening the app on the iPad.
  public-browser:
    name: public-browser — the code-only deploy and the result cache, in ${{ matrix.label }}
    # Skipped only when the `changes` job (at the end of this file) says the
    # pull request cannot reach it. `!= 'false'` rather than `== 'true'`, so a
    # `changes` job that failed, and wrote nothing, runs this rather than
    # skipping it.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.public != 'false' }}
    runs-on: ubuntu-latest
    # This image matches package-lock.json. Its digest is verified against
    # Microsoft's registry; update it together with the Playwright version.
    # Browser/system packages are already present, avoiding the runner's slow APT mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # GitHub's mounted Home belongs to UID 1001. Firefox, when it ran here,
      # refused a root process using someone else's Home; the process and the
      # directory keep one owner, so it can run here again unchanged.
      options: --user 1001 --ipc=host
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            label: Chromium
          - engine: webkit
            label: WebKit
    env:
      SYSTOLE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: install the pinned test tools
        run: npm ci
      - name: verify the preinstalled pinned browser can render
        run: |
          node - <<'NODE'
          const { launch, engineName } = require('./tests/_engine');
          (async () => {
            const browser = await launch();
            try {
              const page = await browser.newPage();
              await page.setContent('<title>Browser ready</title>');
              if (await page.title() !== 'Browser ready') throw new Error('the page did not render');
              console.log('PASS pinned ' + engineName() + ' browser renders');
            } finally { await browser.close(); }
          })().catch(err => { console.error('FAIL pinned browser readiness: ' + err.message); process.exit(1); });
          NODE
      - if: ${{ !cancelled() }}
        name: the code-only deploy in a real browser — the loader shows the import screen and never asks the host for content, a refused package changes nothing, a good one launches the app on blob figures, the notes are served from the package, a replacement is whole or not at all, and a normal build is untouched (36 checks)
        run: node tests/verify-bankstore.js
      - if: ${{ !cancelled() }}
        name: the result cache's view of the browser — every file a page loads from disk is reported in the engines the cache traces, and the cache stays off for an engine that reports none (20 checks)
        run: node tests/verify-suitecache.js

  # One public artifact for all shards: ../../docs/BUILD.md#browser-shards.
  synthetic-build:
    name: synthetic-build — the app, built once around an invented bank, for the browser shards
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.synthetic != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: build the app from app/systole.html around the synthetic export
        run: |
          node scripts/synthetic-export.js build/synthetic/export.html
          node scripts/assemble-app.js build/synthetic/export.html --refs build/synthetic/refs --ref-images build/synthetic/refs-images --out build/synthetic/systole.html
      - name: hand it to the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-build
          path: build/synthetic/
          if-no-files-found: error
          retention-days: 1

  # Suite steps and runner rationale: ../../docs/BUILD.md#browser-shards.
  synthetic-browser:
    name: synthetic-browser — the real app, built around an invented bank, in Chromium, shard ${{ matrix.shard }}
    needs: [changes, synthetic-build]
    if: ${{ !cancelled() && needs.changes.outputs.synthetic != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    uses: ./.github/workflows/verify-browser-shard.yml
    with:
      job: synthetic-browser
      shard: ${{ matrix.shard }}
      of: ${{ strategy.job-total }}
      selected: ${{ needs.changes.outputs.selected }}

  synthetic-webkit:
    name: synthetic-webkit — the real app, built around an invented bank, in WebKit, the engine the iPad runs, shard ${{ matrix.shard }}
    needs: [changes, synthetic-build]
    if: ${{ !cancelled() && needs.changes.outputs.synthetic != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    uses: ./.github/workflows/verify-browser-shard.yml
    with:
      job: synthetic-webkit
      shard: ${{ matrix.shard }}
      of: ${{ strategy.job-total }}
      selected: ${{ needs.changes.outputs.selected }}

  # Release-shaped public verification: ../../docs/BUILD.md#public-ci.
  split-build:
    name: split-build — the split build, made from an invented bank and served, in ${{ matrix.label }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.synthetic != 'false' }}
    runs-on: ubuntu-latest
    # Reuse the pinned browser image already exercised by public-browser.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            label: Chromium
          - engine: webkit
            label: WebKit
    env:
      SYSTOLE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: install the pinned test tools
        run: npm ci
      - name: verify the preinstalled pinned browser can render
        run: |
          node - <<'NODE'
          const { launch, engineName } = require('./tests/_engine');
          (async () => {
            const browser = await launch();
            try {
              const page = await browser.newPage();
              await page.setContent('<title>Browser ready</title>');
              if (await page.title() !== 'Browser ready') throw new Error('the page did not render');
              console.log('PASS pinned ' + engineName() + ' browser renders');
            } finally { await browser.close(); }
          })().catch(err => { console.error('FAIL pinned browser readiness: ' + err.message); process.exit(1); });
          NODE
      - name: build the app from app/systole.html around the synthetic export
        run: |
          node scripts/synthetic-export.js build/synthetic/export.html
          node scripts/assemble-app.js build/synthetic/export.html --refs build/synthetic/refs --ref-images build/synthetic/refs-images --out build/synthetic/systole.html
      - name: take its content out, as a release does before splitting it
        run: node scripts/extract-content.js build/synthetic/systole.html
      - name: build the split build, serve it, and check it over HTTP
        run: node scripts/verify.js build/synthetic/systole.html --pwa --only pwa

  # Required browser verdict: ../../docs/BUILD.md#public-ci.
  browser-done:
    # REQUIRED CHECK in branch protection, by this exact name: see above `jobs:`.
    name: browser-done — every browser job passed, or was skipped for a change it cannot see
    needs: [changes, public-browser, synthetic-build, synthetic-browser, synthetic-webkit, split-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: every browser job passed, or was skipped because changes said so
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/browser-done.js

  build-guard:
    # REQUIRED CHECK in branch protection, by this exact name: see above `jobs:`.
    name: build-guard — refuses to run without the licensed source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: npm run build exits non-zero and explains why, with no source present
        run: |
          set +e
          output="$(npm run --silent build 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::npm run build exited 0 with no source file present — it must refuse to build."
            exit 1
          fi
          if ! echo "$output" | grep -q "deliberately not in this repository"; then
            echo "::error::npm run build failed, but not with its documented refusal message — the guard may have changed shape."
            exit 1
          fi

  # Controls and safe log handling: ../../docs/BUILD.md#the-laptop-as-a-ci-runner-optional.
  full:
    name: full — the browser suites, on a machine with the export
    runs-on: [self-hosted, systole]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    concurrency:
      group: systole-full
      cancel-in-progress: false
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: the licensed export is where the runner says it is
        run: |
          if [ -z "${SYSTOLE_SOURCE:-}" ]; then
            echo "SYSTOLE_SOURCE is not set on this runner."
            echo "Set it to the absolute path of the ACCSAP 12 export in the runner's environment."
            exit 1
          fi
          if [ ! -f "$SYSTOLE_SOURCE" ]; then
            echo "SYSTOLE_SOURCE points at something that is not a file."
            exit 1
          fi
          # Size and digest only — never the name, which can carry the title.
          echo "export present: $(wc -c < "$SYSTOLE_SOURCE") bytes"

      - name: the reference corpus is where the runner says it is
        run: |
          if [ -z "${SYSTOLE_REFS:-}" ]; then
            echo "SYSTOLE_REFS is not set on this runner."
            echo "Set it to the directory holding refs/ and refs-images/ in the runner's environment."
            exit 1
          fi
          for d in refs refs-images; do
            if [ ! -d "$SYSTOLE_REFS/$d" ]; then
              echo "SYSTOLE_REFS has no $d directory."
              exit 1
            fi
          done
          mkdir -p content
          rm -rf content/refs content/refs-images
          cp -R "$SYSTOLE_REFS/refs" content/refs
          cp -R "$SYSTOLE_REFS/refs-images" content/refs-images
          notes=$(find content/refs -type f -name '*.md' | wc -l)
          images=$(find content/refs-images -type f | wc -l)
          if [ "$notes" -eq 0 ] || [ "$images" -eq 0 ]; then
            echo "the corpus staged empty: $notes note files, $images image files."
            exit 1
          fi
          # Counts only, never a name: a note's filename is its topic.
          echo "corpus staged: $notes note files, $images image files"

      - name: the pinned playwright, from the lockfile
        run: |
          npm ci
          npx playwright install chromium webkit


      - name: release-check
        # Keep the source path out of GitHub logs.
        run: npm run --silent release-check -- "$SYSTOLE_SOURCE"

      - name: where to look
        if: always()
        run: |
          echo "Full report (on this machine, not uploaded): build/release-report.md"
          echo "Failing suite output: tests/last-run.log"

  # Change classification and skip rules: ../../docs/BUILD.md#public-ci.
  changes:
    name: changes — which browser jobs this pull request needs
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.which.outputs.public }}
      synthetic: ${{ steps.which.outputs.synthetic }}
      selected: ${{ steps.which.outputs.selected }}
      shards: ${{ steps.which.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: which
        name: read the changed files
        run: node scripts/ci-changes.js
