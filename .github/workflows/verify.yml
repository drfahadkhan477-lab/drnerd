# See ../../docs/BUILD.md#public-ci for scope, scheduling, and action pins.
name: verify (source-independent subset)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep the required check names in ../../docs/BUILD.md#public-ci.
jobs:
  syntax:
    # REQUIRED CHECK in branch protection, by this exact name: see above `jobs:`.
    name: syntax — every file parses, both listings work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: every .js file parses
        run: |
          set -e
          find scripts src tests tools -name '*.js' -print0 \
            | xargs -0 -n1 node --check
      - name: every .py tool parses
        run: |
          set -e
          find tools -name '*.py' -print0 \
            | xargs -0 -n1 python3 -m py_compile
      - name: the verify suite list lists without crashing
        run: npm run suites

  logic:
    # REQUIRED CHECK in branch protection, by this exact name: see above `jobs:`.
    name: logic — every suite that needs no browser and no build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the last: the history step below reads
          # each commit this run adds. The whole history is about 15 MB.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # NOT ONLY THE TREE THAT IS CHECKED OUT. verify-leakguard below reads
      # this commit's files; a licensed file added in one commit of a pull
      # request and deleted in a later one is not among them, and merging the
      # pull request would put it in master's history all the same. This
      # reads every blob each new commit adds: a pull request's own commits
      # (its merge ref's second parent, less its first), or what a push to
      # master brought. A manual run adds no commits.
      - name: nothing licensed in any commit this run adds
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) node scripts/leak-guard.js --range HEAD^1..HEAD^2 ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                node scripts/leak-guard.js --range "$BEFORE..HEAD"
              else
                # No earlier master to stand on (a first push, or one that
                # rewrote it): every commit no other branch already holds.
                node scripts/leak-guard.js --range HEAD --not --exclude=origin/master --remotes
              fi ;;
            *) echo "a $EVENT run adds no commits; verify-leakguard below reads the tree" ;;
          esac
      - name: cancelled Apex responses cannot execute tools (2 checks)
        run: node tests/verify-apex-cancel.js
      - name: FSRS-5–derived scheduling (110 checks)
        run: node tests/verify-fsrs.js
      - name: the scheduler against ts-fsrs, on our own weights (15 checks)
        run: node tests/verify-oracle.js
      - name: the Cloudflare Worker request handler (160 checks)
        run: node tests/verify-worker.js
      - name: the cardiac cycle's physics (23 checks)
        run: node tests/verify-physio-pure.js
      - name: the 12-lead's geometry and morphology (47 checks)
        run: node tests/verify-leads-pure.js
      - name: the ZIP reader's memory ceiling (23 checks)
        run: node tests/verify-zip.js
      - name: the calibration arithmetic (31 checks)
        run: node tests/verify-calib-pure.js
      - name: the palette patches' quoted contrast figures are real (16 checks)
        run: node tests/verify-palette-pure.js
      - name: the vendored libraries (figure viewer, pen) are the ones recorded, whole, and their licences ship with them (16 checks)
        run: node tests/verify-vendor-pure.js
      - name: the home strip's rotation never repeats and excludes vfib (32 checks)
        run: node tests/verify-herorhythm-pure.js
      - name: a corpus with no figures in it still builds (8 checks)
        run: node tests/verify-refimg-pure.js
      - name: the Pencil width curve, without a canvas (38 checks)
        run: node tests/verify-pencil-pure.js
      - name: the Living Diagram's timing and view-cycling, without a screen (31 checks)
        run: node tests/verify-livingdiagram-pure.js
      - name: the conduction pathway fires in order, against real timing (25 checks)
        run: node tests/verify-conductionwave-pure.js
      - name: the coronary tree's branch geometry and flow-glow curve (29 checks)
        run: node tests/verify-coronarytree-pure.js
      - name: the engine is a flag, not thirty-four hardcoded copies of one (119 checks)
        run: node tests/verify-engine.js
      - name: the licensed question bank cannot be committed (114 checks)
        run: node tests/verify-leakguard.js
      - name: the built file cuts into the app and its payloads losslessly, and the app carries none of the bank (47 checks)
        run: node tests/verify-app-slots-pure.js
      - name: the app assembles from app/systole.html, the export and the repository (29 checks)
