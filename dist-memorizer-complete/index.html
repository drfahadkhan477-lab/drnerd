   THE THEMES ARE THE OWNER'S TWO, and Systole's Contrast. Memorizer first
   carried Systole's eight palettes. The owner found them, and the page's
   texture, not right for studying, and chose between three mock-ups drawn
   on the real screens: A, the iPad's own light look — a grey grouped ground,
   white cards, system blue — by day; B, a clinical dark — near-black,
   graphite cards, monitor green — at night; and asked to keep the aurora
   behind the page and the frosted glass over it. Auto pairs them. Contrast
   is Systole's still (scripts/highcontrast-patch.js), and the suite still
   holds it colour for colour to that source.

   The colours that MEAN something (green right, red wrong, amber partly) are
   not themed, so what they mean never shifts underneath you; they change
   only between light and dark. No ground is pure black or white outside
   Contrast: the clinical dark is #050608, which a phone shows as black
   without the halo pure black gives white text.

   SIZE is Systole's type ladder — a minor third (1.2) from a 16px body,
   tokens --t-* in app.css — with the body step itself scalable: Small 15,
   Standard 16, Large 18, Extra large 20. Everything is in rem, so the whole
   page scales together and the ladder's proportions hold.

   CONTRAST AND BRIGHTNESS are computed from each palette, not stored as
   48 more palettes. variant() moves the grounds (brightness) and the ink
   (contrast), then FITS every text colour to a floor: a colour below its
   floor on any ground it is drawn on is mixed toward the far end, a step at
   a time, until it clears. At Standard/Standard the palettes come through
   as drawn except where glass over the aurora takes a colour under its
   floor; the suite names each colour that moves, and shows it needed to. One token is new at every setting: --edge, the outline
   of a control (button, field, swatch). Systole's --border is a hairline,
   about 1.4:1 on a card, and a field drawn with it is hard to find; --edge
   is fitted to 3:1 (4.5:1 at High), WCAG's floor for a control's boundary.

   white with the ink of the page in Daylight, graphite in Clinical, and
   Systole's dark band in Contrast. Its text colours are the theme's, held
   to the same floors across its whole gradient.

   PURE except apply(), which touches only the document element it is given
   and one <style> element.

.pages { display: flex; gap: var(--s-3); overflow-x: auto; padding-bottom: var(--s-2); margin-top: var(--s-3); }
.pages .fig { flex: 0 0 9rem; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.82); display: flex; align-items: center; justify-content: center; padding: var(--s-4); }
.lightbox img { max-width: 100%; max-height: 100%; background: #FFFFFF; border-radius: .375rem; }
/* :not(.figure-view) is what wins this: .btn.primary, later in the file, set
   position: relative at the same weight, and the button went back into the
   row beside a full-width page — off the right edge of the owner's iPad,
   one letter showing. */
.lightbox:not(.figure-view) > .btn { position: absolute; z-index: 1; top: calc(var(--s-4) + env(safe-area-inset-top)); right: calc(var(--s-4) + env(safe-area-inset-right)); }
/* Where the enlarged page is from, over the dark backdrop: light on near-
   black, not the theme's muted ink, which is tuned for the theme's paper. */
.lightbox .lb-where { position: absolute; left: var(--s-4); bottom: calc(var(--s-4) + env(safe-area-inset-bottom)); margin: 0; color: #E2E8F0; font-size: var(--t-meta); }
.lightbox:focus { outline: none; }
/* The storage banner sits under each screen's title bar. */
.store-banner { margin: var(--s-2) 0; }
.store-banner.warn { padding: var(--s-2) var(--s-3); border-radius: .75rem; border: 1px solid var(--mid); }

.review-head { display: flex; justify-content: space-between; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-2); }
.flash { min-height: 15rem; }
.flash hr { border: 0; border-top: 1px solid var(--line); margin: var(--s-4) 0; }
.back { font-size: var(--t-lead); }
.tag { display: inline-block; font-size: var(--t-tiny); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: var(--s-2); }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); margin-top: var(--s-3); }
.grades .btn { width: 100%; }
.g1 { color: var(--bad); } .g2 { color: var(--mid); } .g3 { color: var(--good); } .g4 { color: var(--accent); }

/* ── settings ─────────────────────────────────────────────────────────── */
.settings label { display: block; margin: var(--s-3) 0 var(--s-1); font-weight: 600; }
.settings select, .settings input { display: block; width: 100%; margin-top: var(--s-2); font: inherit; font-weight: 400; padding: .625rem; border-radius: .625rem; border: 1px solid var(--edge); background: var(--bg); color: var(--ink); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: var(--s-3); margin-top: var(--s-2); }
.swatch { display: flex; flex-direction: column; align-items: stretch; gap: var(--s-2); font: inherit; font-size: var(--t-meta); text-align: left; padding: var(--s-2); border: 2px solid var(--edge); border-radius: 1rem; background: var(--surface); color: var(--ink); cursor: pointer; min-height: 2.75rem;
  transition: transform .2s var(--ease-out), border-color .2s, box-shadow .2s; }
.swatch:hover { transform: translateY(-2px); }
.swatch[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sw-minis { display: flex; gap: .375rem; }
.sw-mini { flex: 1 1 0; display: block; height: 4.25rem; border-radius: .625rem; border: 1px solid; padding: .5rem; }
.sw-card { display: flex; flex-direction: column; gap: .3rem; height: 100%; border-radius: .4rem; border: 1px solid; padding: .4rem .45rem; }
.sw-line { display: block; height: .3rem; width: 80%; border-radius: 1rem; opacity: .85; }
.sw-line.short { width: 55%; opacity: .7; }
.sw-pill { display: block; margin-top: auto; height: .6rem; width: 45%; border-radius: 1rem; }
.sw-name { display: flex; flex-direction: column; padding: 0 .25rem .125rem; }
.sw-name small { color: var(--muted); font-size: var(--t-tiny); }
.group-label { font-size: var(--t-tiny); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: var(--s-4) 0 0; }
.seg { display: flex; flex-wrap: wrap; gap: var(--s-1); margin-top: var(--s-2); background: var(--surface-2); padding: var(--s-1); border-radius: .75rem; }
.seg button { flex: 1 1 auto; font: inherit; font-size: var(--t-meta); border: 0; background: none; color: var(--ink); padding: var(--s-2) var(--s-3); border-radius: .5rem; cursor: pointer; min-height: 2.5rem; }
.seg button[aria-checked="true"] { background: var(--surface); box-shadow: var(--shadow); outline: 1px solid var(--edge); outline-offset: -1px; font-weight: 700; }
.preview { margin-top: var(--s-4); padding: var(--s-4); border-radius: .625rem; background: var(--bg); border: 1px dashed var(--line); }


/* High contrast: no soft shadows (the tokens drop them), so every card and
   divider is drawn with the fitted outline instead of the hairline. */
:root[data-contrast="high"] .card, :root[data-contrast="high"] .dock, :root[data-contrast="high"] .option, :root[data-contrast="high"] .section-card, :root[data-contrast="high"] .chip, :root[data-contrast="high"] .pill,
:root[data-contrast="high"] table.data th, :root[data-contrast="high"] table.data td, :root[data-contrast="high"] .fig { border-color: var(--edge); }
:root[data-contrast="high"] .card.note, :root[data-contrast="high"] .card.error { border-color: var(--edge); }

/* The pearl, on ECG paper: 1 mm and 5 mm squares, as a monitor strip. */
.pearl { margin: 0; display: flex; flex-direction: column;
  background-color: var(--surface);
  background-image: linear-gradient(var(--accent-soft) 1px, transparent 1px), linear-gradient(90deg, var(--accent-soft) 1px, transparent 1px),
    linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: .5rem .5rem, .5rem .5rem, 2.5rem 2.5rem, 2.5rem 2.5rem; }
:root[data-contrast="high"] .pearl { background-image: none; }
/* As in Systole (pearlcard-patch): the paper drifts slowly and the rungs
   arrive one at a time, 70 ms apart — a sequence, not a wait. The owner
   first asked for a still home screen, then for animation; reduced motion
   still stops all of it (the browser suite holds that). */
.pearl { animation: pearl-paper 28s linear infinite; }
@keyframes pearl-paper { from { background-position: 0 0, 0 0, 0 0, 0 0; } to { background-position: 0 .5rem, .5rem 0, 0 2.5rem, 2.5rem 0; } }
/* Entrance motion plays when a screen is entered (render() marks main
   data-enter), never on a redraw of the same screen: every tap redraws,
   and the owner saw the cards jump in again each time. */
main[data-enter] .pearl-steps li { animation: pearl-rung .5s ease-out both; }
.pearl-steps li:nth-child(2) { animation-delay: .07s; } .pearl-steps li:nth-child(3) { animation-delay: .14s; }
.pearl-steps li:nth-child(4) { animation-delay: .21s; } .pearl-steps li:nth-child(n+5) { animation-delay: .28s; }
@keyframes pearl-rung { from { opacity: 0; transform: translateX(-.5rem); } to { opacity: 1; transform: none; } }
.mcq-nav { justify-content: space-between; align-items: center; gap: var(--s-3); margin-top: var(--s-3); }
.looking-back { font-weight: 700; color: var(--accent); }
.pearl-steps { list-style: none; counter-reset: step; margin: var(--s-2) 0 var(--s-3); padding: 0; font-size: var(--t-lead); line-height: 1.45; }
.pearl-steps li { counter-increment: step; position: relative; padding: var(--s-2) 0 var(--s-2) 2.25rem; }
.pearl-steps li + li { border-top: 1px dashed var(--line); }
.pearl-steps li::before { content: counter(step); position: absolute; left: 0; top: var(--s-2); width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); font-size: var(--t-meta); font-weight: 700; text-align: center; line-height: 1.5rem; }
.pearl-lead { display: block; font-size: var(--t-tiny); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.pearl mark { background: var(--accent-soft); color: var(--ink); font-weight: 700; border-radius: .25rem; padding: 0 .1875rem; }
.pearl-src { color: var(--muted); font-size: var(--t-meta); margin: auto 0 0; }
.pearl .row { margin-top: var(--s-2); }


/* ═══ Home ═══════════════════════════════════════════════════════════════ */
.wrap.home { max-width: calc(var(--measure) + 12rem); }
.home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); margin: var(--s-4) 0 var(--s-5); }
.home-brand { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
.mascot { width: 4.5rem; height: 4.5rem; flex: none; }
.hello { display: block; color: var(--muted); font-weight: 700; font-size: var(--t-lead); }
.learn { font-size: 2.75rem; line-height: 1; margin: 0; font-weight: 900; letter-spacing: -.02em; }
.pills { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: flex-end; }
.pill { font: inherit; font-weight: 700; display: inline-flex; align-items: center; gap: .25rem; padding: .5rem .875rem; min-height: 2.75rem;
  border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; }
.learn-box { display: flex; flex-direction: column; justify-content: space-between; gap: var(--s-4); min-height: 8.5rem; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 1.75rem; padding: var(--s-5) var(--s-6); box-shadow: var(--shadow); }
.learn-box.over { border-color: var(--accent); background: var(--accent-soft); }
.learn-prompt { color: var(--muted); font-size: var(--t-lead); }
.learn-plus { font-size: 2rem; line-height: 1; font-weight: 300; }
.chips { display: flex; gap: var(--s-2); flex-wrap: wrap; margin: var(--s-3) 0 var(--s-2); }
.chip, .btn.chip { font: inherit; font-weight: 700; display: inline-flex; align-items: center; gap: .375rem; padding: .625rem 1.125rem; min-height: 2.75rem;
  border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
.paste textarea, .paste input { display: block; width: 100%; margin: var(--s-2) 0; font: inherit; padding: .75rem; border-radius: .75rem; border: 1px solid var(--edge); background: var(--bg); color: var(--ink); }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: var(--s-6) 0 var(--s-2); }
.section-head h2 { margin: 0; font-size: var(--t-h4); }
.plus { font-size: 1.75rem; line-height: 1; cursor: pointer; padding: 0 var(--s-2); }
.jump { display: flex; gap: var(--s-3); overflow-x: auto; padding: 0 0 var(--s-2); scroll-snap-type: x mandatory; }
.jump-card { font: inherit; color: var(--ink); text-align: left; flex: 0 0 min(19rem, 80%); scroll-snap-align: start; display: flex; align-items: center; gap: var(--s-4);
  background: var(--surface); border: 1px solid var(--line); border-radius: 1.5rem; padding: var(--s-4) var(--s-5); cursor: pointer; box-shadow: var(--shadow); }
.jump-text { display: flex; flex-direction: column; min-width: 0; }
.jump-text strong { font-size: var(--t-lead); overflow-wrap: anywhere; }
.ring-wrap { position: relative; display: inline-grid; place-items: center; flex: none; width: 3.75rem; height: 3.75rem; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--surface-2); }
.ring .fill { stroke: var(--good); stroke-linecap: round; }
.ring-pct { position: absolute; font-size: var(--t-meta); font-weight: 800; color: var(--good); }
.ring-big + .ring-pct { font-size: var(--t-h4); }
.result .ring-wrap { width: 7.5rem; height: 7.5rem; margin: 0 auto var(--s-3); display: grid; }
.result { text-align: center; }
.units { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s-3); }
.unit-row { position: relative; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: var(--s-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: 1.25rem; padding: var(--s-3) var(--s-3) var(--s-3) var(--s-4);
  box-shadow: var(--shadow); }
/* The unit's colour is its left edge — a border follows the rounded corner
   by itself. It was a stripe the row clipped with overflow: hidden, and the
   same clipping cut off the ⋮ menu below the row (the owner's screenshot:
   a sliver, no Delete). */
.units .unit-row { border-left: .375rem solid hsl(var(--hue) 38% 66%); }
.unit-row > p { grid-column: 1 / -1; margin: 0; }
/* ── Units, books and a book's chapters as tiles, as Systole's chapters are
   (ui.js): the topic's icon in a tinted square, the name, the counts, a
   bar of sixteen segments, and where it stands with its share. The hue is
   the icon's, the bar's and the edge's; the words stay in the text colours. */
.units.tiles { grid-template-columns: repeat(auto-fill, minmax(14.5rem, 1fr)); gap: var(--s-4); }
.utile { grid-template-columns: 1fr auto auto; grid-template-areas: "open open open" "state pct menu"; align-items: center; row-gap: var(--s-2);
  padding: var(--s-4) var(--s-3) var(--s-3) var(--s-5); }
.units .utile { border-left: .25rem solid hsl(var(--hue) 62% 58%); }
.utile > .unit-open { grid-area: open; gap: .375rem; padding: 0; width: 100%; align-items: flex-start; text-align: left; }
.utile .seg { align-self: stretch; }
.utile > .tile-state { grid-area: state; color: var(--muted); font-size: var(--t-meta); }
.utile > .badge, .utile > .tile-pct { grid-area: pct; background: none; padding: 0 .25rem; font-weight: 800; font-size: var(--t-meta); color: var(--ink); font-variant-numeric: tabular-nums; }
.utile > details.menu { grid-area: menu; }
.utile > p { grid-column: 1 / -1; }
.tile-icon { width: 3rem; height: 3rem; border-radius: .875rem; display: grid; place-items: center; margin-bottom: var(--s-2);
  background: hsla(var(--hue), 70%, 55%, .16); color: hsl(var(--hue) 62% 56%); }
.topic-icon { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.utile .doc-name { font-size: var(--t-lead); line-height: 1.25; }
.seg { display: flex; gap: 3px; margin-top: var(--s-2); }
.seg i { flex: 1; height: .375rem; border-radius: 2px; background: var(--surface-2); }
.seg i.on { background: hsl(var(--hue) 62% 56%); }
/* a chapter card's mark is its topic's icon, in its hue */
.ch-n { color: hsl(var(--hue) 62% 56%); background: hsla(var(--hue), 70%, 55%, .16); }
.ch-n .topic-icon { width: 1.25rem; height: 1.25rem; }
/* the chapters as a row of round icons (the owner's picture of Systole) */
.ch-icons { display: flex; gap: var(--s-3); overflow-x: auto; padding: var(--s-2) var(--s-1) var(--s-3); margin: 0 0 var(--s-2); scrollbar-width: none; }
.ch-icons::-webkit-scrollbar { display: none; }
.ch-icon { flex: none; width: 5.5rem; display: flex; flex-direction: column; align-items: center; gap: .5rem; background: none; border: 0; padding: 0; font: inherit; color: var(--ink); cursor: pointer; }
.ci-ring { width: 4rem; height: 4rem; border-radius: 50%; display: grid; place-items: center; color: hsl(var(--hue) 62% 56%);
  border: 3px solid hsla(var(--hue), 60%, 55%, .35); background: hsla(var(--hue), 70%, 55%, .08); transition: transform .2s var(--ease-out), border-color .2s; }
.ch-icon:hover .ci-ring, .ch-icon:focus-visible .ci-ring { transform: translateY(-2px); border-color: hsl(var(--hue) 62% 56%); }
.ci-label { font-size: var(--t-meta); font-weight: 650; text-align: center; line-height: 1.2; color: var(--muted); }
.unit-open { font: inherit; color: var(--ink); text-align: left; background: none; border: 0; padding: var(--s-2) 0; display: flex; flex-direction: column; cursor: pointer; min-width: 0; }
.doc-name { font-size: var(--t-lead); overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: var(--t-meta); font-weight: 700; padding: .125rem .625rem; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
details.menu { position: relative; }
/* A unit's row is glass, so its own stacking context: an open menu inside it
   was painted under the cards after it (the Chapters page has cards below
   its units; the suite found Delete could not be tapped). The row with an
   open menu is lifted above them. */
.unit-row:focus-within, .unit-row:has(details.menu[open]) { z-index: 5; }
details.menu summary { list-style: none; cursor: pointer; font-size: 1.5rem; line-height: 1; padding: .375rem .625rem; border-radius: .5rem; min-width: 2.75rem; min-height: 2.75rem; display: grid; place-items: center; }
details.menu summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: 100%; z-index: 4; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--edge); border-radius: .75rem; box-shadow: var(--shadow); padding: var(--s-1); min-width: 10rem; }
.btn.danger { color: var(--bad); }
.weak-list { list-style: none; margin: 0; padding: var(--s-2) var(--s-5); }
.weak-list li { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-2) 0; border-top: 1px solid var(--line); margin: 0; }
.weak-list li:first-child { border-top: 0; }
.weak-list .row { margin: 0; flex-wrap: nowrap; }
.weak-what { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.card.empty h2 { font-size: var(--t-h4); }

/* ═══ The dock ═══════════════════════════════════════════════════════════ */
.dock { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(var(--s-4) + env(safe-area-inset-bottom));
  display: flex; gap: var(--s-1); padding: var(--s-1); border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.nav-btn { position: relative; font: inherit; color: var(--muted); background: none; border: 0; border-radius: 999px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 4.75rem; min-height: 3.25rem; padding: .25rem .875rem; }
.nav-btn[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.nav-icon { font-size: 1.375rem; line-height: 1; }
.nav-label { font-size: var(--t-tiny); font-weight: 700; }
/* Five tabs and, on a lesson, the next thing to do: narrower on a phone so
   all six fit the width. */
@media (max-width: 30rem) {
  .dock { max-width: calc(100vw - 1rem); gap: 0; }
  .dock .nav-btn { min-width: 0; flex: 1 1 0; padding: .25rem .375rem; }
  .nav-label { font-size: .625rem; }
}
.nav-badge { position: absolute; top: .125rem; right: .5rem; background: var(--bad); color: #FFFFFF; font-size: var(--t-tiny); font-weight: 700; border-radius: 999px; padding: 0 .375rem; min-width: 1.25rem; text-align: center; }

/* ═══ A unit: its sections as cards ══════════════════════════════════════ */
.topbar { display: flex; align-items: center; gap: var(--s-3); margin: var(--s-3) 0 var(--s-2); }
.bar-title { font-size: var(--t-h4); margin: 0; overflow-wrap: anywhere; }
.btn.round { width: 3rem; height: 3rem; min-height: 3rem; border-radius: 50%; padding: 0; font-size: 1.75rem; line-height: 1; flex: none; border-color: var(--line); }
.unit-meta { margin: 0 0 var(--s-2); }
.grid-title { font-size: var(--t-h4); margin: var(--s-5) 0 var(--s-3); }
.sections { display: flex; flex-direction: column; gap: var(--s-3); }
/* ── A unit's page (ui.js viewUnit): the unit at a glance, then its
   contents — a chapter a card with its bar, folding open to its rows; a
   section on its own a row card of its own. Every row can be deleted. */
.unit-hero { display: grid; gap: var(--s-3); padding: var(--s-5); margin: var(--s-3) 0 var(--s-4); }
.unit-hero-top { display: flex; align-items: center; gap: var(--s-4); min-width: 0; }
.unit-hero .ring-wrap { width: 4.5rem; height: 4.5rem; }
.unit-hero .ring-pct { font-size: var(--t-body); }
.unit-hero-text { min-width: 0; }
.unit-hero .unit-meta { margin: 0 0 .25rem; font-size: var(--t-meta); }
.unit-next { margin: 0; line-height: 1.35; overflow-wrap: anywhere; }
.unit-hero .bar { margin: 0; }
.unit-hero .unit-cta { margin: 0; }
.contents-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin: var(--s-5) 0 var(--s-3); }
.contents-head .grid-title { margin: 0; }
.ch-group.card { padding: 0; overflow: hidden; }
.ch-head { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "n text pct" "bar bar bar";
  gap: .625rem var(--s-3); align-items: center; padding: var(--s-4) var(--s-5); cursor: pointer; }
.ch-head::-webkit-details-marker { display: none; }
.ch-n { grid-area: n; width: 2.25rem; height: 2.25rem; border-radius: .75rem; display: grid; place-items: center; font-weight: 800;
  background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.ch-text { grid-area: text; display: flex; flex-direction: column; gap: .125rem; min-width: 0; }
.ch-title { font-size: var(--t-lead); line-height: 1.3; overflow-wrap: anywhere; }
.ch-meta { font-size: var(--t-meta); }
.ch-pct { grid-area: pct; display: flex; align-items: center; gap: .625rem; font-weight: 800; color: var(--good); font-variant-numeric: tabular-nums; }
.ch-pct::after { content: ""; width: .5rem; height: .5rem; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg) translateY(-2px); transition: transform .2s var(--ease-out); }
.ch-group[open] .ch-pct::after { transform: rotate(-135deg) translateY(-2px); }
.ch-bar { grid-area: bar; height: .3125rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.ch-bar i { display: block; height: 100%; background: var(--good); border-radius: inherit; }
.ch-rows { border-top: 1px solid var(--line); }
.section-row { display: flex; align-items: stretch; min-width: 0; }
.ch-rows .section-row + .section-row { border-top: 1px solid var(--line); }
.section-row.card { padding: 0; overflow: hidden; }
.sections .section-row .section-card { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s-3);
  font: inherit; color: var(--ink); text-align: left; padding: var(--s-3) var(--s-4) var(--s-3) 0; cursor: pointer; min-height: 3.5rem;
  background: transparent; border: 0; border-radius: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
:root[data-contrast="high"] .sections .section-row .section-card { border: 0; }
.sections .section-row .section-card:hover { transform: none; box-shadow: none; background: var(--surface-2); }
.sections .section-row .section-card:active { transform: none; }
.section-row.next .section-title::after { content: " · next"; color: var(--accent); font-weight: 700; font-size: var(--t-meta); }
/* Each section's colour is a line down its left, not a block of it. */
.band { align-self: stretch; display: flex; align-items: center; padding-left: .75rem; border-left: 3px solid hsl(var(--hue) 40% 62%); }
.band-n { font-size: var(--t-meta); font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 999px; min-width: 1.75rem; height: 1.75rem; padding: 0 .5rem; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.section-body { display: flex; flex-direction: column; gap: .125rem; min-width: 0; }
.section-title { font-size: var(--t-body); font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.row-meta { display: flex; align-items: center; gap: .375rem; font-size: var(--t-meta); }
.sections > .card { margin: 0; }
.state-dot { width: .5rem; height: .5rem; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); }
.section-card[data-state="taught"] .state-dot { background: var(--accent); border-color: var(--accent); }
.section-card[data-state="drilled"] .state-dot { background: var(--good); border-color: var(--good); }
.section-card .badge { position: static; }
.section-card[data-state="drilled"] .band { border-left-color: var(--good); }
.section-del { flex: none; width: 3rem; display: grid; place-items: center; background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; }
.section-del:hover, .section-del:focus-visible { color: var(--bad); background: var(--bad-soft); }
.trash-icon { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.exam-card { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-top: var(--s-5); }
.exam-card p { margin: 0; }
.exam-card.locked { opacity: .8; }
.lock { font-size: 1.5rem; }
.unit-cta { margin: var(--s-3) 0 var(--s-4); }
.unit-cta .btn { width: 100%; border-radius: 999px; }
.unit-cta { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
.unit-cta #pack-go { width: auto; }

/* ═══ The lesson ═════════════════════════════════════════════════════════ */
.wrap.study { max-width: calc(var(--measure) + 4rem); }
.big-idea { background: linear-gradient(145deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); border: 0; }
.big-idea .eyebrow { color: var(--hero-accent); }
.big-idea .big { font-size: var(--t-h4); line-height: 1.4; margin: var(--s-2) 0 0; font-weight: 600; }
.big-idea mark { background: var(--hero-pill-edge); color: inherit; }
.analogy { border-left: .375rem solid var(--accent); }
.analogy h3 { margin-top: var(--s-1); }
.analogy-text { font-size: var(--t-lead); line-height: 1.55; }
.analogy .label { margin: 0; font-style: italic; }
ol.points { list-style: none; padding: 0; margin: var(--s-3) 0 0; counter-reset: none; }
/* number | the point | its ☆ marker. Two columns once held three children:
   the marker took the text's place and the text fell into the number's
   2.25rem column on a row of its own, one word to a line. */
.point { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--line); margin: 0; align-items: start; }
.point > .point-n { grid-column: 1; } .point > .point-body { grid-column: 2; grid-row: 1; } .point > .mark-btn { grid-column: 3; grid-row: 1; }
.point:first-child { border-top: 0; }
.point-n { width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: grid; place-items: center; }
.point-text { font-size: var(--t-lead); line-height: 1.55; margin: 0; }
.point .lead { font-weight: 800; }
.point .lead::after { content: " \2014  "; font-weight: 400; color: var(--muted); }
.point .subs { margin: var(--s-1) 0 0; color: var(--muted); }
.context summary { cursor: pointer; color: var(--accent); font-size: var(--t-meta); margin-top: var(--s-2); }
.context p { font-size: var(--t-meta); background: var(--surface-2); border-radius: .5rem; padding: var(--s-2) var(--s-3); margin: var(--s-2) 0 0; }
mark { background: var(--accent-soft); color: var(--ink); font-weight: 700; border-radius: .25rem; padding: 0 .1875rem; }
ul.numbers { list-style: none; padding: 0; margin: var(--s-3) 0 0; display: grid; gap: var(--s-2); }
ul.numbers li { background: var(--surface-2); border-radius: .75rem; padding: var(--s-3) var(--s-4); margin: 0; }
details.source { margin: var(--s-4) 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s-2) var(--s-5); }
details.source summary { cursor: pointer; color: var(--accent); padding: var(--s-2) 0; font-weight: 700; }
details.source p, details.source h3 { font-size: var(--t-body); line-height: 1.7; }
details.source p.item { padding-left: var(--s-4); position: relative; }
details.source p.item::before { content: "\2022"; position: absolute; left: .25rem; color: var(--accent); }

/* ═══ The drill ══════════════════════════════════════════════════════════ */
.mcq-meta { display: flex; flex-direction: column; gap: var(--s-1); color: var(--muted); font-size: var(--t-meta); font-weight: 700; }
.mcq-meta .bar { margin: 0 0 var(--s-2); }
.q { font-size: var(--t-h4); line-height: 1.35; }
blockquote.quote { margin: var(--s-3) 0; padding: var(--s-3) var(--s-4); border-left: .25rem solid var(--accent); background: var(--surface-2); border-radius: .5rem; font-size: var(--t-lead); font-family: Georgia, "Iowan Old Style", serif; }
.gap { font-weight: 800; color: var(--accent); border-bottom: 2px solid var(--accent); padding: 0 .25rem; }
.options { display: grid; gap: var(--s-3); margin-top: var(--s-4); }
.option { font: inherit; color: var(--ink); text-align: left; display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); min-height: 3.5rem;
  background: var(--surface); border: 2px solid var(--line); border-radius: 1rem; cursor: pointer; font-size: var(--t-lead); }
.option:hover:not([disabled]) { border-color: var(--accent); }
.opt-letter { flex: none; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; }
.option.right { border-color: var(--good); background: var(--good-soft); }
.option.right .opt-letter { background: var(--good); color: #FFFFFF; }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .opt-letter { background: var(--bad); color: #FFFFFF; }
.option.dim { opacity: .6; }
.option[disabled] { cursor: default; }
/* The verdict: the card's own ground with a rail down its left in the
   meaning colour, and the verdict line in it — a wrong answer read calmly,
   not a block of red (the dark themes' tint was near-black red). */
.why { margin-top: var(--s-4); padding: var(--s-3) var(--s-4); border-radius: 0 1rem 1rem 0; border-left: 4px solid var(--line); background: transparent; }
.why.good { border-left-color: var(--good); }
.why.bad { border-left-color: var(--bad); }
.why.good > strong:first-child { color: var(--good); }
.why.bad > strong:first-child { color: var(--bad); }
.why strong { font-size: var(--t-lead); }
.why-label { font-weight: 800; }
.missed { padding-left: 1.1em; }
.missed p { margin: .25rem 0 .75rem; color: var(--good); font-weight: 600; }
.result-actions .btn.big { flex: 1 1 16rem; }
.by-section { list-style: none; padding: 0; }
.by-section li { display: flex; justify-content: space-between; gap: var(--s-3); padding: var(--s-2) 0; border-top: 1px solid var(--line); }

@media (max-width: 32.5rem) {
  .learn { font-size: 2.25rem; }
  .mascot { width: 3.5rem; height: 3.5rem; }
  .grades { grid-template-columns: repeat(2, 1fr); }
  .nav-btn { min-width: 4rem; }
}
.spinner { width: 1.125rem; height: 1.125rem; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* ── a whole book ── */
.chapter-n { display: inline-block; min-width: 2.2em; font-variant-numeric: tabular-nums; color: hsl(var(--hue) 36% 52%); }
.chapter-row.front { opacity: .7; }
.book-of { margin: 0 0 var(--s-1); }

/* ── ask your book ── */
.ask-row { flex-wrap: nowrap; }
.ask-row input { flex: 1 1 auto; min-width: 0; font: inherit; padding: var(--s-2) var(--s-3); border-radius: .75rem; border: 1px solid var(--edge); background: var(--surface-2); color: var(--ink); }
ul.quotes, ul.read-more, ul.index-list { list-style: none; margin: 0; padding: 0; }
ul.quotes li { padding: var(--s-2) 0; border-bottom: 1px solid var(--line); }
.quote-text { margin: 0 0 var(--s-1); }
.src { display: inline-block; font-size: var(--t-meta); font-weight: 700; color: var(--accent); }
h3.arranged, .arranged { font-style: italic; }
.btn.link { width: 100%; text-align: left; display: block; }
ul.index-list summary { cursor: pointer; padding: var(--s-2) 0; }

/* ── on-device AI ── */
.ai-card { border-left: 4px solid var(--accent); }
.ai-label, .ai-tag { font-size: var(--t-meta); }
.ai-tag { margin-left: var(--s-2); }
sup.cite { font-size: .7em; color: var(--accent); }

/* ── the lesson as a study sheet ── */
.big-idea .big { font-size: var(--t-h4); line-height: 1.35; letter-spacing: -.01em; }
.analogy { padding-block: var(--s-3); }
.analogy .analogy-text { font-size: var(--t-body); line-height: 1.55; margin: var(--s-1) 0; }
.analogy h3 { margin: var(--s-1) 0 0; }
.point-group + .point-group { margin-top: var(--s-4); }
.group-head { display: flex; align-items: center; gap: var(--s-2); margin: var(--s-3) 0 var(--s-1); font-size: var(--t-meta); font-weight: 800;
  text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.group-mark { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: .5rem; background: var(--accent-soft); color: var(--accent); font-size: .8rem; }
ol.points { margin: 0; }
.arranged-note { margin: var(--s-3) 0 0; font-style: italic; }
.fact + .fact { margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--line); }
/* ── The whole lesson (ui.js viewLesson): two columns where there is room —
   what to understand, and beside it what to memorise — each at the
   reading width; one column on a phone. Practice and extras below. */
@media (min-width: 46rem) {
  main.wrap.lesson-wide { max-width: min(78rem, 100%); }
  .lesson-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(15rem, 1fr); gap: var(--s-4); align-items: start; }
  .lesson-main { max-width: var(--measure); }
  .lesson-side { min-width: 0; }
  .lesson-main #points .card-head { flex-wrap: wrap; }
  .lesson-main #points .card-head h2 { flex: none; white-space: nowrap; }
  main.wrap.lesson-wide > :not(.lesson-grid):not(.lesson-practice):not(.lesson-extras) { max-width: var(--measure); }
  .lesson-practice, .lesson-extras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--s-4); align-items: start; }
  .lesson-extras > details.source, .lesson-extras > .tables, .lesson-extras > #tables, .lesson-extras > #visuals { grid-column: 1 / -1; }
}
.lesson-side > .card:first-of-type { margin-top: 0; }
.pack-table { margin: var(--s-3) 0 0; }
.pack-table + .pack-table { margin-top: var(--s-4); }
.pack-table figcaption { margin: 0 0 var(--s-2); }
.side-title { margin: 0 0 var(--s-2); }
/* at the side, the numbers pack tight: facts side by side, tiles small */
.lesson-side #numbers .fact + .fact { margin-top: var(--s-3); padding-top: var(--s-2); }
.lesson-side .tiles { grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); }
.lesson-side .tile { padding: var(--s-2) var(--s-3); }
.lesson-side .tile-value { font-size: var(--t-lead); }
.lesson-side .card { padding: var(--s-4); }
.lesson-side .hook .acrostic { margin: var(--s-2) 0; }
.fact-subject { font-weight: 700; margin: var(--s-2) 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: var(--s-2); }
.tile { display: flex; flex-direction: column; gap: .125rem; padding: var(--s-3); border-radius: .75rem; background: var(--surface-2); border: 1px solid var(--line); }
.tile-value { font-size: var(--t-h4); font-weight: 800; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
.tile-label { font-size: var(--t-meta); color: var(--muted); line-height: 1.3; }
.fact-src { margin: var(--s-1) 0 0; }
details.more-analogies > summary { cursor: pointer; font-weight: 600; }
.end-cta { margin: var(--s-6) 0 var(--s-2); }
.end-cta .btn { width: 100%; border-radius: 999px; }
/* ── the coach ── */
.coach-intro { display: flex; gap: var(--s-3); align-items: flex-start; margin: var(--s-3) 0; }
.coach-avatar .mascot { width: 3rem; height: 3rem; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 1.125rem 1.125rem 1.125rem .25rem; padding: var(--s-3) var(--s-4); flex: 1 1 auto; min-width: 0; }
.bubble p { margin: 0 0 var(--s-2); line-height: 1.5; }
.you { display: flex; justify-content: flex-end; margin: var(--s-3) 0; }
.bubble.mine { flex: 0 1 auto; background: var(--accent); color: var(--accent-ink); border-color: transparent; border-radius: 1.125rem 1.125rem .25rem 1.125rem; font-weight: 600; }
.chips.suggest { margin-top: var(--s-2); }
.chips.suggest .btn.chip { font-size: var(--t-meta); text-align: left; }

/* ── figures made from the book ── */
.figure-view { flex-direction: column; gap: var(--s-3); }
/* The page lightbox pins its one button to a corner; the figure viewer has
   two, and pinned they sat on top of each other ("Close" covered "Save"). */
.figure-view .btn { position: static; }
.figure-view img { max-width: min(92vw, 1080px); max-height: 78vh; background: #FFFFFF; border-radius: .75rem; }
.figure-view .fig-note { color: #E2E8F0; }
.compare-row { margin-top: var(--s-3); }

/* ── at a glance (after the owner's reference: fact boxes, a pathway) ── */
.glance { display: flex; flex-direction: column; gap: var(--s-3); }
.gl-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: var(--s-2); }
.gl-fact { display: flex; flex-direction: column; gap: .125rem; padding: var(--s-3) var(--s-4); border-radius: .75rem; text-align: center;
  background: var(--surface); border: 1px solid var(--line); }
.gl-fact strong { color: var(--accent); font-size: var(--t-lead); }
.gl-fact span { color: var(--muted); font-size: var(--t-meta); }
.gl-caption { margin: 0; font-size: var(--t-meta); color: var(--muted); }
.gl-path { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
.gl-step { padding: var(--s-2) var(--s-3); border-radius: .625rem; background: var(--accent-soft); border: 1px solid var(--line);
  color: var(--ink); font-weight: 600; font-size: var(--t-meta); text-align: center; }
.gl-arrow { display: inline-flex; flex-direction: column; align-items: center; color: var(--muted); font-size: var(--t-tiny); line-height: 1.1; }
.gl-verb { font-style: italic; }
.gl-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: var(--s-2); }
.gl-list { display: flex; flex-direction: column; gap: .125rem; padding: var(--s-3); border-radius: .75rem; background: var(--surface-2); border: 1px solid var(--line); }
.gl-list span { font-size: var(--t-meta); color: var(--muted); }
strong.key { color: var(--accent); }
.quick { border-left: 4px solid var(--muted); }
.quick .q { font-weight: 700; margin: var(--s-2) 0; }

/* minimisable parts of a card: figures, pages */
details.fold + details.fold { margin-top: var(--s-5); }
details.fold > summary.fold-head { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: var(--s-3); }
details.fold > summary.fold-head::-webkit-details-marker { display: none; }
details.fold > summary .eyebrow { margin: 0; }
.fold-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); color: var(--muted); font-size: var(--t-lead); line-height: 1; }
.fold-btn::after { content: '−'; }
details.fold:not([open]) .fold-btn::after { content: '+'; }
details.fold[open] > summary.fold-head { margin-bottom: var(--s-3); }
summary.fold-head:hover .fold-btn { color: var(--accent); border-color: currentColor; }

/* ── the robot coach: bottom right, above the dock ─────────────────────────
   It moves — a slow float, a blink, its antenna glowing — so it reads as
   something to tap; with reduced motion asked for, it stands still. */
.robot-dock { position: fixed; z-index: 11; right: var(--s-4); bottom: calc(5.5rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: var(--s-3); pointer-events: none; }
.robot-dock > * { pointer-events: auto; }
.robot { width: 4rem; height: 4rem; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: .375rem;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); display: grid; place-items: center; }
.robot.on { outline: 3px solid var(--accent); outline-offset: 2px; }
.robot-svg { width: 100%; height: 100%; overflow: visible; animation: rb-float 3.2s ease-in-out infinite; }
.robot-svg .rb-head { fill: var(--accent); }
.rb-ear, .rb-neck { fill: var(--accent); opacity: .75; }
.rb-visor { fill: var(--hero-a); }
.rb-eyes circle { fill: var(--hero-accent); }
.rb-eyes { transform-box: fill-box; transform-origin: center; animation: rb-blink 4.5s infinite; }
.rb-smile { fill: none; stroke: var(--accent-ink); stroke-width: 2.4; stroke-linecap: round; }
.rb-stalk { stroke: var(--accent); stroke-width: 2.4; }
.rb-bulb { fill: var(--hero-accent); animation: rb-glow 1.8s ease-in-out infinite; }
@keyframes rb-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes rb-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes rb-glow { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .robot-svg, .rb-eyes, .rb-bulb { animation: none; } }
.robot-panel { width: min(22rem, calc(100vw - 2rem)); max-height: min(62vh, 34rem); overflow: auto; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 1.25rem; box-shadow: 0 16px 40px rgba(0,0,0,.3); padding: var(--s-4); animation: rb-pop .18s ease-out; transform-origin: bottom right; }
@keyframes rb-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .robot-panel { animation: none; } }
.robot-panel .rb-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-3); }
.rb-close { font: inherit; font-size: var(--t-lead); line-height: 1; width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
.rb-line { margin: 0 0 var(--s-3); }
.rb-line p, .rb-line ul { margin: .125rem 0 0; }
.rb-label { display: block; font-size: var(--t-tiny); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.rb-letters { color: var(--accent); letter-spacing: .08em; }
.rb-options { list-style: none; margin: var(--s-2) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.rb-options li { display: flex; gap: var(--s-2); align-items: flex-start; padding: var(--s-2); border-radius: .75rem; background: var(--surface-2); }
.rb-options li.right { background: var(--good-soft); }
.rb-options li.wrong { background: var(--bad-soft); }
.rb-options p { margin: .125rem 0 0; font-size: var(--t-meta); }
.rb-tag { font-size: var(--t-meta); font-weight: 700; }
.robot-panel .ai-card { margin: var(--s-3) 0 0; }

/* step by step: one card at a time, a bar of progress, Back and Next */
.lesson-mode { justify-content: flex-end; margin: 0 0 var(--s-3); }
.step-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; margin: var(--s-2) 0; }
.step-count { font-size: var(--t-meta); color: var(--muted); }
.step-count strong { color: var(--ink); }
.step-bar { margin: 0 0 var(--s-4); }
.step-nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin: var(--s-5) 0 var(--s-8); }
.step-nav .end-cta { flex: 1; margin: 0; }
.step-nav #step-next { flex: 1; }

/* ── Play this section: animated slides (ui.js motion) ─────────────────── */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pathway .pp { list-style: none; margin: var(--s-4) 0 var(--s-3); padding: 0; display: flex; flex-direction: column; align-items: center; }
.pp-item { display: flex; flex-direction: column; align-items: center; width: 100%; }
.pp-step { display: block; width: min(100%, 26rem); text-align: center; font-size: var(--t-lead); font-weight: 700; padding: var(--s-3) var(--s-4);
  border-radius: 1rem; background: var(--accent-soft); color: var(--ink); border: 2px solid var(--accent); }
.pp-item:first-child .pp-step { background: var(--accent); color: var(--accent-ink); }
.pp-arrow { position: relative; height: 3.5rem; width: 100%; display: flex; justify-content: center; }
.pp-line { display: block; width: 3px; height: 100%; background: var(--accent); transform-origin: top; position: relative; }
.pp-line::after { content: ''; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); border: .45rem solid transparent; border-top: .6rem solid var(--accent); border-bottom: 0; }
.pp-verb { position: absolute; left: calc(50% + var(--s-4)); top: 50%; transform: translateY(-50%); font-size: var(--t-meta); font-weight: 800;
  text-transform: uppercase; letter-spacing: .06em; color: var(--accent); white-space: nowrap; }
.hs-letter { display: inline-block; }
.acrostic .word { display: inline-block; }
.tv-sign, .tv-num { display: inline-block; }
.tile-label { display: block; }
.step-head .btn#replay { margin-left: auto; }

/* memorize: one recall card at a time */
.recall-prompt { display: block; font-size: var(--t-h4); font-weight: 700; line-height: 1.35; }
.recall-answer { display: block; font-size: var(--t-h4); line-height: 1.3; color: var(--ink); }
.recall-full { margin: var(--s-3) 0 0; text-align: center; }
.recall-skip, .recall-rate { justify-content: center; margin-top: var(--s-3); }
/* ── The flashcard, a real card (ui.js flipCard): both faces in one grid
   cell, so the card is as tall as its longer face; the back turned away
   until tapped. ── */
.flip { display: block; width: 100%; margin: var(--s-3) 0 0; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer;
  perspective: 1600px; -webkit-tap-highlight-color: transparent; text-align: center; }
.flip-inner { display: grid; min-height: 17rem; transform-style: preserve-3d; transition: transform .5s var(--ease-out); }
.flip[data-flipped="true"] .flip-inner { transform: rotateY(180deg); }
.flip[data-anim="back"] .flip-inner { animation: flip-back .5s var(--ease-out); }
.flip[data-anim="front"] .flip-inner { animation: flip-front .5s var(--ease-out); }
@keyframes flip-back { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }
@keyframes flip-front { from { transform: rotateY(180deg); } to { transform: rotateY(0deg); } }
.flip-face { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-3);
  padding: var(--s-6) var(--s-5); border-radius: 1.5rem; border: 1px solid var(--line); background: var(--surface);
  box-shadow: 0 1px 0 var(--glass-edge, transparent) inset, 0 18px 40px -22px rgba(0, 0, 0, .45);
  -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.flip-face.back { transform: rotateY(180deg); border-color: var(--good); }
.flip-face.back .eyebrow { color: var(--good); }
.flip-hint { font-size: var(--t-meta); color: var(--muted); margin-top: var(--s-2); }
.flip:focus-visible .flip-face { outline: 3px solid var(--accent); outline-offset: 3px; }
.flip .fc-text { display: block; font-size: var(--t-h4); font-weight: 650; line-height: 1.35; }
.recall-rate { justify-content: space-between; }

/* the Coach as an agent: a conversation */
.turn { margin: var(--s-4) 0; }
.coach-says { display: flex; gap: var(--s-3); align-items: flex-start; margin-top: var(--s-2); }
.coach-avatar.small { width: 2.25rem; height: 2.25rem; flex: none; }
.bubble.agent ul, .bubble.agent ol { margin: var(--s-2) 0; padding-left: var(--s-5); }
.agent-steps { font-size: var(--t-tiny); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 0 0 var(--s-1); }
.agent-quiz { list-style: decimal; }
.agent-q { margin: var(--s-3) 0; }
.agent-q .q { font-weight: 700; margin: 0 0 var(--s-2); }
.agent-compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: var(--s-3); margin: var(--s-2) 0; }
.cmp-col { background: var(--surface-2); border-radius: 1rem; padding: var(--s-3); }
.cmp-col h3 { margin: 0 0 var(--s-2); font-size: var(--t-lead); }
.cmp-num { margin: .125rem 0; }
.agent-hook { margin: var(--s-2) 0; }
.card.earlier { opacity: .85; }

/* ── motion where it helps, and nowhere under reduced motion ─────────────
   Home cards and section cards rise in, a little apart, so the eye reads
   them in order; the progress rings draw; a right answer pulses and a wrong
   one shakes, so the outcome registers before the words are read; a
   revealed recall answer rises into place. All short (under half a second)
   so nothing waits on them. */
main.home[data-enter] > .card, main.home[data-enter] > section > .card, main.home[data-enter] .hero { animation: rise-in .45s cubic-bezier(.2,.7,.2,1) both; }
main.home > :nth-child(2) { animation-delay: .06s; } main.home > :nth-child(3) { animation-delay: .12s; }
main.home > :nth-child(4) { animation-delay: .18s; } main.home > :nth-child(n+5) { animation-delay: .24s; }
main[data-enter] .ring-wrap svg { animation: ring-in .6s cubic-bezier(.2,.7,.2,1) both; transform-origin: center; }
main[data-enter] .sections > * { animation: rise-in .4s cubic-bezier(.2,.7,.2,1) both; }
.sections > :nth-child(2) { animation-delay: .05s; } .sections > :nth-child(3) { animation-delay: .1s; }
.sections > :nth-child(4) { animation-delay: .15s; } .sections > :nth-child(n+5) { animation-delay: .2s; }
.option.right { animation: right-pulse .45s ease-out; }
.option.wrong { animation: wrong-shake .4s ease-in-out; }

@keyframes rise-in { from { opacity: 0; transform: translateY(.75rem); } to { opacity: 1; transform: none; } }
@keyframes ring-in { from { opacity: 0; transform: rotate(-90deg) scale(.8); } to { opacity: 1; transform: none; } }
@keyframes right-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes wrong-shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-.375rem); } 40%, 80% { transform: translateX(.375rem); } }
@media (prefers-reduced-motion: reduce) {
  .pearl, .pearl-steps li, main.home *, .section-card, .option.right, .option.wrong, .recall-answer, .flip-inner { animation: none !important; transition: none !important; }
}

/* ═══ Supreme Memorizer: error types, re-teach, review rounds, the sheet ═══ */
.not-sure-row { margin-top: var(--s-2); }
.type-chip { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: baseline; margin: var(--s-3) 0; font-size: var(--t-meta); }
.type-badge { font-weight: 700; padding: .125rem .5rem; border-radius: 999px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--edge); }
.type-chip[data-type="R"] .type-badge { background: var(--good-soft); }
.type-chip[data-type="C"] .type-badge, .type-chip[data-type="E"] .type-badge { background: var(--bad-soft); }
.type-chip[data-type="N"] .type-badge { background: var(--mid-soft); }
.reteach { margin: var(--s-3) 0; padding: var(--s-4); border-radius: .625rem; background: var(--accent-soft); color: var(--ink); }
.reteach h3 { margin: var(--s-1) 0 var(--s-2); }
.reteach-line + .reteach-line { border-top: 1px solid var(--line); margin-top: var(--s-2); padding-top: var(--s-2); }
.reteach-label { display: block; font-size: var(--t-tiny); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.reteach-line p { margin: .25rem 0 0; }
.reteach-line.app p { color: var(--muted); font-style: italic; }
.chain .chain-verb { color: var(--muted); }
.weak-line { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; justify-content: space-between; }
.weak-line p { margin: 0; }
.closing ol.pillars, .closing ul { padding-left: 1.25rem; }
.closing li { margin: .375rem 0; }
.closing .letters { font-family: var(--script); font-size: var(--t-lead); color: var(--accent); letter-spacing: .08em; }
.weak-report li[data-graduated="true"] strong { text-decoration: line-through; text-decoration-color: var(--good); }

/* ═══ Glass, glow and the aurora ══════════════════════════════════════════
   The finish over the layout above. Surfaces are frosted glass over a slow
   aurora of the theme's own colours (--aura-1..3, --glass*, from
   appearance.js, where every text colour is fitted against the glass as it
   actually composites over the page and each aurora pool — so the finish
   cannot cost contrast). High contrast and the Contrast theme get opaque
   glass and no blur from the same tokens; a browser without backdrop-filter,
   or a person who asks for less transparency, gets the solid surface.
   After the owner asked for an iPad's glass and fewer colours: clearer
   panes under a stronger blur, a bright rim, a sheen from the top-left and a
   light that follows the finger (--px/--py, set by ui.js) — and the accent
   solid, where it used to run into a second colour. */
:root { --accent-2: #0051A8; --glass: rgba(255,255,255,.52); --glass-strong: rgba(255,255,255,.74); --glass-2: rgba(242,242,247,.52);
  --glass-edge: rgba(255,255,255,.75); --glass-blur: 28px; --glass-rim: rgba(255,255,255,.55); --glass-sheen: rgba(255,255,255,.30); --glass-light: rgba(255,255,255,.38);
  --aura-1: rgba(0,122,255,.14); --aura-2: rgba(90,200,250,.16); --aura-3: rgba(175,82,222,.10);
  --ease-out: cubic-bezier(.2,.7,.2,1); --lift: 0 2px 4px rgba(0,0,0,.06), 0 18px 40px -12px rgba(0,0,0,.22); }
body { position: relative; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
  background: radial-gradient(38vmax 30vmax at 12% 8%, var(--aura-1), transparent 70%),
    radial-gradient(34vmax 28vmax at 88% 18%, var(--aura-2), transparent 70%),
    radial-gradient(40vmax 34vmax at 60% 92%, var(--aura-3), transparent 72%);
  opacity: .75; animation: aura-drift 40s ease-in-out infinite alternate; }
@keyframes aura-drift { from { transform: translate3d(0,0,0) rotate(0deg); } to { transform: translate3d(-3vmax,2vmax,0) rotate(8deg); } }

.card, .jump-card, .unit-row, .learn-box, .pill, .chip, .btn.chip, .dock, .section-card, .option, details.source, .menu-list {
  background-color: var(--glass);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.3); backdrop-filter: blur(var(--glass-blur)) saturate(1.3);
  border-color: var(--line);
  box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-rim), var(--shadow); }
.dock, .menu-list { background-color: var(--glass-strong); box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-rim), 0 12px 40px -8px rgba(0,0,0,.35); }
.card, .jump-card, .unit-row, .section-card, .pearl, .learn-box { border-radius: 1.25rem; }
/* The sheen and the light, on every pane but those with a ground of their
   own: the big idea's dark band and the pearl's ECG paper keep theirs. */
:where(.card, .jump-card, .unit-row, .learn-box, .pill, .chip, .btn.chip, .dock, .section-card, .option, details.source, .menu-list):not(.big-idea):not(.pearl) {
  background-image: radial-gradient(16rem circle at var(--px, 50%) var(--py, -40%), var(--lit, transparent), transparent 70%),
    linear-gradient(155deg, var(--glass-sheen), transparent 42%); }
[data-lit] { --lit: var(--glass-light); }
.card.note { background-color: var(--accent-soft); }
.card.error { background-color: var(--bad-soft); }
.hook { background-color: var(--glass-2); border-color: var(--line); }
.option.right { background-color: var(--good-soft); }
.option.wrong { background-color: var(--bad-soft); }
.nav-btn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px -6px var(--accent); }
.nav-btn { transition: background-color .2s, color .2s, transform .2s var(--ease-out); }
.nav-btn:active { transform: scale(.94); }

/* Primary buttons: the accent, solid, with a sheen that crosses on
   hover. */
.btn { transition: transform .18s var(--ease-out), box-shadow .18s, border-color .18s; }
.btn.primary { position: relative; overflow: hidden; border-color: transparent;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 16px -10px var(--accent); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-18deg); transition: left .6s var(--ease-out); }
.btn.primary:hover::after { left: 120%; }
.btn:hover:not([disabled]) { transform: translateY(-1px); }
.btn:active:not([disabled]) { transform: translateY(0) scale(.98); }
.bar i { position: relative; overflow: hidden; background: var(--accent); }
.bar i::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); animation: bar-shine 2.8s ease-in-out infinite; }
@keyframes bar-shine { to { transform: translateX(100%); } }
.stepper li.now { border-color: var(--accent); }

/* Lift on hover, for the things that open something. */
.jump-card, .unit-row, .section-card, .learn-box, .option:not([disabled]) { transition: transform .25s var(--ease-out), box-shadow .25s, border-color .25s; }
.jump-card:hover, .unit-row:hover, .section-card:hover, .learn-box:hover { transform: translateY(-3px); box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-rim), var(--lift); border-color: var(--accent); }
/* Pressed, it gives under the finger. */
.jump-card:active, .unit-row:active, .section-card:active, .learn-box:active, .option:not([disabled]):active { transform: scale(.975); transition-duration: .08s; }

/* A new screen settles in: a short fade up when the view changes (render()
   marks it), never on a redraw of the same screen. `backwards`, so no
   transform is left behind to trap a fixed overlay inside the page. */
main[data-enter] { animation: screen-in .32s var(--ease-out) backwards; }
@keyframes screen-in { from { opacity: 0; transform: translateY(10px) scale(.992); } }

/* ── the home, as a dashboard ─────────────────────────────────────────── */
.wrap.home { max-width: 74rem; }
.home-hero { position: relative; overflow: hidden; isolation: isolate; align-items: center; flex-wrap: wrap;
  margin: var(--s-3) 0 var(--s-5); padding: var(--s-6) var(--s-6) calc(var(--s-6) + 1.5rem); border-radius: 2rem;
  color: var(--hero-ink); border: 1px solid var(--hero-edge);
  background: radial-gradient(60% 120% at 100% 0%, var(--hero-edge), transparent 60%),
    radial-gradient(50% 90% at 0% 100%, rgba(255,255,255,.04), transparent 70%),
    linear-gradient(135deg, var(--hero-a), var(--hero-b) 55%, var(--hero-c));
  box-shadow: inset 0 1px 0 var(--hero-pill-edge), var(--shadow); }
.home-hero::after { content: ""; position: absolute; z-index: -1; width: 26rem; height: 26rem; right: -8rem; top: -12rem; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, var(--hero-accent), transparent 65%); opacity: .18; animation: hero-glow 9s ease-in-out infinite alternate; }
@keyframes hero-glow { from { transform: scale(.9); opacity: .08; } to { transform: scale(1.1); opacity: .16; } }
.home-hero .hello { color: var(--hero-muted); }
.home-hero .learn { color: var(--hero-ink); font-size: 3.25rem;
  background: linear-gradient(120deg, var(--hero-ink) 30%, var(--hero-accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-line { margin: var(--s-2) 0 0; color: var(--hero-muted); font-size: var(--t-body); display: flex; align-items: center; flex-wrap: wrap; gap: .25rem; }
.hero-line strong { color: var(--hero-ink); }
.hero-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--hero-accent); margin-right: .25rem; box-shadow: 0 0 0 0 var(--hero-accent); animation: hero-pulse 2.4s ease-out infinite; }
@keyframes hero-pulse { 0% { box-shadow: 0 0 0 0 var(--hero-edge); } 70% { box-shadow: 0 0 0 .6rem transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hero-trace { position: absolute; left: 0; right: 0; bottom: .25rem; width: 100%; height: 2.5rem; z-index: -1; pointer-events: none; opacity: .75; overflow: visible; }
.hero-trace path { fill: none; stroke: var(--hero-accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 0; filter: drop-shadow(0 0 4px var(--hero-accent)); }
main[data-enter] .hero-trace path { animation: trace-draw 3.2s var(--ease-out) both; }
@keyframes trace-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.hero-stats { gap: var(--s-3); }
.home-hero .pill.stat { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; min-width: 6.5rem; padding: .625rem 1rem; border-radius: 1.25rem;
  font-size: var(--t-lead); color: var(--hero-ink); background: var(--hero-pill); border: 1px solid var(--hero-pill-edge);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 var(--hero-pill-edge); }
.home-hero button.pill.stat { cursor: pointer; transition: transform .2s var(--ease-out), background-color .2s; }
.home-hero button.pill.stat:hover { transform: translateY(-2px); background: var(--hero-pill-edge); }
.stat-label { display: block; font-size: var(--t-tiny); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--hero-muted); }
.home-hero .pill.stat-ring { flex-direction: row; align-items: center; gap: var(--s-2); }
.home-hero .stat-ring .ring-wrap { width: 2.75rem; height: 2.75rem; }
.home-hero .stat-ring .ring .track { stroke: var(--hero-pill-edge); }
.home-hero .stat-ring .ring .fill { stroke: var(--hero-accent); }
.home-hero .stat-ring .ring-pct { color: var(--hero-ink); font-size: var(--t-tiny); }
.home-hero .mascot { filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }

.home-grid { display: grid; gap: var(--s-4); align-items: start; margin: 0 0 var(--s-4); }
.home-grid > .pearl { margin: 0; }
.home-side { display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; }
.home-side > .section-head:first-child { margin-top: 0; }
.home-side .jump { flex-direction: column; overflow: visible; scroll-snap-type: none; }
.home-side .jump-card { flex: none; width: 100%; }
@media (min-width: 60rem) {
  .home-grid.two { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  .units#units, .units:not(#books) { grid-template-columns: repeat(auto-fill, minmax(14.5rem, 1fr)); }
}
.home-add { display: grid; gap: var(--s-2); margin: var(--s-2) 0 0; }
.home-add .chips { margin: 0; }
.learn-box { position: relative; overflow: hidden; min-height: 7rem; border-style: dashed; border-width: 2px; }
.learn-box::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: radial-gradient(40% 120% at 100% 50%, var(--aura-2), transparent 70%); }
.learn-plus { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 50%; color: var(--accent-ink);
  background: var(--accent); box-shadow: 0 6px 16px -8px var(--accent); position: relative; }
.chip:hover { border-color: var(--accent); }

/* ── home is three things; the chapters are their own page ───────────── */
/* A tighter hero, so the brain is in view on opening. */
main.home:not(.shelf) .home-hero { margin-bottom: var(--s-4); padding: var(--s-5); }
/* the band's foot: sections drilled, of all of them */
.hero-progress { flex: 1 1 100%; display: grid; gap: .375rem; margin-top: var(--s-1); }
.hp-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); font-size: var(--t-meta); color: var(--hero-muted); }
.hp-row strong { color: var(--hero-ink); }
.hp-pct { font-variant-numeric: tabular-nums; }
.hp-bar { height: .5rem; border-radius: 999px; background: var(--hero-pill, rgba(127,127,127,.18)); overflow: hidden; }
.hp-bar i { display: block; height: 100%; border-radius: inherit; background: var(--hero-accent); transition: width .6s var(--ease-out); }
main.home:not(.shelf) .home-hero .learn { font-size: 2.75rem; }
main.home:not(.shelf) > .pearl { min-height: 0; margin-bottom: var(--s-4); }
/* the three numbers as one row of small chips, beside Continue */
main.home:not(.shelf) .hero-stats { gap: var(--s-2); }
main.home:not(.shelf) .home-hero .pill.stat { flex-direction: row; align-items: center; gap: .375rem; min-width: 0; padding: .375rem .75rem; min-height: 2.5rem;
  font-size: var(--t-body); border-radius: 999px; }
main.home:not(.shelf) .home-hero .stat-label { display: inline; }
main.home:not(.shelf) .home-hero .pill.stat, main.home:not(.shelf) .home-hero .pill.stat * { white-space: nowrap; }
@media (max-width: 32.5rem) {
  /* on a phone the chips say it by their icons: 🔥 is the streak, ↻ what is due */
  main.home:not(.shelf) .home-hero #streak .stat-label, main.home:not(.shelf) .home-hero #pill-due .stat-label { display: none; }

.brain-svg { display: block; width: 100%; height: auto; max-height: 36rem; overflow: visible; -webkit-user-select: none; user-select: none; }

  animation: brain-fire 2.8s linear infinite; }

.neuron { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: center; transition: transform .25s var(--ease-out); }

<body>
<div id="app"><noscript>Memorizer needs JavaScript.</noscript></div>
<!--
  Order matters: fsrs.js is Systole's scheduler and pearl.js its pearl
  finder, both shared rather than copied (src/core/); ui.js reads every module before it at load.
  scripts/build-memorizer.js inlines each tag marked data-inline, so the
  built app is one file. Served from the repository root, this page also
  runs as-is: http://localhost:8080/memorizer/
-->
<script>/* ../src/core/fsrs.js */
/* ═══════════════════════════════════════════════════════════════════════════
   fsrs.js — FSRS-5 spaced-repetition scheduling.

   Replaces SM-2. The concrete bug this fixes: under SM-2, every rating on a
   card's first review set the same interval (ivl=1, "tomorrow") regardless of
   whether you tapped Again or Easy — reps===1 forced ivl=1 unconditionally,
   so the four buttons on a brand-new card were never actually different from
   each other. FSRS assigns each rating its own initial stability from the
   very first review (w[0..3] below), so Again/Hard/Good/Easy diverge
   immediately instead of only after the card has been seen twice.

   FSRS-5 default parameters, as published by the open-spaced-repetition
   project (MIT-licensed algorithm; these are the documented population
   defaults used before a deck has enough history to fit its own).

   Card shape, day granularity throughout (matches the app's existing
   todayISO()-based due dates — there is no sub-day "learning step" queue
   here, which is why intervals are rounded up to whole days, not minutes):
     { difficulty, stability, ivl, reps, lapses, due, last }
   difficulty: 1-10, how inherently hard the card is to retain.
   stability:  days for retrievability to fall to 90% — the model's memory
               of how well-learned the card is.
   ivl:        the scheduled interval in days, derived from stability at the
               default 90% target retention (see fsrsIvl for why that makes
               ivl and stability numerically the same thing at this target).

   Usage:
     const next = fsrsUpdate(S.srs[q.id], grade);   // grade: 1 Again .. 4 Easy
     S.srs[q.id] = next;
     const r = fsrsRetrievability(card.stability, daysSince(card.last));
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

const FSRS_W = [0.4072,1.1829,3.1262,15.4722,7.2102,0.5316,1.0651,0.0234,1.616,
                0.1544,1.0824,1.9813,0.0953,0.2975,2.2042,0.2407,2.9466,0.5034,0.6567];
const FSRS_DECAY = -0.5;
const FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1;   // ≈0.234568, tuned so R(t=S)=0.9

/* WHICH SCHEDULER WROTE A SCHEDULE.
   A card stores `stability` and `ivl` — numbers, with no record of the model
   that produced them. That is fine while the model never changes, and these
   are the published FSRS-5 population defaults precisely because no deck here
   has enough history to fit its own yet. The day one does, the weights change,
   and every card already on disk was scheduled by a model that no longer
   exists. Nothing today could tell those cards apart from fresh ones, so there
   would be no way to decide whether to leave them, re-derive them, or let them
   correct themselves over the next few reviews.

   Stamped per card rather than once per store, because that is the truthful
   granularity: a store accumulates cards over months and can easily span two
   models, so a single stamp on the blob would be a lie about most of it. The
   cost is ~5 bytes x 639 cards in a store that is bounded and small. */
const SCHEDULER_VERSION = 1;

/* And the forcing function, because a version somebody has to remember to
   bump is a version that will be wrong. This hashes the numbers that actually
   determine every interval the module produces; verify-fsrs.js pins the
   result. Change a weight without bumping SCHEDULER_VERSION and the pin fails
   and says so — the same bargain scripts/build.js makes with its exact-match
   patches, and the same one SHELL_V makes by deriving itself from content.

   FNV-1a: this module runs in a browser with no crypto import, and the job is
   to notice a change, not to resist an adversary. */
function fsrsParamsFingerprint() {
  const src = FSRS_W.join(',') + '|' + FSRS_DECAY;
  let h = 0x811c9dc5;
  for (let i = 0; i < src.length; i++) { h = Math.imul(h ^ src.charCodeAt(i), 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

/* ── calendar days, in the fellow's own timezone ──────────────────────────
   A DAY HERE IS A LOCAL CALENDAR DAY, never a UTC one, and these three are the
   only place that convention is expressed.

   The bug they replace: due dates were built by parsing `iso + 'T00:00:00'`,
   which ES parses as LOCAL midnight, and then read back with
   `.toISOString().slice(0,10)`, which is the UTC day. Anywhere east of
   Greenwich those are different days, so every card was scheduled one day
   EARLY — in Karachi at UTC+5, a one-day interval came due today. It went
   unnoticed for as long as it did because the suite's own expected-date helper
   derived its answer the same wrong way, so the two agreed and the tests
   passed in every timezone.

   The property that makes this correct is that a date string never touches UTC
   at all: it is split into its parts, rebuilt as a local Date, and formatted
   back from local parts. '2026-06-15' in, '2026-06-15' out, at any offset —
   including the 45-minute one Kathmandu uses, which defeats arithmetic that
   assumes whole-hour zones. */
function isoToLocalDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);   /* local midnight */
  return isNaN(d.getTime()) ? null : d;
}
function localDateToISO(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function todayISO() { return localDateToISO(new Date()); }

/* Both ends parsed the same way, so the difference is whole days even across a
   spring-forward boundary where one of them is only 23 hours long — Math.round
   absorbs the hour that DST adds or removes. A malformed date yields 0 rather
   than NaN, because this feeds retrievability, which feeds stability, and a
   NaN there reaches `new Date(NaN).toISOString()` and throws from inside
   render() — the failure mode the rest of this module is already written
   against. */
function daysBetween(fromISO, toISO) {
  const a = isoToLocalDate(fromISO), b = isoToLocalDate(toISO);
  if (!a || !b) return 0;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

/* Probability of recall after `elapsedDays` since a card with the given
   stability was last reviewed. This is the number the rest of the app calls
   "mastery": literally "how likely are you to get this right today". */
function fsrsRetrievability(stability, elapsedDays) {
  if (!(stability > 0)) return 0;
  const t = Math.max(0, elapsedDays);
  return Math.pow(1 + FSRS_FACTOR * t / stability, FSRS_DECAY);
}

function fsrsInitStability(rating) {
  return Math.max(0.1, FSRS_W[Math.max(1, Math.min(4, rating)) - 1]);
}
function fsrsInitDifficulty(rating) {
  const d = FSRS_W[4] - Math.exp(FSRS_W[5] * (rating - 1)) + 1;
  return Math.min(10, Math.max(1, d));
}
/* Difficulty drifts toward the rating just given, damped more gently near the
   1/10 boundaries (FSRS-5's refinement over 4.5), then reverts a little
   toward the difficulty an Easy first-review would have produced — otherwise
   difficulty is a random walk with no anchor. */
function fsrsNextDifficulty(prevDifficulty, rating) {
  const deltaD = -FSRS_W[6] * (rating - 3);
  const damped = prevDifficulty + deltaD * (10 - prevDifficulty) / 9;
  const target = fsrsInitDifficulty(4);
  const reverted = FSRS_W[7] * target + (1 - FSRS_W[7]) * damped;
  return Math.min(10, Math.max(1, reverted));
}
/* Stability after a successful recall (rating 2 Hard, 3 Good, or 4 Easy):
   the harder the card (higher D), the lower the retrievability was when you
   saw it, and the longer it's already held up (higher S) — the bigger the
   stability jump. Hard applies a penalty, Easy a bonus, on top of that. */
function fsrsNextStabilitySuccess(difficulty, stability, retrievability, rating) {
  const hardPenalty = rating === 2 ? FSRS_W[15] : 1;
  const easyBonus = rating === 4 ? FSRS_W[16] : 1;
  const growth = Math.exp(FSRS_W[8])
    * (11 - difficulty)
    * Math.pow(stability, -FSRS_W[9])
    * (Math.exp((1 - retrievability) * FSRS_W[10]) - 1)
    * hardPenalty * easyBonus;
  return stability * (growth + 1);
}
/* Stability after a lapse (rating 1, Again): forgetting resets it, not to
   zero, but to a fraction of what it was — harder cards and cards forgotten
   at higher retrievability (a "surprise" lapse) lose more ground. */
function fsrsNextStabilityFail(difficulty, stability, retrievability) {
  const s = FSRS_W[11]
    * Math.pow(difficulty, -FSRS_W[12])
    * (Math.pow(stability + 1, FSRS_W[13]) - 1)
    * Math.exp((1 - retrievability) * FSRS_W[14]);
  /* FORGETTING MUST NEVER MAKE A CARD MORE DURABLE. The formula alone does not
     guarantee that. Its e^((1-R)·w14) term rewards a lapse at low
     retrievability — the reasoning being that failing something you had
     genuinely forgotten says less about the card than failing something you
     should have known — and on a card whose stability is already small that
     term can carry the result above where it started. Measured on the
     reachable state space: 275 of 616 combinations of stability, difficulty
     and elapsed days came out higher after Again than before it, by up to
     4.2x, and 136 of them pushed the interval FURTHER OUT than the card
     already had. A two-day card you had just failed came back in five.

     That is not a tuning question, it is the wrong sign. Whatever the weights
     say, pressing Again cannot be a way to see a card less often, so the
     result is capped at the stability it started from. */
  return Math.min(s, stability);
}

/* Interval, in whole days, for a given stability at the default 90% target
   retention. At exactly 90% retention the interval-from-retrievability
   formula collapses algebraically to ivl == stability (both are "the number
   of days for recall probability to reach 90%", by definition) — so this is
   not an approximation, it is what stability already means at this target.
   Rounded UP rather than to nearest: a day-granularity due date is a "don't
   resurface before this many full days" commitment, and rounding up is what
   keeps a fresh Again (stability ≈0.4d) and a fresh Hard (≈1.2d) from both
   collapsing onto the same "tomorrow" — the exact failure mode this module
   replaces. */
function fsrsIvl(stability) {
  return Math.max(1, Math.ceil(stability));
}

/* Seed a "previous state" for a card FSRS has never scheduled before —
   either genuinely new, or a legacy SM-2 card ({ivl,reps,due,lapses,last},
   no stability/difficulty fields) carried over from before this module
   existed. A legacy card's old interval is a reasonable proxy for what its
   stability already was; difficulty starts at the neutral midpoint and
   corrects itself within a review or two. Returns null for a genuinely new
   card, since there is no prior state to decay from at all. */
/* EVERY FIELD READ HERE IS CHECKED, because a card is not always a card this
   module wrote. accsap12.v2 — which carries S.srs — is restored wholesale from
   a user-picked file by the backup importer, and a truncated or hand-edited
   backup can supply a card with no difficulty, or a stability of 0 or null.

<script>/* src/skill.js */

       guessed: a wrong option picked is C (it is what the fact was confused
       with), "not sure" is N, missed then right on the retry is R, missed

       protocol is paid for once per few minutes rather than on every step.

   code-execution container on Anthropic's side and are built for work that
   produces files. Every step here is a schema-checked JSON reply the
   student is waiting on; a container per step would add seconds and cost,
   and the structured-output guarantee the grader depends on. Compiling the
   skill keeps both.

   rule (this app teaches only from the uploaded PDF — the grounding rule in

<script>/* src/prompts.js */
/* ═══════════════════════════════════════════════════════════════════════════
