   shape its answer must have, and the parser that refuses anything else.

   it says. A model told to "prefer" a source still smooths over a gap with
   what it already knows, and from the outside you cannot tell which sentences

   gap. Every prompt carries it, and tests/verify-memorizer-prompts-pure.js

  'excerpt seems incomplete. If something is needed and the excerpt does not contain it, write ' +

      if (s.exam.questions) refuse(s, event, 'the exam already has its questions');
      if (!validQuestions(v)) refuse(s, event, 'the exam has no usable questions');

      s.exam.questions = v.questions.map(function (q) {
        var ok = typeof q.cluster === 'number' && q.cluster >= 0 && q.cluster < n && Math.floor(q.cluster) === q.cluster;
        var o = clone(q); o.cluster = ok ? q.cluster : null;
        return o;

    case 'examAnswered': {
      if (s.phase !== 'exam') refuse(s, event, 'an exam answer needs the exam');
      if (!s.exam.questions) refuse(s, event, 'no exam questions yet');
      if (typeof event.choice !== 'number') refuse(s, event, 'an answer is the index of an option');
      var e = answer(s.exam, s.exam.questions, event.choice);
      s.exam.results.push({ q: e.qi, choice: event.choice, correct: e.correct });
      var sec = e.q.cluster == null ? weakest(s, 1)[0] : e.q.cluster;
      if (!e.correct) {
        var emt = missType(e.q, event.choice);
        weakMiss(s, addCard(s, 'exam', sec, e.q), sec, 'exam', e.q, emt.t, emt.w);

/* 0..1 per section: its latest drill's first-pass score; null before it has

function mastery(state, i) {
  var c = state.per[i];

}

/* The sections the exam leans on: lowest mastery first, not-yet-drilled
   counting as zero, a section with nothing to drill as full marks, ties to
   the earlier section. */
function weakest(state, n) {
  var idx = state.titles.map(function (_, i) { return i; });
  idx.sort(function (a, b) {

    ma = ma == null ? (state.per[a].done ? 1 : 0) : ma; mb = mb == null ? (state.per[b].done ? 1 : 0) : mb;
    return ma - mb || a - b;

}

function examSize(state) { return Math.min(12, Math.max(6, state.titles.length * 2)); }

/* The question strings every drill asked, so the exam can avoid them. */
function asked(state) {
  var out = [];

    (q ? q.questions : []).forEach(function (x) { out.push(x.question + (x.quote || '')); });

}

/* The next section to learn: the first not drilled after the current one,
   else the first not drilled at all, else null (time for the exam). */
function nextSection(state) {

}

/* A saved session this version can carry on: version 2 (multiple choice,
   before the weak list) or 3. Version 1 was the old recall protocol. */

/* The item a review round is on, and whether a wrong answer now would be
   the second miss in a row — the skill's trigger for a re-teach (§8). */

}
function needsReteach(state) { var w = reviewItem(state); return !!w && w.streak >= 1; }

/* The skill's closing deliverable (§16): three pillars, the mnemonic sheet,
   the weak-area report. The pillars are the big ideas of one lesson from

  var picks = n < 3 ? state.titles.map(function (_, i) { return i; }) : [0, Math.floor(n / 3), Math.floor(2 * n / 3)];
  var pillars = [];
  picks.forEach(function (i) {
    var L = state.per[i] && state.per[i].lesson;
    var text = L && (L.overview || (L.points && L.points[0] && L.points[0].text));
    if (text && pillars.length < 3) pillars.push({ title: state.titles[i], text: text, page: L.points && L.points[0] ? L.points[0].page : null });
  });
  var sheet = [];
  state.titles.forEach(function (t, i) {
    var L = state.per[i] && state.per[i].lesson;
    ((L && L.mnemonics) || []).forEach(function (m) { if (m && m.letters) sheet.push({ section: t, title: m.title, letters: m.letters, words: (m.words || []).slice() }); });
  });
  var weak = Object.keys(state.weak || {}).map(function (k) { return state.weak[k]; })
    .sort(function (a, b) { return (b.misses >= 2) - (a.misses >= 2) || b.misses - a.misses || a.order - b.order; })
    .map(function (w) {
      return { label: w.label, question: w.q.question, answer: w.q.options[w.q.answer], page: w.q.page, section: state.titles[w.cluster] || '',

  var c = closing(state), out = ['THREE PILLARS'];
  c.pillars.forEach(function (p, i) { out.push((i + 1) + '. ' + p.text + (p.page ? ' (p.' + p.page + ')' : '')); });
  out.push('', 'MNEMONIC SHEET');
  if (!c.sheet.length) out.push('- None this unit.');
  c.sheet.forEach(function (m) { out.push('- ' + m.title + ': ' + m.letters + ' \u2014 ' + m.words.join(', ')); });
  out.push('', 'WEAK AREA REPORT');
  if (!c.weak.length) out.push('- Nothing was missed.');
  c.weak.forEach(function (w) {
    out.push('- ' + w.answer + ' \u2014 ' + w.misses + (w.misses === 1 ? ' miss' : ' misses') + ', type ' + w.types.join('/') +
      (w.confusedWith ? ', confused with ' + w.confusedWith : '') + (w.graduated ? ', graduated' : ', still weak') + (w.page ? ' (p.' + w.page + ')' : ''));
  });
  return out.join('\n');

/* ── review ──────────────────────────────────────────────────────────────── */
/* A card never reviewed is due at once — unless it was made to start
   later (study.js's cloze and occlusion cards start tomorrow, so a drill
   does not end in a second drill of the same sentences). */

  return !card.srs.due || card.srs.due <= today;

/* A section deleted by the owner: every place that names a section by its
   number is renumbered — its progress, the review cards and weak items the
   session holds, the exam's questions — and what belonged to the deleted

  if (n < 2) throw new Error('a unit keeps at least one section: delete the unit instead');
  if (s.phase === 'exam' || s.phase === 'review' || s.review) throw new Error('finish or leave the ' + (s.phase === 'exam' ? 'exam' : 'review') + ' first');

  s.per = per;

  else s.section = shift(s.section);
  s.cards = (s.cards || []).filter(function (c) { return c.cluster !== i; }).map(function (c) { c.cluster = shift(c.cluster); return c; });
  var weak = {};
  Object.keys(s.weak || {}).forEach(function (id) { var w = s.weak[id]; if (w.cluster === i) return; w.cluster = shift(w.cluster); weak[id] = w; });

  nextSection: nextSection, allDone: allDone, isDue: isDue, dueCards: dueCards, review: review,
  NOT_SURE: NOT_SURE, resumable: resumable, pending: pending, interleave: interleave, reviewItem: reviewItem, needsReteach: needsReteach,
  closing: closing, closingText: closingText, missType: missType, dropSection: dropSection, dropCards: dropCards,

<script>/* src/provider.js */
/* ═══════════════════════════════════════════════════════════════════════════
   provider.js — which coach runs the protocol, and the one call to Claude.

   Two choices. The BUILT-IN coach (coach.js) needs no key, no account and no
   network, and is the default. CLAUDE is the optional upgrade: the user's
   own key, kept in this browser's localStorage and sent only to Anthropic.

   Gemini and Groq were here and were removed at the owner's request after
   both failed on first use (Gemini: "high demand"; Groq: key rejected). A
   saved setting naming either is read as the built-in coach — and its key is
   dropped, never sent to a different provider.

   Raw fetch rather than an SDK: this is a single HTML file with no bundler.
   Every phase asks for JSON and names its schema, and the reply goes through
   MemPrompts.parse, which is the check that counts.

   build(): pure — the request a call WOULD make. call(): does it.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

var PROVIDERS = {
  builtin: {
    label: 'Built-in coach \u2014 free, no key, works offline',
    models: [['builtin', 'Built-in']],
    keyHint: '',
    noKey: true,
  },
  anthropic: {
    label: 'Claude (Anthropic) \u2014 your own API key',
    models: [['claude-opus-5', 'Claude Opus 5 \u2014 best teacher'],
             ['claude-sonnet-5', 'Claude Sonnet 5 \u2014 faster, cheaper'],
             ['claude-haiku-4-5', 'Claude Haiku 4.5 \u2014 fastest']],
    keyHint: 'sk-ant-\u2026  from console.anthropic.com',
  },
};
var DEFAULT_PROVIDER = 'builtin';

var ENDPOINT = {
  anthropic: 'https://api.anthropic.com/v1/messages',
};

/* How long to wait before the one retry of an overloaded provider. A
   property so a test can shorten it. */
var RETRY_MS = 2000;

/* Claude Opus 5's safety classifiers can decline a request; "default"
   fallbacks re-run a declined request on Anthropic's recommended model
   server-side instead of returning the refusal. Opus 5 only. */
var FALLBACK_MODELS = { 'claude-opus-5': true };

function build(cfg, prompt, schema, opts) {
  opts = opts || {};
  var provider = cfg.provider, model = cfg.model, key = cfg.key;
  if (provider === 'anthropic') {
    var headers = {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    };
    var body = {
      model: model, max_tokens: 16000, system: prompt.system,
      messages: [{ role: 'user', content: prompt.user }],
    };
    if (schema) body.output_config = { format: { type: 'json_schema', schema: schema } };
    if (FALLBACK_MODELS[model] && !opts.noFallbacks) {
      headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
      body.fallbacks = 'default';
    }
    return { url: ENDPOINT.anthropic, init: { method: 'POST', headers: headers, body: JSON.stringify(body) } };
  }
  throw new Error('unknown provider ' + provider);
}

/* The reply text, or a thrown Error that says what went wrong in words. */
function textOf(provider, data) {
  if (provider === 'anthropic') {
    if (data.stop_reason === 'refusal') {
      var why = data.stop_details && data.stop_details.explanation;
      throw new Error('Claude declined this request' + (why ? ': ' + why : '.'));
    }
    if (data.stop_reason === 'max_tokens') throw new Error('the reply was cut off before it finished');
    return (data.content || []).filter(function (b) { return b.type === 'text'; })
      .map(function (b) { return b.text; }).join('');
  }
  return '';
}

function errorText(status, data) {
  var m = data && data.error && (data.error.message || data.error.type);
  if (status === 401 || status === 403) return 'the API key was rejected (' + status + '). Check it in Settings.';
  if (status === 429) return 'rate limited (429) — wait a moment and try again.';
  if (status === 529 || status === 503) return 'the provider is overloaded right now (' + status + ') \u2014 try again in a minute, or switch to the built-in coach in Settings.';
  /* Providers retire models; the one saved in Settings may no longer exist
     for this key. Say what to do, and keep the provider's own words. */
  if (status === 404) return 'this model is not available to your key (404) — choose another model in Settings.' + (m ? ' The provider said: ' + m : '');
  return 'the provider returned ' + status + (m ? ': ' + m : '');
}

function call(cfg, prompt, kind, fetchImpl) {
  var f = fetchImpl || function (u, i) { return root.fetch(u, i); };
  var P = root.MemPrompts || (typeof require === 'function' ? require('./prompts.js') : null);
  var schema = P.SCHEMAS[kind];
  function attempt(opts) {
    var req = build(cfg, prompt, schema, opts);
    return f(req.url, req.init).then(function (res) {
      return res.text().then(function (t) {
        var data = null;
        try { data = JSON.parse(t); } catch (_) { /* reported below */ }
        if (!res.ok) {
          /* An account without the fallback beta, or a model that does not
             take it, says so in a 400 naming the parameter. Retry once
             without it rather than fail the whole step. */
          if (res.status === 400 && !(opts && opts.noFallbacks) && /fallback/i.test(t) && cfg.provider === 'anthropic') {
            return attempt({ noFallbacks: true, retried: opts && opts.retried });
          }
          /* Overloaded ("high demand") is usually over in seconds. One
             retry, after a pause; a second overload is reported. */
          if ((res.status === 529 || res.status === 503) && !(opts && opts.retried)) {
            return new Promise(function (resolve) { setTimeout(resolve, MemProvider.RETRY_MS); })
              .then(function () { return attempt({ noFallbacks: opts && opts.noFallbacks, retried: true }); });
          }
          throw new Error(errorText(res.status, data));
        }
        if (!data) throw new Error('the provider\'s reply was not JSON');
        var parsed = P.parse(kind, textOf(cfg.provider, data));
        if (!parsed.ok) throw new Error(parsed.error);
        return parsed.value;
      });
    });
  }
  return attempt({});
}

var CFG_KEY = 'memorizer.ai.v1';
/* A saved model that is no longer in its provider's list — one this app has
   since dropped because the provider retired it — is replaced by that
   provider's first model, rather than being sent again to fail. Without
   this, removing a retired model from the list would fix new users and leave
   everyone who had already saved it stuck on the 404. The key is kept. */
function loadConfig(storage) {
  var d = { provider: DEFAULT_PROVIDER, model: PROVIDERS[DEFAULT_PROVIDER].models[0][0], key: '' };
  try {
    /* reading root.localStorage itself throws where storage is refused (a data: URL) */
    var st = storage || root.localStorage;
    var s = JSON.parse(st.getItem(CFG_KEY) || 'null');
    if (s && PROVIDERS[s.provider]) {
      var listed = PROVIDERS[s.provider].models.some(function (m) { return m[0] === s.model; });
      d.provider = s.provider;
      d.model = listed ? s.model : PROVIDERS[s.provider].models[0][0];
      d.key = s.key || '';
    }
  } catch (_) { /* private mode or blocked storage: defaults */ }
  return d;
}
function saveConfig(cfg, storage) {
  try { var st = storage || root.localStorage; st.setItem(CFG_KEY, JSON.stringify(cfg)); return true; } catch (_) { return false; }
}

function needsKey(cfg) { return !(PROVIDERS[cfg.provider] && PROVIDERS[cfg.provider].noKey); }
function ready(cfg) { return !needsKey(cfg) || !!cfg.key; }

var MemProvider = {
  PROVIDERS: PROVIDERS, DEFAULT_PROVIDER: DEFAULT_PROVIDER, RETRY_MS: RETRY_MS, needsKey: needsKey, ready: ready, ENDPOINT: ENDPOINT, build: build, textOf: textOf, call: call,
  loadConfig: loadConfig, saveConfig: saveConfig,
};
root.MemProvider = MemProvider;
if (typeof module !== 'undefined' && module.exports) module.exports = MemProvider;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>/* src/analogies.js */
/* ═══════════════════════════════════════════════════════════════════════════
   analogies.js — everyday comparisons for the ideas cardiology keeps coming
   back to, so a lesson can say "think of it like…" without a key or a network.

   THESE ARE NOT FROM THE STUDENT'S BOOK. Everything else the built-in coach
   teaches is the PDF's own words; these were written for Memorizer, and the
   lesson says so beside every one ("Analogy — Memorizer's, not your book's").
   An analogy explains a mechanism; it never carries a number, a dose, a
   threshold or a recommendation, because those must come from the book.
   Each one says where it stops being true, when that matters.

   An entry is chosen for a section when the section itself uses its terms:
   `match` is a list of patterns, scored by how often the section's text hits
   them (a hit in the title counts three times). The best two that clear
   MIN_SCORE are shown. PURE.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

var MIN_SCORE = 2;

var BANK = [
  { id: 'preload', title: 'Preload', match: [/\bpreload\b/i, /end-?diastolic (?:volume|pressure|stretch)/i, /\bventricular filling\b/i],
    text: 'Preload is how far a rubber band is stretched before you let it go. Stretch it a bit more and it snaps back harder — that is the Frank–Starling relation. Overstretch it and it stops gaining force.' },
  { id: 'afterload', title: 'Afterload', match: [/\bafterload\b/i, /\bwall stress\b/i, /\bsystemic (?:vascular )?resistance\b/i],
    text: 'Afterload is the weight of the door the ventricle must push open to get blood out. A stiff, narrowed valve or high blood pressure makes the door heavier; the muscle has to squeeze harder for the same result, and over time it bulks up.' },
  { id: 'contractility', title: 'Contractility', match: [/\bcontractility\b/i, /\binotrop/i, /\bsystolic function\b/i],
    text: 'Contractility is the strength of the engine itself, independent of how much fuel is loaded (preload) or how steep the hill is (afterload). Inotropes tune the engine up; ischemia or failing muscle tunes it down.' },
  { id: 'frank-starling', title: 'Frank–Starling mechanism', match: [/frank[-– ]starling/i, /\bstarling\b/i],
    text: 'A heart that fills more pumps more, the way a sail that catches more wind pulls harder — up to the point where the sail is stretched flat and more wind adds nothing.' },
  { id: 'cardiac-output', title: 'Cardiac output', match: [/\bcardiac output\b/i, /\bstroke volume\b/i, /\bcardiac index\b/i],
    text: 'Cardiac output is buckets per minute: stroke volume is the size of each bucket and heart rate is how fast you pass them. Shrink the bucket and you must pass faster to keep up.' },
  { id: 'ejection-fraction', title: 'Ejection fraction', match: [/\bejection fraction\b/i, /\bLVEF\b/, /\bHFrEF\b/, /\bHFpEF\b/],
    text: 'Ejection fraction is how much of a full glass you drink with each gulp. It says nothing about how big the glass is, which is why a big failing ventricle and a small stiff one can hide the same symptoms behind different numbers.' },
  { id: 'compliance', title: 'Compliance and diastolic dysfunction', match: [/\bcomplian/i, /\bdiastolic dysfunction\b/i, /\brelaxation\b/i, /\bstiff(?:ness|ened)? (?:ventricle|myocardium|heart)\b/i],
    text: 'A compliant ventricle fills like a party balloon; a stiff one fills like a car tyre. To get the same volume into the tyre you need much more pressure — and that pressure backs up into the lungs.' },
  { id: 'hypertrophy', title: 'Concentric and eccentric hypertrophy', match: [/\bhypertroph/i, /\bremodel/i, /\bwall thickness\b/i],
    text: 'Pressure overload is like lifting heavy weights: the wall thickens inward (concentric). Volume overload is like carrying ever-bigger loads: the chamber stretches and enlarges (eccentric). Both help at first and harm later.' },
  { id: 'laplace', title: 'Law of Laplace', match: [/\blaplace\b/i, /\bwall tension\b/i, /\bdilat(?:ed|ation) (?:ventricle|aorta|chamber)\b/i],
    text: 'A bigger balloon is harder to hold closed than a small one at the same pressure: wall tension rises with radius. A dilated ventricle or aorta works against more tension, and a thicker wall shares the load.' },
  { id: 'stenosis', title: 'Valve stenosis', match: [/\bstenosis\b/i, /\bstenotic\b/i, /\bvalve area\b/i, /\bgradient\b/i],
    text: 'A stenotic valve is a doorway that has narrowed to a slit: the chamber behind it must push harder to get the same flow through, pressure builds up behind it, and the jet squirting through is fast — which is what Doppler measures.' },
  { id: 'regurgitation', title: 'Valve regurgitation', match: [/\bregurgita/i, /\binsufficiency\b/i, /\bleaky\b/i, /\bregurgitant\b/i],
    text: 'A regurgitant valve is a door that will not close: some of each beat flows back the wrong way, so the chamber has to pump the same blood twice. The extra volume stretches it — tolerated for years, until it is not.' },
  { id: 'atherosclerosis', title: 'Atherosclerosis', match: [/\batheroscler/i, /\bplaque\b/i, /\batheroma\b/i, /\bLDL\b/],
    text: 'A plaque is rust building up inside a water pipe: it narrows the lumen slowly, and the dangerous moment is not the slow narrowing but a crack in the rust that exposes the inside and sets off a clot.' },
  { id: 'plaque-rupture', title: 'Plaque rupture and thrombosis', match: [/\brupture\b/i, /\bthromb/i, /\berosion\b/i, /\bacute coronary syndrome\b/i, /\bACS\b/],
    text: 'Plaque rupture is a pothole tearing open in the road: platelets are the road crew rushing in to patch it, and in an artery the patch itself can block the whole lane.' },
  { id: 'ischemia', title: 'Ischemia and supply–demand', match: [/\bischemi/i, /\bischaemi/i, /\bangina\b/i, /\boxygen (?:supply|demand)\b/i],
    text: 'Ischemia is a factory whose delivery trucks cannot keep up with production: at rest the narrowed road is enough, but push the factory harder (exercise, fast heart rate) and the shortfall shows.' },

/* ── the five steps ──────────────────────────────────────────────────────── */

/* ── the lesson ──────────────────────────────────────────────────────────── */

  var lists = K.lists(cluster).filter(function (l) { return l.items.length >= 2 && (hooked || []).indexOf(l.title) === -1; }).slice(0, MAX_LISTS).map(function (l) {
    return { title: l.title, items: l.items.slice(0, MAX_ITEMS).map(function (i) { return i.label; }), more: Math.max(0, l.items.length - MAX_ITEMS), page: l.page };
  });
  return facts.length || pathway.length || lists.length ? { facts: facts, pathway: pathway, lists: lists } : null;
}

/* ── the lesson as one mental model (the owner's plan, phase 2) ──────────
   THE STAGES, in the order a clinician builds a topic: orient (what it is),
   mechanism (why), recognise (the points, the glance), numbers, don't
   confuse (the pairs), recall (check, teach back). A section shows the
   stages it has material for: orient, recognise and recall always; the
   others only when the lesson carries them, so no stage is an empty
   page. */
var STAGES = [['orient', 'Orient'], ['mechanism', 'Mechanism'], ['recognise', 'Recognise'], ['numbers', 'Numbers'],
              ['confuse', 'Don\u2019t confuse'], ['recall', 'Recall']];
var ALWAYS = { orient: true, recognise: true, recall: true };
function stages(have) {
  return STAGES.filter(function (st) { return ALWAYS[st[0]] || (have && have[st[0]]); }).map(function (st) { return { id: st[0], label: st[1] }; });
}

/* THE CLINICAL MAP: the conditions, scenarios, tests and treatments the
   section names (ask.js's vocabulary), grouped, each with the page it is
   first named on — the section's cast, before its lines. Only what the
   book's own text names. */

function clinicalMap(cluster) {
  var by = {}, seen = {};
  (cluster && cluster.segments || []).forEach(function (sg) {
    var t = sg.table ? (sg.tableHeader ? [sg.tableHeader] : []).concat(sg.table).map(function (r) { return r.join(' '); }).join(' ') : sg.text;
    Ask.entriesIn(t || '').forEach(function (e) {
      var k = e.kind + ':' + e.id;
      if (seen[k]) return;
      seen[k] = true;
      (by[e.kind] = by[e.kind] || []).push({ label: e.label, page: sg.page });
    });

/* THE ONE-SCREEN REVIEW: the whole section on a card to glance at before
   a drill or an exam — the idea, each point, the values, the pairs, the
   hooks, the pearls. The lesson's own words, cut to fit, never reworded. */
var REVIEW_POINTS = 8, REVIEW_VALUES = 8;
function reviewSheet(lesson) {
  var L = lesson || {}, sh = sheetOf(L);
  var points = sh.groups.reduce(function (a, g) { return a.concat(g.points); }, []).slice(0, REVIEW_POINTS).map(function (p) { return { text: p.text, page: p.page }; });
  var values = [];
  sh.numbers.forEach(function (n) { n.tiles.forEach(function (t) { values.push({ value: t.value, label: t.label, page: n.page }); }); });
  return {
    idea: sh.bigIdea, points: points, values: values.slice(0, REVIEW_VALUES),
    confuse: (L.distinctions || []).map(function (d) { return { a: d.a, b: d.b, how: d.how }; }),
    hooks: (L.mnemonics || []).map(function (m) { return { title: m.title, letters: m.letters }; }),
    pearls: (L.pearls || []).map(function (p) { return p.text; }),
  };
}

var MemSheet = { MAX_LABEL_WORDS: MAX_LABEL_WORDS, MAX_FACTS: MAX_FACTS, MAX_LISTS: MAX_LISTS, MAX_ITEMS: MAX_ITEMS, numberTiles: numberTiles, sheetOf: sheetOf, glance: glance,
                 STAGES: STAGES, stages: stages, clinicalMap: clinicalMap, REVIEW_POINTS: REVIEW_POINTS, REVIEW_VALUES: REVIEW_VALUES, reviewSheet: reviewSheet };

<script>/* src/figure.js */
/* ═══════════════════════════════════════════════════════════════════════════
   figure.js — figures made from the book, never invented.

   PURE. The owner asked for a figure or image generator. An image model
   draws a convincing valve or ECG and gets it wrong — anatomy invented,
   labels garbled — which is worse than no figure for someone memorising for
   an exam. So these figures are DRAWN FROM THE LESSON: every word and number
   on them is the book's (through sheet.js), laid out to be looked at and
   remembered, and saved as an image to keep or share:
     · a STUDY CARD for a section — big idea, key points under their
       clinical headings, number tiles, mnemonic;
     · a COMPARISON CHART across the sections learned — each one's big idea,
       numbers and mnemonic side by side, the way a student compares aortic
       stenosis with aortic regurgitation.
   Output is SVG text: every piece of text escaped, every line wrapped to
   the card's width. tests/verify-memorizer-figure-pure.js holds it.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

var W = 1080;                 /* card width, px */
var PAD = 56;
var FONT = "-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif";
var C = { bg: '#FFFFFF', ink: '#0F172A', muted: '#475569', accent: '#0369A1', soft: '#E0F2FE', tile: '#F1F5F9', line: '#CBD5E1', hook: '#FEF3C7' };

function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* Words into lines of at most `max` characters; a word longer than that is
   a line of its own, never cut. */
function wrap(text, max) {
  var out = [], cur = '';
  String(text || '').split(/\s+/).filter(Boolean).forEach(function (w) {
    if (cur && (cur + ' ' + w).length > max) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
  });
  if (cur) out.push(cur);
  return out;
}
/* ~0.52 of the font size per character is a fair average for these faces. */
function charsFor(width, size) { return Math.max(8, Math.floor(width / (size * 0.52))); }

function Doc() { this.parts = []; this.y = 0; }
Doc.prototype.text = function (x, size, weight, color, lines, lead) {
  var self = this;
  lines.forEach(function (l) {
    self.y += size * (lead || 1.35);
    self.parts.push('<text x="' + x + '" y="' + Math.round(self.y) + '" font-size="' + size + '" font-weight="' + weight + '" fill="' + color + '">' + esc(l) + '</text>');
  });
};
Doc.prototype.rect = function (x, y, w, h, fill, r) {
  this.parts.push('<rect x="' + x + '" y="' + Math.round(y) + '" width="' + w + '" height="' + Math.round(h) + '" rx="' + (r || 16) + '" fill="' + fill + '"/>');
};
Doc.prototype.svg = function (height, title) {
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + Math.round(height) + '" viewBox="0 0 ' + W + ' ' + Math.round(height) + '" font-family="' + esc(FONT) + '">' +
    '<title>' + esc(title) + '</title><rect width="100%" height="100%" fill="' + C.bg + '"/>' + this.parts.join('') + '</svg>';
};

/* A section's study card. sheet: sheet.js's sheetOf(); mnemonics: the
   lesson's; source: "Book · pp. 12–14". */
function studyCard(title, sheet, mnemonics, source) {
  var d = new Doc(), inner = W - 2 * PAD;
  d.y = PAD - 10;
  d.text(PAD, 20, 700, C.accent, [String(source || '').toUpperCase()]);
  d.text(PAD, 44, 800, C.ink, wrap(title, charsFor(inner, 44)), 1.2);
  d.y += 18;
  var ideaLines = wrap(sheet.bigIdea, charsFor(inner - 48, 28));
  var top = d.y;
  d.rect(PAD, top, inner, ideaLines.length * 28 * 1.4 + 48, C.soft);
  d.y = top + 12;
  d.text(PAD + 24, 28, 700, C.ink, ideaLines, 1.4);
  d.y = top + ideaLines.length * 28 * 1.4 + 48 + 12;
  (sheet.groups || []).forEach(function (g) {
    d.y += 14;
    d.text(PAD, 20, 800, C.accent, [g.heading.toUpperCase()]);
    g.points.forEach(function (p) {
      d.y += 4;
      d.text(PAD + 20, 24, 400, C.ink, wrap('• ' + p.text, charsFor(inner - 20, 24)), 1.35);
    });
  });
  (sheet.numbers || []).forEach(function (n) {
    d.y += 24;
    if (n.subject) d.text(PAD, 22, 800, C.ink, [n.subject]);
    d.y += 12;
    var cols = Math.min(3, n.tiles.length), tw = (inner - (cols - 1) * 16) / cols, row = 0;
    n.tiles.forEach(function (t, i) {
      var col = i % cols;
      if (col === 0 && i) row++;
      var x = PAD + col * (tw + 16), y = d.y + row * 116;
      d.rect(x, y, tw, 100, C.tile, 14);
      d.parts.push('<text x="' + Math.round(x + 18) + '" y="' + Math.round(y + 50) + '" font-size="34" font-weight="800" fill="' + C.ink + '">' + esc(t.value) + '</text>');
      d.parts.push('<text x="' + Math.round(x + 18) + '" y="' + Math.round(y + 82) + '" font-size="20" fill="' + C.muted + '">' + esc(wrap(t.label, charsFor(tw - 36, 20))[0] || '') + '</text>');
    });
    d.y += (row + 1) * 116 - 16;
  });
  (mnemonics || []).forEach(function (m) {
    d.y += 28;
    var h = 70 + m.words.length * 44;
    d.rect(PAD, d.y, inner, h, C.hook);
    var y0 = d.y;
    d.y += 8;
    d.text(PAD + 24, 22, 800, C.ink, [m.title]);
    m.words.forEach(function (w) {
      d.y += 10;
      d.y += 34;
      d.parts.push('<text x="' + (PAD + 24) + '" y="' + Math.round(d.y) + '" font-size="34" font-weight="800" fill="' + C.accent + '">' + esc(w.charAt(0).toUpperCase()) + '</text>' +
        '<text x="' + (PAD + 72) + '" y="' + Math.round(d.y) + '" font-size="28" fill="' + C.ink + '">' + esc(w) + '</text>');
    });
    d.y = y0 + h;
  });
  d.y += 36;
  d.text(PAD, 18, 400, C.muted, ['Made by Memorizer from your book’s own words.']);
  return d.svg(d.y + PAD, title);
}

/* A comparison across sections: rows [{ title, sheet, mnemonic }]. */
function compareChart(unitName, rows) {
  var d = new Doc(), inner = W - 2 * PAD;
  var colW = [260, inner - 260 - 300, 300];
  d.y = PAD - 10;
  d.text(PAD, 20, 700, C.accent, ['COMPARE']);
  d.text(PAD, 40, 800, C.ink, wrap(unitName, charsFor(inner, 40)), 1.2);
  d.y += 20;
  var heads = ['Section', 'The big idea', 'Numbers'];
  var x = PAD;
  heads.forEach(function (hd, i) { d.parts.push('<text x="' + x + '" y="' + Math.round(d.y + 20) + '" font-size="18" font-weight="800" fill="' + C.muted + '">' + esc(hd.toUpperCase()) + '</text>'); x += colW[i]; });
  d.y += 36;
  rows.forEach(function (r, k) {
    var cells = [
      wrap(r.title, charsFor(colW[0] - 20, 24)),
      wrap(r.sheet.bigIdea, charsFor(colW[1] - 24, 22)),
      [].concat.apply([], (r.sheet.numbers || []).map(function (n) { return n.tiles.map(function (t) { return t.label + ' ' + t.value; }); })).reduce(function (a, t) { return a.concat(wrap(t, charsFor(colW[2], 20))); }, []),
    ];
    if (r.mnemonic) cells[0] = cells[0].concat(['', r.mnemonic.letters.split('').join(' · ')]);
    var lines = Math.max(cells[0].length, cells[1].length, Math.max(1, cells[2].length));
    var h = lines * 32 + 28;
    if (k % 2 === 0) d.rect(PAD - 12, d.y, inner + 24, h, C.tile, 10);
    var cx = PAD;
    cells.forEach(function (cell, i) {
      cell.forEach(function (l, j) {
        d.parts.push('<text x="' + cx + '" y="' + Math.round(d.y + 36 + j * 32) + '" font-size="' + (i === 0 ? 24 : i === 1 ? 22 : 20) + '" font-weight="' + (i === 0 ? 800 : 400) + '" fill="' + (i === 2 ? C.accent : C.ink) + '">' + esc(l) + '</text>');
      });
      cx += colW[i];
    });
    d.y += h + 8;
  });
  d.y += 28;
  d.text(PAD, 18, 400, C.muted, ['Made by Memorizer from your book’s own words.']);
  return d.svg(d.y + PAD, 'Compare: ' + unitName);
}

var MemFigure = { W: W, esc: esc, wrap: wrap, charsFor: charsFor, studyCard: studyCard, compareChart: compareChart };
root.MemFigure = MemFigure;
if (typeof module !== 'undefined' && module.exports) module.exports = MemFigure;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>/* src/agent.js */
/* ═══════════════════════════════════════════════════════════════════════════
   agent.js — the Coach as an agent: it reads what you ask, picks a tool,
   uses it on your book, and answers in the conversation.

   PURE. The owner asked for a Coach "like an LLM AI agent". An agent is a
   loop: understand the message, choose an action, act, answer, remember.
   Here the actions are the app's own tools, each working on the owner's
   book and nothing else:
     search    — the book's own sentences on a question (ask.js)
     explain   — a section in one line, its cause and effect, what is asked
                 most, its mnemonics (coach.js explainSection)
     quiz      — three questions on a section, answered in the chat
     compare   — two sections side by side: big idea, numbers, mnemonic
     mnemonic  — a section's mnemonics
     numbers   — a section's numbers to know
     open      — open a section to learn it
     weak      — where the sessions say you are shakiest
     plan      — what to study now
     review    — the cards due today
     help      — what it can do
     mistake   — why the recent misses happened, by error type, and the fix
     round     — a review round of the weak items, begun
     schedule  — the cards due each day this week
   It REMEMBERS the topic, so "quiz me on that", "why?" or "more" carry on
   from the last answer; and, across sessions, which tools are used and the
   book's section titles they landed on (remember / profileLine) — never
   what was typed.

   Without the on-device model, a set of rules over the message (plan())
   picks each step's tool; a message may be several steps (clauses /
   afterStep, below). The tools answer from the book.

   With the on-device model running, the model drives instead (run()): it
   sees the message, what is remembered and each tool's result so far, and
   names the next tool or answers, up to MODEL_STEPS tools. A step is used
   only if it names a real tool; the answer is shown only sentence by
   sentence as it holds to the results it cites (ground.js). A first reply
   that is not a usable step hands the message to the rules' loop.
   tests/verify-memorizer-agent-pure.js holds it.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

function askMod() { return root.MemAsk || (typeof require === 'function' ? require('./ask.js') : null); }

var TOOLS = ['help', 'exam', 'teach', 'table', 'mistake', 'round', 'weak', 'schedule', 'plan', 'review', 'quiz', 'compare', 'mnemonic', 'numbers', 'explain', 'open', 'search'];
/* In order: the first that matches wins. Each one's words are removed from
   the message to leave its topic. */
var RULES = [
  ['help', /^\s*(?:help|hi|hello|hey|what can you do|who are you)\b[\s?!.]*$/i],
  ['exam', /\b(?:my )?exams? (?:is |are )?(?:on|in|date|tomorrow|next)\b|\bexam date\b|\bplan (?:to|for|until) (?:my |the )?exam\b/i],
  ['teach', /\b(?:let me explain|teach (?:it |this )?back|explain (?:it|this) back|i(?:'|’)?ll explain|let me teach)\b/i],
  ['mistake', /\b(?:why (?:did|do) i (?:get|keep getting|keep missing|miss)|explain my (?:mistakes?|misses|errors?)|my (?:mistakes?|misses|errors?))\b/i],
  ['round', /\b(?:review round|round of (?:my )?weak|re-?test (?:my )?weak|drill my weak)\b/i],
  ['weak', /\b(?:weak(?:est)?|shakiest|struggl\w*|where am i (?:bad|weak)|what do i (?:get wrong|miss))\b/i],
  ['schedule', /\b(?:schedule|this week|tomorrow|next few days|when (?:is|are) (?:my )?(?:next )?(?:cards?|reviews?) due)\b/i],
  ['plan', /\b(?:what should i (?:study|learn|do|revise)|study plan|plan (?:for )?(?:today|my day)|what(?:'s| is) next|where do i start)\b/i],
  ['review', /\b(?:review|due cards?|flash ?cards?|revise my cards)\b/i],
  ['table', /\b(?:quiz|test|drill|ask) me on (?:the |this |its )?table\b|\btable (?:round|quiz)\b|\bthe table (?:in|of|on)\b/i],
  ['quiz', /\b(?:quiz|test|drill|ask) me\b|\bmcqs?\b|\bquestions? (?:on|about)\b/i],
  ['compare', /\b(?:compare|comparison|difference(?:s)? between|differ(?:s|ence)?|versus|vs\.?)\b/i],
  ['mnemonic', /\b(?:mnemonics?|how (?:do|can) i remember|help me remember)\b/i],
  ['numbers', /\b(?:numbers?|values?|thresholds?|cut-?offs?|criteria)\b(?: (?:to know|for|of|in))?/i],
  ['explain', /^\s*(?:explain|tell me about|describe|summari[sz]e|give me an overview of|overview of|teach me about)\b/i],
  ['open', /^\s*(?:open|teach me|learn|study|go to|take me to)\b/i],
];
var FILLER = /\b(?:please|give|show|list|me|the|a|an|on|about|of|for|in|to|and|my|this|that|it|them|those|these|one|section|chapter|topic|can you|could you|would you|i want|let'?s|now|again)\b/gi;
var FOLLOW = /^\s*(?:it|that|this|them|those|these|more|again|why|how|same|the same)?\s*[?.!]*\s*$/i;

function topicOf(text, rule) {
  var t = String(text || '');
  if (rule) t = t.replace(rule, ' ');
  t = t.replace(/[?!.,;:"“”]/g, ' ').replace(FILLER, ' ').replace(/\s+/g, ' ').trim();
  return t;
}

/* What the message asks for, by the rules: { tool, topic, topics? }. A
   message that is only a follow-up ("why?", "more", "quiz me on that")
   takes its topic from memory. */
function plan(text, memory) {
  var mem = memory || {};
  var t = String(text || '').trim();
  if (!t) return { tool: 'help', topic: '' };
  for (var i = 0; i < RULES.length; i++) {
    var r = RULES[i];
    if (!r[1].test(t)) continue;
    var out = { tool: r[0], topic: topicOf(t, r[1]) };
    if (r[0] === 'compare') {
      /* split the message itself — the filler words include "and" */
      var parts = t.split(/\s+(?:and|with|vs\.?|versus|or)\s+|\s*,\s*/i).map(function (x) { return topicOf(x, r[1]); }).filter(Boolean);
      out.topics = parts.slice(0, 2);
      if (out.topics.length === 1 && mem.topic) out.topics.unshift(mem.topic);
    }
    if (!out.topic && /quiz|explain|mnemonic|numbers|open|compare|teach|table/.test(r[0])) out.topic = mem.topic || '';
    if (r[0] === 'exam') out.topic = t;
    return out;
  }
  /* "why?", "more", "that one" — carry on from the last topic */
  if (FOLLOW.test(t) && mem.topic) return { tool: /why|how/i.test(t) ? 'explain' : 'search', topic: mem.topic };
  return { tool: 'search', topic: t };
}

/* A step the model names: used only when it names one of the tools. */
function parsePlan(reply) {
  var v;
  try { v = JSON.parse(String(reply)); } catch (_) { return null; }
  if (!v || TOOLS.indexOf(v.tool) === -1) return null;
  var topic = typeof v.topic === 'string' ? v.topic.trim().slice(0, 80) : '';
  var out = { tool: v.tool, topic: topic, by: 'ai' };
  if (v.tool === 'compare') {
    out.topics = (Array.isArray(v.topics) ? v.topics : []).filter(function (x) { return typeof x === 'string' && x.trim(); }).map(function (x) { return x.trim().slice(0, 80); }).slice(0, 2);
    if (out.topics.length < 2) return null;
  }
  return out;
}

/* The section a topic means: one whose title shares the most of its words,
   else the best section for it as a question (ask.js). -1 if none. */
function findSection(idx, topic) {
  var words = String(topic || '').toLowerCase().split(/[^a-z0-9]+/).filter(function (w) { return w.length > 2; });
  if (!idx || !words.length) return -1;
  /* the most of the topic's words; of equals, the title with least else in it */
  var best = -1, bestScore = 0, bestLen = Infinity;
  idx.sections.forEach(function (s, i) {
    var title = String(s.title || '').toLowerCase();
    var n = words.filter(function (w) { return title.indexOf(w) !== -1; }).length;
    var score = n / words.length;
    if (n && (score > bestScore || score === bestScore && title.length < bestLen)) { best = i; bestScore = score; bestLen = title.length; }
  });
  if (best !== -1 && bestScore >= 0.5) return best;
  var r = askMod().ask(idx, topic);
  return r.found && r.sections.length ? r.sections[0] : best;
}

/* What the coach says before its tool's result: short, and about the book. */
function say(p, title) {
  var t = title ? '“' + title + '”' : '';
  switch (p.tool) {
    case 'help': return 'I’m your coach. Ask me anything about your book, or: explain a topic, quiz me, compare two topics, give me the mnemonics or numbers, what should I study, where am I weak.';
    case 'weak': return 'Here is where your answers say you are shakiest.';
    case 'plan': return 'Here is what I’d do next.';
    case 'review': return 'Your cards due today.';
    case 'quiz': return t ? 'Three questions on ' + t + '. Answer them here.' : 'Tell me the topic to be quizzed on.';
    case 'table': return t ? 'The table in ' + t + ', row by row.' : 'Tell me which section’s table.';
    case 'compare': return t ? 'Side by side: ' + t + '.' : 'Tell me the two topics to compare.';
    case 'mnemonic': return t ? 'The mnemonics for ' + t + '.' : 'Tell me the topic.';
    case 'numbers': return t ? 'The numbers to know in ' + t + '.' : 'Tell me the topic.';
    case 'explain': return t ? t + ', as your book tells it.' : 'Tell me what to explain.';
    case 'open': return t ? 'Opening ' + t + '.' : 'Tell me what to open.';
    case 'exam': return 'Your plan from today to the exam.';
    case 'teach': return t ? 'Explain ' + t + ' in your own words; I’ll check it against the book.' : 'Tell me what you will explain.';
    case 'mistake': return 'Why your recent misses happened, and what fixes each kind.';
    case 'round': return 'A review round of what you still get wrong, mixed.';
    case 'schedule': return 'Your cards due each day this week.';
    default: return 'From your book:';
  }
}

/* The item-level weak list (the Supreme Memorizer rule, skill.js), unit by
   unit: what "where am I weak" names besides the weakest sections — each
   item still weak, with its error type and how often it was missed. An
   item that has graduated is not weak; a unit with nothing weak is left
   out. */
function weakItems(docs, sessions, max) {
  var Skill = root.MemSkill || (typeof require === 'function' ? require('./skill.js') : null);
  var out = [];
  (docs || []).forEach(function (d) {
    var st = sessions && sessions[d.id];
    var items = st && st.weak ? Object.keys(st.weak).map(function (k) { return st.weak[k]; }) : [];

<script>/* src/pack.js */
/* ═══════════════════════════════════════════════════════════════════════════
   pack.js — a unit's lessons and questions, written with Claude in the
   owner's own chat, and held to the book before any of it is used.

   PURE. Builds the prompt the owner copies into claude.ai, reads the reply
   pasted back, and checks it. Never calls anything.

   WHY THIS EXISTS. The built-in coach only extracts: it can pick the book's
   sentences, never reason about them. The owner has Claude, with their own
   Braunwald-the-Master and Supreme-Memorizer skills, one chapter per chat.
   So Memorizer writes the request, carrying the chapter's own text with its
   [p.N] page markers (the same excerpt the API path sends, prompts.js), and
   imports what comes back: the lesson, the questions, and what an extractor
   cannot write — the mechanism, the pairs that get confused, why each wrong
   option is wrong, and the trap a question sets.

   HELD TO THE BOOK. What Claude writes is checked against the chapter, and
   what is not found is FLAGGED on screen, never passed off as the book's:
     · every number must be in the section or on the page it cites;
     · every condition, test and treatment it names (ask.js's vocabulary)

     · every page it cites must be in the section;
     · a quoted sentence, its gap filled with the answer, must be the

   title is not this unit's, a question that is not a fair multiple-choice
   question (prompts.js mcqError), and anything Claude marked NOT_IN_PDF.
   A question is held to these by what it claims — its right answer and its
   explanation — not by its stem, whose vignette is a scenario, nor by its
   wrong options, which are wrong on purpose. Only what the checks name is
   checked: a sentence can pass all of them and still be Claude's
   paraphrase, which is why it is labelled "Written with Claude".

   ═══════════════════════════════════════════════════════════════════════════ */

var Ask = root.MemAsk || (typeof require === 'function' ? require('./ask.js') : null);

var FORMAT = 'memorizer-pack';
var VERSION = 1;
/* Sections per reply. A section's lesson and questions, with a reason for

var PER_REPLY = 4;
var NOT_IN_PDF = Prompts.NOT_IN_PDF;

/* ── the shape ─────────────────────────────────────────────────────────────

  distinctions: arr(extend({ properties: {} }, { a: S, b: S, how: S, page: I })),
  pearls: arr(PAGED),

  cases: arr(extend({ properties: {} }, { stem: S, asks: arr(extend({ properties: {} }, { q: S, a: S })), page: I })),
  /* comparison and classification tables: a first column of what is

var EXAMPLE = {
  section: 1,
  title: 'the section title, exactly as listed',
  lesson: {
    overview: 'The big idea in one or two plain sentences.',
    mechanism: 'Why it happens, as a chain: A leads to B, which causes C.',
    points: [{ text: 'Key term — the point, at most 25 words.', page: 12 }],
    numbers: [{ text: 'What it measures: the value and its unit.', page: 12 }],
    distinctions: [{ a: 'one thing', b: 'what it is confused with', how: 'How to tell them apart, in one sentence.', page: 13 }],
    pearls: [{ text: 'The one fact most likely to be asked.', page: 12 }],
    cases: [{ stem: 'A short clinical scenario, as on rounds.', asks: [{ q: 'What an examiner asks first?', a: 'The answer, from the text.' }], page: 12 }],
    mnemonics: [{ title: 'What the list is', letters: 'ABC', words: ['Alpha', 'Beta', 'Gamma'] }],
    analogies: [{ title: 'Short name', text: 'An everyday comparison.', source: 'Claude' }],
    flowchart: 'flowchart TD\n  A["first step"] --> B["next step"]',
    tables: [{ title: 'What the table compares', columns: ['Feature', 'first thing', 'second thing'], rows: [['a feature', 'its value for the first', 'its value for the second']], page: 12 }],

    quote: '',

/* ── the prompt ────────────────────────────────────────────────────────── */

    '',
    'You are a master clinician and a medical educator preparing a candidate for boards and oral exams. Write a ' +
    'study pack for my Memorizer app from the chapter below. Use your Braunwald-the-Master and Supreme-Memorizer ' +
    'skills if this chat has them. The goal: after one pass through a section, I understand why, I can recall ' +

    '1. Work ONLY from the chapter text below (and from the chapter’s PDF, if I attach it, for its figures ' +
    'and tables). Every fact, number, dose, threshold, drug, test and condition you write must be in it. Add ' +
    'nothing from your own knowledge, however correct. Where something is needed and the text does not have ' +
    'it, write ' + NOT_IN_PDF + ' instead — Memorizer leaves those items out.',
    '2. Cite a page for every item, numbered as the [p.N] markers in the text number them.',
    '3. Memorizer checks your reply against my book before it uses it: every number, every page, every quoted ' +
    'sentence, table cell and flowchart label, and the conditions, tests and treatments you name. Anything it ' +
    'cannot find is shown to me flagged "not found in your book". Copy numbers exactly as printed (value, unit, ' +
    'direction: >, <, ≥, ≤); never round, convert or combine them; name things in the text’s own words.',

    '5. Reply with JSON only, in one code block, in exactly the shape shown below. Every field is required: ' +
    'write "" or [] when there is nothing to put.',
    '',
    'HOW TO DESIGN IT — for the eye, for memory, for the exam',
    '- Most examinable first, in every list. Cut what is not worth a mark.',
    '- One fact per item. Start with its key term, then the fact: "Key term — fact". Short, parallel phrasing; ' +

    '- Show structure, do not describe it: a comparison of two or more things across two or more features is a ' +
    'TABLE; a sequence, cascade or decision is a FLOWCHART; a list of three or more is a MNEMONIC; two things a ' +

    '- Understanding before memorising: the mechanism explains the facts, so a point never needs its own reason repeated.',
    '- Every number worth a mark is in lesson.numbers, and again in a table if it belongs to a comparison.',
    '',
    'FOR EACH SECTION',
    '- "section" is its number in the list below, and "title" its title exactly as listed.',
    '- lesson.overview: the big idea — what this section is about and why it matters — in one or two plain sentences.',
    '- lesson.mechanism: the chain of cause and effect that makes the section make sense, as "A → B → C" in two ' +
    'to four sentences ("" if it has none).',
    '- lesson.points: 5 to 10 high-yield points, most important first, each at most 25 words and starting ' +
    'with its key term.',
    '- lesson.numbers: every threshold, cut-off, dose, percentage or duration worth memorising, one to an ' +
    'item, as "what it measures: value unit".',
    '- lesson.distinctions: the pairs a student confuses — two conditions, drugs, signs or criteria — ' +

    '{ "format": "' + FORMAT + '", "version": ' + VERSION + ', "unit": ' + JSON.stringify(name) + ', "sections": [ … ] }',

    JSON.stringify(EXAMPLE, null, 2),

    'REPLIES',

    plan,

    'THE SECTIONS',
    list,
    '',
    'THE CHAPTER TEXT',
    '<<<CHAPTER',
    text,
    'CHAPTER>>>',

/* ── reading a reply ───────────────────────────────────────────────────────

function parse(text) {

    if (!Array.isArray(p.sections)) return { ok: false, error: 'the pack has no list of sections' };

/* ── the book, as the checks read it ──────────────────────────────────── */

}

/* "p. 12", "pp. 12–13", "[p.12]": a citation's number is not a claim. */
function unpaged(t) { return String(t || '').replace(/\[?\bpp?\.\s*\d+(?:\s*[–—-]\s*\d+)?\]?/gi, ' '); }

<script>/* src/format.js */
/* ═══════════════════════════════════════════════════════════════════════════
   format.js — a key point as a bullet: short, professional, the key term
   first.

   PURE, and SUBTRACTIVE ONLY. It may drop words — "However,", "It is
   important to note that", "(see Figure 3)", "[12]" — and split a long point
   at its semicolons, but it never adds or changes a word. A definition
   "Preload is the stretch on …" becomes lead "Preload", body "the stretch on
   …": the "is" is dropped, the rest is the PDF's own words in the PDF's own
   order. tests/verify-memorizer-coach-pure.js holds that: every word out is
   a word that was in.

   What it returns is a description, not markup — { lead, body, subs } — so
   the page draws it with textContent, like every other piece of text.
   ═══════════════════════════════════════════════════════════════════════════ */

'use strict';

var FILLER = /^(?:however|moreover|furthermore|in addition|additionally|also|thus|therefore|hence|importantly|notably|of note|in general|generally|overall|finally|first|second|third|firstly|secondly|similarly|conversely|in contrast|for example|for instance|that is|in summary|in short|in fact|indeed|of course|as such|in practice|clinically)\s*,\s*/i;
var PREAMBLE = /^(?:it is (?:important|worth|useful) (?:to note|noting|remembering|to remember) that|it should be (?:noted|remembered) that|note that|remember that|recall that)\s+/i;
var CITE = /\s*\[\s*\d+(?:\s*[,–\-]\s*\d+)*\s*\]/g;
var XREF = /\s*\((?:see\s+)?(?:fig(?:ure)?|table|chapter|section|page|p)\.?\s*[^)]{0,20}\)/gi;
var DEFINE = /^((?:\S+\s+){0,5}?\S+)\s+(?:is|are|refers to|is defined as|are defined as|means)\s+(.+)$/i;

   asks Claude for. Only the dash or colon is dropped. A colon needs a space
   after it, so "12:00" is not a lead. */
var LEAD = /^([^\u2014\u2013:;]+?)\s*(?:[\u2014\u2013]|:)\s+(.+)$/;

  var s = String(t || '').replace(CITE, '').replace(XREF, '').replace(/\s+/g, ' ').trim();

  var main = parts[0], subs = parts.slice(1);

<script>/* ../src/core/pearl.js */
/* ═══════════════════════════════════════════════════════════════════════════
   pearl.js — one fact from your own notes, on the home screen.

   The hero is the first thing seen every morning and, below the wordmark, it
   was chrome: a question count, a percentage, and a rhythm label naming the
   trace behind it. Handsome, and it taught nothing. A board candidate opening
   a study app should read something worth knowing before they read a metric.

   WHERE THE PEARLS COME FROM. The reference notes already on the shelf —
   Braunwald-sourced, written for this exam; 295 of them across heart failure,
   ischaemic heart disease and the valvular unit at the time of writing.
   Nothing is invented here and no second corpus is maintained: this only has
   to *find* the good sentence in prose that already exists, so adding a unit
   to content/refs/ adds its pearls with no further work.

   WHAT MAKES A SENTENCE A PEARL. Not every sentence in a note survives being
   pulled out of it. The ones that do are self-contained and carry a fact:

     · a bolded term, which is how these notes mark the thing being taught;
     · a number — a dose, a threshold, a cut-off, a trial year;
     · a trial name in capitals.

   And the ones that cannot survive are excluded by the same reasoning: a
   sentence opening with "This", "That", "It" or "These" refers to the
   paragraph it was lifted from, and reads as a non-sequitur alone.

   WEIGHTED TOWARD WHERE YOU ARE WEAK. The app already computes weak chapters
   for Apex's prompt, so a pearl can be aimed rather than merely random —
   without asking a model, a network call, or a second data source. The
   weighting is gentle: strongest chapters still appear, because a revision
   tool that only ever shows your failures is a tool people stop opening.

   Depends on app globals (REF, Profile, S) — embedded, not standalone.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

/* A PEARL IS A COMPLETE THOUGHT, NOT A SHORT ONE. The first version capped a
   pearl at 210 characters and required it to be exactly one sentence, on the
   theory that one sentence is what you can hold. In use that was wrong twice
   over: it threw away the sentence that gave a rule its exception, and it let
   through 60-character clauses that were true but taught nothing. Length was
   never the thing that made a pearl memorable — Pearl.steps() is, by breaking
   whatever arrives at its own joints.

   So the floor rises to something that has to contain a real claim, the
   ceiling rises to a short paragraph, and a pearl may now be a RUN of up to
   three consecutive sentences where they form one statement. */
const MIN = 90, MAX = 700;
const MAX_RUN = 3;                  // sentences; beyond this it is a paragraph, not a pearl
const LEADS = /^(this|that|these|those|it|they|he|she|there|such|both|either|neither|hence|so|then|thus|however|instead|again)\b/i;

/* Strip the note's markup back to the prose underneath. Figures go entirely —
   a caption is not a pearl — and emphasis markers go after being used as a
   signal for whether the sentence carries a taught term. */
function plain(body) {
  return String(body || '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')          // figures
    .replace(/`[^`]*`/g, ' ')                        // code spans
    .replace(/^#{1,6}\s+.*$/gm, ' ')                 // headings

       written to be read under its stem — "A falling antihypertensive
       requirement…, which reflects declining stroke volume" is a noun phrase
       with no main verb, and it passes every structural test while reading as
       a non-sequitur on its own. Only prose sentences survive being quoted. */
    .replace(/^\s*([-*·+]|\d+\.)\s+.*$/gm, ' ')      // list items
    .replace(/^\s*\|.*$/gm, ' ')                     // table rows

       other run of whitespace. Now that a pearl can be several sentences, the
       boundary matters: two sentences either side of a blank line are two
       different points, and joining them makes the non-sequitur this module
       exists to avoid. Runs of spaces still collapse. */

       these notes bold the term being taught, so a sentence very often starts
       "**Finerenone** is…", and looking only for a capital left two sentences
       fused into one pearl that read as a non-sequitur.

       sentence ender — which says the same thing more directly, and is a
       parse-time SyntaxError on iPadOS

       block fails to compile, and that block also holds the rhythm registry,
       the scheduler and most of the app. One unsupported character silently

/* A PEARL HAS TO BE A SENTENCE, NOT A LABEL. These notes use a bolded phrase

     "**A falling antihypertensive requirement over time** in a previously
      hypertensive patient, which reflects declining stroke volume rather
      than improving hypertension."

   That is a noun phrase with no main verb. It is true, it is well written, and
   quoted on its own it reads as a non-sequitur — the module already drops real
   markdown bullets for exactly this reason, and this one escapes because it is
   punctuated as a paragraph. So the test is structural rather than typographic:

  + 'increase|increases|require|requires|predict|predicts|occur|occurs|present|presents|reflect|reflects|'
  + 'show|shows|suggest|suggests|prevent|prevents|improve|improves|worsen|worsens|carry|carries|confer|'
  + 'confers|need|needs|mean|means|make|makes|give|gives|leave|leaves|add|adds|fall|falls|rise|rises|'
  + 'begin|begins|start|starts|stop|stops|follow|follows|depend|depends|differ|differs|exceed|exceeds|'
  + 'produce|produces|drive|drives|explain|explains|support|supports|favour|favours|favor|favors)\\b', 'i');

   "This is why…" is perfectly good as the second sentence of a statement and

  return hasMainVerb(parts.slice(0, 2).join(' '));

  const out = [];
  for (let n = Math.min(MAX_RUN, sents.length); n >= 1; n--) {

    return { lead, text: body.replace(/[,;:]\s*$/, '').replace(/\s*\.$/, '') };

<script>/* src/store.js */
/* ═══════════════════════════════════════════════════════════════════════════
   store.js — where your PDFs' clusters, your sessions and your cards live.

   IndexedDB, on this device only. Nothing here is ever uploaded. The PDF's
   bytes are kept too (from v2), so a section can show its figures, its
   tables as printed and its pages — the text clusters alone cannot.

   Four object stores, all keyed by `id`:
     docs      { id, name, addedAt, pages, scanned:[page…], clusters:[…] }
     sessions  { id: docId, state }        — the MemSession state, saved every step
     cards     { id, docId, …, srs }       — the review deck
     files     { id: docId, bytes }         — the PDF itself, for its pages and figures
   and, from v3, for whole books:
     books     { id, name, addedAt, pages, parts:[{ fileId, name, first, last }],
                 method, chapters:[{ n, title, pageStart, pageEnd, docId }] }
     bookpages { id: bookId + ':' + part, pages:[{ page, lines }] }
                                            — the book's text as read, so its
                                              chapters can be cut again without
                                              reading 1,500 pages a second time
     meta      { id, … }                    — small records: the days studied
   and, from v4:
     vectors   { id: docId, model, vecs:[[…] per section] }
                                            — each section's meaning, for search
                                              by meaning (vec.js); remade if the
                                              model changes
   and, from v5:
     packs     { id: docId, sections:{ index: … }, at }
                                            — the unit's lessons and questions
                                              written with Claude and checked
                                              against the book (pack.js)

   A chapter of a book is a doc like any other, with bookId and the book's
   parts (its figures and pages are drawn from whichever part holds them).

   When IndexedDB cannot be opened (some private-browsing modes refuse it),
   everything still works for this visit from memory, and `persistent` says
   so, so the UI can tell the user their work will not survive a reload
   rather than let them find out.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

var DB_NAME = 'memorizer';
var DB_VERSION = 5;
/* v2 adds `files`: the PDF's own bytes, kept on this device so its pages and
   figures can be drawn while studying. v3 adds `books`, `bookpages` and
   `meta`; v4, `vectors`; v5, `packs`. Upgrading keeps every store already
   there. */
var STORES = ['docs', 'sessions', 'cards', 'files', 'books', 'bookpages', 'meta', 'vectors', 'packs'];

      t.onerror = function () { reject(t.error); };
      t.onabort = function () { reject(t.error || new Error('transaction aborted')); };

        t.objectStore('sessions').put(session);

             transaction, the session's write with it. */
          try {
            var add = fresh(req.result);
            add.forEach(function (c) { cs.put(c); });
            out = req.result.concat(add);

        };

    });

api.deleteDoc = deleteDoc; api.deleteBook = deleteBook; api.mergeCards = mergeCards; api.saveStep = saveStep;

  var svgRegex = /<svg[\s\S]*?<\/svg>/g;
  var svgMatch;
  var svgIdx = 0;
  while ((svgMatch = svgRegex.exec(text)) !== null) {
    result.diagrams.push({
      id: 'figure-svg-' + svgIdx,
      type: 'svg',
      content: svgMatch[0]
    });
    svgIdx++;
  }

  // Extract quiz questions
  var qRegex = /^### Question (\d+):\s+(.+?)$\n([\s\S]*?)(?=^### Question |\Z)/gm;
  var qMatch;
  while ((qMatch = qRegex.exec(text)) !== null) {
    var q = parseQuestion(qMatch[1], qMatch[2], qMatch[3]);
    if (q) result.questions.push(q);
  }

  return result;
}

function parseMarkdownTable(rows, index) {
  try {
    var headers = rows[0]
      .split('|')
      .slice(1, -1)
      .map(function (h) { return h.trim(); });

    var dataRows = rows.slice(2).map(function (row) {
      return row
        .split('|')
        .slice(1, -1)
        .map(function (cell) { return cell.trim(); });
    });

    if (headers.length === 0 || dataRows.length === 0) return null;

    return {
      id: 'table-' + index,
      headers: headers,
      rows: dataRows
    };
  } catch (e) {
    return null;
  }
}

function parseQuestion(num, title, content) {
  try {
    var stemMatch = content.match(/^\*\*Stem\*\*:\s+(.+?)(?=\*\*|$)/s);
    var stem = stemMatch ? stemMatch[1].trim() : '';

    var optionRegex = /^-\s+([A-D])\)\s+(.+)$/gm;
    var options = [];
    var match;
    while ((match = optionRegex.exec(content)) !== null) {
      options.push({
        letter: match[1],
        text: match[2].trim()
      });
    }

    var answerMatch = content.match(/^\*\*Correct Answer\*\*:\s+([A-D])/m);
    var answer = answerMatch ? answerMatch[1] : '';

    var explainMatch = content.match(/^\*\*Explanation\*\*:\s+(.+?)(?=\*\*|$)/s);
    var explanation = explainMatch ? explainMatch[1].trim() : '';

    if (stem && options.length >= 2 && answer) {
      return {
        id: 'q-' + num,
        num: parseInt(num),
        stem: stem,
        options: options,
        answer: answer,
        explanation: explanation
      };
    }
    return null;
  } catch (e) {
    return null;
  }
}

/* ── HTML Parser ──────────────────────────────────────────────────────────── */
function parseHTML(htmlText) {
  var result = {
    metadata: {},
    teachingPoints: [],
    mechanisms: {},
    tables: [],
    diagrams: [],
    questions: [],
    misconceptions: []
  };

  // Parse HTML
  var parser = new DOMParser();
  var doc = parser.parseFromString(htmlText, 'text/html');

  // Extract metadata
  var titleEl = doc.querySelector('title');
  result.metadata.unit = titleEl ? titleEl.textContent.trim() : 'Untitled Unit';

  var h1 = doc.querySelector('h1');
  if (h1) result.metadata.unit = h1.textContent.trim();

  // Extract teaching points from definition lists or divs
  var dlItems = doc.querySelectorAll('dl');
  dlItems.forEach(function (dl) {
    var dts = dl.querySelectorAll('dt');
    var dds = dl.querySelectorAll('dd');
    for (var i = 0; i < dts.length; i++) {
      var term = dts[i].textContent.trim();
      var def = dds[i] ? dds[i].textContent.trim() : '';
      if (term && def) {
        result.teachingPoints.push({ term: term, definition: def });
      }
    }
  });

  // Extract tables
  var tables = doc.querySelectorAll('table');
  tables.forEach(function (table, idx) {
    var headers = [];
    var headerCells = table.querySelectorAll('thead th, thead td');
    headerCells.forEach(function (cell) {
      headers.push(cell.textContent.trim());
    });

    if (headers.length === 0) {
      var firstRow = table.querySelector('tr');
      if (firstRow) {
        firstRow.querySelectorAll('th, td').forEach(function (cell) {
          headers.push(cell.textContent.trim());
        });
      }
    }

    var rows = [];
    var tbody = table.querySelector('tbody') || table;
    tbody.querySelectorAll('tr').forEach(function (tr, trIdx) {
      if (trIdx === 0 && !table.querySelector('thead')) return; // Skip header row
      var rowData = [];
      tr.querySelectorAll('td').forEach(function (cell) {
        rowData.push(cell.textContent.trim());
      });
      if (rowData.length > 0) rows.push(rowData);
    });

    if (headers.length > 0 && rows.length > 0) {
      result.tables.push({
        id: 'table-' + idx,
        headers: headers,
        rows: rows
      });
    }
  });

  // Extract SVG diagrams
  var svgs = doc.querySelectorAll('svg');
  svgs.forEach(function (svg, idx) {
    result.diagrams.push({
      id: 'figure-svg-' + idx,
      type: 'svg',
      content: svg.outerHTML
    });
  });

  // Extract questions
  var questionDivs = doc.querySelectorAll('.question, [data-question]');
  questionDivs.forEach(function (qDiv, idx) {
    var stem = qDiv.querySelector('.stem, [data-stem]');
    var stemText = stem ? stem.textContent.trim() : qDiv.querySelector('p')?.textContent?.trim() || '';

    var optionEls = qDiv.querySelectorAll('.option, [data-option], li');
    var options = [];
    optionEls.forEach(function (opt, oIdx) {
      var text = opt.textContent.trim();
      if (text) {
        var match = text.match(/^[A-D][\)\.\:\-\s]/);
        var letter = match ? text[0] : String.fromCharCode(65 + oIdx);
        var cleanText = text.replace(/^[A-D][\)\.\:\-\s]/, '').trim();
        options.push({ letter: letter, text: cleanText });
      }
    });

    if (stemText && options.length >= 2) {
      result.questions.push({
        id: 'q-' + idx,
        num: idx + 1,
        stem: stemText,
        options: options,
        answer: ''
      });
    }
  });

  return result;
}

/* ── Unified Importer ─────────────────────────────────────────────────────── */
var api = {
  /**
   * Detect file format
   */
  detectFormat: function (filename, content) {
    if (filename.endsWith('.md') || filename.endsWith('.markdown')) return 'markdown';
    if (filename.endsWith('.html') || filename.endsWith('.htm')) return 'html';
    if (content.trim().startsWith('---') && content.includes('---\n')) return 'markdown';
    if (content.includes('<h1') || content.includes('<table') || content.includes('<svg')) return 'html';
    return 'markdown';
  },

  /**
   * Parse study file and convert to pack format
   */
  parseStudyFile: function (content, filename) {
    try {
      var format = this.detectFormat(filename, content);
      var parsed = format === 'html' ? parseHTML(content) : parseMarkdown(content);

      // Convert to pack format
      var pack = this.convertToPack(parsed);

      return {
        success: true,
        format: format,
        pack: pack,
        summary: this.getSummary(pack)
      };
    } catch (error) {
      return {
        success: false,
        error: error.message
      };
    }
  },

  /**
   * Convert parsed study data to Memorizer pack format
   */
  convertToPack: function (parsed) {
    var unitName = parsed.metadata.unit || parsed.metadata.title || 'Imported Unit';
    var docId = 'import-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);

    // Create a single section with all content
    var section = {
      section: 1,
      title: unitName,
      points: parsed.teachingPoints.map(function (pt, idx) {
        return {
          num: idx + 1,
          text: pt.term + ': ' + pt.definition
        };
      }),
      questions: parsed.questions.map(function (q, idx) {
        return {
          num: idx + 1,
          stem: q.stem,
          options: q.options.map(function (opt) { return opt.text; }),
          answer: q.answer ? q.answer.charCodeAt(0) - 65 : 0, // Convert A-D to 0-3
          explanation: q.explanation || '',
          page: 1,
          why: []
        };
      }),
      mechanism: '',
      distinctions: [],
      pearls: [],
      cases: [],
      tables: parsed.tables.map(function (t) {
        return {
          title: t.headers.join(' | '),
          columns: t.headers,
          rows: t.rows,
          page: 1
        };
      }),
      mnemonics: [],
      analogies: [],
      flowchart: ''
    };

    // Add SVG diagrams as flowchart if available
    if (parsed.diagrams.length > 0) {
      section.flowchart = parsed.diagrams.map(function (d) { return d.content; }).join('\n');
    }

    return {
      id: docId,
      name: unitName,
      source: 'imported',
      addedAt: new Date().toISOString(),
      sections: {
        1: section
      }
    };
  },

  /**
   * Get summary of imported content
   */
  getSummary: function (pack) {
    var section = pack.sections[1] || {};
    return {
      unit: pack.name,
      teaching_points: (section.points || []).length,
      questions: (section.questions || []).length,
      tables: (section.tables || []).length,
      diagrams: section.flowchart ? 1 : 0
    };
  },

  /**
   * Save pack to store
   */
  savePack: function (pack) {
    if (!Store) return Promise.reject(new Error('Store not available'));

    return Store.put('packs', {
      id: pack.id,
      sections: pack.sections,
      at: new Date().toISOString()
    }).then(function () {
      return Store.put('docs', {
        id: pack.id,
        name: pack.name,
        addedAt: pack.addedAt,
        source: 'imported',
        pages: 0,
        scanned: [],
        clusters: []
      });
    });
  }
};

if (typeof module !== 'undefined' && module.exports) {
  module.exports = api;
} else if (root) {
  root.MemStudyImport = api;
}
})(typeof window !== 'undefined' ? window : global);

</script>
<script>/* src/importUI.js */
/* ═══════════════════════════════════════════════════════════════════════════
   importUI.js — Drag-drop interface for importing study units

   Handles file selection, parsing, and import confirmation.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
'use strict';

var StudyImport = root.MemStudyImport || (typeof require === 'function' ? require('./studyImport.js') : null);

var api = {};

/**
 * Show import dialog
 */
api.show = function (onImport) {
  var modal = createModal();

  modal.querySelector('#importBtn').addEventListener('click', function () {
    if (modal.currentPack) {
      onImport(modal.currentPack);
      modal.remove();
    }
  });

  modal.querySelector('#cancelBtn').addEventListener('click', function () {
    modal.remove();
  });

  document.body.appendChild(modal);
  setupDragDrop(modal);
};

function createModal() {
  var modal = document.createElement('div');
  modal.className = 'import-modal';
  modal.innerHTML = `
    <div class="import-overlay">
      <div class="import-dialog">
