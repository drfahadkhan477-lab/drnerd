# Cloudflare Pages Configuration
# Use this for Cloudflare Pages deployment (recommended for static/SPA apps)

name = "memorizer"
main = "functions/index.js"
compatibility_date = "2024-01-01"

# Build settings for Pages
[build]
# Command to build the app
command = "npm run memorizer"
# Output directory
output_dir = "dist-memorizer-complete"
# Environment for building
environment = { NODE_ENV = "production" }

# Functions configuration
[functions]
directory = "functions"
main = "index.js"

# Caching strategy
[[rules]]
type = "CompiledContentType"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "CompiledContentType"
globs = ["**/*.html"]
fallthrough = true

# Static files caching
[env.production]
name = "memorizer-prod"
route = "https://yourdomain.com/*"
zone_id = ""

[env.staging]
name = "memorizer-staging"
route = "https://staging.yourdomain.com/*"
zone_id = ""

# Analytics and monitoring
[analytics]
enabled = true
