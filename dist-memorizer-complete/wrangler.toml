name = "memorizer"
type = "javascript"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account and deployment info
account_id = ""  # Set this to your Cloudflare account ID
workers_dev = true

# Routes for deployment (optional - only needed for custom domains)
routes = [
  { pattern = "example.com/*", zone_id = "" }
]

# Build configuration
[build]
command = "npm run memorizer"
cwd = "."
watch_paths = ["memorizer/src/**/*.js", "memorizer/index.html"]

# Environment variables (if needed later)
[env.production]
name = "memorizer-prod"
routes = [
  { pattern = "yourdomain.com/*", zone_id = "" }
]

[env.staging]
name = "memorizer-staging"
routes = [
  { pattern = "staging.yourdomain.com/*", zone_id = "" }
]

# CORS and caching headers
[triggers.crons]
# Optional: Backup cron job

# Asset handling
[assets]
directory = "dist-memorizer-complete"
include = ["*.html", "*.js", "*.css", "*.png", "*.svg", "*.webmanifest", "*.json"]
