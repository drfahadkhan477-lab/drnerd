<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- What this page may load and where it may send anything. The API key is in this
     browser's storage, so connect-src is the line that keeps it from going anywhere but
     Anthropic: jsDelivr for the pinned readers, Hugging Face and GitHub for the optional
     on-device AI's model and runtime. No eval (wasm-unsafe-eval only, for the readers'
     WebAssembly); inline script and style because the whole app is one file. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; worker-src 'self' blob:; connect-src 'self' blob: data: https://api.anthropic.com https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">

<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memorizer">
<title>Memorizer</title>
<!-- @pwa -->
<!-- Themes, text size and layout: applied here, before the body is drawn,
     so the page is never painted in the wrong theme first. -->
<script src="src/appearance.js" data-inline></script>
<!-- The memory hook's handwriting is the device's own script face (Bradley
     Hand on iPad and Mac, Segoe Print on Windows; Caveat if installed) — see
     --script in app.css. It was fetched from Google Fonts, which made every
     launch a request to a third party and the first offline launch look
     different from the rest. Nothing is fetched to draw the page now. -->
<link rel="stylesheet" href="app.css" data-inline>
</head>
<body>
<div id="app"><noscript>Memorizer needs JavaScript.</noscript></div>
<!--
  Order matters: fsrs.js is Systole's scheduler and pearl.js its pearl
  finder, both shared rather than copied (src/core/); ui.js reads every module before it at load.
  scripts/build-memorizer.js inlines each tag marked data-inline, so the
  built app is one file. Served from the repository root, this page also
  runs as-is: http://localhost:8080/memorizer/
-->
<script src="../src/core/fsrs.js" data-inline></script>
<script src="src/chunk.js" data-inline></script>
<script src="src/book.js" data-inline></script>
<script src="src/skill.js" data-inline></script>
<script src="src/spec.js" data-inline></script>
<script src="src/prompts.js" data-inline></script>
<script src="src/session.js" data-inline></script>
<script src="src/provider.js" data-inline></script>
<script src="src/analogies.js" data-inline></script>
<script src="src/coach.js" data-inline></script>
<script src="src/vec.js" data-inline></script>
<script src="src/ask.js" data-inline></script>
<script src="src/sheet.js" data-inline></script>
<script src="src/figure.js" data-inline></script>
<script src="src/agent.js" data-inline></script>
<script src="src/study.js" data-inline></script>
<script src="src/ground.js" data-inline></script>
<script src="src/pack.js" data-inline></script>
<script src="src/models.js" data-inline></script>
<script src="src/llm.js" data-inline></script>
<script src="src/format.js" data-inline></script>
<script src="../src/core/pearl.js" data-inline></script>
<script src="src/home.js" data-inline></script>
<script src="src/store.js" data-inline></script>
<script src="src/studyImport.js" data-inline></script>
<script src="src/importUI.js" data-inline></script>
<script src="src/pdf.js" data-inline></script>
<script src="src/ocr.js" data-inline></script>
<script src="src/provenance.js" data-inline></script>
<script src="src/dialog.js" data-inline></script>
<script src="../src/core/rhythms-extra.js" data-inline></script>
<script src="src/ui.js" data-inline></script>
</body>
</html>
