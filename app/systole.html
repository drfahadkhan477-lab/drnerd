/* ═══════════ cardiac waveform engine — original, offline, no external assets ═══════════
   Generates physiologically-shaped ECG in millivolts as a function of time.
   Used for the live hero monitor, answer feedback blips, and the interactive Rhythm Lab. */
'use strict';

const RHYTHMS={
  sinus:      {name:'Normal Sinus',      hr:68,  desc:'P before every QRS, PR 120–200 ms, regular'},
  brady:      {name:'Sinus Bradycardia', hr:44,  desc:'Sinus mechanism under 60/min'},
  tachy:      {name:'Sinus Tachycardia', hr:130, desc:'Sinus mechanism over 100/min'},
  afib:       {name:'Atrial Fibrillation',hr:110,desc:'Irregularly irregular, no discrete P waves'},
  flutter:    {name:'Atrial Flutter',    hr:150, desc:'Sawtooth F waves ~300/min, often 2:1 conduction'},
  vt:         {name:'Ventricular Tachycardia',hr:180,desc:'Wide monomorphic complexes, AV dissociation'},
  vfib:       {name:'Ventricular Fibrillation',hr:0,desc:'Chaotic, no organised complexes — defibrillate'},
  chb:        {name:'Complete Heart Block',hr:38,desc:'P waves march independently of escape QRS'},
  torsades:   {name:'Torsades de Pointes',hr:230,desc:'Polymorphic VT twisting about the baseline'},
  stemi:      {name:'Anterior STEMI',    hr:88,  desc:'Convex ST elevation with reciprocal change'},
  paced:      {name:'Ventricular Paced', hr:70,  desc:'Pacing spike then wide, LBBB-like QRS'},
  asystole:   {name:'Asystole',          hr:0,   desc:'No electrical activity'}
};
Object.assign(RHYTHMS, RhythmsExtra.EXTRA);   // AV blocks, ectopy, WPW, BBBs, K+/QT, pericarditis
const RHYTHM_KEYS=Object.keys(RHYTHMS);

/* gaussian bump — the natural shape of P and T waves */
function gauss(t,centre,width,amp){
  const x=(t-centre)/width;
  return amp*Math.exp(-0.5*x*x);
}
/* one PQRST beat, t in ms from beat onset, returns mV */
function beatMV(t,o){
  o=o||{};
  const pAmp = o.pAmp===undefined?0.13:o.pAmp;
  const qrsW = o.qrsW||1;            // width multiplier (wide for VT/paced/LBBB)
  const stE  = o.stElev||0;
  let v=0;
  if(pAmp) v+=gauss(t,45,20,pAmp);                        // P wave
  const q0=160;                                            // QRS onset
  const w=qrsW;
  v+=gauss(t,q0+8*w,5*w,-0.10);                            // Q
  v+=gauss(t,q0+26*w,9*w, 1.05*(o.rAmp||1));               // R
  v+=gauss(t,q0+48*w,10*w,-0.22);                          // S
  const stStart=q0+60*w;
  if(t>stStart&&t<stStart+120) v+=stE;                     // ST segment shift
  v+=gauss(t,q0+230*w,55*w,(o.tAmp===undefined?0.28:o.tAmp)); // T wave
  return v;
}
/* rhythm-aware signal: absolute time ms -> mV */
function rhythmMV(kind,tms,state){
  const R=RHYTHMS[kind]||RHYTHMS.sinus;
  const st=state||(state={});
  const extra=RhythmsExtra.extraRhythmMV(kind,tms,st);
  if(extra!==null) return extra;
  if(kind==='asystole') return Math.sin(tms/700)*0.008;
  if(kind==='vfib'){
    return 0.42*Math.sin(tms/38)+0.26*Math.sin(tms/17+1.1)
          +0.18*Math.sin(tms/9+2.3)+0.10*Math.sin(tms/54+0.4);
  }
  if(kind==='torsades'){
    const rr=60000/R.hr;
    const phase=(tms%rr)/rr;
    const envelope=Math.sin(tms/1400);                     // the "twist"
    return envelope*(0.9*Math.sin(phase*Math.PI*2)+0.35*Math.sin(phase*Math.PI*6));
  }
  if(kind==='chb'){
    // atria and ventricles run on independent clocks
    const pRR=60000/78, vRR=60000/38;
    const pv=gauss(tms%pRR,45,20,0.14);
    const qv=beatMV(tms%vRR,{pAmp:0,qrsW:1.5,tAmp:0.3});
    return pv+qv;
  }
  if(kind==='flutter'){
    const fRR=60000/300;                                   // sawtooth F waves
    const saw=((tms%fRR)/fRR)*0.22-0.11;
    const vRR=60000/R.hr;
    return saw+beatMV(tms%vRR,{pAmp:0,tAmp:0.18});
  }
  if(kind==='afib'){
    // irregularly irregular RR, driven by a deterministic hash so the trace is stable
    if(st.next===undefined){ st.next=0; st.rr=600; st.n=0; }
    while(tms>=st.next+st.rr){ st.next+=st.rr; st.n++;
      const h=Math.abs(Math.sin(st.n*12.9898)*43758.5453)%1;
      st.rr=380+h*620; }
    const fib=0.035*Math.sin(tms/23)+0.025*Math.sin(tms/11+1.7);
    return fib+beatMV(tms-st.next,{pAmp:0});
  }
  if(kind==='vt')     return beatMV(tms%(60000/R.hr),{pAmp:0,qrsW:2.3,tAmp:-0.35,rAmp:1.15});
  if(kind==='paced'){
    const rr=60000/R.hr, p=tms%rr;
    const spike=(p>150&&p<156)?1.1:0;                      // pacing artefact
    return spike+beatMV(p,{pAmp:0,qrsW:2.0,tAmp:-0.3});
  }
  if(kind==='stemi')  return beatMV(tms%(60000/R.hr),{stElev:0.32,tAmp:0.42});
  return beatMV(tms%(60000/R.hr),{});                      // sinus family
}

/* ── live scrolling monitor on a canvas ── */
class ECGMonitor{
  constructor(canvas,opts){
    this.cv=canvas; this.ctx=canvas.getContext('2d');
    this.o=Object.assign({kind:'sinus',speed:0.13,color:'#5EEAD4',glow:true,
      grid:false,lineWidth:2,amp:52},opts||{});
    this.t=0; this.state={}; this.raf=null; this.last=null; this.pts=[];
    this.dead=false;
    this.fit();
  }
  fit(){
    const r=this.cv.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,3);
    if(!r.width||!r.height) return;
    this.cv.width=Math.round(r.width*dpr); this.cv.height=Math.round(r.height*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.w=r.width; this.h=r.height;
  }
  setRhythm(k){ this.o.kind=k; this.state={}; this.pts=[]; this.t=0; }
  start(){
    if(this.raf||this.dead) return;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      this.drawStatic(); return;                        // honour the system setting
    }
    const loop=(now)=>{
      if(this.dead) return;
      if(this.last===null) this.last=now;
      let dt=now-this.last; this.last=now;
      if(dt>80) dt=80;                                  // ignore tab-away jumps
      this.t+=dt;
      this.step(dt);
      this.raf=requestAnimationFrame(loop);
    };
    this.raf=requestAnimationFrame(loop);
  }
  stop(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf=null; this.last=null; }
  destroy(){ this.stop(); this.dead=true; }
  step(dt){
    if(!this.w) { this.fit(); if(!this.w) return; }
    const pxPerMs=this.o.speed;
    const advance=dt*pxPerMs;
    const stepMs=1000/240;                              // sample finer than the frame rate
    for(let m=0;m<dt;m+=stepMs){
      const tt=this.t-dt+m;
      this.pts.push({x:(this.pts.length?this.pts[this.pts.length-1].x:0)+stepMs*pxPerMs,
                     v:rhythmMV(this.o.kind,tt,this.state)});
    }
    const shift=this.pts.length?this.pts[this.pts.length-1].x-this.w:0;
    if(shift>0){ for(const p of this.pts) p.x-=shift;
      while(this.pts.length&&this.pts[0].x<-4) this.pts.shift(); }
    this.draw();
  }
  drawStatic(){
    this.pts=[]; const stepMs=1000/240;
    for(let x=0,t=0;x<this.w;t+=stepMs,x+=stepMs*this.o.speed)
      this.pts.push({x,v:rhythmMV(this.o.kind,t,{})});
    this.draw();
  }
  draw(){
    const c=this.ctx,mid=this.h*0.5;
    c.clearRect(0,0,this.w,this.h);
    if(this.o.grid){
      c.strokeStyle='rgba(148,163,184,.13)'; c.lineWidth=1; c.beginPath();
      for(let x=0;x<this.w;x+=10){ c.moveTo(x,0); c.lineTo(x,this.h); }
      for(let y=0;y<this.h;y+=10){ c.moveTo(0,y); c.lineTo(this.w,y); }
      c.stroke();
    }
    if(this.pts.length<2) return;
    c.lineWidth=this.o.lineWidth; c.strokeStyle=this.o.color;
    c.lineJoin='round'; c.lineCap='round';
    if(this.o.glow){ c.shadowColor=this.o.color; c.shadowBlur=9; }
    c.beginPath();
    c.moveTo(this.pts[0].x,mid-this.pts[0].v*this.o.amp);
    for(let i=1;i<this.pts.length;i++)
      c.lineTo(this.pts[i].x,mid-this.pts[i].v*this.o.amp);
    c.stroke();
    c.shadowBlur=0;
    // leading dot
    const p=this.pts[this.pts.length-1];
    c.fillStyle=this.o.color; c.beginPath();
    c.arc(p.x,mid-p.v*this.o.amp,2.6,0,6.284); c.fill();
  }
}

/* ── one-shot feedback blip: a healthy beat for correct, a flatline for wrong ── */
function feedbackBlip(host,ok){
  if(!host) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas');
  cv.className='blip-canvas';
  host.appendChild(cv);
  const m=new ECGMonitor(cv,{kind:ok?'sinus':'asystole',speed:0.30,
    color:ok?'#34D399':'#F87171',amp:ok?30:6,lineWidth:2.2});
  m.start();
  setTimeout(()=>{ m.destroy(); cv.classList.add('blip-out');
    setTimeout(()=>cv.remove(),420); }, ok?1500:1200);
}

/* ══════════ Apple-Pencil annotation · sticky notes · local persistence ══════════ */
'use strict';

const INK_KEY='accsap12.ink', NOTE_KEY='accsap12.notes';
const INK_COLORS=['#EF4444','#0891B2','#F59E0B','#10B981','#111E35'];
/* Highlighter pigment, not ink. Bright, weak and transparent — these are the
   colours a marker actually lays down, and they are chosen to stay legible
   under both multiply (light) and screen (dark). */
const HL_COLORS=['#FDE047','#86EFAC','#7DD3FC','#F9A8D4','#FDBA74'];
function paletteFor(tool){ return tool==='hl'?HL_COLORS:INK_COLORS; }

let INK = loadJSON(INK_KEY, {});     // { "qid:slot": [stroke,…] }
let NOTES = loadJSON(NOTE_KEY, {});  // { qid: [ {id,x,y,text,color} ] }

/* Store answers synchronously for every key. The four large ones come from
   IndexedDB once it has hydrated and from localStorage before that; everything
   else passes straight through to localStorage exactly as it always did. */
function loadJSON(k,d){ return Store.get(k,d); }
/* The whole records that more than one window of this app may hold (see "one record, several windows" below), and for each the text this window
   last read or wrote. A write of one of them through here is a write this window knows of. */
const SEEN=Object.create(null);
/* A whole record another window may write, read at launch: parsed from the text read, and that text is what this window has seen of it. Reading it
   a second time for SEEN, later in the script, would take in a write made in between and call it seen, and the window would never take it. */
function loadSeen(k,d){
  let text=null; try{ text=localStorage.getItem(k); }catch(_){}
  SEEN[k]=text;
  let v; try{ v=text==null?undefined:JSON.parse(text); }catch(_){}
  return v==null?d:v;
}
function saveJSON(k,v){
  if(!Store.set(k,v)) warnStorage();
  /* Only the bytes this save wrote are seen. Another window may have replaced them before a read-back. */
  else if(k in SEEN){ try{ SEEN[k]=JSON.stringify(v); }catch(_){} }
}
let storageWarned=false;
function warnStorage(){
  if(storageWarned)return; storageWarned=true;
  toast('Device storage is full or unavailable — use Export to save your annotations.');
}

/* ══════════ review log — append-only history of every answer and rating ══════════
   A scheduler is fitted to review history. FSRS needs, per review: which card,
   what you rated it, how long since you last saw it, and the card's state
   BEFORE it was rescheduled. None of that can be reconstructed afterwards, so
   the log starts now even though nothing reads it yet. */
const LOG_KEY='accsap12.log', LOG_CAP=20000;
let LOG=loadJSON(LOG_KEY,[]);
let logDirty=false, logTimer=null;
function saveLogSoon(){
  logDirty=true;
  if(logTimer)return;
  logTimer=setTimeout(()=>{ logTimer=null; if(!logDirty)return; logDirty=false; saveJSON(LOG_KEY,LOG); },1500);
}
function flushLog(){
  if(logTimer){ clearTimeout(logTimer); logTimer=null; }
  if(logDirty){ logDirty=false; saveJSON(LOG_KEY,LOG); }
}
/* THE INK IS SAVED WHEN THE PEN HAS BEEN STILL, and not at every pen-up. Saving it hands IndexedDB the whole store, which clones everything ever
   written, on the main thread, inside the put: with nothing else running, 24 ms on Chromium and 84 on WebKit at three thousand strokes, 88 and
   316 at twelve thousand, every time the pen is lifted, which is when the next stroke begins and the first of its points wait behind the clone.
   Erasing a sweep of strokes did it once for each. The strokes are in INK, which the screen reads, from the moment they are drawn; only the copy
   in the database waits. It waits until the pen has been still for INK_IDLE_MS, and never more than INK_MAX_MS after the first stroke not yet saved,
   so that writing without a pause still reaches the database. Hiding the page and exporting save it at once, and closing it asks for the same save (a
   transaction opened by a page that is going away is the browser's to finish or drop; hiding, which comes first, is what is relied on). Before the store has
   hydrated a save is made at once as well: a write that comes in that window is the one the store merges under what it then reads, and that
   depends on its having been made (src/core/store.js). What is lost if the page is killed with no warning is what was drawn since the last save,
   at most INK_IDLE_MS of writing and at the outside INK_MAX_MS; hiding the page, which comes first on an iPad, saves it. */
const INK_IDLE_MS=900, INK_MAX_MS=10000;
let inkDirtyAt=0, inkTimer=null;
function saveInkNow(){
  if(inkTimer){ clearTimeout(inkTimer); inkTimer=null; }
  inkDirtyAt=0; saveJSON(INK_KEY,INK);
}
function saveInkSoon(){
  if(!Store.isHydrated()){ saveInkNow(); return; }
  const now=Date.now();
  if(!inkDirtyAt) inkDirtyAt=now;
  if(inkTimer) clearTimeout(inkTimer);
  inkTimer=setTimeout(flushInk,Math.max(0,Math.min(INK_IDLE_MS,inkDirtyAt+INK_MAX_MS-now)));
}
function flushInk(){ if(inkDirtyAt) saveInkNow(); }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    flushLog(); flushInk();
  }
  syncHomeMotion();
});
window.addEventListener('pagehide',()=>{ flushLog(); flushInk(); });

/* ══════════ ink hosts are released when they leave the document ══════════
   Every render replaces .q-card, so each render used to leak one
   ResizeObserver still watching a node nobody could see. */
const INK_HOSTS=new Set();
function sweepInkHosts(){
  for(const h of INK_HOSTS){
    if(h.isConnected) continue;
    if(h.__ro){ h.__ro.disconnect(); h.__ro=null; }
    if(h.__onResize){ window.removeEventListener('resize',h.__onResize); h.__onResize=null; }
    h.__ink=null; h.__notes=null; h.__redraw=null; h.__fit=null; h.__make=null; h.__noteLayer=null;
    INK_HOSTS.delete(h);

}

/* ══════════ strokes are rounded and simplified before they are stored ══════════
   A raw pointer coordinate serialises to ~18 characters; four decimals is
   sub-pixel on any screen this runs on. Ramer-Douglas-Peucker then drops the
   points that sit on a line their neighbours already describe. Together they
   cut stored ink by roughly an order of magnitude. */
function roundPt(p){
  const out=[Math.round(p[0]*1e4)/1e4, Math.round(p[1]*1e4)/1e4, Math.round(p[2]*100)/100];
  if(p.length>3) out.push(Math.round(p[3]*100)/100);
  return out;
}
function rdp(pts,eps){
  if(pts.length<3) return pts;
  const a=pts[0], b=pts[pts.length-1];
  const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1e-9;
  let dmax=0, idx=0;
  for(let i=1;i<pts.length-1;i++){
    const d=Math.abs((pts[i][0]-a[0])*dy-(pts[i][1]-a[1])*dx)/len;
    if(d>dmax){ dmax=d; idx=i; }
  }
  if(dmax<=eps) return [a,b];
  return rdp(pts.slice(0,idx+1),eps).slice(0,-1).concat(rdp(pts.slice(idx),eps));
}
function simplifyStroke(s){
  if(s&&s.p&&s.p.length>2) s.p=rdp(s.p,0.0012);

/* Store.ready(), but not for ever. Store.open() gives up on a database that
   never answers, but a database that opens and then stops answering partway
   through hydration would still leave Export and Import waiting without a
   word. Resolves null instead, and the caller says so: an export taken before
   hydration would hold only what localStorage had, and an import written then
   would land nowhere durable. */
const STORE_WAIT_MS=15000;
function storeReadyOrNull(){
  return Promise.race([Store.ready(),new Promise(r=>setTimeout(()=>r(null),STORE_WAIT_MS))]);
}
async function exportMarkup(){

  if(typeof flushLog==='function') flushLog();

    mem:(typeof Memory!=='undefined'?Memory.all():[])},null,0)],
    {type:'application/json'});

function validateAnnotationBackup(d){
  const record=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  if(!record(d)||(d.v!=null&&(!Number.isInteger(d.v)||d.v<1||d.v>6))) throw new Error('Invalid backup.');
  const safe=v=>{ if(v&&typeof v==='object') for(const k of Object.keys(v)){
    if(['__proto__','constructor','prototype'].includes(k)) throw new Error('Unsafe backup key.'); safe(v[k]);
  }};
  safe(d);
  for(const k of ['ink','notes','chat','stats']) if(d[k]!=null&&!record(d[k])) throw new Error('Invalid '+k);
  for(const k of ['refs','log','mem']) if(d[k]!=null&&!Array.isArray(d[k])) throw new Error('Invalid '+k);
  if(d.refs&&d.refs.some(r=>!record(r)||typeof r.body!=='string')) throw new Error('Invalid reference.');
  if(d.v===6&&!record(d.assets)) throw new Error('Missing backup images.');

      try{

        if(!(await storeReadyOrNull())){ toast('Storage is not responding, so nothing was restored. Reload and try again.'); return; }
        const assetsStored=d.assets==null||await RefAssets.restoreBackup(d.assets);
        if(d.ink)  { INK=d.ink;   saveInkNow(); }
        if(d.notes){ NOTES=d.notes; saveJSON(NOTE_KEY,NOTES); }
        if(d.refs&&typeof REF!=='undefined'){ REF=d.refs; saveJSON('accsap12.ref',REF);
          if(typeof invalidateIndex==='function')invalidateIndex(); }
        if(d.log&&Array.isArray(d.log)){ LOG=d.log; saveJSON(LOG_KEY,LOG); }
        /* Every other line here updates the live variable as well as the
           store; this one only wrote, so a restored backup's conversations
           did not appear until the app was next launched. */
        if(d.chat){ CHATS=d.chat; saveJSON('accsap12.chat',CHATS); }

             reload must not lose them, so they go into it; with none made there is nothing to add. */
          saveJSON('accsap12.v2',d.stats.flagged!=null||!S.flagged.size?d.stats:Object.assign({},d.stats,{flagged:[...S.flagged]}));

      }catch(e){ toast('That file could not be read.'); }
    };

}

/* ═══════ BM25 retrieval over the bank's commentary + the fellow's own reference ═══════ */
'use strict';

const REF_KEY='accsap12.ref';
const REF_SEED = /*REF_SEED_START*/@@SLOT[payload:REF_SEED]@@/*REF_SEED_END*/;
/* Where each seeded note's pearl is, found at build time (scripts/pearl-bake.js);
   no note text, only positions and scores, checked against the note at use. */
const REF_PEARLS = /*REF_PEARLS_START*/@@SLOT[payload:REF_PEARLS]@@/*REF_PEARLS_END*/;
/* Keyed by the CONTENT of the seed, not by a version number somebody has to
   remember to bump.
 *
 * The first version stored a bare '1' here and returned early whenever it was
 * present, so a device was seeded exactly once, for ever. That was wrong in a
 * way that took a while to surface: when the corpus later grew figure
 * citations, every already-seeded device kept the old bodies and showed no
 * figures at all — and nothing in the app could explain why, because the new
 * seed was right there in the build. Compounding it, the merge skipped any
 * title it already had, so even a forced re-seed would have skipped all 146
 * notes: the titles had not changed, only the bodies.
 *
 * Now the stored value is a hash of the seed itself. Change the corpus and it
 * changes, so the sync runs. Change nothing and it does not. */
const REF_SEED_KEY = 'accsap12.refseed';
/* FNV-1a, 32-bit. Small, dependency-free, and only ever compared against
   itself — this is change detection, not cryptography. */
function refHash(s){
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); }
  return (h>>>0).toString(36);
}
/* Sync, not merely seed — while still never clobbering your own writing:
     · a note you wrote yourself is never touched;
     · a seeded note you have since edited is left alone, detected by its body
       no longer hashing to what was written when it was seeded;
     · an untouched seeded note is brought up to date, which is what lets a
       corpus change — new figures, a corrected trial number — actually reach
       a device seeded months ago;
     · a seeded note you deleted comes back only when the corpus itself
       changes, which is the price of not keeping a tombstone for every title
       ever shipped. */
function refSeedApply(cur, seed){
  try{
    /* The split build empties REF_SEED and fetches it instead, so an empty
       seed means "not here yet" — never "seeded, nothing to do". Marking the
       key now would permanently block the fetched copy from ever landing. */
    if(!seed || !seed.length) return cur;
    const version = refHash(JSON.stringify(seed));
    if(localStorage.getItem(REF_SEED_KEY) === version) return cur;
    const byTitle = Object.create(null);
    for(const r of cur) byTitle[r.title] = r;
    let added=0, updated=0;
    for(const s of seed){
      const r = byTitle[s.title];
      if(!r){
        cur.push({ id:'seed'+(added++).toString(36)+Math.random().toString(36).slice(2,6),
                   title:s.title, body:s.body, tags:s.tags, source:s.source,
                   ts:Date.now(), seed:true, seedHash:refHash(s.body||'') });
        continue;
      }
      if(!r.seed) continue;                       // yours, not ours — hands off
      /* Notes seeded before seedHash existed carry no fingerprint, so an edit
         cannot be told from an original. They are adopted rather than frozen:
         they were machine-written and are almost certainly untouched, and
         freezing them would mean the devices that most need this fix are the
         only ones it never reaches. */
      if(r.seedHash !== undefined && r.seedHash !== refHash(r.body||'')) continue;
      if(r.body !== s.body || r.tags !== s.tags || r.source !== s.source) updated++;
      r.body = s.body; r.tags = s.tags; r.source = s.source;
      r.seedHash = refHash(s.body||'');
    }
    localStorage.setItem(REF_SEED_KEY, version);
    if(added || updated){
      saveJSON(REF_KEY, cur);
      if(typeof invalidateIndex === 'function') invalidateIndex();
    }
  }catch(_){ /* private mode, quota, anything — an unseeded library still works */ }
  return cur;
}
let REF = refSeedApply(loadSeen(REF_KEY, []), REF_SEED);          // [{id,title,tags,body,ts,source}]
/* Figures cited by the reference notes above, keyed by the refimg:// path
   each note uses to name them. Reassignable ('let') because the split PWA
   build empties this and fetches the real map in afterward. */
let REF_IMGS = /*REF_IMGS_START*/@@SLOT[payload:REF_IMGS]@@/*REF_IMGS_END*/;
/* A note's images, as {caption,key} pairs, in citation order. Shared by the
   renderer (which resolves key -> pixels) and by the chat layer (which
   resolves key -> a vision block) so the two never drift out of sync on what
   counts as "this note has a figure". */
function extractRefImages(body){
  const out=[]; const re=/!\[([^\]]*)\]\(refimg:\/\/([^)\s]+)\)/g;
  let m; while((m=re.exec(body||''))) out.push({caption:m[1], key:m[2]});
  return out;
}

const STOP=new Set(('a an the and or but if then than that this these those of in on at to for with '+
 'from by as is are was were be been being it its he she they them his her their you your we our '+
 'which who whom what when where why how all any both each few more most other some such no nor not '+
 'only own same so too very can will just should now also may might one two patient patients year '+
 'years old man woman male female presents present presented history following one-of which-one '+
 'answer choice correct incorrect because therefore however although while during after before '+
 'likely most-likely appropriate next best initial').split(/\s+/));

/* conservative stemmer — medical morphology is unforgiving */
const KEEP=/^(stenosis|sclerosis|thrombosis|fibrosis|necrosis|diagnosis|prognosis|anastomosis|apoptosis|stasis|crisis|axis|basis)$/;
/* The index stems every token of every document, and a few thousand words make up nearly all of them: each is stemmed
   once. The answer is a function of the word alone, so what is kept can never be stale. */
const STEMMED=new Map();
function stem(w){
  let s=STEMMED.get(w);
  if(s===undefined){
    if(STEMMED.size>60000) STEMMED.clear();
    s=stemWord(w); STEMMED.set(w,s);
  }
  return s;
}
function stemWord(w){
  if(w.length<=4) return w;
  if(KEEP.test(w)) return w;
  // fold clinical morphology: amyloidosis/amyloid, ischemia/ischemic, stenotic/stenosis
  // 'otic' only folds when a real stem survives (stenotic->stenosis is handled below)
  let x=w.replace(/(osis|osed)$/,'').replace(/otic$/, m=>'')
         .replace(/(aemia|emia|aemic|emic)$/,'em')
         .replace(/(pathy|pathic)$/,'path')
         .replace(/(itis|itic)$/,'it')
         .replace(/(ically|ical|ically)$/,'ic')
         .replace(/(fication|fied|fying)$/,'fi')
         .replace(/(tion|sion)$/,'t')
         .replace(/(ance|ence)$/,'an')
         .replace(/(ing|ed)$/,'');
  if(x.length<5) x=w;                       // refuse aggressive truncation
  if(/^sten/.test(w)) x='stenosis';         // stenosis / stenotic / stenoses
  if(/ies$/.test(x)) return x.slice(0,-3)+'y';
  if(/(ches|shes|xes|ses)$/.test(x)) return x.slice(0,-2);
  if(/(us|ss|is|as)$/.test(x)) return x;
  if(/s$/.test(x)) return x.slice(0,-1);

}
// short clinical abbreviations that a length>=3 filter would otherwise erase
const SHORTOK=new Set(['qt','av','mi','pe','lv','rv','la','ra','pa','bp','hr','ef','cad','chd',
  'afib','vt','vf','svt','avb','mr','ar','ts','tr','pr','ps','as','mv','tv','pv','ivc','svc',
  'lad','lcx','rca','pci','cabg','icd','ppm','crt','hf','cvd','dvt','copd','osa']);
function tok(s){
  const out=[];
  for(let t of String(s||'').toLowerCase().split(/[^a-z0-9₀-₉+/-]+/)){
    /* Only a token with a - + or / at an end has anything to trim; most have none. */
    const a=t.charCodeAt(0), z=t.charCodeAt(t.length-1);
    if(a===45||a===43||a===47||z===45||z===43||z===47) t=t.replace(/^[-+/]+|[-+/]+$/g,'');
    if(!t||STOP.has(t)||/^\d+$/.test(t)) continue;
    if(t.length<3 && !SHORTOK.has(t)) continue;
    out.push(t.length<=4&&SHORTOK.has(t)?t:stem(t));
    if(t.includes('-')) for(const p of t.split('-')) if((p.length>=3||SHORTOK.has(p))&&!STOP.has(p)) out.push(SHORTOK.has(p)?p:stem(p));
  }

}

let IDX=null;      // {df, docs:[{key,len,tf}], avg, N}
let VOCAB=null;    // IDX.df's keys, sorted — rebuilt with IDX, never apart
let IDXJOB=null;   // an index half built by warmIndex(): a search that cannot wait finishes it where it stands
let IDXWARM=null;  // the job a chain of slices is working on

/* A query token the index has never seen is a STUB, and a stub stands for
   every vocabulary term it prefixes — not for two of them chosen by length.
   Only a token with no df of its own qualifies: a token the index knows is a
   word, and prefix-matching a word would rewrite queries that work today. On
   this shelf that guard is load-bearing rather than theoretical — "as" is
   aortic stenosis, and treating it as a prefix would pull in aspirin, assess
   and asystole on every search that mentions it. */
const PREFIX_MIN=4;
function stubTerms(t){
  if(!IDX||IDX.df[t]||t.length<PREFIX_MIN) return null;
  if(!VOCAB) VOCAB=Object.keys(IDX.df).sort();
  /* Binary search to the first term at or after the stub, then walk while the
     prefix holds. The slice is contiguous because the vocabulary is sorted. */
  let lo=0,hi=VOCAB.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(VOCAB[m]<t) lo=m+1; else hi=m; }
  let end=lo;
  while(end<VOCAB.length&&VOCAB[end].startsWith(t)) end++;
  return end>lo?VOCAB.slice(lo,end):null;
}
/* THE INDEX IS BUILT A SLICE AT A TIME when nobody is waiting for it, and all at once when somebody is. Building it takes about
   a second on a library the size of the real one (1,785 documents), and an iPad takes longer: done in the one call that the
   first search made, the screen froze under the first letter typed. warmIndex() does the same work in slices of a few
   milliseconds from the moment the search screen opens, which is time the reader spends on the first word; a search that
   arrives before it is done finishes what is left, in the same job, and gets the same index either way. */
function indexJob(){
  return {i:0, qs:ALL_Q, refs:REF.slice(), docs:[], df:Object.create(null), post:Object.create(null), bgdf:Object.create(null)};
}
function indexAdd(job,key,text,meta){
  const docs=job.docs, df=job.df, post=job.post, bgdf=job.bgdf;
  const ts=tok(text); if(!ts.length) return;
  const tf=Object.create(null);
  for(const t of ts) tf[t]=(tf[t]||0)+1;
  /* POSTINGS. df already needs a pass over the document's distinct terms;
     recording WHICH document, in the same pass, is what lets a prefix be
     scored from the postings of the terms it covers rather than by walking
     the whole collection once per stub. */
  const di=docs.length;
  for(const t in tf){ df[t]=(df[t]||0)+1; (post[t]||(post[t]=[])).push(di); }
  /* ADJACENT PAIRS, over tok()'s own output, so a pair is two scored terms
     side by side. Presence only: order is the evidence, not repetition. */
  const bg=Object.create(null);
  for(let i=0;i+1<ts.length;i++) bg[ts[i]+'\u0001'+ts[i+1]]=1;
  for(const k in bg) bgdf[k]=(bgdf[k]||0)+1;

/* Adds documents to the job until the time `until` has passed, or all of them when it is 0. True when the index is whole. */
function indexStep(job,until){
  const nq=job.qs.length, n=nq+job.refs.length;
  while(job.i<n){
    if(until&&performance.now()>=until) return false;
    const k=job.i++;
    if(k<nq){

      indexAdd(job,'q:'+q.id, q.s+' '+q.o.map(o=>o.t).join(' ')+' '+correct+' '+q.ex,
          {kind:'q',id:q.id,ch:q.ch,n:q.n});
    } else {
      const r=job.refs[k-nq];
      indexAdd(job,'r:'+r.id, (r.title||'')+' '+(r.tags||'')+' '+(r.body||''),
          {kind:'r',id:r.id,title:r.title||'Untitled note'});

  const docs=job.docs, df=job.df, post=job.post, bgdf=job.bgdf;
  const avg=docs.reduce((a,d)=>a+d.len,0)/Math.max(docs.length,1);
  IDX={df,docs,avg,N:docs.length,post,bgdf};

function buildIndex(){

const INDEX_SLICE_MS=8;
/* The next slice runs as a message, not as setTimeout(…,0): a browser holds a timer that sets itself again to at least 4 ms, which
   made a build of a second take a second and a half, and runs timers late in low-power mode. Input and drawing still go first. */
const indexYield=(function(){
  if(typeof MessageChannel!=='function') return fn=>setTimeout(fn,0);
  const ch=new MessageChannel(), next=[];
  ch.port1.onmessage=()=>{ const fn=next.shift(); if(fn) fn(); };
  return fn=>{ next.push(fn); ch.port2.postMessage(0); };
})();
function warmIndex(){
  if(IDX||(IDXJOB&&IDXWARM===IDXJOB)) return;
  const job=IDXJOB||(IDXJOB=indexJob());
  IDXWARM=job;
  const slice=()=>{
    /* Thrown away since (a note was changed), or finished by a search that could not wait: it is not this job's turn. */
    if(IDXJOB!==job){ if(IDXWARM===job) IDXWARM=null; return; }
    if(indexStep(job,performance.now()+INDEX_SLICE_MS)){ IDXJOB=null; IDXWARM=null; }
    else indexYield(slice);

}
function invalidateIndex(){

/* kind: rank only that kind of document ('q' questions, 'r' notes). Ranked together, the notes' boost and the weak-tail
   cut below decided a questions-only search: when the notes held the word, every question fell under 32% of the top

function search(query,{exclude=null,limit=5,kind=null}={}){

  const k1=1.5,b=0.75, seen=Object.create(null), stubs=[];

  for(const t of qt){

     of postings that can match, not the size of the collection. */
  for(const st of stubs){

     pairs, so a pair with one would only dilute the fraction. */
  const qb=[];

    if(!(qt[i] in seen)||!(qt[i+1] in seen)) continue;
    const k=qt[i]+'\u0001'+qt[i+1]; if(!qb.includes(k)) qb.push(k);
  }

     is in hundreds of notes and says little about which one was meant; a
     pair in three says a great deal. Unweighted, the owner's run left 23
     misses whose winners were shorter neighbours earning the common pairs. */
  const qbw=qb.map(k=>{ const n=(IDX.bgdf&&IDX.bgdf[k])||0; return Math.log(1+(IDX.N-n+0.5)/(n+0.5)); });

        // bury them under 1,500-char commentaries. Boost, and credit query coverage.
        // A matched stub counts towards coverage exactly as a matched term does:
        // half a typed word found is half the query answered.
        s = s*2.1 + (covered/nq)*6;
        /* The query's words in the query's order: the right note holds the
           phrase, a neighbour on the same topic only its words. */
        if(qb.length&&qbW>0&&d.bg){ let h=0; for(let j=0;j<qb.length;j++) if(d.bg[qb[j]]) h+=qbw[j]; s += (h/qbW)*PHRASE_W; }
      }
      out.push({score:s,meta:d.meta});
    }
  }
  out.sort((a,b)=>b.score-a.score);
  const top=out.slice(0,limit);
  const cut=top.length?top[0].score*0.32:0;      // drop weak tails
  return top.filter(r=>r.score>=cut);
}

/* ── build the extra context block handed to the tutor ────────────────────── */
const CTX_BUDGET=5200;
function systemPrompt(){ return AI_GROUNDED ? SYSTEM+GROUNDED : SYSTEM; }

/* In grounded mode the library is the whole answer, not supporting material:
   the question bank is excluded entirely, more notes are returned, and each
   gets far more of the budget — a Braunwald section clipped at 1500 characters
   loses exactly the qualifying clause that made it worth citing. */
/* ═══════════ Where the fellow's material starts and stops ═══════════
   Retrieved notes are DATA. They are also, in this app, imported from wherever
   the fellow got them — so their text is untrusted in the ordinary sense, and
   a plain "--- REFERENCE NOTE:" heading is a boundary any note can imitate.

   The nonce is what makes it unforgeable: it is new for every request, so a
   note written yesterday cannot contain today's closing fence. Stripping
   lookalikes from the body as well means it cannot be hit by accident either. */
let refFenceId=null;
function refFence(){
  if(!refFenceId){
    /* padStart is not decoration. A byte's base36 is one character below 36 and
       two above it, so six raw bytes produced anywhere from six to twelve
       characters — a fence whose LENGTH leaked how lucky the draw was, and
       occasionally only 30 bits of it. Two characters per byte, always. */
    const b=(typeof crypto!=='undefined'&&crypto.getRandomValues)
      ? Array.from(crypto.getRandomValues(new Uint8Array(6)))
      : Array.from({length:6},()=>Math.floor(Math.random()*256));
    refFenceId=b.map(n=>(n%1296).toString(36).padStart(2,'0')).join('').slice(0,12).toUpperCase();
  }
  return refFenceId;
}
/* A new fence for every turn: a nonce that never changes is a nonce that can
   eventually be learned and written into a note. */
function refFenceRoll(){ refFenceId=null; return refFence(); }
/* Nothing inside a fence may contain something that looks like a fence. */
function refSafe(s){
  /* Narrow on purpose. An earlier version collapsed any run of three angle
     brackets, which quietly rewrote "LVEDP >>> RVEDP" in a haemodynamics note.
     What has to go is fence-SHAPED text: a whole forged delimiter, half of one
     sitting against a word, and a bare block id that could be cited as if it
     named a real block. Ordinary comparisons are left exactly as written. */
  return String(s==null?'':s)
    .replace(/<<<\/?[^\n>]{0,64}>>>/g,'[fence removed]')
    .replace(/<{3,}([\/\w])/g,'--$1')
    .replace(/([\/\w])>{3,}/g,'$1--')
    .replace(/\b(?:NOTE|MEMORY)-[A-Za-z0-9]{6,}\b/g,'[block id removed]');
}
function refBlock(label,head,body){
  const F=refFence();
  return `<<<${label}-${F}>>>
${head}
${refSafe(body)}
<<</${label}-${F}>>>`;
}
function groundedContext(userText,q){
  const hits=search((userText+' ').repeat(3)+(q?clip(q.s,160):''),{limit:40})
              .filter(h=>h.meta.kind==='r').slice(0,6);
  if(!hits.length){
    return {text:'\n\nTHE FELLOW\u2019S REFERENCE LIBRARY RETURNED NOTHING for this question. Tell them their notes do not cover it — do not answer from your own knowledge.\n', hits:[]};
  }
  const parts=[]; const kept=[]; let used=0;
  for(const h of hits){
    const r=REF.find(x=>x.id===h.meta.id); if(!r) continue;
    const block=refBlock('NOTE',
      `title: ${refSafe(r.title||'Untitled')}${r.source?'\n    source: '+refSafe(r.source):''}${r.tags?'\n    tags: '+refSafe(r.tags):''}`,
      clip(r.body,4000));
    if(used+block.length>CTX_BUDGET*3) break;
    used+=block.length; parts.push(block); kept.push(h.meta);
  }
  return {
    text:`\n\nTHE FELLOW'S REFERENCE LIBRARY — these notes are the ONLY material you may teach from in this reply. Cite each by title.\n\n`+parts.join('\n\n'),
    hits:kept
  };
}

function retrievedContext(userText,q){
  if(AI_GROUNDED) return groundedContext(userText,q);
  // The user's own words matter more than the stem they happen to be sitting on:
  // repeat them so they dominate, and fall back to the stem only for thin queries.
  const seedTerms = q ? (q.s+' '+(q.o[q.ci]?q.o[q.ci].t:'')) : '';
  const uTok=tok(userText);
  // the fellow's own words lead; the stem only supplements, never dominates
  const weighted = (userText+' ').repeat(4) + clip(seedTerms, uTok.length<3 ? 300 : 160);
  let hits=search(weighted,{exclude:q?q.id:null,limit:6});
  if(REF.length && !hits.some(h=>h.meta.kind==='r')){
    const own=search(userText,{exclude:q?q.id:null,limit:60})
              .filter(h=>h.meta.kind==='r').slice(0,2);
    if(own.length) hits=own.concat(hits).slice(0,6);      // own notes lead
  }
  if(!hits.length) return {text:'',hits:[]};
  const byId=Object.create(null); ALL_Q.forEach(x=>byId[x.id]=x);
  let used=0; const parts=[]; const kept=[];
  for(const h of hits){
    let block='';
    if(h.meta.kind==='r'){
      const r=REF.find(x=>x.id===h.meta.id); if(!r) continue;
      block=refBlock('NOTE',
        `title: ${refSafe(r.title||'Untitled')}${r.tags?'\n    tags: '+refSafe(r.tags):''}`,
        clip(r.body,1500));
    } else {
      const o=byId[h.meta.id]; if(!o) continue;
      block=`--- RELATED ITEM ${o.ch}, question ${o.n}\nAsked: ${clip(o.s,320)}\nCorrect answer: ${o.o[o.ci].t}\n${BANK_BY?BANK_BY+'commentary':'Commentary'}: ${clip(o.ex,900)}`;
    }
    if(used+block.length>CTX_BUDGET) break;
    used+=block.length; parts.push(block); kept.push(h.meta);
  }
  if(!parts.length) return {text:'',hits:[]};
  return {
    text:`\n\nFURTHER MATERIAL FROM THE FELLOW'S OWN LIBRARY (retrieved because it bears on this question — draw the concept across these items where it helps, and say which item you are drawing on):\n\n`+parts.join('\n\n'),
    hits:kept
  };
}
function clip(s,n){ s=String(s||''); return s.length<=n?s:s.slice(0,n).replace(/\s+\S*$/,'')+'…'; }

/* ── reference store CRUD ─────────────────────────────────────────────────── */
function refAdd(title,body,tags,source){
  /* Date.now() alone collides when a whole chapter is imported in one tick —
     every note in the file would land on the same id and the last would win. */
  const r={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
           title:title||'',body:body||'',tags:tags||'',source:source||'',ts:Date.now()};
  REF.push(r); saveJSON(REF_KEY,REF); invalidateIndex(); return r;
}
function refUpdate(id,patch){
  const r=REF.find(x=>x.id===id); if(!r)return;
  Object.assign(r,patch); saveJSON(REF_KEY,REF); invalidateIndex();
}
function refDelete(id){
  REF=REF.filter(x=>x.id!==id); saveJSON(REF_KEY,REF); invalidateIndex();
  /* Import is content-addressed, deletion is not, so without this an imported
     chapter that gets deleted would leave its figures in the store for ever.
     authoritative: REF was just rebuilt from the live array, so an empty list
     here means every note really is gone — including the last one, whose
     figure would otherwise never be reclaimed. */
  try{ if(typeof RefAssets!=='undefined') RefAssets.sweep(REF.map(r=>r.body),{authoritative:true}); }catch(_){}
}
function stripFrontmatter(raw){
  // Claude Skill files (SKILL.md) and many note tools prepend YAML frontmatter:
  // ---\nname: ...\ndescription: ...\n---\n  — strip it so it never becomes a note.
  // A reference corpus wants more than that: a title to cite it by, tags to
  // retrieve it on, and a source you could actually go and open.
  const m=raw.match(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/);
  if(!m) return {body:raw, meta:null};
  const yaml=m[0];
  const f=k=>{ const x=yaml.match(new RegExp('^'+k+':\\s*(.+)$','m')); return x?x[1].trim().replace(/^["']|["']$/g,''):''; };
  return {body:raw.slice(m[0].length), meta:{
    name:f('name')||null, desc:f('description')||null,
    title:f('title'), tags:f('tags'), source:f('source')||f('citation')||f('ref'),
  }};
}
/* Split on # / ## / ### headings, but never inside a fenced ```code block```,
   where a line starting with '#' (a shell/Python comment, a markdown example,
   etc.) is not a heading and must not fracture the section. */
function splitSections(body){
  const lines=body.split('\n');
  const secs=[]; let cur=[]; let inFence=false;
  for(const line of lines){
    if(/^```/.test(line.trim())) inFence=!inFence;
    if(!inFence && /^#{1,6}\s/.test(line) && cur.length){ secs.push(cur.join('\n')); cur=[line]; }
    else cur.push(line);
  }
  if(cur.length) secs.push(cur.join('\n'));
  return secs.map(s=>s.trim()).filter(Boolean);
}
/* Pure, testable: raw file text + filename -> [{title,body,tags}]. No DOM, no I/O. */
function parseImportText(raw,filename){
  try{
    const j=JSON.parse(raw);
    if(Array.isArray(j)) return j.map(x=>({title:x.title||'Untitled',body:x.body||'',tags:x.tags||''}));
  }catch(_){}
  const {body,meta}=stripFrontmatter(raw);
  const fmTitle=(meta&&meta.title)||'';
  const source=(meta&&meta.source)||'';
  /* Front-matter tags win; the file name is a poor last resort but better than
     nothing, since it is usually the topic. */
  const tags=(meta&&meta.tags) || (meta&&meta.name?meta.name.replace(/[_-]+/g,' '):'')
             || filename.replace(/\.\w+$/,'').replace(/[_-]+/g,' ');
  const secs=splitSections(body);
  if(secs.length>1){
    /* One section per note. Retrieval works on whole notes, so a 4000-word
       chapter as a single note would either blow the context budget or be
       clipped mid-sentence; a section is the size a claim actually lives at.
       The file's own title is kept as a prefix so a citation still says which
       chapter it came from. */
    return secs.map(s=>{
      const m=s.match(/^#{1,6}\s*(.+)/);
      const secTitle=m?m[1].trim():'Note';
      return {title: fmTitle? fmTitle+' — '+secTitle : secTitle,
              body:s.replace(/^#{1,6}\s*.+\n?/,'').trim(), tags, source};
    }).filter(s=>s.body||s.title!=='Note');
  }
  const single=(secs[0]||body).trim();
  const m=single.match(/^#{1,6}\s*(.+)/);
  return [{title: fmTitle || (m?m[1].trim():'') || (meta&&meta.desc) || filename.replace(/\.\w+$/,''),
           body: m?single.replace(/^#{1,6}\s*.+\n?/,'').trim():single, tags, source}];
}
/* A Markdown link and a zip's internal path rarely agree exactly: the note
   says visuals/012.jpg, the zip says Braunwald_HF_atlas/visuals/012.jpg, and a
   file picker gives you no path at all. So resolution widens in three steps —
   exact, then suffix, then basename — and stops at the first that is unique.
   Widening past unique would silently pick the wrong figure, which is worse
   than reporting one as missing. */
function refResolveAsset(ref, byPath, byName){
  const clean=String(ref||'').split(/[?#]/)[0].replace(/^\.\//,'').replace(/^\//,'');
  if(byPath[clean]) return byPath[clean];
  const suffix=Object.keys(byPath).filter(p=>p.endsWith('/'+clean));
  if(suffix.length===1) return byPath[suffix[0]];
  const base=clean.split('/').pop();
  const hits=byName[base];
  return (hits&&hits.length===1)?hits[0]:null;
}

/* Rewrite every image link in one note body to a refimg:// key, storing the
   bytes as it goes. Anything already refimg://, or an http(s) URL, is left
   exactly as it is. */
function refAbsorbImages(body, byPath, byName, report){
  return String(body||'').replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,cap,ref)=>{
    if(/^refimg:\/\//.test(ref)) return m;
    if(/^(https?:|data:)/i.test(ref)) return m;
    const file=refResolveAsset(ref,byPath,byName);
    if(!file||typeof RefAssets==='undefined'||!RefAssets.isImageName(file.name)){
      report.missing.push(ref);
      return m;                                  // leave it visible rather than vanish
    }
    const key=RefAssets.add(file.bytes,file.name);
    if(!key){ report.missing.push(ref); return m; }
    report.linked++;
    return `![${cap}](refimg://${key})`;
  });
}

/* A file the picker hands over, read. Blob.arrayBuffer() and Blob.text() came in Safari 14, and the floor is iPadOS 13.4, where calling them is a
   TypeError and the import says "could not be read" for every file. FileReader is on every Safari. A Response has both methods from Safari 10, so
   the scan of the floor (tests/verify-ipad-pure.js) cannot tell a Blob's apart from it by their spelling, and the picker's files go through these. */
function blobBytes(f){
  if(typeof f.arrayBuffer==='function') return f.arrayBuffer();
  return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>no(r.error||new Error('unreadable')); r.readAsArrayBuffer(f); });
}
function blobText(f){
  if(typeof f.text==='function') return f.text();
  return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>no(r.error||new Error('unreadable')); r.readAsText(f); });
}
function refImportText(){
  const inp=document.createElement('input');
  inp.type='file'; inp.multiple=true;
  inp.accept='.md,.txt,.json,.zip,.jpg,.jpeg,.png,.webp,.gif,'
            +'text/plain,text/markdown,application/json,application/zip,image/*';
  inp.onchange=async()=>{
    const picked=[...(inp.files||[])]; if(!picked.length)return;
    toast('Reading…');
    const texts=[];                              // {name, raw}
    const byPath=Object.create(null);            // path -> {name, bytes}
    const byName=Object.create(null);            // basename -> [{name, bytes}]
    const report={linked:0, missing:[], skipped:0};

    const offer=(pathName, bytes)=>{
      const rec={name:pathName.split('/').pop(), bytes};
      byPath[pathName.replace(/^\.\//,'').replace(/^\//,'')]=rec;
      (byName[rec.name]||(byName[rec.name]=[])).push(rec);
    };

    let failed=0;
    for(const f of picked){
      try{
        if(/\.zip$/i.test(f.name)){
          const {files,skipped}=await ZipRead.read(await blobBytes(f));
          report.skipped+=skipped.length;
          for(const z of files){
            /* Zips from macOS carry a __MACOSX shadow of every file. */
            if(/(^|\/)__MACOSX\//.test(z.name)||/(^|\/)\._/.test(z.name)) continue;
            if(/\.(md|txt|json)$/i.test(z.name)) texts.push({name:z.name, raw:new TextDecoder().decode(z.bytes)});
            else offer(z.name, z.bytes);
          }
        } else if(/\.(md|txt|json)$/i.test(f.name)){
          texts.push({name:f.name, raw:await blobText(f)});
        } else {
          /* A file picker gives no directory, so its own name is its path. */
          offer(f.webkitRelativePath||f.name, new Uint8Array(await blobBytes(f)));
        }
      }catch(_){ failed++; }
    }

    let notes=0;
    for(const t of texts){
      try{
        for(const n of parseImportText(t.raw, t.name)){
          refAdd(n.title, refAbsorbImages(n.body, byPath, byName, report), n.tags, n.source);
          notes++;
        }
      }catch(_){ failed++; }
    }

    /* The figures are written to IndexedDB in the background; "linked" must mean
       stored, or a reload straight after the import loses them. */
    const stored=(report.linked&&typeof RefAssets!=='undefined'&&RefAssets.flush)?await RefAssets.flush():true;
    render();
    /* The old importer said "Added 14 notes" and nothing about the figures it
       had just discarded, which is exactly why nobody noticed for weeks. */
    const bits=[`Added ${notes} note${notes===1?'':'s'}`];
    if(report.linked) bits.push(`${report.linked} figure${report.linked===1?'':'s'} linked`);
    if(!stored) bits.push('figures could not be saved on this device and will not survive a reload');
    if(report.missing.length) bits.push(`${report.missing.length} image${report.missing.length===1?'':'s'} not found (${report.missing.slice(0,2).join(', ')}${report.missing.length>2?'…':''})`);
    if(report.skipped) bits.push(`${report.skipped} zip entr${report.skipped===1?'y':'ies'} unreadable`);
    if(failed) bits.push(`${failed} file${failed===1?'':'s'} could not be read`);
    toast(bits.join(' · '));
  };
  inp.click();
}

/* ═══════════ SM-2 spaced repetition + active recall ═══════════
   Per-question card: {difficulty, stability, ivl, reps, due, lapses, last}.
   difficulty/stability drive FSRS-5's forgetting-curve model (src/core/fsrs.js).
   ivl: the scheduled interval in days, at FSRS's default 90% target retention.
   due: ISO date string (day granularity — ISO strings compare correctly with <=).
   rating: FSRS's own 1-4 scale (Again/Hard/Good/Easy), supplied directly by
   the post-explanation self-rating in review sessions. Ordinary quiz answers
   (Stage 0 onward) never reach the scheduler at all — see selectOpt/S.practice.
*/
'use strict';

/* The LOCAL calendar day, as src/core/fsrs.js counts it (see isoToLocalDate
   there). Both used to read the UTC day back with toISOString(): east of
   Greenwich between local midnight and UTC midnight, todayISO() was yesterday
   and every exam countdown read a day long; addDays() parsed local midnight
   and so stepped back a day for any zone east of UTC. Found on the owner's
   run in Karachi (UTC+5) after midnight. */
function isoLocal(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function todayISO(){ return isoLocal(new Date()); }
function addDays(iso,n){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||'')); const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }

/* rateReview() and the rate-row preview call FSRS.update(card, rating, today)
   directly — see src/core/fsrs.js. Rating scale is FSRS's own: 1 Again,
   2 Hard, 3 Good, 4 Easy (RATINGS below carries these, not SM-2's 0/3/4/5). */
function fsrsPreview(card,rating){ return FSRS.update(card,rating,todayISO()); }

function dueQuestions(){
  const t=todayISO();
  return POOL.filter(q=>{ const c=S.srs[q.id]; return c && c.due<=t; });
}
/* New (never-reviewed) questions, sampled round-robin across chapters rather than
   sequential bank order — otherwise a fresh reviewer would grind straight through
   Arrhythmias (first alphabetically) before ever seeing another chapter. */
function newQuestionsForReview(limit){
  if(limit<=0) return [];
  const byCh=Object.create(null);
  for(const q of POOL) if(!S.srs[q.id]) (byCh[q.ch]||(byCh[q.ch]=[])).push(q);
  const chs=Object.keys(byCh);
  if(!chs.length) return [];
  const out=[]; let i=0;
  while(out.length<limit){
    let added=false;
    for(const ch of chs){
      const bucket=byCh[ch];
      if(i<bucket.length){ out.push(bucket[i]); added=true; if(out.length>=limit) break; }
    }
    if(!added) break;
    i++;
  }
  return out;
}
/* Returns EVERY due card, topped up with new ones until the session reaches
   `target`. It is not a cap: if 70 cards are due, all 70 come back. Dropping
   overdue cards to hit a round number is how a review backlog silently
   becomes a hole in the schedule. */
function reviewQueue(target){
  const due=dueQuestions();
  const topUp=newQuestionsForReview(Math.max(0,target-due.length));
  return [...due,...topUp];
}

/* ── active-recall rating (shown after the explanation, review sessions only) ── */
const RATINGS=[['again','Again',1,'#EF4444'],['hard','Hard',2,'#F59E0B'],
               ['good','Good',3,'#10B981'],['easy','Easy',4,'#0891B2']];
function rateReview(grade){
  const q=S.questions[S.qIdx]; if(!q||!S.answered) return;
  const ans=S.answers[S.qIdx]; if(ans&&ans.rated) return;   // the rate-row is gone once true; this is the second line of defence
  logReview(q,grade,grade>=2,'review');
  S.srs[q.id]=FSRS.update(S.srs[q.id],grade,todayISO());
  if(ans) ans.rated=true;
  logRated();
  bumpStreak();
  save();
  nextQ();
}
function bumpStreak(){
  const t=todayISO();
  if(S.lastReviewDay!==t){
    S.reviewStreak = (S.lastReviewDay===addDays(t,-1)) ? S.reviewStreak+1 : 1;
    S.lastReviewDay=t;
  }
}
function fmtInterval(days){
  if(days<1) return 'later today';
  if(days===1) return 'tomorrow';
  if(days<14) return `in ${days} days`;
  if(days<60) return `in ${Math.round(days/7)} weeks`;
  return `in ${Math.round(days/30)} months`;
}

/* ═══════════ local progress tracking + stats ═══════════ */
'use strict';

/* daily activity log: { 'YYYY-MM-DD': {a:answered, c:correct, r:rated} } */
function logAnswer(ok){
  const d=todayISO();
  const day=S.daily[d]||(S.daily[d]={a:0,c:0,r:0});
  day.a++; if(ok) day.c++;
  S.sinceBackup=(S.sinceBackup||0)+1;
  if(S.sinceBackup>0 && S.sinceBackup%150===0)
    setTimeout(()=>toast('150 answers since your last backup — Progress → Export everything.'),900);
}
/* iPadOS clears storage for sites it thinks are disposable. Asking to persist
   is the difference between losing a month of review history and not. */
let PERSISTED=null;
function requestPersistence(){
  if(!navigator.storage||!navigator.storage.persist) return;
  navigator.storage.persist().then(granted=>{
    PERSISTED=granted;
    if(S.screen==='stats') render();
  }).catch(()=>{});
}
function storageLine(){
  const p = PERSISTED===null ? 'checking storage'
          : PERSISTED ? 'storage granted eviction protection (not permanent — keep exporting backups)'
          : 'storage not persistent — export regularly';
  const b = S.lastBackup
          ? 'last backup '+Math.max(0,Math.round((Date.now()-S.lastBackup)/86400000))+'d ago'
          : 'never backed up';
  return p+' · '+b;
}
function logRated(){ const d=todayISO(); (S.daily[d]||(S.daily[d]={a:0,c:0,r:0})).r++; }

function storageOK(){
  try{ const k='__t'+Date.now(); localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(_){ return false; }
}
function masteryFor(ch){
  const qs=POOL.filter(q=>q.ch===ch);
  if(!qs.length) return 0;
  let score=0;
  const t=todayISO();
  for(const q of qs){
    const c=S.srs[q.id];
    if(c&&c.stability!==undefined){
      // "mastery" is literally FSRS's own prediction: how likely you are to
      // recall this card today, given how long it's been and how it's gone.
      score+=FSRS.retrievability(c.stability, FSRS.daysBetween(c.last||t,t));
      continue;
    }
    // a legacy card not yet touched by a review since the FSRS switch, or a
    // card only ever practised — both fall back to the old, coarser signal
    // until their next real review picks up a proper retrievability curve.
    if(c){ score+=Math.min(1,(c.reps||0)/3); continue; }
    const p=S.practice[q.id];
    if(p) score+=Math.min(0.45,(p.c||0)*0.22);
  }
  return score/qs.length;
}
/* average predicted retention across every card FSRS has actually scheduled —
   the single number the Progress screen leads with. */
function avgRetention(){
  const t=todayISO();
  let sum=0,n=0;
  for(const id in S.srs){
    const c=S.srs[id];
    if(!c||c.stability===undefined) continue;
    sum+=FSRS.retrievability(c.stability, FSRS.daysBetween(c.last||t,t)); n++;
  }
  return n?Math.round(sum/n*100):null;
}
/* how many cards come due on each of the next 7 days — so exam week doesn't
   ambush you with a queue you never saw coming. */
function forecast7(){
  const t=todayISO();
  const out=[];
  for(let i=0;i<7;i++){
    const day=addDays(t,i);
    let n=0;
    for(const id in S.srs){ if(S.srs[id].due===day) n++; }
    out.push({d:day,n});
  }
  return out;
}
/* every card you have met, by either route */
function startedCount(){
  const s=new Set(Object.keys(S.srs));
  for(const k in S.practice) s.add(k);
  return s.size;
}
function last30(){
  const out=[];
  for(let i=29;i>=0;i--){
    const d=addDays(todayISO(),-i);
    const v=S.daily[d];
    out.push({d,a:v?v.a:0,c:v?v.c:0});
  }
  return out;
}
function pct(x){ return Math.round(x*100)+"%"; }
function secs(ms){ return ms==null?"—":(ms<10000?(ms/1000).toFixed(1):Math.round(ms/1000))+"s"; }
function calibPanel(){

  if(!cal.rated && !sp.n && !rs.tagged) return "";
  const bars=cal.bands.map(function(b){
    const w = b.accuracy==null ? 0 : Math.round(b.accuracy*100);
    const val = b.accuracy==null ? ("needs "+(Calib.MIN_SAMPLES-b.n)+" more") : pct(b.accuracy);

  const head = cal.certainButWrong==null

    : '<div class="cb-head">Certain, and wrong: <b>'+pct(cal.certainButWrong)+'</b>'

      + (sp.fragile ? '<span class="cb-sub">right, but slower than your wrong answers — the concept is there, the retrieval is not yet</span>' : "")
      + '</div>';
  const mix = !rs.enough ? '<div class="cb-thin">'+(rs.misses? "Tag a few misses and the pattern shows here." : "No misses recorded.")+'</div>'
    : rs.counts.filter(function(c){return c.n;}).sort(function(a,b){return b.n-a.n;}).map(function(c){
        return '<div class="cb-row"><span class="cb-lab">'+e(c.label)+'</span>'
          + '<span class="cb-track"><span class="cb-fill" style="width:'+Math.round(c.share*100)+'%"></span></span>'
          + '<span class="cb-val">'+pct(c.share)+'</span></div>';

  return '<div class="panel"><div class="panel-h">Calibration · '+cal.rated+' rated</div>'

/* The cardiac cycle. Remembered across sessions like every other lab choice,
   because someone working through the PV loop comes back to the PV loop. */
const PHYSIO_VIEWS=[['wiggers','Wiggers'],['pv','PV loop'],['flow','Flow'],
                    ['right','Right heart'],['curves','Curves'],['conduction','Conduction'],
                    ['coronary','Coronary']];
let physio=null;
let physioView=(()=>{try{const v=localStorage.getItem('accsap12.physioview');
  return PHYSIO_VIEWS.some(x=>x[0]===v)?v:'wiggers';}catch(_){return 'wiggers';}})();
let physioIv='base', physioCanvasEl=null;
/* Half real time by default. A whole cycle then takes about 1.8 seconds, which
   is long enough to follow the cursor through isovolumic contraction — 50ms in
   life — and short enough that the loop still reads as a loop. */
const PHYSIO_SPEEDS=[[1,'1×'],[2,'½×'],[4,'¼×']];
let physioSlow=(()=>{ try{ return +localStorage.getItem('accsap12.physioslow')||2; }catch(_){ return 2; } })();
function setPhysioSlow(n){
  physioSlow=n;
  try{ localStorage.setItem('accsap12.physioslow',String(n)); }catch(_){}
  if(physio&&physio.setSlow) physio.setSlow(n);
  document.querySelectorAll('[data-physio-slow]').forEach(b=>
    b.classList.toggle('hot',+b.dataset.physioSlow===n));
}
/* Playing or paused. Unset until the screen first needs it, then decided by the device: with Reduce Motion on, the cycle starts paused, a still
   diagram that can be dragged and played; without it, playing. After that the Play/Pause chip decides, for the visit. */
let physioPlaying=null;
function physioIsPlaying(){
  if(physioPlaying===null){
    let reduced=false;
    try{ reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(_){}
    physioPlaying=!reduced;
  }
  return physioPlaying;
}
function setPhysioPlaying(on){
  physioPlaying=!!on;
  if(physio) physioPlaying?physio.play():physio.pause();
  document.querySelectorAll('[data-physio-play]').forEach(b=>{
    b.textContent=physioPlaying?'Pause':'Play';
    b.title=physioPlaying?'Pause the cycle':'Play the cycle';
  });
}

function buildPhysio(){
  const v=PHYSIO_VIEWS.find(x=>x[0]===physioView)||PHYSIO_VIEWS[0];
  return `<div class="panel physio-panel">
    <div class="panel-h"><span>Cardiac cycle · ${e(v[1])}</span>
      <span class="physio-phase" id="physioPhase">&nbsp;</span></div>
    <div class="physio-chips speed-chips"><button class="chip mini" data-physio-play
        title="${physioIsPlaying()?'Pause the cycle':'Play the cycle'}">${physioIsPlaying()?'Pause':'Play'}</button><span class="speed-lbl">speed</span>${
      PHYSIO_SPEEDS.map(([n,label])=>
        `<button class="chip mini${physioSlow===n?' hot':''}" data-physio-slow="${n}"
           title="${n===1?'Real time':'\u0024{label} of real time'}">${e(label)}</button>`).join('')}</div>
    <div class="physio-chips">${PHYSIO_VIEWS.map(([k,label])=>
      `<button class="chip${physioView===k?' hot':''}" data-physio-view="${k}">${e(label)}</button>`).join('')}</div>
    <div class="physio-stage"><canvas id="physioCanvas" aria-label="Cardiac cycle diagram"></canvas></div>
    ${physioView==='pv'?`<div class="physio-chips iv-chips">${Physio.INTERVENTIONS.map(iv=>
      `<button class="chip${physioIv===iv.id?' hot':''}" data-physio-iv="${iv.id}">${e(iv.label)}</button>`).join('')}</div>`:''}
    <div class="physio-note" id="physioNote"></div>
    <div class="ref-hint physio-model" id="physioModel">A teaching model: every curve is computed from
      textbook resting values, not recorded from a patient. Use it to understand the cycle, not to
      measure or interpret one.</div>
  </div>`;
}
function physioNoteHtml(){
  if(physioView==='pv'){
    const iv=Physio.INTERVENTIONS.find(x=>x.id===physioIv)||Physio.INTERVENTIONS[0];
    return `<b>${e(iv.label)}</b> ${e(iv.note)}`;
  }
  if(physioView==='curves')
    return `<b>Two curves, one intersection.</b> Cardiac output is not set by the heart alone —
      it is set where what the heart can pump meets what the circulation returns. That is why an
      inotrope moves it so little, and why volume moves it so much in a failing ventricle.`;
  if(physioView==='flow')
    return `<b>Flow follows the gradient.</b> The left coronary bed is squeezed shut by the muscle
      around it during systole and fills in diastole; the right is perfused throughout, because RV
      cavity pressure never rises far. Shorten diastole and you starve the left side first.`;
  if(physioView==='right')
    return `<b>Same cycle, quarter the pressure, different timing.</b> The right ventricle has
      about 10 mmHg to overcome instead of 80, so it opens earlier and shuts later — which is the
      physiological splitting of the second heart sound, not a separate phenomenon to memorise.`;
  if(physioView==='conduction')
    return `<b>The pause is the point.</b> SA to atria is fast — that is the P wave. Atria to
      ventricle is not: the AV node deliberately slows conduction so the atria finish emptying
      into the ventricles before they contract, which is what the isoelectric PR segment actually
      is. Lose that delay (WPW's accessory pathway) and you lose the coordination it buys.`;
  if(physioView==='coronary')
    return `<b>The left ventricle squeezes its own arteries.</b> Intramyocardial pressure in
      systole compresses the left coronary bed, so most left coronary flow arrives in diastole — and
      the subendocardium, where that compression is greatest, is where ischaemia shows first. The
      right coronary keeps flowing through systole because RV pressure stays low. Tachycardia
      shortens diastole, and with it the left ventricle's perfusion time.`;
  const ph=Physio.phaseAt(physio?physio.time():0);
  return `<b>${e(ph.name)}.</b> ${e(ph.blurb)}`;
}
function mountPhysio(){
  const cv=document.getElementById('physioCanvas');
  if(!cv||typeof Wiggers==='undefined'){
    if(physio&&physio.destroy) physio.destroy();
    physio=null; physioCanvasEl=null; return;
  }
  /* A screen change can render twice — the second render replaces the canvas
     node under the first one's deferred callback. Guarding on existence alone
     leaves the old instance animating a node that has left the document, and
     requestAnimationFrame will happily keep calling it forever. Guarding on
     identity is what makes that race harmless. */
  if(physio&&physioCanvasEl===cv) return;
  if(physio&&physio.destroy) physio.destroy();
  const dark=document.documentElement.getAttribute('data-theme')==='dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  physio=Wiggers.mount(cv,{view:physioView,dark,hr:RHYTHMS[labKind].hr||68,
    slow:physioSlow, playing:physioIsPlaying(),
    /* Its own clock. wiggers.js integrates one when no timeSource is given,
       and onFrame is how the caption below learns what time it is — sixty
       times a second, from the thing that owns the time. */
    onFrame:()=>{ if(typeof paintPhysioNote==='function') paintPhysioNote(); }});
  if(!physio) return;
  physioCanvasEl=cv;
  physio.setIntervention(physioIv);
  document.querySelectorAll('[data-physio-slow]').forEach(b=>
    b.onclick=()=>setPhysioSlow(+b.dataset.physioSlow));
  document.querySelectorAll('[data-physio-play]').forEach(b=>
    b.onclick=()=>setPhysioPlaying(!physioIsPlaying()));
  document.querySelectorAll('[data-physio-view]').forEach(b=>b.onclick=()=>{
    physioView=b.dataset.physioView;
    try{localStorage.setItem('accsap12.physioview',physioView);}catch(_){}
    render();
  });
  document.querySelectorAll('[data-physio-iv]').forEach(b=>b.onclick=()=>{
    physioIv=b.dataset.physioIv;
    physio.setIntervention(physioIv);
    document.querySelectorAll('[data-physio-iv]').forEach(x=>x.classList.toggle('hot',x===b));
    paintPhysioNote();
  });
  /* Dragging the diagram scrubs the cycle. While a finger is down the heart's
     clock is ignored, so you can stop time on the dicrotic notch and read it. */
  let down=false;
  const at=ev=>{ const r=cv.getBoundingClientRect();
    return physio.scrubAt((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,
                          (ev.touches?ev.touches[0].clientY:ev.clientY)-r.top); };
  cv.onpointerdown=ev=>{ if(physioView==='pv'||physioView==='curves') return;
    down=true; physio.setScrub(true); cv.setPointerCapture(ev.pointerId); at(ev); paintPhysioNote(); };
  cv.onpointermove=ev=>{ if(!down) return; at(ev); paintPhysioNote(); };
  cv.onpointerup=cv.onpointercancel=ev=>{ if(!down) return;
    down=false; physio.setScrub(false); try{cv.releasePointerCapture(ev.pointerId);}catch(_){} };
  /* The note's repaint guard tracks the phase already on screen. render()
     hands us a fresh, empty #physioNote, so the guard has to be cleared with
     it — otherwise it reports "already painted" about an element that no
     longer exists and the note stays blank until the phase happens to turn
     over. */
  __physioNotePhase='';
  paintPhysioNote();
  requestAnimationFrame(()=>physio&&physio.draw());
}
let __physioNoteAt=0, __physioNotePhase='';
function paintPhysioNote(){
  const el=document.getElementById('physioNote'); if(!el) return;
  /* Repainting a paragraph sixty times a second is wasteful and makes the text
     unselectable, so only when the phase actually changes. */
  if(physioView==='wiggers'){
    const id=Physio.phaseAt(physio?physio.time():0).id;
    if(id===__physioNotePhase) return;
    __physioNotePhase=id;
  }
  el.innerHTML=physioNoteHtml();
  const pill=document.getElementById('physioPhase');
  if(pill) pill.textContent = physioView==='wiggers'
    ? Physio.phaseAt(physio?physio.time():0).name : PHYSIO_VIEWS.find(x=>x[0]===physioView)[1];
}

function buildTwelveLead(){

function mountTwelve(){
  const cv=document.getElementById('twelveCanvas');

  const dark=document.documentElement.getAttribute('data-theme')==='dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  twelve=ECG12.mount(cv,{kind:LEAD12_MAP[labKind]||'sinus',hr:RHYTHMS[labKind].hr||68,dark});

let pendingNav=null, toolTrace=[];
/* Grounded mode: answer from the reference library alone. Off by default —
   with an empty library it would leave Apex with nothing to say. */
let AI_GROUNDED=(()=>{try{return localStorage.getItem('accsap12.grounded')==='1';}catch(_){return false;}})();
function toggleGrounded(){
  if(!AI_GROUNDED && !REF.length){ toast('Import your reference notes first — grounded mode has nothing to read yet.'); return; }
  AI_GROUNDED=!AI_GROUNDED;
  try{localStorage.setItem('accsap12.grounded',AI_GROUNDED?'1':'0');}catch(_){}
  buildAI();

                   :'Open mode: Apex will use its own knowledge again.');

/* A mock block is open: the tutor is put away until it is handed in (mockMount). A reply already on its way when the block was opened
   must not carry on into it, so every tool refuses, and so does fire() and flushNav(). The screen is asked as well as the attribute:
   the attribute is drawn by the render, which a view transition runs a frame or more after the screen is set. */
function apexAway(){ return document.documentElement.hasAttribute('data-mock')||(S.screen==='mock'&&!!S.mock); }
function runTool(name,input){
  try{
    if(apexAway()) return {result:'A mock exam block is open, so the tutor stays out of it until it is handed in. Say nothing about the questions in it.'};
    input=input||{};
    if(name==='search_question_bank'){
      const n=Math.min(Math.max(input.limit||4,1),6);
      /* Grounded mode leaves the bank out of this door as groundedContext()
         does: a bank item carries its answer and commentary, the key that mode
         withholds. Notes only, searched as wide as groundedContext() searches. */
      let hits=search(String(input.query||''),{limit:AI_GROUNDED?40:n});
      if(AI_GROUNDED) hits=hits.filter(h=>h.meta.kind==='r').slice(0,n);
      if(!hits.length) return {result:AI_GROUNDED
        ? 'No matching notes in the fellow\'s reference library. Grounded mode leaves the question bank out.'
        : 'No matching items in the bank.'};
      const byId=Object.fromEntries(ALL_Q.map(x=>[x.id,x]));
      const rows=hits.map(h=>{
        if(h.meta.kind==='r'){
          const r=REF.find(x=>x.id===h.meta.id);
          if(!r) return '';
          /* Same fence, same nonce, same sanitiser as the notes already in the
             prompt — fire() rolls it before the turn is assembled, so a note
             that arrives through a tool call is indistinguishable in kind from
             one that arrived through retrieval. The typeof guard is for the
             single-file build being driven without the app's own scope. */
          return (typeof refBlock==='function')
            ? refBlock('NOTE','the fellow\'s own note: '+refSafe(r.title),clip(r.body,900))
            : `[OWN NOTE] ${r.title}\n${clip(r.body,900)}`;
        }
        const q=byId[h.meta.id];
        return `[${q.id}] ${q.ch} item ${q.n}\nStem: ${clip(q.s,300)}\nCorrect: ${q.o[q.ci].t}\nCommentary: ${clip(q.ex,800)}`;
      }).filter(Boolean);
      return {result:rows.join('\n\n---\n\n'),cite:hits.map(h=>h.meta)};
    }
    if(name==='get_performance'){
      const st=S.chStats||{};
      const rows=Object.entries(st).map(([ch,s])=>
        `${ch}: ${s.correct}/${s.total} (${s.total?Math.round(s.correct/s.total*100):0}%)`);
      const missed=[...S.missed].slice(0,40);
      const byId=Object.fromEntries(ALL_Q.map(x=>[x.id,x]));
      const mlist=missed.map(id=>byId[id]?`${id} — ${byId[id].ch} item ${byId[id].n}`:'').filter(Boolean);
      const dueN=dueQuestions().length;
      const how=apexStandingLines();
      let ready=''; try{ ready=StudyPlan.readiness({pool:POOL,srs:S.srs,chStats:S.chStats,recentPerDay:recentPerDay(),examDate:S.examDate}).text; }catch(_){}
      return {result:
        `Answered overall: ${S.sessionCorrect}/${S.sessionTotal}\n`+
        `Spaced-repetition: ${dueN} due right now, ${Object.keys(S.srs).length}/${TOTAL_Q} cards ever reviewed, review streak ${S.reviewStreak||0} day(s).\n`+
        (rows.length?`Per chapter:\n${rows.join('\n')}`:'No chapter attempts recorded yet.')+
        (mlist.length?`\n\nMissed questions (${S.missed.size} total, first ${mlist.length}):\n${mlist.join('\n')}`
                     :'\n\nNo missed questions recorded.')+
        (how.length?`\n\nHow they answer:\n${how.join('\n')}`:'')+
        (ready?`\n\nOn track for the exam? ${ready}`:'')};
    }
    if(name==='get_misses'){
      const d=ApexSignals.digest({log:LOG,missed:S.missed,byId:QBYID,limit:input.limit,now:Date.now(),grounded:AI_GROUNDED});
      return {result:d.text||'No recent misses are recorded: either nothing is missed, or what is missed was answered before the review log kept it.'};
    }
    if(name==='plan_session'){
      const minutes=Math.max(5,Math.min(120,Number.isInteger(input.minutes)?input.minutes:20));
      const p=planNow(minutes);
      if(!p.items.length) return {result:p.text};
      pendingNav={kind:'plan',minutes};
      return {result:p.text+' It will open as a review session as soon as this reply finishes; ratings there move the schedule as usual.'};
    }
    if(name==='start_review_session'){
      const due=dueQuestions();
      const qs=reviewQueue(20);
      if(!qs.length) return {result:'Nothing due, and no new questions left to seed — the bank is fully reviewed. Nice work.'};
      pendingNav={kind:'due'};
      return {result:`Ready: ${due.length} due card${due.length===1?'':'s'}${qs.length>due.length?` plus ${qs.length-due.length} new (sampled across chapters)`:''} will open as soon as this reply finishes.`};
    }
    if(name==='start_quiz'){
      let ids=Array.isArray(input.question_ids)?input.question_ids.filter(id=>ALL_Q.some(q=>q.id===id&&!q.bad)):[];
      if(input.missed_only) ids=[...S.missed].filter(id=>ALL_Q.some(q=>q.id===id&&!q.bad));
      const narrowed=ids.length>0||!!input.missed_only||!!input.chapter||(Array.isArray(input.question_ids)&&input.question_ids.length>0);
      if(!ids.length&&input.chapter){
        const ch=CHAPTERS.find(c=>c.toLowerCase().includes(String(input.chapter).toLowerCase().split(' ')[0]));
        if(ch) ids=POOL.filter(q=>q.ch===ch).map(q=>q.id);
      }
      /* Restricts whatever else was asked for (ids, missed, a chapter) to the flagged; asked alone, it is every flagged question. */
      if(input.flagged_only){ const f=flaggedQs().map(q=>q.id); ids=narrowed?ids.filter(id=>f.includes(id)):f; }
      if(!ids.length) return {result:'No questions matched — nothing was launched.'};
      pendingNav={kind:'quiz',ids};
      return {result:`Ready: a ${ids.length}-question quiz will open as soon as this reply finishes.`};
    }
    if(name==='open_question'){
      const q=ALL_Q.find(x=>x.id===input.question_id&&!x.bad);
      if(!q) return {result:'That question ID does not exist in the bank.'};
      pendingNav={kind:'open',id:q.id};
      return {result:`Will open ${q.ch} item ${q.n} once this reply finishes.`};
    }
    if(name==='remember'){
      if(typeof Memory==='undefined') return {result:'Memory is unavailable.'};
      const r=Memory.add(String(input.text||''),String(input.kind||'fact'),
        {src:'tool',said:input.said===true});
      if(!r) return {result:'Nothing to remember — the text was empty.'};
      toolTrace.push({kind:'mem',text:r.text});
      return {result:`Kept as [${r.id}]. You will see this at the top of every future conversation, so do not repeat it back to them now.`};
    }
    if(name==='forget'){
      if(typeof Memory==='undefined') return {result:'Memory is unavailable.'};
      return {result:Memory.remove(String(input.id||''))
        ? 'Forgotten. It will not appear in future conversations.'
        : 'No memory has that id — it may already be gone.'};
    }
    if(name==='save_reference_note'){
      const r=refAdd(String(input.title||'Note'),String(input.body||''),String(input.tags||''));
      toolTrace.push({kind:'note',title:r.title});
      return {result:`Saved to the reference library as "${r.title}". It is now searchable and will be handed to you as context in future questions.`};
    }
  }catch(err){ return {result:'Tool error: '+err.message}; }
  return {result:'Unknown tool.'};
}

function flushNav(){
  if(!pendingNav) return;
  const nav=pendingNav; pendingNav=null;
  if(apexAway()) return;
  if(nav.kind==='open'){ jumpTo(nav.id); }
  else if(nav.kind==='due'){ startQuiz(null,'due'); }
  else if(nav.kind==='plan'){ startPlan(nav.minutes); }
  else if(nav.kind==='quiz'){
    const qs=nav.ids.map(id=>ALL_Q.find(q=>q.id===id)).filter(Boolean);
    if(!qs.length)return;
    startAdhocQuiz(shuf(qs),null);
  }
}

'use strict';

function peekQuestion(id){

  closePeek();
  const wrap=document.getElementById('peek')||(()=>{
    const d=document.createElement('div'); d.id='peek'; document.body.appendChild(d); return d;})();
  wrap.className='peek-open';
  wrap.innerHTML=`<div class="peek-card" role="dialog" aria-label="Related question">
      <div class="peek-head">

             <div class="peek-sub">related item from your question bank</div></div>
        <button class="icon-btn" style="background:var(--card);border-color:var(--border);color:var(--muted)"
          aria-label="Close" onclick="closePeek()">${icon('x','icon-sm')}</button>
      </div>
      <div class="peek-body">
        <p>${e(q.s)}</p>
        <ul class="peek-opts">${q.o.map((o,i)=>
