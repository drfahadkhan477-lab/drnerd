/* Scrolled to the top on the way in: arriving at a long page halfway down it
   is the classic single-page-app failure, and the doors are at the bottom of
   the home screen, which is exactly where the scroll would be left. */
function goStudy(){ S.screen='study'; render(); toTop(); }

function buildQuiz(){
  const {questions,qIdx,selected,answered}=S;
  const ansHere=S.answers[qIdx];
  const alreadyRated=S.mode==='due'&&!!(ansHere&&ansHere.rated);
  const canGoBack=qIdx>0;
  if(!questions.length)return '<div style="padding:60px;text-align:center;color:var(--muted)">No questions found.</div>';
  const q=questions[qIdx];
  const prog=(qIdx+1)/questions.length*100;
  const chColor=CH_COLORS[q.ch]||'var(--teal)';
  const figHtml='<div class="fig-zone"></div>';

  const opts=q.o.map((o,i)=>{
    let cls='opt'+(q.imgopt?' img-opt':'');
    let pctEl='';
    if(answered){
      if(i===q.ci)cls+=' correct';
      else if(i===selected)cls+=' wrong';
      const col=i===q.ci?'var(--green)':(i===selected?'var(--red)':'var(--muted)');
      pctEl=`<span class="opt-pct" style="color:${col}">${o.p}%</span>`;
    }
    return `<button class="${cls}" ${answered?'disabled':''} data-idx="${i}" type="button"
      aria-pressed="${answered&&i===selected}" style="--acc:${chColor}">
      <span class="opt-letter">${o.l}</span>
      <span class="opt-text">${e(o.t)}</span>${pctEl}</button>`;
  }).join('');

  let revealHtml='';
  if(answered){
    const ok=selected===q.ci;
    const corr=q.o[q.ci];
    const short=corr.t.length>58?e(corr.t.slice(0,58))+'…':e(corr.t);
    const distRows=q.o.map((o,i)=>{
      let rowCls='dist-row';
      if(i===q.ci)rowCls+=' correct-row'; else if(i===selected)rowCls+=' wrong-row';
      return `<div class="${rowCls}"><span class="dist-letter">${o.l}</span>
        <div class="dist-bar-wrap"><div class="dist-bar" style="clip-path:inset(0 ${(100 - Math.max(o.p, 0.6)).toFixed(2)}% 0 0 round 5px)"></div>
        <span class="dist-pct">${o.p}%</span></div></div>`;
    }).join('');
    revealHtml=`<div class="reveal-card">
      <div class="reveal-header ${ok?'ok':'bad'}" tabindex="-1">
        <span class="reveal-icon">${ok?icon("check-circle"):icon("x-circle")}</span>
        <div><div class="reveal-verdict">${ok?'Correct!':'Incorrect — Answer: '+corr.l}</div>
          <div class="reveal-sub">${ok?corr.p+'% of candidates answered correctly':'Correct: '+short}</div></div>
      </div>
      <div class="reveal-body">
        <div class="exp-text">${e(q.ex).replace(/\n+/g,'<br><br>')}</div>
        ${q.tr?`<div class="exp-trunc">${icon("alert","icon-sm")} The ACCSAP text export truncated this commentary. Open the item in ACCSAP for the complete discussion.</div>`:''}
        ${q.src?`<div class="exp-trunc" style="color:var(--green);font-style:normal">${icon('check','icon-sm')} Question, answer key, peer statistics and full commentary verified against the ACCSAP 12 source export.</div>`:''}
        <div class="dist-title">Answer Distribution</div>${distRows}${missRowHtml(ok)}
      </div></div>`;
  }

  const isMobile=window.innerWidth<768;
  const letters=q.o.map(o=>`<kbd>${o.l}</kbd>`).join('');
  const kbHint=!answered
    ?`<div class="kb-hint kbd-row">${isMobile?'Tap to answer':`Press ${letters} to answer · <kbd>←</kbd> <kbd>→</kbd> to move`}</div>`
    :`<div class="kb-hint">${isMobile?'Tap Next to continue':'Press <kbd>Enter</kbd> or <kbd>Space</kbd> for next'}</div>`;

  const reviewing = answered && S.mode==='due' && !alreadyRated;
  const rateRow = reviewing ? `<div class="rate-prompt anim-pop">
      <div class="rate-q">How well did you know this — before you saw the options?</div>
      <div class="rate-row">${RATINGS.map(([key,label,grade,col])=>
        `<button class="rate-btn" style="--rc:${col}" onclick="rateReview(${grade})">
           <span class="rate-label">${label}</span>
           <span class="rate-sched">${fmtInterval(fsrsPreview(S.srs[q.id],grade).ivl)}</span>
         </button>`).join('')}</div>
    </div>` : '';
  const prevBtn=canGoBack?`<button class="btn btn-prev" onclick="prevQ()" type="button" aria-label="Previous question">${icon('arrow-left','icon-sm')}</button>`:'';
  const actions = reviewing ? '' : answered
    ?`<button class="btn btn-home" onclick="goHome()" type="button" aria-label="Home">${icon('home')}</button>${prevBtn}
      <button class="btn btn-next anim-pop" onclick="nextQ()" type="button">${qIdx<questions.length-1?'Next Question':'View Results'} ${icon('arrow-right','icon-sm')}</button>`
    :`<button class="btn btn-home" onclick="goHome()" type="button" aria-label="Home">${icon('home')}</button>${prevBtn}
      <button class="btn btn-skip" onclick="nextQ()" type="button">Skip ${icon('arrow-right','icon-sm')}</button>`;

  return `<div class="quiz-wrap">
    <div class="qbar anim-slide">
      <div class="qbar-top">
        <span class="ch-badge" style="background:${chColor}22;color:${chColor}">${e(q.ch)}</span>
        <span class="q-counter">Q ${qIdx+1} / ${questions.length}</span>
        ${S.resumed?`<button class="q-restart" type="button" onclick="restartQuiz()"
          title="Deal this chapter again from the beginning">Resumed · start over</button>`:''}
      </div>
      <div class="prog-track"><div class="prog-fill" style="transform:scaleX(${(prog / 100).toFixed(4)})"></div></div>
      <div class="qstats">${S.quizTotal?`This quiz: ${S.quizCorrect}/${S.quizTotal} (${Math.round(S.quizCorrect/S.quizTotal*100)}%)`:'&nbsp;'}</div>
    </div>
    ${figHtml}
    <div class="q-card anim-pop" tabindex="-1" aria-labelledby="qTag" style="border-left-color:${chColor}">
      <div class="q-tag" id="qTag"><span class="q-tag-dot" style="color:${chColor}"></span>Question ${q.n} · ${e(q.ch)}
        ${typeof hasMarkup==='function'&&hasMarkup(q.id)?`<span class="src-badge" style="color:var(--amber);background:var(--amber-bg);border-color:var(--amber-b)">${icon('pencil','icon-sm')} annotated</span>`:''}</div>
      ${e(q.s)}
      ${q.imgopt?'<div class="q-imgnote">Answer options refer to the labelled panels in the figure above.</div>':''}
      ${q.flag?`<div class="notice"><span>${icon("alert")}</span><span>${e(q.flag)}</span></div>`:''}
    </div>
    ${cfRowHtml()}
    <div class="opts">${opts}</div>
    ${kbHint}
    ${revealHtml}
    ${rateRow}
    <div class="actions">${actions}</div>
  </div>`;
}

function buildResults(){
  const sc=S.quizTotal?S.quizCorrect:S.sessionCorrect, st=S.quizTotal||S.sessionTotal;
  const p=st>0?Math.round(sc/st*100):0;
  const col=p>=80?'var(--green)':p>=60?'var(--amber)':'var(--red)';
  const msgIcon=p>=80?'trophy':p>=60?'target':'book';
  const msg=p>=80?'Outstanding!':p>=60?'Good Progress!':'Keep Studying!';
  const r=50,circ=2*Math.PI*r;
  const svgCircle=`<svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Score ${p} percent">
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"/>
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="${col}" stroke-width="10"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-p/100)}" stroke-linecap="round"
      transform="rotate(-90 64 64)" style="transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)"/></svg>`;
  const rows=CHAPTERS.map(ch=>{
    const s=S.chStats[ch];
    if(!s||!s.total)return '';
    const cp=Math.round(s.correct/s.total*100);
    const cc=cp>=70?'var(--green)':cp>=50?'var(--amber)':'var(--red)';
    const bc=CH_COLORS[ch]||'var(--teal)';
    return `<div class="chp-row" style="--accent:${bc}"><span class="chp-icon">${chIcon(ch)}</span>
      <div class="chp-info"><div class="chp-name">${e(ch)}</div>
        <div class="chp-bar"><div class="chp-fill" style="transform:scaleX(${cp / 100});background:${cc}"></div></div></div>
      <div class="chp-score"><div class="chp-pct" style="color:${cc}">${cp}%</div>
        <div class="chp-count">${s.correct}/${s.total}</div></div></div>`;
  }).filter(Boolean).join('');

  const restartLabel=(S.mode==='due'?'Continue Reviewing':S.chapter?'Restart Chapter':'Restart Quiz');
  const restartMode=S.mode==='due'?'due':S.mode==='missed'?'missed':'all';
  return `<div class="results-wrap anim-fade">
    <div class="score-hero">
      <div class="score-circle">${svgCircle}
        <div class="score-num"><span class="score-pct" style="color:${col}">${p}%</span>
        <span class="score-label">Score</span></div></div>
      <div class="score-msg">${icon(msgIcon,'icon-lg')} ${msg}</div>
      <div class="score-sub">${sc} correct · ${st-sc} wrong · ${st} answered${
        S.sessionTotal!==st?` · session total ${S.sessionCorrect}/${S.sessionTotal}`:''}</div>
    </div>
    ${rows?`<div class="section-label">Cumulative Chapter Performance</div><div class="ch-perf">${rows}</div>`:''}
    <div class="results-btns">
      <button class="btn btn-next" onclick="goHome()" type="button">${icon('arrow-left','icon-sm')} Back to Chapters</button>
      ${S.missed.size>0?`<button class="btn" type="button" style="background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-b)" onclick="startQuiz(null,'missed')">${icon('repeat','icon-sm')} Retry Missed (${S.missed.size})</button>`:''}
      <button class="btn" type="button" style="background:var(--card);border:1.5px solid var(--border);color:var(--muted)"
        onclick="startQuiz(${S.mode==='due'?'null':'S.chapter'},'${restartMode}')">${restartLabel}</button>
    </div>
  </div>`;
}

function attachEvents(){
  document.querySelectorAll('[data-fig]').forEach(fc=>{
    if(fc.__bound)return; fc.__bound=true;
    fc.addEventListener('click',()=>toggleZoom(parseInt(fc.dataset.fig,10)));
    fc.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleZoom(parseInt(fc.dataset.fig,10));}
    });
  });
  document.querySelectorAll('[data-idx]').forEach(b=>{
    b.addEventListener('click',()=>{if(!S.answered)selectOpt(parseInt(b.dataset.idx,10));});
  });
  document.querySelectorAll('[role="button"][tabindex="0"]').forEach(el=>{
    el.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();el.click();}
    });
  });
}

document.addEventListener('keydown',ev=>{
  const t=ev.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||ev.target.isContentEditable)return;
  if(S.screen!=='quiz')return;
  if(S.answered){
    if(ev.key===' '||ev.key==='Enter'||ev.key==='ArrowRight'){ev.preventDefault();nextQ();}
    if(ev.key==='ArrowLeft'){ev.preventDefault();prevQ();}
    return;
  }
  const idx='abcde'.indexOf(ev.key.toLowerCase());
  const n=S.questions[S.qIdx]?S.questions[S.qIdx].o.length:0;
  if(idx>-1&&idx<n){ev.preventDefault();selectOpt(idx);return;}
  if(ev.key==='ArrowRight'){ev.preventDefault();nextQ();}
  if(ev.key==='ArrowLeft'){ev.preventDefault();prevQ();}
});

/* iOS: suppress double-tap zoom without blocking single taps */
let lastTap=0;
document.addEventListener('touchend',ev=>{
  /* Scoped, not global. A bare document-level preventDefault here also
     suppressed double-tap zoom on figures and interfered with Pencil and
     browser gestures — three separate audits flagged it. Only the controls
     where a stray second tap actually misfires are guarded. */
  const t=ev.target&&ev.target.closest&&ev.target.closest('.opt,.btn,.nav-item,.door,.rate-btn');
  if(!t)return;
  const now=Date.now();
  if(now-lastTap<350&&now-lastTap>0)ev.preventDefault();
  lastTap=now;},{passive:false});

applyTheme();
/* After applyTheme so the first paint is already right, and before render so
   a flip during boot is not missed. */
watchSystemTheme();
/* Scoped to "the screen never painted anything at all" — render()'s own
   catch above already handles a throw while updating a screen that is
   already up, and an unrelated rejection (a dropped Apex request, say)
   should not blow away a working quiz just because it happened to be
   uncaught. */
window.addEventListener('error', ev=>{
  console.error('Uncaught error:', ev.error||ev.message);
  const app=document.getElementById('app');
  if(app && !app.firstElementChild) showCrashScreen(ev.error||new Error(String(ev.message||'unknown error')));
});
window.addEventListener('unhandledrejection', ev=>{
  console.error('Unhandled rejection:', ev.reason);
});
render();
/* THE DATABASE ANSWERS AFTER THE APP HAS ALREADY BOOTED. Boot is not gated on
   it — a browser with IndexedDB disabled would then show a blank app instead
   of a working one — so the app starts from whatever localStorage still held
   and picks the real stores up here. On every device I can measure this lands
   inside the splash, so there is nothing to see. */
Store.ready().then(r=>{
  /* THE PROGRESS BLOB CAME BACK. accsap12.v2 is not one of the four keys this
     store owns — it stays in localStorage because load() reads it
     synchronously at boot — but the store keeps a copy of it, and if
     localStorage was emptied underneath the app (seven days without a visit,
     on iOS) the copy has just been put back.

     S was built from an empty store several hundred milliseconds ago, so every
     count on screen is wrong and rebuilding them in place would mean
     re-deriving a dozen fields that load() already derives. A reload runs
     load() again, against the restored data, which is the same code path as
     any other launch.

     IT CANNOT LOOP. The restore only fires when localStorage held nothing when
     store.js was evaluated; it now holds the restored blob, so the next boot
     takes the ordinary path. */
  if(r&&r.restored&&r.restored.length){
    try{ toast('Your progress was restored from this device.'); }catch(_){}
    setTimeout(()=>{ try{ location.reload(); }catch(_){} },1400);
    return;
  }
  /* Re-render only if the database actually held something the app did not
     already have. On a first launch, and on every launch where the migration
     has nothing left to do, this changes nothing — and an unconditional
     render() here is real work on a cold, throttled CPU, landing while the
     splash is still waiting on its own dismissal timer. It delayed the splash
     past its removal on about one launch in three. Key names rather than a
     serialisation: comparing megabytes of ink to decide whether to repaint
     would cost more than the repaint. */
  const mark=()=>Object.keys(INK).join()+'|'+Object.keys(NOTES).join()+'|'+
                 Object.keys(CHATS).join()+'|'+LOG.length;
  const was=mark();
  INK=Store.get(INK_KEY,{}); NOTES=Store.get(NOTE_KEY,{});
  CHATS=Store.get(AI_CHAT,{}); LOG=Store.get(LOG_KEY,[]);
  if(mark()===was) return;
  try{ render(); }catch(_){}
  try{ if(document.getElementById('shell').classList.contains('ai-open')) buildAI(); }catch(_){}
}).catch(()=>{});

/* ── keeping the progress blob copied ──────────────────────────────────────
   accsap12.v2 stays in localStorage — load() reads it synchronously at boot —
   and the store keeps a copy of it in the database so that seven quiet days on
   an iPad cannot take the cards with them. See src/core/store.js.

   DRIVEN FROM HERE RATHER THAN FROM save(). The obvious place is the end of
   save() itself, and it is the wrong place: save()'s last line is the anchor
   scripts/resume-patch.js matches on, and appending to it breaks the build
   with "expected exactly 1 match, found 0". The patch chain's exact-match rule
   is the whole safety model, so the call moved instead of the anchor.

   Nothing is lost by that. Store.mirror() compares the stored text against
   what it last copied, so a call with nothing to do is one string comparison —
   which is what makes a timer and a page-hide handler an honest substitute for
   a hook on every write. The copy is at most one interval behind, and
   localStorage still holds the truth until the day it is evicted. */
(function(){
  var V2='accsap12.v2';
  var tick=function(){ try{ if(window.Store&&Store.mirror) Store.mirror(V2); }catch(_){} };
  /* Once the restore pass has armed it, for the copy a brand-new install has
     never had. */
  Store.ready().then(tick).catch(function(){});
  /* The two moments the iPad actually gives us: switching away, and the tab
     going into the background. pagehide fires where unload does not on iOS. */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden') tick();
  });
  window.addEventListener('pagehide',tick);
  /* And a floor, so a session left open all evening is not one write behind
     all evening. Forty-five seconds against a blob of a few hundred KB, only
     when it has changed. */
  setInterval(tick,45000);
})();
/* One frame's grace so the reveal lands on a painted screen rather than
   racing it, then fade and remove — leaving the node in place would keep a
   full-screen element alive over the app for no reason. */
/* The avatar was already built and already state-driven; the button just
   never used it. Mounting it here means the mark on screen is the same
   creature as the one in the panel header, running the same states. */
let fabAvatar=null;
function mountFabAvatar(){
  const cv=document.getElementById('apexFabAvatar');
  if(!cv||typeof Apex==='undefined') return;
  if(fabAvatar) return;
  fabAvatar=Apex.avatar(cv,{size:26});
  const fab=document.getElementById('aiFab');
  if(!fab) return;
  /* It should feel alive to the touch, not just animate at you. */
  fab.addEventListener('pointerenter',()=>fabAvatar&&fabAvatar.pulse(2));
  fab.addEventListener('pointerdown', ()=>fabAvatar&&fabAvatar.pulse(4));
}
/* Keep the mark in step with what Apex is actually doing. */
function setApexState(s){
  if(fabAvatar) fabAvatar.setState(s);
  if(typeof apexAvatar!=='undefined'&&apexAvatar) apexAvatar.setState(s);
}
function dismissSplash(){
  const sp=document.getElementById('splash');
  if(!sp) return;
  requestAnimationFrame(()=>{
    sp.classList.add('gone');
    setTimeout(()=>{ if(sp.parentNode) sp.remove(); },520);
  });
}
/* ══════════ on-device self-test — why, at length, in scripts/selftest-patch.js ══════════ */
const ST_SAMPLE=24;
const stFrame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

/* EVERY figure, not one per question. A question can carry several and the
   later ones are not the same shape as the first — sampling only [0] quietly
   halved the bank the check could see. */
function stFigureUrls(){
  const out=[];
  try{ for(const id in IMGS){ const l=IMGS[id]; if(!l) continue;
    for(const u of l) if(typeof u==='string'&&u) out.push(u); } }catch(_){}
  return out;
}

/* THE ONE THAT BROKE. Opens real figures and measures the rendered rectangle
   against the frame — never recomputes the sizing rule, which would agree with
   a wrong one. */
async function stFiguresFit(){
  const urls=stFigureUrls();
  if(!urls.length) return {ok:null,detail:'this build carries no figures'};
  const step=Math.max(1,Math.floor(urls.length/ST_SAMPLE));
  let seen=0,missed=0,worst=0,worstAt='';
  for(let i=0;i<urls.length&&seen<ST_SAMPLE;i+=step){
    try{ closePeek(); openFigure(urls[i],'Self-test',''); }catch(_){ missed++; continue; }
    /* Wait for the element, then for the decode, separately. Polling frames
       for both together reported the first figure as unreachable on a
       perfectly healthy device — the first open also builds the overlay and
       mounts the zoom controller, so it is always the slow one. A self-test
       that cries wolf on its own timing is the failure mode this whole step
       exists to avoid. */
    let img=null;
    for(let t=0;t<120;t++){ await stFrame();
      img=document.querySelector('.figv-scroll img'); if(img) break; }
    if(img&&!(img.complete&&img.naturalWidth)){
      await new Promise(res=>{ let done=0; const fin=()=>{ if(!done++) res(); };
        img.addEventListener('load',fin,{once:true});
        img.addEventListener('error',fin,{once:true});
        setTimeout(fin,4000); });
      await stFrame();
    }
    if(!img||!img.naturalWidth){ missed++; continue; }
    await stFrame();
    /* LAYOUT SIZE, NOT THE PAINTED RECTANGLE. getBoundingClientRect() includes
       every transform above the element, and the viewer has two: its own
       entrance animation, and the zoom. Opening two dozen figures back to back
       restarts the entrance each time, so a rect measured two frames in is
       mid-animation — which reported a 12px overflow on a figure that fits
       exactly. offsetHeight against clientHeight is the question actually
       being asked: does the fitted image fit the frame it was laid out in. */
    const box=document.querySelector('.figv-scroll');
    if(box){
      const over=Math.max(0,img.offsetHeight-box.clientHeight,img.offsetWidth-box.clientWidth);
      if(over>worst){ worst=Math.round(over); worstAt=img.naturalWidth+'x'+img.naturalHeight; }
    }
    seen++;
  }
  try{ closePeek(); }catch(_){}
  if(!seen) return {ok:false,detail:missed+' figures could not be loaded — download them on this device first'};
  return {ok:worst<=1,
    detail:seen+' sampled · worst overflow '+worst+'px'+(worst>1?' on a '+worstAt+' figure':'')+
           (missed?' · '+missed+' unreachable':'')};
}

/* A sideways scrollbar is the other thing that only appears at a real width. */
function stNoSideways(){
  const d=document.documentElement, over=Math.round(d.scrollWidth-d.clientWidth);
  return {ok:over<=1,detail:over<=1?'nothing overflows the width':over+'px wider than the screen'};
}

/* The figures under an Apex answer used to arrive with no way to put them
   away. Shut-by-default is now the promise; this is where it is kept. */
function stFigStripShut(){
  const w=document.querySelector('.fig-strip');
  if(!w) return {ok:null,detail:'no Apex answer on screen to check'};
  return {ok:!w.classList.contains('open'),
    detail:w.classList.contains('open')?'it opened by itself':'arrives folded, as it should'};
}

/* Private browsing, an MDM profile, or a full disk all present as this, and
   all of them silently lose a morning of annotations. */
function stStorage(){
  try{
    const k='accsap12.selftest';
    localStorage.setItem(k,'1');
    const back=localStorage.getItem(k)==='1';
    localStorage.removeItem(k);
    const idb=typeof indexedDB!=='undefined';
    return {ok:back&&idb,detail:back?(idb?'readable and writable':'localStorage fine, IndexedDB missing')
                                   :'writes are not coming back'};
  }catch(e){ return {ok:false,detail:'storage refused: '+(e&&e.name||'error')}; }
}

/* Not a check — the context every other line has to be read against. */
function stEnv(){
  const ua=navigator.userAgent, w=innerWidth, h=innerHeight;
  const engine=/\bCriOS|Chrome\//.test(ua)?'Blink':(/Firefox\//.test(ua)?'Gecko':'WebKit');
  return {ok:null,detail:engine+' · '+w+'x'+h+' '+(w>h?'landscape':'portrait')+
    ' · dpr '+(devicePixelRatio||1)+' · '+stFigureUrls().length+' figures'};
}

const ST_CHECKS=[
  ['this device and orientation',stEnv],
  ['every figure fits the viewer at Fit',stFiguresFit],
  ['nothing scrolls sideways',stNoSideways],
  ['the Apex figures arrive folded',stFigStripShut],
  ['annotations can be saved here',stStorage],
];

async function runSelfTestNow(){
  const out=[];
  for(const [name,fn] of ST_CHECKS){
    let r; try{ r=await fn(); }catch(e){ r={ok:false,detail:'threw: '+(e&&e.message||e)}; }
    out.push({name:name,ok:r.ok,detail:r.detail});
  }
  return out;
}

/* SERIALISED, NOT DROPPED. The figure check drives a single shared viewer, so
   two overlapping runs have each other's images torn out by the other's
   closePeek() — which reports as figures being "unreachable" on a device where
   every one of them is fine. Queueing rather than refusing means a caller
   always gets a real answer: arriving on #selftest fires both the boot hook
   and the hashchange listener, and Run again is a button a finger can hit
   twice. */
let stQueue=Promise.resolve();
function runSelfTest(){
  stQueue=stQueue.then(runSelfTestNow,runSelfTestNow);
  return stQueue;
}

function renderSelfTest(rows,busy){
  let el=document.getElementById('selftest');
  if(!el){ el=document.createElement('div'); el.id='selftest'; document.body.appendChild(el); }
  const real=rows.filter(r=>r.ok!==null), bad=real.filter(r=>!r.ok);
  el.innerHTML='<div class="st-card"><div class="st-head"><b>Self-test</b>'+
    '<button class="st-x" id="stClose" aria-label="Close">'+icon('x','icon-sm')+'</button></div>'+
    '<div class="st-rows">'+rows.map(r=>
      '<div class="st-row"><span class="st-dot '+(r.ok===null?'info':(r.ok?'pass':'fail'))+'">'+
      (r.ok===null?'i':(r.ok?'✓':'✗'))+'</span><span class="st-txt"><b>'+e(r.name)+'</b>'+
      '<span>'+e(r.detail||'')+'</span></span></div>').join('')+'</div>'+
    '<div class="st-foot"><span>'+(busy?'running…':
      (bad.length?bad.length+' of '+real.length+' failing':'all '+real.length+' holding here'))+
    '</span><button class="st-run" id="stRun"'+(busy?' disabled':'')+'>Run again</button></div></div>';
  const x=document.getElementById('stClose');
  if(x) x.onclick=closeSelfTest;
  const run=document.getElementById('stRun');
  if(run) run.onclick=openSelfTest;
}

function closeSelfTest(){
  const el=document.getElementById('selftest'); if(el) el.remove();
  if(location.hash==='#selftest'){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){}
  }
}

/* The queue above keeps runs from colliding; this keeps a second tap from
   throwing the panel back to "running…" over results that are already there. */
let stRunning=false;
async function openSelfTest(){
  if(stRunning) return;
  stRunning=true;
  renderSelfTest(ST_CHECKS.map(c=>({name:c[0],ok:null,detail:'…'})),true);
  try{
    const rows=await runSelfTest();
    renderSelfTest(rows,false);
  } finally { stRunning=false; }
}

(function boot(){
  dismissSplash();
  if(location.hash==='#selftest') setTimeout(openSelfTest,600);
  window.addEventListener('hashchange',()=>{ if(location.hash==='#selftest') openSelfTest(); });
  mountFabAvatar();
  requestPersistence();
  const sh=document.getElementById('shell');
  let open=false; try{ open=localStorage.getItem('accsap12.aiopen')==='1'; }catch(_){}
  if(open&&window.innerWidth>=1024){
    let full=false; try{ full=localStorage.getItem('accsap12.aifull')==='1'; }catch(_){}
    sh.classList.add('ai-open');
    if(full) sh.classList.add('ai-full');
    buildAI();
  }
  const fab=document.getElementById('aiFab');
  if(fab){ fab.onclick=toggleAI; fab.style.display=sh.classList.contains('ai-open')?'none':'flex'; }
  window.addEventListener('resize',()=>{ if(typeof repaintAll==='function')repaintAll(); });
})();

</script>
</body>
</html>
