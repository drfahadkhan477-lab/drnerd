  const paint=()=>{ raf=0; if(live){ live.innerHTML=md(getText())+toolStrip(); apexStick(body); } };
  return {
    schedule(){ if(!raf) raf=requestAnimationFrame(paint); },
    flush(){ if(raf){ cancelAnimationFrame(raf); raf=0; } paint(); },
  };
}

/* One non-streaming completion, no tools, no question context. The three
   oneTurn* functions cannot serve this — they are bound to aiCtx() and TOOLS —
   so this carries the three wire shapes in the smallest form that works.
   Returns '' rather than throwing: every caller here is best-effort. */
async function oneShot(prompt,maxTokens){
  const p=AI.provider, k=cur().key, model=cur().model;
  /* No key is not the end of it when the build is hosted: gemUrl and
     gemHeaders already send a keyless call through this site. The same
     condition buildAI opens the panel on. */
  if(!k && !(p==='gemini' && apexHosted())) return '';
  try{
    const r=await geminiFetch(gemUrl('generate',model,k),{method:'POST',
      headers:gemHeaders(k,true),
      body:JSON.stringify({generationConfig:{maxOutputTokens:maxTokens},
        contents:[{role:'user',parts:[{text:prompt}]}]})});
    if(!r.ok || apexSessionLapsed(r)) return '';
    relayAnswered(r);
    const j=await r.json();
    const parts=((j.candidates||[])[0]||{}).content;
    return ((parts&&parts.parts)||[]).map(x=>x.text||'').join('');
  }catch(_){ return ''; }
}

/* Written once at the end of a sitting, never per question. The fellow chose
   to have sessions summarised, but a summary is only worth its API call if
   something happened: a handful of answers, or a real conversation. */
let sessionSummarised=false;
async function summariseSession(){
  if(sessionSummarised) return;
  if(typeof Memory==='undefined') return;
  sessionSummarised=true;
  try{
    /* Hosted needs no key, as in buildAI and oneShot. But a summary is a call
       nobody asked for, so hosted it waits until this site's relay has
       answered one that was asked for (relayKnown): served with no Worker
       behind it (scripts/serve.js on a LAN, IPAD.md), the relay is a 404 that
       every sitting would otherwise send, and the browser log. */
    if(!cur().key && !(AI.provider==='gemini' && apexHosted() && relayKnown())) return;
    const answered=S.sessionTotal||0;
    const turns=Object.values(CHATS||{}).reduce((n,t)=>n+(t?t.length:0),0);
    if(answered<5 && turns<4) return;
    const weak=(typeof Profile!=='undefined'?Profile.weakChapters(3,3):[])
      .map(w=>`${w.ch} ${w.pct}%`).join(', ');
    const talk=Object.values(CHATS||{}).flat().slice(-14)
      .map(m=>`${m.role==='user'?'FELLOW':'YOU'}: ${String(m.content||'').slice(0,320)}`).join('\n');
    const known=Memory.all().slice(0,20).map(m=>'- '+m.text).join('\n');
    const out=await oneShot(
`You are keeping notes on a cardiology fellow you tutor, for your own use next time.
This study session: ${S.sessionCorrect||0}/${answered} correct${weak?`, weakest ${weak}`:''}.

${talk?`What was said:\n${talk}`:'There was no conversation this session.'}

${known?`You already know, and must NOT repeat:\n${known}`:''}

Write AT MOST three short lines worth remembering in a month — a persistent
confusion, a stated goal or deadline, a teaching preference they showed. One
sentence each, third person, no bullets, no preamble. Skip anything that is
just this session's score, anything you already know, and anything that will
not still matter in a month. If there is nothing worth keeping, reply with the
single word NOTHING.`, 220);
    if(!out || /^\s*NOTHING\s*$/i.test(out)) return;
    out.split('\n').map(l=>l.replace(/^[-•*\d.\s]+/,'').trim())
      .filter(l=>l.length>12 && !/^NOTHING$/i.test(l))
      /* A summary is always Apex's own reading of a sitting, never the
         fellow's words, so said stays false and the model is told so. */
      .slice(0,3).forEach(l=>Memory.add(l,'session',{src:'summary',said:false}));
  }catch(_){ /* a broken summariser must never break the results screen */ }
}

function toOpenAITools(tools){
  return tools.map(t=>({type:'function',
    function:{name:t.name,description:t.description,parameters:t.input_schema}}));
}
/* Gemini's function-declaration schema is the same OpenAPI-flavoured JSON
   Schema our TOOLS already speak (type/properties/items/required, all
   lowercase) — no translation needed beyond the field name. */
function toGeminiTools(tools){
  return tools.map(t=>({name:t.name,description:t.description,parameters:t.input_schema}));
}
/* The one block shape Vision.withFigures/withImages ever produces —
   {type:'text',text} and {type:'image',source:{media_type,data}} — becomes
   Gemini's inlineData part. A wire entry already shaped {role,parts} (a
   tool exchange pushToolExchange added this turn) rides through untouched. */
function geminiParts(content){
  if(content==null||typeof content==='string') return [{text:String(content||'')}];
  if(Array.isArray(content)) return content.map(b=>
    b.type==='image' ? {inlineData:{mimeType:b.source.media_type,data:b.source.data}}
                      : {text:b.text||''});
  return [{text:String(content)}];
}
function toGeminiContents(wire){
  return wire.map(m=>m.parts ? {role:m.role,parts:m.parts}
                              : {role:m.role==='assistant'?'model':'user',parts:geminiParts(m.content)});
}
async function oneTurnGemini(q,wire,extra){
  const model=cur().model;
  const contents=toGeminiContents(Vision.withImages(
    Vision.withFigures(wire, q, (typeof IMGS!=='undefined'?IMGS[q&&q.id]:null), AI.provider),
    refImagesForHits(lastHits), AI.provider));
  const r=await geminiFetch(gemUrl('stream',model,cur().key),{
    method:'POST', signal:aiAbort.signal,
    headers:gemHeaders(cur().key,true),
    body:JSON.stringify({
      systemInstruction:{parts:[{text:systemPrompt()+'\n\n'+aiCtx(q)+(extra||'')}]},
      tools:[{functionDeclarations:toGeminiTools(TOOLS)}],
      generationConfig:{maxOutputTokens:2000},
      contents})
  },attempt=>{
    const live=document.getElementById('aiLive');
    if(live) live.textContent='Gemini is busy. Retrying ('+attempt+'/2)…';
  });
  if(apexSessionLapsed(r)) throw new Error(APEX_LAPSED);
  if(!r.ok) throw new Error(await apiError(r,'gemini'));
  relayAnswered(r);
  const rd=r.body.getReader(), dec=new TextDecoder();
  const live=document.getElementById('aiLive'), body=document.getElementById('aiBody');
  /* Gemini streams whole parts, not token deltas inside a block envelope: a
     text part is the next chunk of prose, a functionCall part arrives
     complete in one piece (structured args are not assembled incrementally
     the way oneTurnGroq's callMap has to). raw keeps every part in the order
     it arrived, so a turn that starts talking and then calls a tool pushes
     back exactly what it did, not a reconstruction of it. */
  let buf='', text='', raw=[];
  const painter=makeStreamPainter(live,body,()=>text);
  try{
  while(true){
    const {done,value}=await rd.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    for(const ln of lines){
      if(!ln.startsWith('data:'))continue;
      const p=ln.slice(5).trim(); if(!p)continue;
      let j; try{ j=JSON.parse(p); }catch(_){ continue; }
      if(j.error) throw new Error(j.error.message||'stream error');
      const cand=j.candidates&&j.candidates[0]; if(!cand)continue;
      for(const part of (cand.content&&cand.content.parts)||[]){
        /* THE SIGNATURE TRAVELS WITH THE PART, AND HAS TO GO BACK WITH IT.
           Gemini 3 signs the parts of a turn that involved thinking, and
           validates on the next request that the signature came back exactly
           as issued. Dropping it does not degrade the answer, it fails the
           call: "Function call is missing a thought_signature in functionCall
           parts", HTTP 400, and the conversation dies at the point Apex tried
           to use a tool. Every part is therefore pushed with whatever
           signature arrived beside it. */
        if(part.text){
          if(!text) apexSetState('speaking');
          text+=part.text;
          raw.push(part.thoughtSignature?{text:part.text,thoughtSignature:part.thoughtSignature}
                                        :{text:part.text});
          apexPulse();
          painter.schedule();
        } else if(part.functionCall){
          apexSetState('tool');
          raw.push(part.thoughtSignature?{functionCall:part.functionCall,thoughtSignature:part.thoughtSignature}
                                        :{functionCall:part.functionCall});
        } else if(part.thoughtSignature&&raw.length){
          /* A signature can arrive in a chunk of its own, with neither text nor
             a call attached. It belongs to the part before it. */
          raw[raw.length-1].thoughtSignature=part.thoughtSignature;
        }
      }
    }
  }
  } finally { painter.flush(); }
  const calls=raw.filter(p=>p.functionCall).map(p=>({
    id:'call_'+Math.random().toString(36).slice(2),
    name:p.functionCall.name, input:p.functionCall.args||{}}));
  return {text, raw, calls};
}
/* Gemini says {error:{message}}. The other shapes — {message} or {detail} at
   the top level, either possibly an object rather than a string — are kept
   because an error body is the one response nobody controls, and reading a
   shape that never arrives costs nothing. Take the first that is there. */
function errMsg(j){
  if(!j||typeof j!=='object') return '';
  const m = (j.error&&j.error.message) ?? j.message ?? j.detail;
  if(typeof m==='string') return m;
  if(m==null) return '';
  try{ return JSON.stringify(m).slice(0,300); }catch(_){ return ''; }
}
/* A refusal from this site's own relay (hosted: no key typed) is not about a
   key the fellow can re-enter. It is the Worker's gate (Access not set up, or
   its token refused) or the site's key, and the Worker's message says which,
   in words for whoever deployed the site. Told apart by where the response
   came from, not by what is typed now: that is the request that failed. */
function viaRelay(r){
  try{ return new URL(r.url,location.href).pathname.indexOf(APEX_API+'/')===0; }catch(_){ return false; }
}
/* Whether this site's relay has ever answered: set by a hosted call that came
   back ok and was not Access's sign-in page. summariseSession reads it. */
const RELAY_OK_KEY='accsap12.relayok';
function relayAnswered(r){ if(r&&r.ok&&viaRelay(r)){ try{ localStorage.setItem(RELAY_OK_KEY,'1'); }catch(_){} } }
function relayKnown(){ try{ return localStorage.getItem(RELAY_OK_KEY)==='1'; }catch(_){ return false; } }
async function apiError(r,provider){
  let d=''; try{ d=errMsg(await r.json()); }catch(_){}
  const name='Gemini';
  if((r.status===401||r.status===403)&&viaRelay(r)) return `This site refused to pass the request to Gemini${d?': '+e(d):'.'}`;
  if(r.status===401) return 'Your API key was rejected. Tap the settings icon to re-enter it.';
  if(r.status===403&&provider==='gemini') return 'Your API key was rejected. Tap the settings icon to re-enter it.';
  if(r.status===400&&provider==='gemini'&&/api key not valid/i.test(d)) return 'Your API key was rejected. Tap the settings icon to re-enter it.';
  if(r.status===429&&provider==='gemini'&&/quota/i.test(d)) return "Gemini's quota limit was reached. Check your plan and quota in Google AI Studio, or choose another available model in Apex settings. The reset time depends on the limit.";
  if(r.status===429) return 'Rate limited — wait a few seconds and try again.';
  if(r.status===400&&/credit|balance/i.test(d)) return `Your ${name} account is out of credit.`;
  /* Pointing at the model menu is useless when every name in it is stale —
     which is the normal case once Google retires a generation. Pressing
     Connect is what rebuilds the menu from the live list. */
  if(r.status===404&&provider==='gemini') return 'Google does not offer that model to your key. Open settings and press <b>Connect</b> again — the app will ask Google for the current list and pick one that works.';
  if(r.status===404) return `That model is not available on ${name} right now — pick a different one in settings.`;
  if(r.status>=500) return `${name} is temporarily unavailable. Try again shortly, or choose another available model in Apex settings.`;
  return `API error ${r.status}. ${e(d)}`;
}

/* very small markdown → HTML (escaped first) */
/* The build's figures and your imported ones share the refimg:// namespace
   and differ only in where they are kept — so everything downstream of this
   line (rendering, vision, export) can stop caring which is which. */
function refImgSrc(key){
  const baked=(typeof REF_IMGS!=='undefined'&&REF_IMGS[key])||'';
  if(baked) return baked;
  return (typeof RefAssets!=='undefined'&&RefAssets.get(key))||'';
}
function md(t){
  let s=e(t);
  s=s.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre><code>${c}</code></pre>`);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  /* refimg:// figures resolve before any other inline rule touches them, so
     a caption's own `**bold**` or `*em*` is not double-processed once the
     caption is re-inserted whole into the <figcaption>. */
  s=s.replace(/!\[([^\]]*)\]\(refimg:\/\/([^)\s]+)\)/g,(m,cap,key)=>{
    const src=refImgSrc(key);
    if(!src) return '';
      /* The caption is the image's alt and is shown under it: the shown copy is hidden from a screen reader, which read it twice. */
  return `<figure class="ref-fig" onclick="openFigureFrom(this)" role="button" tabindex="0"
      title="Open this figure full size"><img src="${src}" alt="${cap}" loading="lazy"><figcaption aria-hidden="true">${cap}</figcaption></figure>`;
  });
  /* Headings before inline marks, so a ## line never becomes a paragraph. */
  s=s.replace(/^####\s+(.+)$/gm,'<h4>$1</h4>');
  s=s.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^##\s+(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  /* A mark opens on a word and closes on one. A * with a space after it is a bullet or a times sign, which this used to take for
     the start of an emphasis: "* a *very* point" lost its bullet and italicised the wrong words, and "5 * 3 * 2" was set in italics. */
  s=s.replace(/(^|[\s(])\*(?=[^\s*])([^*\n]*[^\s*])\*/g,'$1<em>$2</em>');
  /* GFM pipe tables. Runs after the inline marks so cells keep their bold,
     and before the list rules so a |---|---| divider is never read as a
     bullet. The wrapper scrolls sideways: a drug-dose table is wider than a
     phone, and the alternative is a squeezed column nobody can read. */
  s=s.replace(/(?:^\|.*\|[ \t]*\n)(?:^\|[ \t:|-]+\|[ \t]*\n)(?:^\|.*\|[ \t]*\n?)+/gm,block=>{
    const rows=block.trim().split('\n');
    const cut=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const head=cut(rows[0]), body=rows.slice(2).map(cut);
    // Empty Markdown header cells still need a name for screen-reader table
    // navigation. Keep the visual corner empty and label its column number.
    return `<div class="tw"><table><thead><tr>${head.map((c,i)=>`<th scope="col">${c||`<span class="sr-only">Column ${i+1}</span>`}</th>`).join('')}</tr></thead>`+
      `<tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  });
  /* One <blockquote> per run of quoted lines, rather than one per line. */
  s=s.replace(/^&gt;\s?(.*)$/gm,'\u0001$1\u0002');
  s=s.replace(/(?:\u0001[^\u0002]*\u0002\n?)+/g,run=>
    '<blockquote><p>'+(run.match(/\u0001([^\u0002]*)\u0002/g)||[])
      .map(x=>x.slice(1,-1)).join(' ').trim()+'</p></blockquote>');
  /* [ \t]* and not \s*: with the m flag \s matches newlines too, so a \s*-
     anchored rule eats the blank lines on either side of the divider — and
     those blank lines are exactly what the paragraph pass below splits on.
     The rule still fired; the <hr> just ended up inside the paragraph it was
     supposed to separate. */
  s=s.replace(/^[ \t]*(?:---+|___+)[ \t]*$/gm,'<hr>');
  /* The * is the bullet Gemini, the default model here, writes. */
  s=s.replace(/^\s*[-•*]\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/^\s*\d+\.\s+(.+)$/gm,'<li data-o>$1</li>');
  /* THE ORDER IS THE CONTENT. Both kinds used to become a bare <li> and every
     run was wrapped in <ul>, so "1. 2. 3." came out as three bullets with the
     numbers gone. Tag the kind, wrap a run, and split it where the kind
     changes — a list that mixes them is two lists, not one guess. */
  s=s.replace(/(?:<li(?: data-o)?>[\s\S]*?<\/li>\s*)+/g,run=>{
    const items=run.match(/<li(?: data-o)?>[\s\S]*?<\/li>/g)||[];
    let out='',cur=null,buf=[];
    const flush=()=>{ if(buf.length){ out+='<'+cur+'>'+buf.join('')+'</'+cur+'>'; buf=[]; } };
    for(const it of items){
      const kind=it.startsWith('<li data-o>')?'ol':'ul';
      if(kind!==cur){ flush(); cur=kind; }
      buf.push(it.replace('<li data-o>','<li>'));
    }
    flush();
    return out;
  });
  /* A single newline joins, as markdown says it should. Source files are
     hard-wrapped at ~78 characters; turning each of those into a <br> gave
     paragraphs a ragged false margin that tracked the .md file rather than
     the column it was being read in. A blank line still starts a paragraph. */
  const para=p=>/^<(ul|ol|h3|h4|pre|div|table|figure|blockquote|hr)/.test(p.trim())?p:`<p>${p.replace(/\n/g,' ')}</p>`;
  const BLOCK=/(<ul>[\s\S]*?<\/ul>|<ol>[\s\S]*?<\/ol>|<h[34]>[\s\S]*?<\/h[34]>|<pre>[\s\S]*?<\/pre>|<div class="tw">[\s\S]*?<\/div>|<figure[\s\S]*?<\/figure>|<blockquote>[\s\S]*?<\/blockquote>|<hr>)/;
  /* A block is never inside a paragraph. One written straight under a line of prose, or with a line of prose straight under it,
     is cut out of the paragraph it was in: a <ul> inside a <p> is not markup, and the browser closes the <p> in front of it and
     leaves what followed with no paragraph at all. */
  s=s.split(/\n{2,}/).map(p=>{
    const parts=p.split(BLOCK);
    return parts.length===1?para(p):parts.map((x,k)=>k%2?x:(x.trim()?para(x.trim()):'')).join('');
  }).join('');
  return s;
}

   inside the panel today, but a keyboard shortcut or a deep link would not

   obvious thing. */
function toggleApexFull(){
  const sh=document.getElementById('shell'); if(!sh) return;

/* Escape leaves full-page and stops there. It deliberately does NOT go on to
   close the panel on a second press: someone reading a long answer full
   screen who hits Escape twice out of habit should end up looking at the
   thread beside their question, not at a dismissed conversation. */
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Escape'||!apexIsFull()) return;
  if(figPs||document.querySelector('.peek-open')) return;

     to whatever is being typed into first. */
  const t=ev.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&t.id!=='aiIn') return;
  ev.preventDefault();
  toggleApexFull();
});

}

   drop. Why, at length, in scripts/schema-patch.js. */
const DATA_SCHEMA_VERSION=1;
const SCHEMA_KEYS=['schemaVersion','chStats','missed','theme','homeLayout',
  'sessionCorrect','sessionTotal','srs','reviewStreak','lastReviewDay','daily',
  'practice','sinceBackup','lastBackup','resume','focusMode','examDate','exams','flagged'];
let FOREIGN={};

/* A calendar day as the app writes one (FSRS.localDateToISO): a daily key,
   an srs due or last. One that does not read back as itself is a day the
   scheduler and Progress cannot place. */
const statDay=s=>{ if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d=FSRS.isoToLocalDate(s); return !!d&&FSRS.localDateToISO(d)===s; };

/* What one entry of each statistics map must hold. The import refuses a file
   with an entry that fails (progressFromBackup), and an export leaves such
   an entry out (usableStats), from this one table so the two cannot drift.
   The Progress screen and the scheduler read entries field by field (d.a in
   buildStats, S.srs[id].due in forecast7), so one null day passed the
   import, was saved, and crashed Progress on every later launch. A field is
   checked where the app reads it; one that is absent is left to the
   reader's own default, as it always was. Per map: the fields that must be
   counts, the counts that must be there, and a rule over the whole entry.

   A correct answer is only ever counted as one of the answers (logAnswer,
   selectOpt), so more correct than answered is a record the app never
   wrote: 9 of 2 drew a Results row at 450%, and a day's c over its a can
   put Progress's accuracy over 100%. Written as not-greater, not at-most:
   undefined<=n is false as well, which would refuse a missing count there
   and leave the need lists with nothing to prove. */
const STAT_ENTRY={
  daily:   [['a','c','r'],['a','c'],(v,day)=>!(v.c>v.a)&&statDay(day)],
  chStats: [['correct','total'],['correct','total'],v=>!(v.correct>v.total)],  // selectOpt does st.total++, st.correct++
  practice:[['n','c','t'],['n','c'],v=>!(v.c>v.n)],                          // and pr.n++, pr.c++: a missing count is NaN
  srs:     [['reps','lapses','ivl','stability','difficulty'],[],v=>(v.due==null||statDay(v.due))&&(v.last==null||statDay(v.last))],
  resume:  [['i','correct','total','ts'],[],v=>(v.ids==null||(Array.isArray(v.ids)&&v.ids.every(x=>typeof x==='string')))
    &&(v.i==null||(Number.isInteger(v.i)&&!(v.ids&&v.i>=v.ids.length)))&&(v.answers==null||statRecord(v.answers))]};
const statRecord=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function statEntryOk(k,v,key){
  const [fields,need,rule]=STAT_ENTRY[k], count=x=>x==null||(Number.isFinite(x)&&x>=0);
  return statRecord(v)&&fields.every(f=>count(v[f]))&&need.every(f=>v[f]!=null)&&rule(v,key);
}
function usableStats(raw){
  if(!statRecord(raw)) return raw;
  const out=Object.assign({},raw);
  for(const k in STAT_ENTRY) if(statRecord(out[k]))
    out[k]=Object.fromEntries(Object.entries(out[k]).filter(([key,v])=>statEntryOk(k,v,key)));
  if('exams' in out) out.exams=Array.isArray(out.exams)?out.exams.filter(MockExam.validEntry):[];
  if('flagged' in out) out.flagged=FlagSet.clean(out.flagged);
  return out;
}

function progressFromBackup(raw){
  for(const k in STAT_ENTRY) if(raw[k]!=null&&!statRecord(raw[k])) throw new Error('Invalid statistics.');
  /* Every entry too, before anything is stored: see STAT_ENTRY. */
  for(const k in STAT_ENTRY) for(const [key,v] of Object.entries(raw[k]||{})) if(!statEntryOk(k,v,key)) throw new Error('Invalid statistics.');
  for(const k of ['sessionCorrect','sessionTotal','reviewStreak','sinceBackup','lastBackup'])
    if(raw[k]!=null&&(!Number.isFinite(raw[k])||raw[k]<0)) throw new Error('Invalid statistics.');
  for(const k of ['theme','homeLayout','lastReviewDay','examDate']) if(raw[k]!=null&&typeof raw[k]!=='string') throw new Error('Invalid statistics.');
  if(raw.missed!=null&&(!Array.isArray(raw.missed)||raw.missed.some(x=>typeof x!=='string'))) throw new Error('Invalid missed list.');
  if(raw.exams!=null&&(!Array.isArray(raw.exams)||raw.exams.some(x=>!MockExam.validEntry(x)))) throw new Error('Invalid exam history.');
  if(!FlagSet.valid(raw.flagged)) throw new Error('Invalid flagged list.');
  return {resume:raw.resume||{},resumed:false,sessionCorrect:raw.sessionCorrect||0,sessionTotal:raw.sessionTotal||0,
    chStats:raw.chStats||{},missed:new Set(raw.missed||[]),srs:raw.srs||{},reviewStreak:raw.reviewStreak||0,
    lastReviewDay:raw.lastReviewDay||null,daily:raw.daily||{},practice:raw.practice||{},
    sinceBackup:raw.sinceBackup||0,lastBackup:raw.lastBackup||null,theme:raw.theme||'auto',homeLayout:raw.homeLayout||'signal',
    focusMode:!!raw.focusMode,examDate:validExamDate(raw.examDate)?raw.examDate:null,
    mocks:MockExam.cleanHistory(raw.exams),
    /* Absent says nothing: a backup made before flags must not empty the flags made since. A list, even an empty one, replaces them. */
    ...(raw.flagged!=null?{flagged:new Set(FlagSet.clean(raw.flagged))}:{})};
}

function save(){try{const text=JSON.stringify(Object.assign({},FOREIGN,{
  schemaVersion:DATA_SCHEMA_VERSION,
  chStats:S.chStats,missed:[...S.missed],theme:S.theme,homeLayout:S.homeLayout,
  sessionCorrect:S.sessionCorrect,sessionTotal:S.sessionTotal,
  srs:S.srs,reviewStreak:S.reviewStreak,lastReviewDay:S.lastReviewDay,daily:S.daily,
  practice:S.practice,sinceBackup:S.sinceBackup,lastBackup:S.lastBackup,
  resume:S.resume,focusMode:!!S.focusMode,examDate:S.examDate||null,exams:S.mocks,flagged:[...S.flagged]}));
  localStorage.setItem(KEY,text); SEEN[KEY]=text;}
  /* This holds the statistics and all 639 FSRS cards. It had a bare catch, so
     the one store whose loss you would most want to hear about was the only
     one that died without a word. */
  catch(_){ warnStorage(); }}
const NEWER_DATA_NOTE='This copy of Systole is older than the data saved on this device. Nothing has been lost — update this copy to see everything.';
function load(){try{
  const text=localStorage.getItem(KEY); SEEN[KEY]=text;
  const raw=JSON.parse(text)||{};
  /* No schemaVersion means a store written before this step — every store in
     the wild today, and its shape is exactly version 1. Left unstamped until
     the next save rather than backfilled. */
  FOREIGN={}; for(const k in raw) if(SCHEMA_KEYS.indexOf(k)===-1) FOREIGN[k]=raw[k];
  /* Deferred past the splash, which is still up at boot. */
  if(+raw.schemaVersion>DATA_SCHEMA_VERSION)
    setTimeout(()=>toast(NEWER_DATA_NOTE),4200);
  return raw;
}catch(_){return{};}}

const boot=load();
let S={screen:'home',chapter:null,questions:[],qIdx:0,selected:null,answered:false,answers:{},
  /* {key: {ids,i,answers,correct,total,ts}} — one record per practice deck.
     See resumeKey() for what a key is and why due/missed have none. */
  resume:boot.resume||{}, resumed:false,
  sessionCorrect:boot.sessionCorrect||0,sessionTotal:boot.sessionTotal||0,
  quizCorrect:0,quizTotal:0,
  chStats:boot.chStats||{},missed:new Set(boot.missed||[]),
  srs:boot.srs||{},reviewStreak:boot.reviewStreak||0,lastReviewDay:boot.lastReviewDay||null,
  daily:boot.daily||{},practice:boot.practice||{},
  sinceBackup:boot.sinceBackup||0,lastBackup:boot.lastBackup||null,
  mode:'all',zoomed:-1,theme:boot.theme||'auto',homeLayout:boot.homeLayout||'signal',
  focusMode:!!boot.focusMode,
  examDate:validExamDate(boot.examDate)?boot.examDate:null,
  /* What is kept of each finished mock block, newest last (src/core/mockexam.js). */
  mocks:MockExam.cleanHistory(boot.exams),
  /* Question ids flagged to come back to, oldest flag first (src/core/flagset.js). Reset leaves them: they are
     the fellow's own marks, as the ink and the sticky notes are, not a score. */
  flagged:new Set(FlagSet.clean(boot.flagged))};

/* ── one record, several windows ──
   The progress record and the reference notes are one record each per origin, and a window holds its own copy and writes the whole of it at
   every answer or edit. Two windows of this app on one origin (two tabs; two Safari windows in Split View) therefore decided between them by who
   wrote last: an answer given in one was lost when the other, which had loaded before it, answered next, and a window left open for days wiped
   the days between at its first answer. The browser says when another window has written (a storage event), and a window that was suspended
   and missed that is caught up the next time it is seen. The record is then taken as this window's own, by the path a restore takes
   (progressFromBackup, on the record as it was written: one a restore would refuse is not taken, not trimmed to what it would accept), and
   nothing else is touched: not the question on screen, the answer chosen, the deck being worked, or the notes being typed. Nothing here
   writes; a window that takes a record does not send it back.
   NOT COVERED: the ink, the sticky notes, the chats and the review log live in the database (src/core/store.js), which does not tell other
   windows, and are still decided by who wrote last. */
for(const k of [KEY,REF_KEY]) if(!(k in SEEN)) SEEN[k]=null;     // set at launch by the reads that built S and REF, from the text they parsed
let newerNoted=false;        // a record from a newer copy was taken and the window has said so
function adoptProgress(text){
  let raw; try{ raw=JSON.parse(text); }catch(_){ return false; }
  if(!statRecord(raw)) return false;
  let p; try{ p=progressFromBackup(raw); }catch(_){ return false; }               // what a restore would refuse is not taken
  if(+raw.schemaVersion>DATA_SCHEMA_VERSION&&!newerNoted){ newerNoted=true; toast(NEWER_DATA_NOTE); }   // as load() says it of a record read at launch
  delete p.resumed;                                                               // whether this window has resumed a deck is its own
  delete p.focusMode;                                                             // and so is its focus mode: the chrome of this window is not set by another
  const themeWas=S.theme;
  Object.assign(S,p);
  FOREIGN={}; for(const k in raw) if(SCHEMA_KEYS.indexOf(k)===-1) FOREIGN[k]=raw[k];
  if(S.theme!==themeWas){ applyTheme(); try{ notifyThemeRenderers(); }catch(_){} }
  return true;
}
function adoptRefs(text){
  let list; try{ list=JSON.parse(text); }catch(_){ return false; }
  if(!Array.isArray(list)||list.some(r=>!r||typeof r!=='object'||typeof r.body!=='string')) return false;
  REF=list; invalidateIndex();
  return true;
}
/* What was taken is drawn where it shows: the progress record on the screens that show it (the lists of questions carry its missed and flagged
   marks), the notes on the library and on the home screen (its pearl comes from them). A screen with a question on it is not drawn again, nor
   one with a field being typed in or a note being written, and it shows what was taken the next time it is. A window that is hidden draws when
   it is seen. */
const sharedStale={progress:false,refs:false};
function refDrafted(){ return ['refT','refG','refB'].some(id=>{ const el=document.getElementById(id); return !!el&&el.value.trim()!==''; }); }
function fieldFocused(){ const a=document.activeElement, app=document.getElementById('app'); return !!a&&!!app&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function drawShared(){
  const s=S.screen, p=sharedStale.progress, r=sharedStale.refs;
  sharedStale.progress=sharedStale.refs=false;
  if(p&&s==='quiz'){ const q=S.questions[S.qIdx]; if(q) paintFlag(S.flagged.has(q.id)); }   // the question stays as it is; its flag follows, painted in place
  if(fieldFocused()) return;
  if((p&&(s==='home'||s==='stats'||s==='study'||s==='search'||s==='annotations'))||(r&&(s==='home'||(s==='refs'&&!refEditing&&!refDrafted())))) render();
}
function showShared(what){
  sharedStale[what]=true;
  if(document.visibilityState!=='hidden') drawShared();
}
function takeShared(k,text){
  if(typeof text!=='string'||text===SEEN[k]) return;
  SEEN[k]=text;
  if(k===KEY){ if(adoptProgress(text)) showShared('progress'); }
  else if(k===REF_KEY){ if(adoptRefs(text)) showShared('refs'); }
}
function onProgressStorage(e){
  if(e.storageArea!==localStorage||(e.key!==KEY&&e.key!==REF_KEY)) return;
  /* A queued event can describe a record older than this window's own save or catch-up. Read what is there now. */
  let text; try{ text=localStorage.getItem(e.key); }catch(_){ return; }
  takeShared(e.key,text);
}
function catchUpShared(){
  for(const k of [KEY,REF_KEY]){ let text=null; try{ text=localStorage.getItem(k); }catch(_){ return; } takeShared(k,text); }
}
window.addEventListener('storage',onProgressStorage);
window.addEventListener('pageshow',catchUpShared);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  catchUpShared();
  if(sharedStale.progress||sharedStale.refs) drawShared();
});

/* ── theme ──
   A theme is a mode (which drives every existing component style) paired with
   a palette (which recolours the core tokens). 'auto' follows the system.
   The swatch is the two colours the eye reads first: the ground, and the
   accent laid over it. */
const THEMES=[
  {id:'auto',     name:'Auto',      group:'light', mode:'auto',  palette:null,        bg:'#EFF3F8',ac:'#0284C7',bar:'#0A1628'},
  {id:'daylight', name:'Daylight',  group:'light', mode:'light', palette:null,        bg:'#EFF3F8',ac:'#0284C7',bar:'#0F1E3D'},
  {id:'slate',    name:'Slate',     group:'light', mode:'light', palette:'slate',     bg:'#EDF0F6',ac:'#6366F1',bar:'#0F1E3D'},
  {id:'parchment',name:'Parchment', group:'light', mode:'light', palette:'parchment', bg:'#F3ECDD',ac:'#0E7C86',bar:'#0F1E3D'},
  {id:'midnight', name:'Midnight',  group:'dark',  mode:'dark',  palette:null,        bg:'#0A1628',ac:'#0EA5E9',bar:'#0A1628'},
  {id:'nocturne', name:'Nocturne',  group:'dark',  mode:'dark',  palette:'nocturne',  bg:'#0E0B1A',ac:'#A78BFA',bar:'#0E0B1A'},
  {id:'cathlab',  name:'Cath Lab',  group:'dark',  mode:'dark',  palette:'cathlab',   bg:'#120C07',ac:'#F59E0B',bar:'#120C07'},
  {id:'monitor',  name:'Monitor',   group:'dark',  mode:'dark',  palette:'monitor',   bg:'#08110D',ac:'#2DD4BF',bar:'#08110D'},
  {id:'contrast', name:'Contrast',  group:'dark',  mode:'dark',  palette:'contrast',  bg:'#060606',ac:'#38BDF8',bar:'#060606'},
];
const THEME_BY_ID=Object.fromEntries(THEMES.map(t=>[t.id,t]));
/* Old saved values (auto/light/dark) are still valid ids, except the bare
   'dark' which is now 'midnight' and 'light' which is now 'daylight'. */
function themeDef(){ return THEME_BY_ID[S.theme]||THEME_BY_ID[{dark:'midnight',light:'daylight'}[S.theme]]||THEME_BY_ID.auto; }
function themeIsDark(t){
  t=t||themeDef();
  if(t.mode==='dark')return true;
  if(t.mode==='light')return false;
  return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme(){
  const h=document.documentElement, t=themeDef();
  if(t.mode==='auto')h.removeAttribute('data-theme'); else h.setAttribute('data-theme',t.mode);
  if(t.palette)h.setAttribute('data-palette',t.palette); else h.removeAttribute('data-palette');
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content', themeIsDark(t)? t.bar : '#0F1E3D');
}
/* ── focus mode ──
   The attribute goes on only while the preference is on AND the quiz is the
   screen, so walking away from the quiz restores the chrome without anything
   having to remember to. Called from renderNow()'s mount list, so every
   screen change re-decides it. */
function applyFocus(){
  const h=document.documentElement;
  if(S.focusMode && S.screen==='quiz') h.setAttribute('data-focus','1');
  else h.removeAttribute('data-focus');
}
function toggleFocusMode(){
  S.focusMode=!S.focusMode; save(); render();
}
function notifyThemeRenderers(){
  const d=themeIsDark();
  if(typeof heroHeart3d!=='undefined'&&heroHeart3d) heroHeart3d.setDark(d);
  if(typeof twelve!=='undefined'&&twelve) twelve.setDark(d);
  if(typeof physio!=='undefined'&&physio) physio.setDark(d);
}
/* True only while the chosen theme has no opinion of its own. Every other
   theme is a decision, and a decision is not revisited because the sun set. */
function themeFollowsSystem(){
  const t=themeDef();
  return !t || t.mode==='auto';
}
/* Everything setTheme does except the two things that would be wrong here:
   it does not save (nothing was chosen) and it does not close the menu
   (nothing was opened). */
function themeSystemChanged(){
  if(!themeFollowsSystem()) return;
  applyTheme();
  try{ render(); }catch(_){}
  notifyThemeRenderers();
}
function watchSystemTheme(){
  if(!window.matchMedia) return null;
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(!mq) return null;
  /* addEventListener on a MediaQueryList landed in Safari 14; addListener is
     the deprecated spelling that works before it. Trying both costs a line. */
  if(mq.addEventListener) mq.addEventListener('change',themeSystemChanged);
  else if(mq.addListener) mq.addListener(themeSystemChanged);
  return mq;
}
function setTheme(id){
  S.theme=id; applyTheme(); save();
  closeThemeMenu(); render(); notifyThemeRenderers();
}
/* Kept so anything still calling it (or a keyboard shortcut) advances sensibly
   through the presets rather than throwing. */
function cycleTheme(){
  const i=THEMES.findIndex(t=>t.id===themeDef().id);
  setTheme(THEMES[(i+1)%THEMES.length].id);
}
/* ── reading size ──
   How large the question, its options, the explanation and Apex's thread are drawn (app/css/ipad.css). Kept on the device and
   not in the saved record or a backup: the iPad and the phone that share one want different sizes. Standard is no attribute
   at all, so the default page is the page it was. */
const READ_KEY='accsap12.readsize';
const READ_SIZES=['Standard','Large','Larger','Largest'];
function readSize(){
  try{ const v=Number(localStorage.getItem(READ_KEY)); return Number.isInteger(v)&&v>=0&&v<READ_SIZES.length?v:0; }
  catch(_){ return 0; }
}
function applyReadSize(){
  const n=readSize(), h=document.documentElement;
  if(n) h.setAttribute('data-read',String(n)); else h.removeAttribute('data-read');
}
function setReadSize(n){
  if(!(Number.isInteger(n)&&n>=0&&n<READ_SIZES.length)) return;
  try{ if(n) localStorage.setItem(READ_KEY,String(n)); else localStorage.removeItem(READ_KEY); }catch(_){}
  applyReadSize();
  /* What is shown is what was kept: storage that refused the write leaves the size, and the menu, as they were. */
  const kept=readSize();
  /* Painted in place: a render would close the menu the fellow is choosing in, and the question would move under them. */
  document.querySelectorAll('.read-opt').forEach(b=>{ const on=+b.dataset.read===kept; b.classList.toggle('on',on); b.setAttribute('aria-checked',on?'true':'false'); });
  const live=document.getElementById('srLive');
  if(live){ live.textContent=''; live.textContent='Text size: '+READ_SIZES[kept]+'.'; }
}
/* ── reading width ──
   How wide the reading column is on a tablet, the way a reader app offers margins: Narrow keeps a book's measure, Wide
   (the default) uses an iPad's landscape screen, Full runs edge to edge. It moves --measure (app/css/base.css), which the
   navbar and every reading screen are drawn to; Home is a full-width layout of its own and is not affected. Kept on the
   device like the text size. Phones are narrower than every step and are unaffected. */
const WIDTH_KEY='systole.readwidth';
const READ_WIDTHS=['Narrow','Medium','Wide','Full'];
const WIDTH_DEFAULT=2;
function readWidth(){
  try{ const r=localStorage.getItem(WIDTH_KEY); if(r===null||r.trim()==='') return WIDTH_DEFAULT;
    const v=Number(r); return Number.isInteger(v)&&v>=0&&v<READ_WIDTHS.length?v:WIDTH_DEFAULT; }
  catch(_){ return WIDTH_DEFAULT; }
}
function applyReadWidth(){ document.documentElement.setAttribute('data-width',String(readWidth())); }
function setReadWidth(n){
  if(!(Number.isInteger(n)&&n>=0&&n<READ_WIDTHS.length)) return;
  try{ if(n===WIDTH_DEFAULT) localStorage.removeItem(WIDTH_KEY); else localStorage.setItem(WIDTH_KEY,String(n)); }catch(_){}
  applyReadWidth();
  const kept=readWidth();
  document.querySelectorAll('.width-opt').forEach(b=>{ const on=+b.dataset.width===kept; b.classList.toggle('on',on); b.setAttribute('aria-checked',on?'true':'false'); });
  const live=document.getElementById('srLive');
  if(live){ live.textContent=''; live.textContent='Reading width: '+READ_WIDTHS[kept]+'.'; }
}
function readWidthHtml(){
  const cur=readWidth();
  return `<div class="theme-menu-h" id="readWidthH">Reading width</div>
    <div class="read-row" role="group" aria-labelledby="readWidthH">${READ_WIDTHS.map((label,i)=>
      `<button class="width-opt${i===cur?' on':''}" type="button" role="menuitemradio" aria-checked="${i===cur}" data-width="${i}"
        aria-label="${label}" title="${label}" onclick="setReadWidth(${i})"><span class="width-glyph" style="width:${[8,12,16,20][i]}px"></span></button>`).join('')}</div>`;
}
function readSizeHtml(){
  const cur=readSize();
  return `<div class="theme-menu-h" id="readSizeH">Text size</div>
    <div class="read-row" role="group" aria-labelledby="readSizeH">${READ_SIZES.map((label,i)=>
      `<button class="read-opt${i===cur?' on':''}" type="button" role="menuitemradio" aria-checked="${i===cur}" data-read="${i}"
        aria-label="${label}" title="${label}" onclick="setReadSize(${i})"><span style="font-size:${[13,16,19,23][i]}px">A</span></button>`).join('')}</div>`;
}
/* Brightness and contrast, per device (round seven). A filter on the root element: the one element whose filter does not
   become the containing block for fixed-position descendants, so the bars, the rail and Apex stay where they are. At
   100% each the filter is removed, not set to 1, so the default page is drawn exactly as before. */
const TUNE_KEY='systole.tune';
const TUNE={b:{min:70,max:130,label:'Brightness'},c:{min:80,max:140,label:'Contrast'}};
function readTune(){
  const out={b:100,c:100};
  try{ const t=JSON.parse(localStorage.getItem(TUNE_KEY)||'{}');
    for(const k of ['b','c']){ const v=Number(t&&t[k]); if(Number.isFinite(v)&&v>=TUNE[k].min&&v<=TUNE[k].max) out[k]=Math.round(v); } }catch(_){}
  return out;
}
function applyTune(){
  const t=readTune(), r=document.documentElement;
  if(t.b===100&&t.c===100) r.style.removeProperty('filter');
  else r.style.filter='brightness('+t.b/100+') contrast('+t.c/100+')';
}
function setTune(k,v){
  const t=readTune(); v=Math.round(Number(v));
  if(!TUNE[k]||!Number.isFinite(v)) return;
  t[k]=Math.min(TUNE[k].max,Math.max(TUNE[k].min,v));
  try{ if(t.b===100&&t.c===100) localStorage.removeItem(TUNE_KEY); else localStorage.setItem(TUNE_KEY,JSON.stringify(t)); }catch(_){}
  applyTune(); paintTune();
}
function resetTune(){ try{ localStorage.removeItem(TUNE_KEY); }catch(_){} applyTune(); paintTune();
  const live=document.getElementById('srLive'); if(live){ live.textContent=''; live.textContent='Brightness and contrast reset.'; } }
function paintTune(){
  const t=readTune();
  for(const k of ['b','c']){
    const i=document.getElementById('tune-'+k), o=document.getElementById('tune-'+k+'-v');
    if(i){ i.value=t[k]; i.setAttribute('aria-valuetext',t[k]+'%'); }
    if(o) o.textContent=t[k]+'%';
  }
  const r=document.getElementById('tuneReset'); if(r) r.disabled=t.b===100&&t.c===100;
}
function tuneHtml(){

   longer describes a deck this build can deal:

     · the bank moved under it — a reseed can retire an id, so ids are resolved
       through the pool that actually exists and a record that loses any of
       them is dropped rather than silently dealt short;
     · it was finished — a record sitting on the last question with that
       question answered is a completed deck nobody cleared, and resuming onto
       it would show one question and end;
     · it is not this deck — the saved ids are checked against the pool the
       caller computed, so a chapter's record can never be dealt into "all". */

  const have={}; qs.forEach(q=>{ have[q.id]=q; });

     only read it, go back, open the chapter again, and it was a freshly shuffled deck). This declined every record at
     index 0 as "nothing done", and the deck dealt on entry was never written until the first answer or Next, so
     leaving from the first question always lost it. The record is written as the deck is dealt (startQuiz), and index
     0 is a place like any other. */

/* ═══════════ Mock exam — the rules are src/core/mockexam.js; this is the screen ═══════════

/* What the Study card is set to start. Not saved: a block is chosen each time, from the last choice this visit. */

  const given={}; res.items.forEach(it=>{ if(it.sel!=null) given[it.id]=it.sel; });

  Object.assign(S,{screen:'quiz',chapter:null,questions:deck,qIdx:0,mode:'mockreview',zoomed:-1,
    quizCorrect:0,quizTotal:0,answers,resumed:false});
  restoreQuizState(); render(); toTop(); clearAnnounce(); markShown();
}

/* ── the screens ── */
function buildMock(){
  const r=S.mock, q=mockQ();

      <span class="mock-pause-ic">${icon('pause')}</span><h2>Paused</h2>
      <p>The clock is stopped and the question is hidden. Nothing is scored until you hand the block in.</p>

      <button class="btn btn-next" type="button" onclick="mockUnpause()">${icon('play','icon-sm')} Resume</button></div></div>`;

        <span class="q-counter">Question ${r.i+1} of ${n}</span>

function buildMockEnd(){

function buildMockReport(){
  const r=S.mockLast;
  if(!r) return `<div class="mock-wrap"><div class="mock-gone"><p>No block has been handed in yet.</p>

  const g=MockExam.grade(r,mockLookup), p=g.pct;

  const msg=p>=80?'Outstanding!':p>=60?'Good Progress!':'Keep Studying!', msgIcon=p>=80?'trophy':p>=60?'target':'book';
  const rad=50, circ=2*Math.PI*rad;
  const ring=`<svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Score ${p} percent">

      transform="rotate(-90 64 64)" style="transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)"/></svg>`;
  const rows=g.byCh.slice().sort((a,b)=>(a.correct/a.n)-(b.correct/b.n)||a.ch.localeCompare(b.ch)).map(c=>{
    const cp=Math.round(c.correct/c.n*100), cc=cp>=70?'var(--green)':cp>=50?'var(--amber)':'var(--red)', bc=CH_COLORS[c.ch]||'var(--teal)';
    return `<div class="chp-row mock-chrow" data-ch="${e(c.ch)}" style="--accent:${bc}"><span class="chp-icon">${chIcon(c.ch)}</span>

      <div class="chp-score"><div class="chp-pct" style="color:${semText(cc)}">${cp}%</div><div class="chp-count">${c.correct}/${c.n}</div></div></div>`;

  const kept=g.items.filter(it=>it.flagged&&S.flagged.has(it.id)).length;

  const missed=MockExam.reviewIds(g,'missed').length;
  return `<div class="results-wrap mock-report anim-fade">
    <div class="score-hero">
      <div class="score-circle">${ring}<div class="score-num"><span class="score-pct" style="color:${semText(col)}">${p}%</span><span class="score-label">Mock block</span></div></div>
      <div class="score-msg">${icon(msgIcon,'icon-lg')} ${msg}</div>

/* The Progress screen's record of the blocks handed in: the last eight, oldest to newest, each a bar as high as its score. */
function mockPanel(){
  const h=S.mocks.slice(-8);
  if(!h.length) return '';
  const pc=x=>Math.round(100*x.correct/x.n);
  const bars=h.map(x=>{
    const p=pc(x), cls=p>=80?'g':p>=60?'a':'r';
    const d=new Date(x.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const t=x.limit!=null?MockExam.fmtClock(x.ms)+' of '+MockExam.fmtClock(x.limit,'down'):MockExam.fmtClock(x.ms);
    return `<div class="mk-bar ${cls}" role="listitem" data-pct="${p}" title="${e(d)}: ${x.correct} of ${x.n}, ${p}%, ${e(t)}"><b>${p}%</b>
      <span class="mk-col"><i style="height:${Math.max(4,p)}%"></i></span><span class="mk-d">${e(d)}</span><em>${x.n} q</em></div>`;
  }).join('');
  const last=S.mocks[S.mocks.length-1], per=Math.round(last.ms/last.n/1000);
  return `<div class="panel" id="mockPanel"><div class="panel-h">Mock exam blocks · ${S.mocks.length}</div>
    <div class="mk-hist" role="list">${bars}</div>
    <div class="ref-hint">Last: ${pc(last)}%, ${last.correct} of ${last.n} in ${e(MockExam.fmtClock(last.ms))}, about ${per} s a question. A question left blank counts as wrong, as it does in the real exam.</div></div>`;
}

function toggleZoom(i){
  S.zoomed = (S.zoomed===i) ? -1 : i;
  document.querySelectorAll('.fig-card').forEach((fc,j)=>{
    const on = S.zoomed===j, im=fc.querySelector('.fig-img');
    fc.classList.toggle('zoomed',on);
    if(im){
      im.style.transition='transform .3s cubic-bezier(.16,1,.3,1)';
      im.style.transform = on?'scale(1.8) translateY(10%)':'scale(1)';

    }

/* ── figures ── */
function figLabel(q,i,n){
  if(q.imgopt && n===q.o.length) return q.o[i].t;          // "ECG A", "PV loop B" …
  return n>1 ? 'Figure '+(i+1) : 'Figure';
}
function buildFigures(q){
  const src=IMGS[q.id];
  if(!q.img||!src||!src.length) return '';
  const n=src.length;
  return src.map((u,i)=>{
    const on=S.zoomed===i;
    /* The full-screen button sits beside the card, not in it: the card is itself a button, and a control
       inside a control is one a screen reader cannot reach (axe: nested-interactive). */
    return `<div class="fig-slot"><div class="fig-card${on?' zoomed':''}" data-fig="${i}" role="button" tabindex="0"
        aria-label="${e(figLabel(q,i,n))} — tap to ${on?'shrink':'enlarge'}">
      <img class="fig-img" src="${u}" alt="${e(figLabel(q,i,n))} for question ${S.screen==='mock'&&S.mock?S.mock.i+1:q.n}"
        decoding="async" loading="eager"
        style="transform:${on?'scale(1.8) translateY(10%)':'scale(1)'};transform-origin:center top">
      <div class="fig-label"><span>\uD83D\uDCCA ${e(figLabel(q,i,n))}</span>
        <span class="fig-zoom-hint">${on?'Tap to shrink':'Tap to enlarge'}</span></div>
    </div>
      <button class="fig-full" type="button" aria-label="Open ${e(figLabel(q,i,n))} full screen"
        onclick="openQuestionFigures('${e(q.id)}',${i},event)">${icon('expand','icon-sm')}</button>
    </div>`;

/* ── render ── */
let figCache={id:null,node:null};
let lastScreen=null;
/* Only wrap actual screen-to-screen navigation in a view transition — not
   in-screen updates (answering, typing a search, toggling theme), which
   already have their own targeted CSS animations and would look wrong
   cross-fading the whole page on every keystroke. */
function showCrashScreen(err){
  try{ console.error('Systole: a screen failed to render —', err); }catch(_){}
  try{
    const app=document.getElementById('app');
    if(!app) return;
    const msg=err&&err.message?err.message:String(err);
    const stack=err&&err.stack?err.stack:'';
    app.innerHTML=
      '<div style="max-width:26rem;margin:18vh auto 0;padding:0 1.5rem;text-align:center;'+
      'font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;">'+
      '<div style="font-size:2.25rem;margin-bottom:.6rem;">\u26A0\uFE0F</div>'+
      '<h2 style="margin:0 0 .4rem;font-size:1.1rem;">Something went wrong</h2>'+
      '<p style="opacity:.7;margin:0 0 1.1rem;font-size:.9rem;line-height:1.4;">'+
      'This screen could not draw itself. Nothing already answered or saved is lost — '+
      'reloading should bring it back.</p>'+
      '<button onclick="location.reload()" style="padding:.55rem 1.3rem;border:none;'+
      'border-radius:.6rem;background:#3b82f6;color:#fff;font-size:.9rem;font-weight:600;'+
      'cursor:pointer;">Reload</button>'+
      '<details style="margin-top:1.1rem;text-align:left;opacity:.55;font-size:.72rem;">'+
      '<summary style="cursor:pointer;">Details</summary>'+
      '<pre style="white-space:pre-wrap;word-break:break-word;margin:.5rem 0 0;">'+e(msg)+'\n'+e(stack)+'</pre>'+
      '</details></div>';
  }catch(_){
    try{ document.body.innerHTML='<p style="padding:2rem;font-family:sans-serif;">Something went wrong. <a href="javascript:location.reload()">Reload</a></p>'; }catch(__){}
  }
}
function render(){
  const changingScreen = lastScreen!==null && lastScreen!==S.screen;
  lastScreen = S.screen;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{
    if(changingScreen && document.startViewTransition && !reduced){
      const vt=document.startViewTransition(()=>renderNow());
      vt.updateCallbackDone.catch(showCrashScreen);
      /* A TRANSITION SKIPPED BY THE NEXT ONE IS NAVIGATION, NOT A FAILURE.
         startViewTransition hands back three promises. Only updateCallbackDone
         can carry a render throw, which is why it alone reaches the crash
         screen — curate-patch.js records why that must not be loosened. But
         ready and finished reject with AbortError whenever a newer transition
         starts before the current one settles, and a fellow tapping through
         screens faster than the animation does exactly that. Unhandled, those
         become unhandled promise rejections: harmless to the app, and enough
         to fail every "no console or page errors" check in the suite — which
         is how this was found, on a newer Chromium than it was written on.
         Swallowed, not reported: there is nothing here to tell anybody. */
      if(vt.ready) vt.ready.catch(()=>{});
      if(vt.finished) vt.finished.catch(()=>{});
    } else {
      renderNow();
    }
  }catch(err){
    showCrashScreen(err);
  }
}
/* The question whose figures this render draws: the quiz's, or the mock block's. */
function renderQ(){
  return (S.screen==='quiz'&&S.questions.length)?S.questions[S.qIdx]:S.screen==='mock'?mockQ():null;
}
/* A screen redrawn in place (a query typed into it, a note saved, the theme changed) is the screen the fellow was looking at, and its
   new elements would each run their entrance from the start: the search results rose in again at every pause in typing, the box
   they were typing in with them, and the doors and cards of home and Study when the theme changed. An animation that is running
   is put at its end, which is where the one that was there had got to; one that goes on for ever is left alone. WebKit answers
   the end of an entrance with a transition of the transform, from the value it rests at to the same one, which moves nothing
   and is an animation all the same: so they are asked for again until a pass finds none to finish. Each pass reads them all
   before it finishes any: finishing one and asking the next for its timing made the page work its styles out again between. */
function settleEntrances(root){
  try{
    if(!document.getAnimations) return;
    for(let pass=0;pass<4;pass++){
      const ending=document.getAnimations().filter(a=>{
        const fx=a.effect, t=fx&&fx.target;
        return a.playState==='running'&&t&&root.contains(t)&&fx.getComputedTiming().iterations!==Infinity;
      });
      if(!ending.length) break;
      for(const a of ending){ try{ a.finish(); }catch(_){} }
    }
  }catch(_){}   // a screen that has been drawn is drawn: an engine that cannot list its animations does not take the draw down with it
}
/* Where the fellow is: the screen, and on a quiz or a mock block the question. */
let lastView='';
function renderNow(){
  const app=document.getElementById('app');
  const q=renderQ();
  const reuse=q&&figCache.id===q.id&&figCache.node&&S.zoomed===-1;
  /* A redraw that changes none of it (an answer chosen, a rating given) is the same view redrawn, and wears .again: the CSS
     does not let what was already on the screen make its entrance a second time. The question dropped to nothing and came
     back, and the options slid in again, on every answer. */
  const view=S.screen+(q?':'+q.id:'');
  const again=view===lastView; lastView=view;
  /* The bar is painted into its own fixed header rather than into the screen:
     inside #app it could never be wider than the reading column. */

/* Reveal below-fold surfaces once, using the browser's actual scroll root.
   No scroll handler or perpetual animation loop is needed. Every render
   releases observations of the previous screen. */
let surfaceRevealObserver=null;
function mountScrollReveal(){
  if(surfaceRevealObserver){surfaceRevealObserver.disconnect();surfaceRevealObserver=null;}
  if(!window.IntersectionObserver||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const app=document.getElementById('app');
  const scrolls=/auto|scroll/.test(getComputedStyle(app).overflowY);
  const root=scrolls?app:null;
  const bottom=root?root.getBoundingClientRect().bottom:window.innerHeight;
  const cards=Array.from(app.querySelectorAll('.ch-tile,.feed-card,.ref-card,.door'))
    .filter(el=>el.getBoundingClientRect().top>=bottom);
  if(!cards.length)return;
  surfaceRevealObserver=new IntersectionObserver(entries=>{
    for(const entry of entries)if(entry.isIntersecting){
      entry.target.classList.add('is-visible');surfaceRevealObserver?.unobserve(entry.target);
    }
  },{root,threshold:0.08});
  for(const card of cards){
    card.classList.add('scroll-reveal');surfaceRevealObserver.observe(card);
    card.addEventListener('focusin',()=>card.classList.add('is-visible'),{once:true});
  }
}

/* THE APP'S OWN PHYSIOLOGY, DRAWN SMALL. Physio.lvPressure(t) and
   Physio.lvVolume(t) over one normalised cycle are the pressure–volume loop —
   the same pair of functions the cardiac-cycle screen plots, so the loop in
   this corner is the loop on that screen and cannot drift from it.

   Four limbs, counterclockwise: isovolumic contraction up the left at constant
   volume, ejection across the top as volume falls, isovolumic relaxation down
   the right, filling along the bottom. Phase advances linearly, so the head
   races the isovolumic limbs and slows through filling the way the ventricle
   does — the timing is the model's, not an easing curve. */
/* The raf handle for whatever the card is animating. Named for the trace now
   that the pressure-volume loop it used to hold has gone. */
let pearlTrace=null;
/* ═══════════ the pearl's current ═══════════
   An ECG trace across the whole card with a bright head travelling along it
   and a fading tail behind — what current looks like on a monitor.

   The waveform is rhythmMV(), the generator the hero strip and the rhythm lab
   already share, so this is a real sinus rhythm at a real rate rather than a
   decorative wave. The travelling head is the mechanic from the pressure-volume
   loop this replaces, which was the part worth keeping.

   IT IS BACKGROUND. Everything here is tuned to stay under the words: the
   resting trace is faint, the head is small, and the whole canvas is capped in
   opacity by CSS as well. prefers-reduced-motion gets the trace with no head
   moving along it, because a still line is still worth looking at. */
function mountPearlCurrent(){
  if(pearlTrace){ cancelAnimationFrame(pearlTrace.raf); pearlTrace=null; }
  const cv=document.getElementById('pearlCurrent'); if(!cv) return;
  if(typeof rhythmMV!=='function') return;
  const ctx=cv.getContext('2d'); if(!ctx) return;

  const still=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  const SPAN=4200;            // ms of rhythm across the card's width
  const state={raf:0, pause(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf=0; },
    resume(){ if(!this.raf) this.raf=requestAnimationFrame(paint); }};
  let t0=0, geometry=null;

  function paint(now){
    state.raf=0;
    if(!cv.isConnected||S.screen!=='home'||homePage!==0||document.visibilityState==='hidden') return;
    const r=cv.getBoundingClientRect();
    if(!r.width||!r.height){ state.raf=requestAnimationFrame(paint); return; }
    const dpr=Math.min(window.devicePixelRatio||1,3);
    const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);

    /* Sampled per device pixel column, so the QRS stays a spike rather than
       being aliased into a bump on a wide card. */
    const N=Math.max(120,Math.min(1400,Math.round(r.width)));
    /* LOW IN THE CARD, AND SMALL. The trace is the card's pulse along its foot,
       not a wash across the prose — measured, a full-height trace at a readable
       brightness dropped the text contrast to 2.1:1 on the darker palettes. */
    const baseline=r.height*0.87;
    const amp=Math.min(r.height*0.13,34);
    if(!geometry||geometry.w!==r.width||geometry.h!==r.height){
      const st={}, points=new Array(N+1);
      for(let i=0;i<=N;i++){
        const x=i/N*r.width;
        points[i]=[x, baseline-rhythmMV('sinus', i/N*SPAN, st)*amp];
      }
      geometry={w:r.width,h:r.height,points};
    }
    const pts=geometry.points;

    const css=getComputedStyle(document.documentElement);
    const accent=(css.getPropertyValue('--teal')||'#0284C7').trim();
    /* A DARK THEME NEEDS A SMALLER BUDGET, and it is not obvious which way
       round. On a light card the text is near-black and a bright accent stroke
       stays far from it; on a dark card the text is near-white and the same
       bright accent moves TOWARD the text, so contrast collapses. Measured on
       the three darkest palettes it fell to 3.5:1 at the alphas that read
       correctly on Daylight. One factor, applied to every alpha below. */
    const K=(typeof themeIsDark==='function' && themeIsDark()) ? 0.5 : 1;
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=accent; ctx.fillStyle=accent;

    /* Every alpha here is budgeted against a contrast measurement, not chosen
       by eye: verify-pearl composites the brightest pixel this canvas paints
       over the card and fails the build under 4.5:1 in any of the eight
       themes. Raising any of them means re-running that check. */
    ctx.globalAlpha=.16*K; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<=N;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke();

    if(still){ ctx.globalAlpha=1; return; }

    if(!t0) t0=now;
    const u=((now-t0)%5200)/5200;
    const head=Math.max(1,Math.floor(u*N));
    const trail=Math.max(10,Math.round(N*0.13));
    /* ONE PATH FOR THE TAIL, NOT ONE STROKE PER SEGMENT. Stroked a segment
       at a time, the round caps overlapped and every overlap compounded: on
       the QRS, where the tail folds back on itself, three or four segments
       landed on one pixel and the brightest ink depended on where the head
       happened to be. Measured over one cycle that moved the canvas's peak
       alpha from .69 to .84 frame by frame, and Parchment's text contrast
       with it, to 4.48:1 in a full run. A single stroke paints each pixel
       once, so the fade comes from a gradient along x instead — the tail
       runs left to right, so x is the same ordering the index was. */
    const from=head-trail, s0=Math.max(0,from);
    const ac=(function(){ ctx.fillStyle=accent; const c=String(ctx.fillStyle);
      const h=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);
      if(h) return [parseInt(h[1],16),parseInt(h[2],16),parseInt(h[3],16)];
      const m=c.match(/[d.]+/g); return m&&m.length>=3 ? [+m[0],+m[1],+m[2]] : [2,132,199]; })();
    const fade=ctx.createLinearGradient(from/N*r.width,0,pts[head][0],0);
    fade.addColorStop(0,'rgba('+ac.join(',')+',0)');
    fade.addColorStop(1,'rgba('+ac.join(',')+','+(0.30*K)+')');
    ctx.globalAlpha=1; ctx.lineWidth=2.1; ctx.strokeStyle=fade;
    ctx.beginPath(); ctx.moveTo(pts[s0][0],pts[s0][1]);
    for(let i=s0+1;i<=head;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke();
    ctx.strokeStyle=accent; ctx.fillStyle=accent;
    const hp=pts[head];
    ctx.globalAlpha=.42*K;
    ctx.beginPath(); ctx.arc(hp[0],hp[1],2.2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=.09*K;
    ctx.beginPath(); ctx.arc(hp[0],hp[1],6.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    state.raf=requestAnimationFrame(paint);
  }
  state.raf=requestAnimationFrame(paint);
  pearlTrace=state;
}
/* In a landscape grid the steps can run past the card and scroll inside it, and a line cut at the edge read as the end
   of the pearl. While there is more below, the card says so: the column's foot fades, and a button under it opens the
   whole pearl (the card grows and the page scrolls) or folds it back.

   MEASURED AGAIN WHENEVER THE ANSWER CAN CHANGE, not once. It was measured once, as the screen was drawn, while the
   steps were still rising into place: a moving transform counts towards the column's scroll height, so for the length
   of the entrance every pearl ran past its card. On an iPad in portrait, where nothing does once the steps land, that
   one reading stood: the last step sat faded under a "More" that had nothing to open and did nothing when tapped. So it
   is measured when each step's entrance ends, and when the column or the card changes size. */
let pearlRO=null, pearlFitRaf=0;
function pearlFit(){
  const wrap=document.getElementById('pearlBody'), card=document.getElementById('pearlCard');
  if(!wrap||!card) return;

     the canvas stops where the prose column does (--pc-foot, the band's height; 0 side by side). */
  const main=card.querySelector('.pearl-main');
  if(main) card.style.setProperty('--pc-foot',Math.max(0,card.clientHeight-main.offsetTop-main.offsetHeight)+'px');

     once the pearl keeps its four readable lines there is no longer room for
     a picture AND its caption: the band came up 13px short, cut through the
     caption's last line — the half that says what the picture shows, while
     Read note still carries all of it. So: if the figure would be cut, it is
     not drawn. No height to tune, which is the point; an earlier pass here
     used 560px and hid the figure on a 540px card where it fitted perfectly
     well. Measured while the figure is SHOWN, so the class cannot feed back
     into the measurement that sets it, and only where contain:size fixes the
     card's height from the grid row — under 700px the card is sized by its
     own content and this would be a ResizeObserver loop. */

     offering a sliver. */
  /* The scale is chosen with the Show all button out of the way: left up from the last measure, it took the room the
     steps were being fitted to, and a pearl that fitted was scaled as if it did not, then drawn past its card. */
  const btn=document.getElementById('pearlMore');

     scrollHeight, which read as overflow for the length of the entrance and put up a Show all that took the room the
     scale had just been fitted to. */

  if(!cut) pearlSkips=0;
  else if(pearlCurrent&&pearlCurrent===pearlPicked&&pearlSkips<12&&matchMedia('(min-width:700px)').matches){
    pearlSkips++; requestAnimationFrame(()=>{ if(pearlCurrent===pearlPicked) pearlNext(true); });

/* The largest text scale at which the pearl fits its card, so a short pearl fills the card and a long one still needs
   no scroll. Measured from the layout box (offsetHeight), which a step's entrance transform does not change, so the
   steps rising in cannot make the pearl look longer than it is. Only where the card's height is set by the grid
   (700px and wider); a narrower card is as tall as its content. It stops 4px short of the edge: a scale chosen to the
   exact pixel was a pixel over once the figure's image or a rounding settled. Under the floor the pearl keeps the
   floor and the Show all button. */
function pearlScale(card,wrap){
  if(!matchMedia('(min-width:700px)').matches||card.classList.contains('pearl-all')||wrap.hidden||!wrap.firstElementChild){
    card.style.removeProperty('--pz'); return; }
  const fig=card.classList.contains('has-fig')&&!card.classList.contains('pearl-nofig');
  const fits=z=>{ card.style.setProperty('--pz',String(z)); return wrap.firstElementChild.offsetHeight<=wrap.clientHeight-4; };
  /* A figure gives way before the text does: two fifths of the card, then less, until the steps fit at the floor. */
  if(fig){
    const shares=[44,40,36,32,28,24];
    const at=z=>shares.find(pf=>{ card.style.setProperty('--pf',String(pf)); return fits(z); });
    if(at(1)===undefined&&at(0.84)===undefined) card.style.setProperty('--pf','24');

     cut off under a Show all. */
  if(!fits(lo)&&fig){ card.classList.add('pearl-figthumb'); card.style.removeProperty('--pf'); hi=1.6; if(fits(hi)) return; }
  if(!fits(lo)) return;
  for(let i=0;i<7;i++){ const m=(lo+hi)/2; if(fits(m)) lo=m; else hi=m; }
  /* The value that was measured to fit, not a rounding of it: rounded up, it crossed the point where a line wraps. */
  fits(lo);

    :done?'This device has the whole bank. It works with no network at all.'
    :'Pull every figure down once and the bank works with no network at all.';
  card.classList.toggle('has-trouble',offlineJob.bad>0);
  const btn=card.querySelector('.off-btn');

    btn.disabled=!offlineJob.busy&&done;

  }
}

/* ═══════════ The brain on the Brain page ═══════════
   Memorizer's brain (src/core/brain.js: the geometry, the lobes, the live impulses), drawn from the bank: each chapter is
   a lobe, and its questions are split into up to BRAIN_PER neurons, each lit by what FSRS predicts of the questions in it
   today: solid (85% or more), fading (60% or more), weak, or not yet seen. A connection is lit when both its neurons are,
   impulses run what is known and die at the edge of what is not, and a tap fires a neuron and says what it holds. */
const BRAIN_PER=16, BRAIN_STATE_LABEL={solid:'solid',fading:'fading',weak:'weak','new':'not seen yet'};
/* Systole's brain runs hotter than Memorizer's (BrainMap.LIVE): a bank that has not been opened yet is every neuron
   "not seen yet", and at Memorizer's rates those pass an impulse on one time in seven, so a new fellow's brain sat
   still and read as a picture. Here the unseen still crackle, more faintly and more slowly than what is known. */
const BRAIN_TUNE={MAX_SPARKS:24, AMBIENT_MS:260, FIRE:{'new':2}, RELAY:{'new':0.5}, PASS:{'new':0.45}};
let brainArtL=null, brainLiveRun=null, brainSel=-1;
function qRecall(q){
  const c=S.srs[q.id], t=todayISO();
  if(c&&c.stability!==undefined) return FSRS.retrievability(c.stability, FSRS.daysBetween(c.last||t,t));
  if(c) return Math.min(1,(c.reps||0)/3);
  const p=S.practice[q.id]; return p?Math.min(0.45,(p.c||0)*0.22):null;
}
function brainUnits(){
  return CHAPTERS.map(ch=>{
    const qs=POOL.filter(q=>q.ch===ch), per=Math.max(1,Math.ceil(qs.length/BRAIN_PER)), sections=[];
    for(let i=0,ci=0;i<qs.length;i+=per,ci++){
      const part=qs.slice(i,i+per), vals=part.map(qRecall).filter(v=>v!=null);
      const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
      sections.push({ci, title:`${ch} · questions ${i+1}–${i+part.length}`, from:i, n:part.length,
        state:avg==null?'new':avg>=0.85?'solid':avg>=0.6?'fading':'weak', recall:avg==null?null:Math.round(avg*100)});
    }
    return {docId:ch, name:ch, sections};
  });
}
function brainLayoutNow(){
  const units=brainUnits(), sig=JSON.stringify(units.map(u=>u.sections.map(x=>x.state+(x.recall==null?'':x.recall))));
  if(!brainArtL||brainArtL.sig!==sig) brainArtL={sig, L:BrainMap.brainLayout(units)};
  return brainArtL.L;
}
function brainHash(t){ let x=7; for(let i=0;i<t.length;i++) x=(x*31+t.charCodeAt(i))>>>0; return x; }
/* A neuron's four branches, each forked at the tip of every other one (Memorizer's ui.js dendrites). */
function brainDendrites(n){
  const h0=brainHash(n.key); let d='';
  for(let k=0;k<4;k++){
    const a=(h0%628)/100+k*Math.PI/2+((h0>>(k+3))%60-30)/100, len=n.r*(1.5+((h0>>(k*2))%9)/10), bend=((h0>>k)%2?1:-1)*n.r*0.5;
    const sx=n.x+Math.cos(a)*n.r*0.8, sy=n.y+Math.sin(a)*n.r*0.8, ex=n.x+Math.cos(a)*(n.r+len), ey=n.y+Math.sin(a)*(n.r+len);
    const cx=(sx+ex)/2-Math.sin(a)*bend, cy=(sy+ey)/2+Math.cos(a)*bend;
    d+='M'+sx.toFixed(1)+' '+sy.toFixed(1)+'Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1);
    if(k%2===0){ const fa=a+0.6; d+='M'+ex.toFixed(1)+' '+ey.toFixed(1)+'L'+(ex+Math.cos(fa)*n.r*0.7).toFixed(1)+' '+(ey+Math.sin(fa)*n.r*0.7).toFixed(1); }
  }
  return d;
}
function brainAxon(a,b,i){ const c=BrainMap.axonCtrl(a,b,i); return 'M'+a.x+' '+a.y+'Q'+c.x+' '+c.y+' '+b.x+' '+b.y; }
function buildBrainArt(){
  if(typeof BrainMap==='undefined') return '';
  const L=brainLayoutNow(), B=BrainMap.BRAIN, nodes=L.nodes;
  if(!nodes.length) return '';

function brainPick(i,tap){

/* THE BRAIN, LIVE (Memorizer's ui.js brainLive): impulses run the wiring, neurons flash where they land. At most about
   thirty draws a second, only while the Brain page is uncovered and the app is in view, and not at all when the
   device asks for reduced motion (including a preference changed after mounting). brainLiveRun says what it is doing
   (verify-homepager reads its frames). */
function mountBrainLive(){
  const art=document.getElementById('brainArt');
  if(!art||typeof BrainMap==='undefined'||!homeMotionOK()||!window.requestAnimationFrame){ brainLiveRun=null; return; }
  const L=brainArtL.L, prev=brainLiveRun;
  const run=brainLiveRun={L, st:prev&&prev.L===L?prev.st:BrainMap.liveInit(L,BRAIN_TUNE), frames:prev&&prev.L===L?prev.frames:0, running:true, turn:{x:0,y:0}};
  const pool=[...art.querySelectorAll('.bspark')].map(g=>({g,tails:g.querySelectorAll('.tail'),head:g.querySelector('.head'),halo:g.querySelector('.halo')}));
  const flashEls={}, hotEls={}; let shown={}, hot={}, last=0, drawn=0;
  art.querySelectorAll('.flash').forEach(c=>{ flashEls[c.getAttribute('data-i')]=c; });
  art.querySelectorAll('.brain-axons path').forEach(p=>{ hotEls[p.getAttribute('data-e')]=p; });
  const glowOf=st=>'url(#sbGlow'+st.charAt(0).toUpperCase()+st.slice(1)+')';
  const draw=()=>{
    const st=run.st;
    pool.forEach((p,k)=>{ const s=st.sparks[k];
      if(!s){ if(p.on){ p.g.style.display='none'; p.on=false; } return; }
      if(!p.on){ p.g.style.display=''; p.on=true; }
      if(p.state!==s.state){ p.halo.setAttribute('fill',glowOf(s.state==='new'?'spark':s.state)); p.g.setAttribute('data-state',s.state); p.state=s.state; }
      const at=BrainMap.sparkAt(L,st,s,0); p.head.setAttribute('transform','translate('+at.x.toFixed(1)+' '+at.y.toFixed(1)+')');
      for(let t=0;t<p.tails.length;t++){ const b=BrainMap.sparkAt(L,st,s,0.045*(t+1)); p.tails[t].setAttribute('cx',b.x.toFixed(1)); p.tails[t].setAttribute('cy',b.y.toFixed(1)); }
    });
    Object.keys(st.flash).forEach(i=>{ const el=flashEls[i]; if(!el) return;
      el.style.opacity=(st.flash[i]/st.live.FLASH_MS*(L.nodes[i].state==='new'?0.5:1)).toFixed(2); shown[i]=true; });
    Object.keys(shown).forEach(i=>{ if(!(i in st.flash)){ flashEls[i].style.opacity='0'; delete shown[i]; } });
    const now={}; st.sparks.forEach(x=>{ now[x.e]=true; });
    Object.keys(now).forEach(k=>{ if(!hot[k]&&hotEls[k]) hotEls[k].setAttribute('data-hot',''); });
    Object.keys(hot).forEach(k=>{ if(!now[k]&&hotEls[k]) hotEls[k].removeAttribute('data-hot'); });
    hot=now;
  };
  /* THE TURN. The brain is a drawing, so it is given depth the way a drawing can be: it sways slowly on its vertical
     axis and nods on its horizontal one, the light on the cortex moves the other way as it turns, and the neurons and
     their wiring ride a little above the tissue, sliding against it (parallax).

     IT HOLDS STILL UNDER A FINGER. A neuron is something to tap, and a target that never stops moving is a hard one to
     hit: while a finger is on the stage the brain stays at the angle it had, and while a pointer that can hover is over
     it, it leans towards the pointer and settles there, exactly, rather than easing towards it for ever. The sway comes
     back when the pointer leaves. run.turn holds the angle (degrees) the last frame drew. */
  const tilt=document.getElementById('brainTilt'), stage=document.getElementById('brain3d'), net=document.getElementById('brainNet');
  const tissue=art.querySelector('#sbTissue'), shade=art.querySelector('#sbShade');
  let aim=null, held=false;
  if(stage){
    const over=ev=>{ if(ev.pointerType==='touch'){ held=true; return; } const r=stage.getBoundingClientRect(); if(!r.width) return;
      aim={x:Math.max(-1,Math.min(1,(ev.clientX-r.left)/r.width*2-1)), y:Math.max(-1,Math.min(1,(ev.clientY-r.top)/r.height*2-1))}; };
    stage.onpointerenter=over; stage.onpointermove=over; stage.onpointerdown=over;
    stage.onpointerleave=stage.onpointercancel=()=>{ aim=null; held=false; };
  }
  const turn=ts=>{
    const t=ts/1000, k=run.turn;
    if(held) return;
    const ry=aim?aim.x*14:Math.sin(t*0.42)*13, rx=aim?-aim.y*8:Math.sin(t*0.31+1)*5;
    const dy=ry-k.y, dx=rx-k.x;
    if(aim&&Math.abs(dy)<0.3&&Math.abs(dx)<0.3){ if(k.y===ry&&k.x===rx) return; k.y=ry; k.x=rx; }
    else { const e=aim?0.2:0.12; k.y+=dy*e; k.x+=dx*e; }
    if(tilt) tilt.style.transform='rotateX('+k.x.toFixed(2)+'deg) rotateY('+k.y.toFixed(2)+'deg)';
    if(net) net.setAttribute('transform','translate('+(k.y*0.9).toFixed(1)+' '+(-k.x*0.9).toFixed(1)+')');
    if(tissue){ tissue.setAttribute('cx',(42-k.y*1.6).toFixed(1)+'%'); tissue.setAttribute('cy',(36+k.x*1.8).toFixed(1)+'%'); }
    if(shade) shade.setAttribute('cx',(68-k.y*1.2).toFixed(1)+'%');
  };
  const frame=ts=>{
    if(brainLiveRun!==run) return;
    if(!art.isConnected||S.screen!=='home'){ run.running=false; return; }
    if(homePage!==1||document.hidden||figPs||apexIsFull()||!homeMotionOK()){
      last=ts; requestAnimationFrame(frame); return;
    }
    const dt=last?Math.min(0.1,(ts-last)/1000):0;
    if(ts-drawn>=30){ BrainMap.liveStep(run.st,L,dt,Math.random); draw(); turn(ts); drawn=ts; last=ts; run.frames++; }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function homeMotionOK(){ return !(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
/* Where the scroller is, as a fraction of a page (0 to 2): the pill's place, each page's depth, and which page is the
   current one. Read in a frame, so a fast swipe costs one layout read per frame. */
function homePagerScroll(){ if(!homeRaf) homeRaf=requestAnimationFrame(()=>{ homeRaf=0; homePagerSync(); }); }
function homePagerSync(){
  const pg=document.getElementById('homePager'), root=document.getElementById('homePages');
  if(!pg||!root) return;
  const w=pg.clientWidth||1, f=Math.max(0,Math.min(2,pg.scrollLeft/w));
  root.style.setProperty('--hp-f',f.toFixed(4));
  pg.querySelectorAll('.home-page').forEach((el,i)=>el.style.setProperty('--hp-d',Math.min(1,Math.abs(f-i)).toFixed(4)));
  const i=Math.round(f);

}
/* The current page is the tab that is selected and the panel a screen reader reads; the others are inert until a swipe
   or a tab brings them in, so Tab never walks into a page that is off the screen. */
function homeMark(){
  const root=document.getElementById('homePages'); if(!root) return;
  root.dataset.page=String(homePage);
  /* Guarded like the line above it: this now runs on every resize event, and a throw there repeats
     for as long as the drag lasts rather than once. 700px is the stylesheet's breakpoint too —
     tests/verify-homepager.js reads the rail's direction off the screen rather than off this number,
     so the two cannot drift apart unnoticed. */
  const tabs=root.querySelector('.home-tabs');
  if(tabs) tabs.setAttribute('aria-orientation',matchMedia('(min-width:700px)').matches?'vertical':'horizontal');
  for(let i=0;i<3;i++){
    const tab=document.getElementById('homeTab'+i), page=document.getElementById('homePage'+i);
    if(tab){ tab.setAttribute('aria-selected',String(i===homePage)); tab.tabIndex=i===homePage?0:-1; }
    if(page){ if(i===homePage){ page.removeAttribute('aria-hidden'); page.inert=false; page.removeAttribute('inert'); }
      else { page.setAttribute('aria-hidden','true'); page.inert=true; page.setAttribute('inert',''); } }
  }

}
/* Home remains mounted behind pager panels and full-screen overlays. Its
   hidden canvases must not consume the foreground's frame budget. */
function syncHomeMotion(){
  const on=!atlasPaused&&S.screen==='home'&&homePage===0&&document.visibilityState!=='hidden'&&!figPs&&!apexIsFull();
  if(heroMon) on?heroMon.start():heroMon.stop();
  if(heroHeart3d) on?heroHeart3d.start():heroHeart3d.stop();
  if(pearlTrace) on?pearlTrace.resume():pearlTrace.pause();
  if(!on&&heroRotateTimer){ clearInterval(heroRotateTimer); heroRotateTimer=null; }
  else if(on&&heroMon&&!heroRotateTimer) heroRotateTimer=startHeroRotation();
