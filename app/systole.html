/* ═══════════ how much of a thread rides on a request ═══════════
   Every turn used to carry every message ever sent about this question, so a
   long conversation grew slower and more expensive with each exchange and had
   no ceiling at all. APEX_SEND is the window; APEX_KEEP is what is written to
   storage, which is larger because reading back a thread is free and re-sending
   it is not.

   TWO THINGS THIS DOES CAREFULLY.

   err turns are dropped: they are the panel's record of a failed request — an
   expired session, a dropped connection — kept in the thread so you can see
   what happened, but they are not things Apex said, and sending them back as
   assistant turns wrote every network blip permanently into the context.

   And the window starts on a USER turn. Anthropic rejects two assistant turns
   in a row, so a window that happened to open on a reply would turn a long
   conversation into an HTTP 400 — arriving precisely when this was working. */
const APEX_SEND=16, APEX_KEEP=60;
function apexWire(hist){
  const live=(hist||[]).filter(m=>!m.err).map(m=>({role:m.role,content:m.content}));
  if(live.length<=APEX_SEND) return live;
  let from=live.length-APEX_SEND;
  while(from<live.length && live[from].role!=='user') from++;
  if(from>=live.length) return live.slice(-1);
  const kept=live.slice(from);
  /* Said inside the first message kept rather than as a message of its own —
     an extra turn would be the very assistant-adjacency this avoids. */
  kept[0]=Object.assign({},kept[0],{content:
    '[Earlier messages in this thread are not included — it is longer than one '+
    'request carries. Ask me to recap if you need something from before this.]\n\n'+
    kept[0].content});
  return kept;
}
/* Storage has a ceiling too: accsap12.chat held every exchange about all 639
   questions, forever, in a 5 MB budget. Trimmed on the same user-turn boundary
   so what is kept is always a whole exchange. */
function apexTrim(hist){
  if(!hist || hist.length<=APEX_KEEP) return hist;
  let from=hist.length-APEX_KEEP;
  while(from<hist.length && hist[from].role!=='user') from++;
  if(from>=hist.length) return hist;
  hist.splice(0,from);
  return hist;
}
async function streamReply(q,hist,extra){
  aiAbort=new AbortController();
  toolTrace=[];
  const wire=apexWire(hist);
  let guard=0, truncated=false;
  try{
    while(guard++ < 6){                       // bounded agent loop
      apexSetState('thinking');
      const turn=await oneTurn(q,wire,extra);
      if(turn.text.trim()||turn.calls.length){
        if(turn.text.trim()) hist.push({role:'assistant',content:turn.text});
        saveJSON(AI_CHAT,CHATS);
      }
      if(!turn.calls.length) break;
      if(guard>=6) truncated=true;          // calls still pending on the last allowed step
      const results=turn.calls.map(c=>{
        const out=runTool(c.name,c.input);
        if(out.cite) lastHits=(lastHits||[]).concat(out.cite).slice(-6);
        toolTrace.push({kind:'call',name:c.name,input:c.input});
        return {id:c.id, name:c.name, content:String(out.result).slice(0,9000)};
      });
      pushToolExchange(wire,turn,results);      // provider-shaped, see below
      buildAI();                                // show the tool chips as they run
    }
    /* Marked err:true so it renders as a notice rather than as teaching, and
       so rule 3 above keeps it out of the next request. */
    if(truncated){
      hist.push({role:'assistant',err:true,
        content:'That needed more tool steps than one turn allows, so I stopped there. Ask again and I will carry on from where this left off.'});
      saveJSON(AI_CHAT,CHATS);
    }
  }catch(err){
    if(err.name!=='AbortError'){
      hist.push({role:'assistant',err:true,content:err.message||'Request failed. Check the connection.'});
      saveJSON(AI_CHAT,CHATS);
    }
  }finally{
    aiBusy=false; aiAbort=null; buildAI();
    apexSetState('idle');
    try{ flushNav(); }catch(_){}
  }
}
/* Gemini correlates a tool result to its call by name and position rather
   than by an id, so this pushes the model's own parts back verbatim and
   answers with functionResponse parts. The OpenAI-shaped alternative — an
   assistant message carrying tool_calls, then one role:'tool' message per
   call — left with the second provider. */
function pushToolExchange(wire,turn,results){
  {
    /* Gemini correlates a functionResponse to its call by name and by
       position, not by an id — there is nothing here to carry one. */
    /* A floor under the signature rule. Gemini 3 validates that the FIRST
       functionCall part of a step carries its signature; if one never arrived
       — an older model on the same key, a part reassembled oddly, a thread
       resumed from somewhere this app did not see — the request 400s and the
       conversation dies mid-tool-call. Google publishes an explicit opt-out
       token for calls it did not generate. It costs some model performance and
       is documented as a last resort, which is exactly what this is: a wrong
       signature is refused, a missing one is fatal, and a slightly worse
       answer beats a dead thread. */
    const parts=turn.raw.slice();
    const firstCall=parts.findIndex(p=>p.functionCall);
    if(firstCall>=0&&!parts[firstCall].thoughtSignature){
      parts[firstCall]=Object.assign({},parts[firstCall],
        {thoughtSignature:'skip_thought_signature_validator'});
    }
    wire.push({role:'model',parts});
    wire.push({role:'user',parts:results.map(r=>({functionResponse:{name:r.name,response:{content:r.content}}}))});
  }
}

/* one streamed request; returns {text, calls, raw} — dispatches by provider */
function oneTurn(q,wire,extra){
  return oneTurnGemini(q,wire,extra);
}

/* lastHits holds whichever notes retrievedContext/groundedContext put in
   front of Apex this turn (plus anything a tool call cited afterward) — the
   same list the "cited from" UI already reads. Turning those into images
   here, at call time, means no new state has to be threaded through fire() /
   streamReply() / oneTurn(): the images always match what the fellow can see
   was actually retrieved.

   Grounded mode only. In the default mode retrievedContext's "further
   material" fallback surfaces a note even on thin, coincidental keyword
   overlap — fine for an optional citation, not fine for putting a random
   figure in front of the fellow on an unrelated question. Grounded mode is
   the opposite: the fellow has told Apex these notes are the only material
   it may teach from, so a cited note's own figure belongs in view. */
/* Every figure carried by the notes this turn drew on. No mode gate: what is
   worth showing and what is worth paying to send are different questions, and
   conflating them is why the figures were invisible. */
function refFiguresForHits(hits,cap){
  const out=[]; const seen=Object.create(null);
  for(const h of (hits||[])){
    if(!h||h.kind!=='r') continue;
    const r=REF.find(x=>x.id===h.id); if(!r) continue;
    for(const img of extractRefImages(r.body)){
      if(seen[img.key]) continue;               // two notes may cite one figure
      const dataUrl=refImgSrc(img.key);
      if(!dataUrl) continue;
      seen[img.key]=1;
      out.push({key:img.key, caption:img.caption, dataUrl, noteTitle:r.title});
      if(out.length>=(cap||4)) return out;
    }
  }
  return out;
}
/* What actually rides on the request. Still grounded-mode only: an image costs
   tokens on every turn, and the free tiers this app is aimed at are metered in
   tokens per minute. Rendering the same figure costs nothing, so the panel
   shows it either way — see the strip in buildAI. */
function refImagesForHits(hits){
  return AI_GROUNDED ? refFiguresForHits(hits,4) : [];
}

/* Coalesces repeated paints of a streaming reply onto animation frames
   instead of network chunks. schedule() is cheap to call on every delta —
   it only ever queues one frame at a time, no matter how many deltas arrive
   before it fires. flush() is the correctness guarantee: called once after
   the stream ends, it cancels any pending frame and paints text's CURRENT
   value synchronously, so the very last chunk is never left unpainted
   waiting on a frame that may not come before the caller moves on. */
function makeStreamPainter(live,body,getText){
  let raf=0;
  const paint=()=>{ raf=0; if(live){ live.innerHTML=md(getText())+toolStrip(); apexStick(body); } };
  return {
    schedule(){ if(!raf) raf=requestAnimationFrame(paint); },
    flush(){ if(raf){ cancelAnimationFrame(raf); raf=0; } paint(); },
  };
}

/* One non-streaming completion, no tools, no question context. The three
   oneTurn* functions cannot serve this — they are bound to aiCtx() and TOOLS —
   so this carries the three wire shapes in the smallest form that works.
   Returns '' rather than throwing: every caller here is best-effort. */
async function oneShot(prompt,maxTokens){
  const p=AI.provider, k=cur().key, model=cur().model;
  if(!k) return '';
  try{
    const r=await fetch(gemUrl('generate',model,k),{method:'POST',
      headers:gemHeaders(k,true),
      body:JSON.stringify({generationConfig:{maxOutputTokens:maxTokens},
        contents:[{role:'user',parts:[{text:prompt}]}]})});
    if(!r.ok) return '';
    const j=await r.json();
    const parts=((j.candidates||[])[0]||{}).content;
    return ((parts&&parts.parts)||[]).map(x=>x.text||'').join('');
  }catch(_){ return ''; }
}

/* Written once at the end of a sitting, never per question. The fellow chose
   to have sessions summarised, but a summary is only worth its API call if
   something happened: a handful of answers, or a real conversation. */
let sessionSummarised=false;
async function summariseSession(){
  if(sessionSummarised) return;
  if(typeof Memory==='undefined') return;
  sessionSummarised=true;
  try{
    if(!cur().key) return;
    const answered=S.sessionTotal||0;
    const turns=Object.values(CHATS||{}).reduce((n,t)=>n+(t?t.length:0),0);
    if(answered<5 && turns<4) return;
    const weak=(typeof Profile!=='undefined'?Profile.weakChapters(3,3):[])
      .map(w=>`${w.ch} ${w.pct}%`).join(', ');
    const talk=Object.values(CHATS||{}).flat().slice(-14)
      .map(m=>`${m.role==='user'?'FELLOW':'YOU'}: ${String(m.content||'').slice(0,320)}`).join('\n');
    const known=Memory.all().slice(0,20).map(m=>'- '+m.text).join('\n');
    const out=await oneShot(
`You are keeping notes on a cardiology fellow you tutor, for your own use next time.
This study session: ${S.sessionCorrect||0}/${answered} correct${weak?`, weakest ${weak}`:''}.

${talk?`What was said:\n${talk}`:'There was no conversation this session.'}

${known?`You already know, and must NOT repeat:\n${known}`:''}

Write AT MOST three short lines worth remembering in a month — a persistent
confusion, a stated goal or deadline, a teaching preference they showed. One
sentence each, third person, no bullets, no preamble. Skip anything that is
just this session's score, anything you already know, and anything that will
not still matter in a month. If there is nothing worth keeping, reply with the
single word NOTHING.`, 220);
    if(!out || /^\s*NOTHING\s*$/i.test(out)) return;
    out.split('\n').map(l=>l.replace(/^[-•*\d.\s]+/,'').trim())
      .filter(l=>l.length>12 && !/^NOTHING$/i.test(l))
      /* A summary is always Apex's own reading of a sitting, never the
         fellow's words, so said stays false and the model is told so. */
      .slice(0,3).forEach(l=>Memory.add(l,'session',{src:'summary',said:false}));
  }catch(_){ /* a broken summariser must never break the results screen */ }
}

function toOpenAITools(tools){
  return tools.map(t=>({type:'function',
    function:{name:t.name,description:t.description,parameters:t.input_schema}}));
}
/* Gemini's function-declaration schema is the same OpenAPI-flavoured JSON
   Schema our TOOLS already speak (type/properties/items/required, all
   lowercase) — no translation needed beyond the field name. */
function toGeminiTools(tools){
  return tools.map(t=>({name:t.name,description:t.description,parameters:t.input_schema}));
}
/* The one block shape Vision.withFigures/withImages ever produces —
   {type:'text',text} and {type:'image',source:{media_type,data}} — becomes
   Gemini's inlineData part. A wire entry already shaped {role,parts} (a
   tool exchange pushToolExchange added this turn) rides through untouched. */
function geminiParts(content){
  if(content==null||typeof content==='string') return [{text:String(content||'')}];
  if(Array.isArray(content)) return content.map(b=>
    b.type==='image' ? {inlineData:{mimeType:b.source.media_type,data:b.source.data}}
                      : {text:b.text||''});
  return [{text:String(content)}];
}
function toGeminiContents(wire){
  return wire.map(m=>m.parts ? {role:m.role,parts:m.parts}
                              : {role:m.role==='assistant'?'model':'user',parts:geminiParts(m.content)});
}
async function oneTurnGemini(q,wire,extra){
  const model=cur().model;
  const contents=toGeminiContents(Vision.withImages(
    Vision.withFigures(wire, q, (typeof IMGS!=='undefined'?IMGS[q&&q.id]:null), AI.provider),
    refImagesForHits(lastHits), AI.provider));
  const r=await fetch(gemUrl('stream',model,cur().key),{
    method:'POST', signal:aiAbort.signal,
    headers:gemHeaders(cur().key,true),
    body:JSON.stringify({
      systemInstruction:{parts:[{text:systemPrompt()+'\n\n'+aiCtx(q)+(extra||'')}]},
      tools:[{functionDeclarations:toGeminiTools(TOOLS)}],
      generationConfig:{maxOutputTokens:2000},
      contents})
  });
  if(apexSessionLapsed(r)) throw new Error(APEX_LAPSED);
  if(!r.ok) throw new Error(await apiError(r,'gemini'));
  const rd=r.body.getReader(), dec=new TextDecoder();
  const live=document.getElementById('aiLive'), body=document.getElementById('aiBody');
  /* Gemini streams whole parts, not token deltas inside a block envelope: a
     text part is the next chunk of prose, a functionCall part arrives
     complete in one piece (structured args are not assembled incrementally
     the way oneTurnGroq's callMap has to). raw keeps every part in the order
     it arrived, so a turn that starts talking and then calls a tool pushes
     back exactly what it did, not a reconstruction of it. */
  let buf='', text='', raw=[];
  const painter=makeStreamPainter(live,body,()=>text);
  try{
  while(true){
    const {done,value}=await rd.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    for(const ln of lines){
      if(!ln.startsWith('data:'))continue;
      const p=ln.slice(5).trim(); if(!p)continue;
      let j; try{ j=JSON.parse(p); }catch(_){ continue; }
      if(j.error) throw new Error(j.error.message||'stream error');
      const cand=j.candidates&&j.candidates[0]; if(!cand)continue;
      for(const part of (cand.content&&cand.content.parts)||[]){
        /* THE SIGNATURE TRAVELS WITH THE PART, AND HAS TO GO BACK WITH IT.
           Gemini 3 signs the parts of a turn that involved thinking, and
           validates on the next request that the signature came back exactly
           as issued. Dropping it does not degrade the answer, it fails the
           call: "Function call is missing a thought_signature in functionCall
           parts", HTTP 400, and the conversation dies at the point Apex tried
           to use a tool. Every part is therefore pushed with whatever
           signature arrived beside it. */
        if(part.text){
          if(!text) apexSetState('speaking');
          text+=part.text;
          raw.push(part.thoughtSignature?{text:part.text,thoughtSignature:part.thoughtSignature}
                                        :{text:part.text});
          apexPulse();
          painter.schedule();
        } else if(part.functionCall){
          apexSetState('tool');
          raw.push(part.thoughtSignature?{functionCall:part.functionCall,thoughtSignature:part.thoughtSignature}
                                        :{functionCall:part.functionCall});
        } else if(part.thoughtSignature&&raw.length){
          /* A signature can arrive in a chunk of its own, with neither text nor
             a call attached. It belongs to the part before it. */
          raw[raw.length-1].thoughtSignature=part.thoughtSignature;
        }
      }
    }
  }
  } finally { painter.flush(); }
  const calls=raw.filter(p=>p.functionCall).map(p=>({
    id:'call_'+Math.random().toString(36).slice(2),
    name:p.functionCall.name, input:p.functionCall.args||{}}));
  return {text, raw, calls};
}
/* Gemini says {error:{message}}. The other shapes — {message} or {detail} at
   the top level, either possibly an object rather than a string — are kept
   because an error body is the one response nobody controls, and reading a
   shape that never arrives costs nothing. Take the first that is there. */
function errMsg(j){
  if(!j||typeof j!=='object') return '';
  const m = (j.error&&j.error.message) ?? j.message ?? j.detail;
  if(typeof m==='string') return m;
  if(m==null) return '';
  try{ return JSON.stringify(m).slice(0,300); }catch(_){ return ''; }
}
async function apiError(r,provider){
  let d=''; try{ d=errMsg(await r.json()); }catch(_){}
  const name='Gemini';
  if(r.status===401) return 'Your API key was rejected. Tap the settings icon to re-enter it.';
  if(r.status===403&&provider==='gemini') return 'Your API key was rejected. Tap the settings icon to re-enter it.';
  if(r.status===400&&provider==='gemini'&&/api key not valid/i.test(d)) return 'Your API key was rejected. Tap the settings icon to re-enter it.';
  /* Gemini's free tier is a DAILY quota, not a per-minute one — "wait a few
     seconds" is actively wrong advice for it. */
  if(r.status===429&&provider==='gemini'&&/quota/i.test(d)) return "Gemini's free daily quota is used up for today — try again tomorrow, or switch provider in settings.";
  if(r.status===429) return 'Rate limited — wait a few seconds and try again.';
  if(r.status===400&&/credit|balance/i.test(d)) return `Your ${name} account is out of credit.`;
  /* Pointing at the model menu is useless when every name in it is stale —
     which is the normal case once Google retires a generation. Pressing
     Connect is what rebuilds the menu from the live list. */
  if(r.status===404&&provider==='gemini') return 'Google does not offer that model to your key. Open settings and press <b>Connect</b> again — the app will ask Google for the current list and pick one that works.';
  if(r.status===404) return `That model is not available on ${name} right now — pick a different one in settings.`;
  if(r.status>=500) return `${name} had a server error. Try again shortly.`;
  return `API error ${r.status}. ${e(d)}`;
}

  start_quiz:'building a quiz',open_question:'opening a question',save_reference_note:'saving a note',
  start_review_session:'opening your review queue',
  remember:'remembering that',forget:'forgetting that'};

/* very small markdown → HTML (escaped first) */
/* The build's figures and your imported ones share the refimg:// namespace
   and differ only in where they are kept — so everything downstream of this
   line (rendering, vision, export) can stop caring which is which. */
function refImgSrc(key){
  const baked=(typeof REF_IMGS!=='undefined'&&REF_IMGS[key])||'';
  if(baked) return baked;
  return (typeof RefAssets!=='undefined'&&RefAssets.get(key))||'';
}
function md(t){
  let s=e(t);
  s=s.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre><code>${c}</code></pre>`);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  /* refimg:// figures resolve before any other inline rule touches them, so
     a caption's own `**bold**` or `*em*` is not double-processed once the
     caption is re-inserted whole into the <figcaption>. */
  s=s.replace(/!\[([^\]]*)\]\(refimg:\/\/([^)\s]+)\)/g,(m,cap,key)=>{
    const src=refImgSrc(key);
    if(!src) return '';
    return `<figure class="ref-fig" onclick="openFigureFrom(this)" role="button" tabindex="0"
      title="Open this figure full size"><img src="${src}" alt="${cap}" loading="lazy"><figcaption>${cap}</figcaption></figure>`;
  });
  /* Headings before inline marks, so a ## line never becomes a paragraph. */
  s=s.replace(/^####\s+(.+)$/gm,'<h4>$1</h4>');
  s=s.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^##\s+(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  /* GFM pipe tables. Runs after the inline marks so cells keep their bold,
     and before the list rules so a |---|---| divider is never read as a
     bullet. The wrapper scrolls sideways: a drug-dose table is wider than a
     phone, and the alternative is a squeezed column nobody can read. */
  s=s.replace(/(?:^\|.*\|[ \t]*\n)(?:^\|[ \t:|-]+\|[ \t]*\n)(?:^\|.*\|[ \t]*\n?)+/gm,block=>{
    const rows=block.trim().split('\n');
    const cut=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const head=cut(rows[0]), body=rows.slice(2).map(cut);
    return `<div class="tw"><table><thead><tr>${head.map(c=>`<th>${c}</th>`).join('')}</tr></thead>`+
      `<tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  });
  /* One <blockquote> per run of quoted lines, rather than one per line. */
  s=s.replace(/^&gt;\s?(.*)$/gm,'\u0001$1\u0002');
  s=s.replace(/(?:\u0001[^\u0002]*\u0002\n?)+/g,run=>
    '<blockquote><p>'+(run.match(/\u0001([^\u0002]*)\u0002/g)||[])
      .map(x=>x.slice(1,-1)).join(' ').trim()+'</p></blockquote>');
  /* [ \t]* and not \s*: with the m flag \s matches newlines too, so a \s*-
     anchored rule eats the blank lines on either side of the divider — and
     those blank lines are exactly what the paragraph pass below splits on.
     The rule still fired; the <hr> just ended up inside the paragraph it was
     supposed to separate. */
  s=s.replace(/^[ \t]*(?:---+|___+)[ \t]*$/gm,'<hr>');
  s=s.replace(/^\s*[-•]\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/^\s*\d+\.\s+(.+)$/gm,'<li data-o>$1</li>');
  /* THE ORDER IS THE CONTENT. Both kinds used to become a bare <li> and every
     run was wrapped in <ul>, so "1. 2. 3." came out as three bullets with the
     numbers gone. Tag the kind, wrap a run, and split it where the kind
     changes — a list that mixes them is two lists, not one guess. */
  s=s.replace(/(?:<li(?: data-o)?>[\s\S]*?<\/li>\s*)+/g,run=>{
    const items=run.match(/<li(?: data-o)?>[\s\S]*?<\/li>/g)||[];
    let out='',cur=null,buf=[];
    const flush=()=>{ if(buf.length){ out+='<'+cur+'>'+buf.join('')+'</'+cur+'>'; buf=[]; } };
    for(const it of items){
      const kind=it.startsWith('<li data-o>')?'ol':'ul';
      if(kind!==cur){ flush(); cur=kind; }
      buf.push(it.replace('<li data-o>','<li>'));
    }
    flush();
    return out;
  });
  /* A single newline joins, as markdown says it should. Source files are
     hard-wrapped at ~78 characters; turning each of those into a <br> gave
     paragraphs a ragged false margin that tracked the .md file rather than
     the column it was being read in. A blank line still starts a paragraph. */
  s=s.split(/\n{2,}/).map(p=>/^<(ul|ol|h3|h4|pre|div|table|figure|blockquote|hr)/.test(p.trim())?p:`<p>${p.replace(/\n/g,' ')}</p>`).join('');
  return s;
}

/* Expanding an unopened panel opens it — the button is only reachable from

function toggleApexFull(){

/* Escape leaves full-page and stops there. It deliberately does NOT go on to

document.addEventListener('keydown',ev=>{

     to whatever is being typed into first. */
  const t=ev.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&t.id!=='aiIn') return;

}

function progressFromBackup(raw){
  const record=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  for(const k of ['chStats','srs','daily','practice','resume']) if(raw[k]!=null&&!record(raw[k])) throw new Error('Invalid statistics.');
  /* Every entry too, before anything is stored: the Progress screen and the
     scheduler read them field by field (d.a in buildStats, S.srs[id].due in
     forecast7), so one null day passed here, was saved, and crashed Progress
     on every later launch. A field is checked where the app reads it; one
     that is absent is left to the reader's own default, as it always was. */
  const count=v=>v==null||(Number.isFinite(v)&&v>=0);
  const entries=(k,fields,need,extra)=>{ for(const v of Object.values(raw[k]||{})){
    if(!record(v)||fields.some(f=>!count(v[f]))||need.some(f=>v[f]==null)||(extra&&!extra(v))) throw new Error('Invalid statistics.');

  entries('daily',['a','c','r'],['a','c']);
  entries('chStats',['correct','total'],[]);
  entries('practice',['n','c','t'],[]);
  entries('srs',['reps','lapses','ivl','stability','difficulty'],[],v=>(v.due==null||typeof v.due==='string')&&(v.last==null||typeof v.last==='string'));
  entries('resume',['i','correct','total','ts'],[],v=>v.ids==null||(Array.isArray(v.ids)&&v.ids.every(x=>typeof x==='string')));
  for(const k of ['sessionCorrect','sessionTotal','reviewStreak','sinceBackup','lastBackup'])
    if(raw[k]!=null&&(!Number.isFinite(raw[k])||raw[k]<0)) throw new Error('Invalid statistics.');

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* ── navigation ── */
/* ONLY PRACTICE DECKS HAVE A KEY. Returning null is how the three functions
   below all decline at once: a mode with no key is a mode that never saves,
   never restores and never needs clearing. 'due' is recomputed from the FSRS
   schedule every time it is asked for and 'missed' shrinks as you improve, so
   for both of them a remembered deck is a stale deck. */
function resumeKey(ch,mode){
  if(mode!=='all') return null;
  return 'all|'+(ch||'*');
}
/* Twelve decks is more than anyone has half-finished at once, and it bounds
   what this can cost in a store that is already carrying the FSRS cards for
   the whole bank. Oldest touched goes first. */
const RESUME_MAX=12;
/* WRITING THE RECORD AND WRITING THE STORE ARE SEPARATE, because selectOpt
   already calls save() and a second write per answer would be pure waste.
   recordResume() updates S.resume and stops; saveResume() does both, for the
   navigation paths that were not going to save anyway. */
function recordResume(){
  const key=resumeKey(S.chapter,S.mode);
  if(!key||S.screen!=='quiz'||!S.questions.length) return false;
  S.resume[key]={ids:S.questions.map(q=>q.id), i:S.qIdx,
    answers:S.answers, correct:S.quizCorrect, total:S.quizTotal, ts:Date.now()};
  const keys=Object.keys(S.resume);
  if(keys.length>RESUME_MAX){
    keys.sort((a,b)=>(S.resume[a].ts||0)-(S.resume[b].ts||0));
    while(keys.length>RESUME_MAX) delete S.resume[keys.shift()];
  }
  return true;
}
function saveResume(){ if(recordResume()) save(); }
function clearResume(ch,mode){
  const key=resumeKey(ch,mode);
  if(key&&S.resume[key]){ delete S.resume[key]; save(); }
}
/* Rebuilds the deck in its saved order, or returns null and lets the caller
   shuffle a fresh one. Every reason to decline is a reason the saved record no
   longer describes a deck this build can deal:

     · the bank moved under it — a reseed can retire an id, so ids are resolved
       through the pool that actually exists and a record that loses any of
       them is dropped rather than silently dealt short;
     · it was finished, or all but — a record sitting on the last question is
       a completed deck nobody cleared, and resuming onto it would show one
       question and end;
     · it is not this deck — the saved ids are checked against the pool the
       caller computed, so a chapter's record can never be dealt into "all". */
function restoreDeck(qs,key){
  const rec=key&&S.resume[key];
  if(!rec||!Array.isArray(rec.ids)||!rec.ids.length) return null;
  const have={}; qs.forEach(q=>{ have[q.id]=q; });
  const deck=[]; for(const id of rec.ids){ const q=have[id]; if(!q) return null; deck.push(q); }
  if(deck.length!==qs.length) return null;
  const i=rec.i|0;
  if(!(i>0&&i<deck.length)) return null;
  return {deck,i,answers:(rec.answers&&typeof rec.answers==='object')?rec.answers:{},
          correct:rec.correct|0,total:rec.total|0};
}
/* ── "I have N minutes" — src/core/studyplan.js chooses what, in what order and why (due first, most
   forgotten first; then the weaker chapters; then new). It runs as a review session (mode 'due'), so a
   card rated here moves its schedule exactly as in the review queue. ── */
function planNow(minutes){
  return StudyPlan.plan({minutes,pool:POOL,srs:S.srs,chStats:S.chStats,missed:S.missed});
}
function startPlan(minutes){
  const qs=planNow(minutes).items.map(it=>QBYID[it.id]).filter(q=>q&&!q.bad);
  if(!qs.length){toast('Nothing to plan: there are no questions to draw from.');return;}
  startQuiz(null,'due',qs);
}
/* ── Topic runs — src/core/topicrun.js groups questions that are about the same thing (shared distinctive
   words, within one chapter) into runs of three to five, starting from what you missed, then what is due.
   Asked back to back in the order it gives, as a review session: ratings move the schedule as usual. ── */
let _runsKey='',_runs=[],_runsShown=[];
function topicRunsNow(){
  const dueIds=new Set(dueQuestions().map(q=>q.id));
  const key=POOL.length+'|'+S.missed.size+'|'+dueIds.size;
  if(key!==_runsKey){
    _runsKey=key;
    try{ _runs=TopicRun.runs({pool:POOL.filter(q=>!q.bad),missed:S.missed,due:dueIds,size:4,max:3}); }
    catch(_){ _runs=[]; }   // a card that cannot be worked out is no card, not a broken screen
  }
  return _runs;
}
function runLabel(r){
  const words=r.shared.slice(0,3).join(' · ');

}
function startRun(i){
  const r=_runsShown[i]; if(!r) return;

  if(qs.length<2){toast('That run is no longer available.');return;}

/* ── Voice session — src/core/voicemode.js decides what to say and how to read what was said; the browser's
   speechSynthesis speaks and SpeechRecognition listens. It drives the ordinary quiz screen (startQuiz in review
   mode), so an answer is scored by selectOpt and rated by rateReview exactly as when tapped: right → Good, wrong →
   Again. Nothing starts without a tap (iPad Safari will not speak or listen otherwise), and a browser without
   both speech halves simply has no card. Leaving the quiz screen ends the session. ── */
const VOICE_SR=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
function voiceAvailable(){ return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance&&VOICE_SR()); }
let _voice=null;
function voiceSay(text){

    const t=setTimeout(fin,4000+text.length*90);          // some browsers never fire onend
    try{ const u=new SpeechSynthesisUtterance(text); u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); }catch(_){ fin(); }

    const t=setTimeout(()=>fin(null),9000);
    const watch=setInterval(()=>{ if(_voice===null||S.screen!=='quiz'){ clearInterval(watch); fin(null); } },250);   // the microphone does not stay open on another screen
    try{
      rec=new (VOICE_SR())(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
      rec.onresult=ev=>{ try{ fin(ev.results[0][0].transcript); }catch(_){ fin(null); } };
      rec.onerror=()=>fin(null); rec.onend=()=>fin(null);
      rec.start();

/* The voice dock: a bar over the quiz screen while a voice session runs, saying whether the app is speaking or
   listening, and holding the only Stop button that works with the hands full of something else. It lives on

function voiceDock(state,text){
  let d=document.getElementById('voiceDock');
  if(state===null){ if(d) d.remove(); document.body.classList.remove('voice-on'); return; }
  if(!d){
    d=document.createElement('div'); d.id='voiceDock'; d.setAttribute('role','status'); d.setAttribute('aria-live','polite');
    d.innerHTML=`<span class="vd-orb" aria-hidden="true"><span class="vd-ring"></span>${icon('mic')}</span>
      <span class="vd-bars" aria-hidden="true">${'<i></i>'.repeat(5)}</span>
      <span class="vd-text"><b class="vd-state"></b><span class="vd-sub"></span></span>
      <button class="vd-stop" id="voiceStop" onclick="stopVoice()" aria-label="Stop the voice session">${icon('stop')}<span>Stop</span></button>`;
    document.body.appendChild(d);

function voiceLive(v){ return _voice===v && S.screen==='quiz' && S.questions===v.deck; }
function startVoice(){
  if(!voiceAvailable()){toast('This browser cannot speak and listen. Try Safari or Chrome.');return;}
  const ids=planNow(10).items.map(it=>it.id);
  const qs=ids.map(id=>QBYID[id]).filter(q=>q&&!q.bad&&q.o&&q.o.length);
  if(!qs.length){toast('Nothing to ask: there are no questions to draw from.');return;}
  startQuiz(null,'due',qs);
  if(S.screen!=='quiz') return;
  const v=_voice={deck:S.questions,state:VoiceMode.init(S.questions.length),pending:[]};
  runVoice(v,{type:'start'});

function stopVoice(){ _voice=null; voiceDock(null); try{speechSynthesis.cancel();}catch(_){} }
async function runVoice(v,event){
  let queue=[event];
  while(queue.length&&_voice===v){
    const ev=queue.shift();
    /* Feedback has been read: rate the answer as a tap would (right → Good, wrong → Again). That moves the quiz on,
       or, after the last question, to the results screen; the spoken summary still follows. */
    if(ev.type==='feedbackRead'&&voiceLive(v)){
      const last=v.state.results[v.state.results.length-1];
      rateReview(last&&last.correct?3:1);
    }
    const r=VoiceMode.step(v.state,ev,{q:v.deck[v.state.i]||{}}); v.state=r.state;
    for(const fx of r.effects){
      if(_voice!==v) return;
      if(fx.type==='done'){ await voiceSay(fx.summary); if(_voice===v){ _voice=null; voiceDock(null); } return; }
      if(!voiceLive(v)) { stopVoice(); return; }
      if(fx.type==='ask'){
        while(S.qIdx<fx.i&&S.qIdx<S.questions.length-1) nextQ();   // a skipped question leaves the screen behind
        for(const part of VoiceMode.speakable(v.deck[fx.i]).parts){ if(!voiceLive(v)){stopVoice();return;} await voiceSay(part); }
        queue.push({type:'questionRead'});
      }else if(fx.type==='speak'){
        await voiceSay(fx.text);
        if(v.state.phase==='feedback') queue.push({type:'feedbackRead'});
      }else if(fx.type==='listen'){
        const t=await voiceHear();
        if(t!=null&&_voice===v) voiceDock('speaking',`Heard “${t}”`);

/* ── Exam date — one date the owner sets on the Study screen, kept with the rest of the progress. StudyPlan.readiness
   turns it into the countdown and the pace needed. A value that is not a real calendar day is refused, not stored. ── */
function validExamDate(v){
  if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const [y,m,d]=v.split('-').map(Number), t=new Date(y,m-1,d);
  return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;
}
function setExamDate(v){
  if(v===''||v==null) S.examDate=null;
  else if(validExamDate(v)) S.examDate=v;
  else return;
  save(); render();
}
/* A progress arc on a circle of any radius. pathLength=100 makes the dash a percentage, so the arc drawn is
   exactly the fraction given (clamped to 0..1) whatever the radius. data-frac is that fraction, for the tests. */
function arc(cls,cx,cy,r,frac){
  const f=Math.max(0,Math.min(1,+frac||0));
  return `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" pathLength="100" stroke-dasharray="${(f*100).toFixed(1)} 100" data-frac="${f.toFixed(4)}" transform="rotate(-90 ${cx} ${cy})"/>`;
}
function examDaysLeft(){ return S.examDate?FSRS.daysBetween(todayISO(),S.examDate):null; }
function examLeftText(){
  if(!S.examDate) return '';

  return n>1?`${n} days to your exam`:n===1?'Your exam is tomorrow':n===0?'Your exam is today':'Your exam date has passed';

/* Questions answered a day, over the last seven days (today included). */
function recentPerDay(){
  let total=0,d=new Date();
  for(let i=0;i<7;i++){ const v=S.daily[FSRS.localDateToISO(d)]; if(v&&v.a>0) total+=v.a; d.setDate(d.getDate()-1); }
  return total/7;
}
function startQuiz(ch,mode='all',deck){
  let qs;

  else if(mode==='due') qs=deck||reviewQueue(20);
  else qs=(ch?POOL.filter(q=>q.ch===ch):[...POOL]);
  if(!qs.length){alert(mode==='due'?'Nothing left to review right now — the whole bank is scheduled.':'No questions available for that selection.');return;}
  /* A deck handed in (the study plan) is asked in the order it was planned in, not shuffled below. (Only
     'all' decks are ever saved for resuming: resumeKey is null for review, so a plan has nothing to resume.) */
  const back=restoreDeck(qs,resumeKey(ch,mode));

    Object.assign(S,{screen:'quiz',chapter:ch,questions:back.deck,qIdx:back.i,
      selected:null,answered:false,mode,zoomed:-1,
      quizCorrect:back.correct,quizTotal:back.total,answers:back.answers,resumed:true});

       rather than a second copy of that reasoning. */

       region announceResult already speaks through. */

    answered:false,mode,zoomed:-1,quizCorrect:0,quizTotal:0,answers:{},resumed:false});

/* One short pulse for right, a short-pause-short triplet for wrong — the

/* THE APP'S OWN PHYSIOLOGY, DRAWN SMALL. Physio.lvPressure(t) and
   Physio.lvVolume(t) over one normalised cycle are the pressure–volume loop —
   the same pair of functions the cardiac-cycle screen plots, so the loop in
   this corner is the loop on that screen and cannot drift from it.

   Four limbs, counterclockwise: isovolumic contraction up the left at constant
   volume, ejection across the top as volume falls, isovolumic relaxation down
   the right, filling along the bottom. Phase advances linearly, so the head
   races the isovolumic limbs and slows through filling the way the ventricle
   does — the timing is the model's, not an easing curve. */
/* The raf handle for whatever the card is animating. Named for the trace now
   that the pressure-volume loop it used to hold has gone. */
let pearlTrace=null;
/* ═══════════ the pearl's current ═══════════
   An ECG trace across the whole card with a bright head travelling along it
   and a fading tail behind — what current looks like on a monitor.

   The waveform is rhythmMV(), the generator the hero strip and the rhythm lab
   already share, so this is a real sinus rhythm at a real rate rather than a
   decorative wave. The travelling head is the mechanic from the pressure-volume
   loop this replaces, which was the part worth keeping.

   IT IS BACKGROUND. Everything here is tuned to stay under the words: the
   resting trace is faint, the head is small, and the whole canvas is capped in
   opacity by CSS as well. prefers-reduced-motion gets the trace with no head
   moving along it, because a still line is still worth looking at. */
function mountPearlCurrent(){
  if(pearlTrace){ cancelAnimationFrame(pearlTrace.raf); pearlTrace=null; }
  const cv=document.getElementById('pearlCurrent'); if(!cv) return;
  if(typeof rhythmMV!=='function') return;
  const ctx=cv.getContext('2d'); if(!ctx) return;

  const still=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  const SPAN=4200;            // ms of rhythm across the card's width
  const state={raf:0}; let t0=0;

  function paint(now){
    const r=cv.getBoundingClientRect();
    if(!r.width||!r.height){ state.raf=requestAnimationFrame(paint); return; }
    const dpr=Math.min(window.devicePixelRatio||1,3);
    const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);

    /* Sampled per device pixel column, so the QRS stays a spike rather than
       being aliased into a bump on a wide card. */
    const N=Math.max(120,Math.min(1400,Math.round(r.width)));
    /* LOW IN THE CARD, AND SMALL. The trace is the card's pulse along its foot,
       not a wash across the prose — measured, a full-height trace at a readable
       brightness dropped the text contrast to 2.1:1 on the darker palettes. */
    const baseline=r.height*0.87;
    const amp=Math.min(r.height*0.13,34);
    const st={};
    const pts=new Array(N+1);
    for(let i=0;i<=N;i++){
      const x=i/N*r.width;
      pts[i]=[x, baseline-rhythmMV('sinus', i/N*SPAN, st)*amp];
    }

    const css=getComputedStyle(document.documentElement);
    const accent=(css.getPropertyValue('--teal')||'#0284C7').trim();
    /* A DARK THEME NEEDS A SMALLER BUDGET, and it is not obvious which way
       round. On a light card the text is near-black and a bright accent stroke
       stays far from it; on a dark card the text is near-white and the same
       bright accent moves TOWARD the text, so contrast collapses. Measured on
       the three darkest palettes it fell to 3.5:1 at the alphas that read
       correctly on Daylight. One factor, applied to every alpha below. */
    const K=(typeof themeIsDark==='function' && themeIsDark()) ? 0.5 : 1;
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=accent; ctx.fillStyle=accent;

    /* Every alpha here is budgeted against a contrast measurement, not chosen
       by eye: verify-pearl composites the brightest pixel this canvas paints
       over the card and fails the build under 4.5:1 in any of the eight
       themes. Raising any of them means re-running that check. */
    ctx.globalAlpha=.16*K; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<=N;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke();

    if(still){ ctx.globalAlpha=1; return; }

    if(!t0) t0=now;
    const u=((now-t0)%5200)/5200;
    const head=Math.max(1,Math.floor(u*N));
    const trail=Math.max(10,Math.round(N*0.13));
    /* ONE PATH FOR THE TAIL, NOT ONE STROKE PER SEGMENT. Stroked a segment
       at a time, the round caps overlapped and every overlap compounded: on
       the QRS, where the tail folds back on itself, three or four segments
       landed on one pixel and the brightest ink depended on where the head
       happened to be. Measured over one cycle that moved the canvas's peak
       alpha from .69 to .84 frame by frame, and Parchment's text contrast
       with it, to 4.48:1 in a full run. A single stroke paints each pixel
       once, so the fade comes from a gradient along x instead — the tail
       runs left to right, so x is the same ordering the index was. */
    const from=head-trail, s0=Math.max(0,from);
    const ac=(function(){ ctx.fillStyle=accent; const c=String(ctx.fillStyle);
      const h=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);
      if(h) return [parseInt(h[1],16),parseInt(h[2],16),parseInt(h[3],16)];
      const m=c.match(/[d.]+/g); return m&&m.length>=3 ? [+m[0],+m[1],+m[2]] : [2,132,199]; })();
    const fade=ctx.createLinearGradient(from/N*r.width,0,pts[head][0],0);
    fade.addColorStop(0,'rgba('+ac.join(',')+',0)');
    fade.addColorStop(1,'rgba('+ac.join(',')+','+(0.30*K)+')');
    ctx.globalAlpha=1; ctx.lineWidth=2.1; ctx.strokeStyle=fade;
    ctx.beginPath(); ctx.moveTo(pts[s0][0],pts[s0][1]);
    for(let i=s0+1;i<=head;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke();
    ctx.strokeStyle=accent; ctx.fillStyle=accent;
    const hp=pts[head];
    ctx.globalAlpha=.42*K;
    ctx.beginPath(); ctx.arc(hp[0],hp[1],2.2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=.09*K;
    ctx.beginPath(); ctx.arc(hp[0],hp[1],6.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    state.raf=requestAnimationFrame(paint);
  }
  state.raf=requestAnimationFrame(paint);
  pearlTrace=state;
}

    style:'specimen',

/* Harvested once, and cached: render() is called on every answer. "A few
   milliseconds of regex" was true of a few hundred notes; with the full shelf
   it was the largest cost left at launch on an iPad's CPU, so the seeded notes'
   pearls are found at build time (REF_PEARLS) and only notes edited or added
   on this device are searched here. Rebuilt when the library changes, which is
   what invalidateIndex signals. */
let pearlCache=null, pearlCurrent=null;
function pearlAll(){
  if(pearlCache) return pearlCache;
  try{ pearlCache=(typeof Pearl!=='undefined'&&typeof REF!=='undefined')?Pearl.harvest(REF, typeof REF_PEARLS==='object'?REF_PEARLS:null):[]; }
  catch(_){ pearlCache=[]; }

}
function pearlNow(){
  if(pearlCurrent) return pearlCurrent;

     caller already renders nothing for null, and verify-pearl ("no notes
     means no card, rather than an empty one") caught the fake card on the
     owner's next full run. A suite that needs a pearl needs notes. */
  if(!all.length) return null;
  try{ pearlCurrent=Pearl.pick(all, null); }catch(_){ pearlCurrent=all[0]; }
  return pearlCurrent;
}
/* The note's figure, when it has one. Shown beside the sentence rather than
   under it: a pearl about the wavefront of necrosis and the diagram of the
   wavefront belong on one line, and a diagram stacked underneath reads as a
   second, unrelated thing. */
function pearlFigure(p){
  if(!p||!p.figKey) return '';
  const src=(typeof refImgSrc==='function')?refImgSrc(p.figKey):'';
  if(!src) return '';
  const cap=(p.figCap||'').trim();
  return `<figure class="pearl-fig" id="pearlFig" onclick="openFigureFrom(this)" role="button" tabindex="0"
    title="${e(cap)}"><img src="${src}" alt="${e(cap||'Figure from this note')}" loading="lazy">
    ${cap?`<figcaption>${e(cap.length>150?cap.slice(0,149)+'…':cap)}</figcaption>`:''}</figure>`;
}
/* The measurements are what the question turns on, so they are marked. Applied
   AFTER escaping, and matching only digits and a unit word, so it can never
   reach into an entity the escaper produced — &amp; has no digit in it. */
const PEARL_NUM=/(\d[\d.,:]*(?:\s?[–—-]\s?\d[\d.,]*)?\s?(?:%|mg|mcg|kg|g\b|mmHg|mL|mm|cm|hours?|hrs?|days?|weeks?|months?|years?|minutes?|mins?|beats|bpm|mmol|mEq|msec|ms|mo)?)/g;
function pearlMark(escaped){
  return escaped.replace(PEARL_NUM,(m)=>/\d/.test(m)?`<b class="pearl-num">${m}</b>`:m);
}
/* One sentence, broken where it already bends. A single step means the
   sentence had no joint worth cutting — it is then set as prose rather than as
   a ladder of one, which would be a numbered list with nothing to order. */
function pearlLadder(p){
  let steps=[];
  try{ steps=(typeof Pearl!=='undefined')?Pearl.steps(p.text):[]; }catch(_){ steps=[]; }
  if(steps.length<2) return `<p class="pearl-body pearl-in">${pearlMark(e(p.text))}</p>`;
  return `<ol class="pearl-steps pearl-in">${steps.map((s,i)=>
    `<li class="pearl-step" style="--i:${i}"><span class="pearl-n">${i+1}</span>
      <span class="pearl-txt">${s.lead?`<em class="pearl-lead">${e(s.lead)}</em>`:''}${pearlMark(e(s.text))}</span></li>`).join('')}</ol>`;
}
function pearlNext(){
  const all=pearlAll();
  if(all.length<2) return;
  try{ pearlCurrent=Pearl.pick(all, pearlCurrent&&pearlCurrent.id); }catch(_){}
  const el=document.getElementById('pearlBody');
  if(!el||!pearlCurrent) return;
  /* Repaint in place: re-rendering the whole home screen to change one
     sentence would restart the ECG canvas and the heart behind it. Rebuilding
     the ladder from scratch also restarts its own stagger, which is the point
     — the steps should arrive one at a time on every pearl, not just the first. */
  el.innerHTML=pearlLadder(pearlCurrent);
  const cap=document.getElementById('pearlCap');
  if(cap) cap.textContent=pearlCurrent.chapter||'From your notes';
  /* The figure belongs to the note, so it has to move with the sentence —
     including disappearing when the next note has none. */
  const card=document.getElementById('pearlCard'), old=document.getElementById('pearlFig');
  if(old) old.remove();

/* ═══════════ Putting the whole bank on the device ═══════════
   Only meaningful in the split build — see the header of offline-patch.js. */
function offlineCapable(){
  return typeof window!=='undefined' && window.SPLIT_BUILD===true
      && typeof caches!=='undefined' && typeof IMGS!=='undefined';
}
/* Every distinct figure URL the bank references. IMGS is id → array of URLs in
   the split build; a data: URI here would mean the single-file build, where
   this whole feature is inapplicable, so those are filtered rather than
   fetched. */
function offlineFigures(){
  const seen=Object.create(null), out=[];
  try{
    for(const id in IMGS){
      const list=IMGS[id]; if(!list||!list.length) continue;
      for(const u of list){
        if(typeof u!=='string'||u.slice(0,5)==='data:'||seen[u]) continue;
        seen[u]=1; out.push(u);
      }
    }
  }catch(_){ }
  return out;
}
let offlineJob={have:0,total:0,bad:0,busy:false,stop:false,counted:false};
/* IS THIS ACTUALLY A FIGURE? Behind an authenticating proxy — Cloudflare
   Access, an SSO gateway, a captive portal on hospital wifi — an expired
   session does not answer with an error. It answers 200 OK with a login page.
   r.ok is true, the fetch resolves, and without this check the downloader
   would count four hundred sign-in forms as four hundred figures and cache
   every one of them, leaving the fellow with a bank of broken images and a
   progress bar that said everything was fine.

   The content type is the whole test: a figure is an image and a login page is
   not, whatever the status code says. */
function offlineIsImage(res){
  if(!res||!res.ok) return false;
  const ct=(res.headers.get('content-type')||'').toLowerCase();
  return ct.indexOf('image/')===0;
}
/* Something that is not a figure must not be left in the cache pretending to
   be one, or every later survey counts it as present. The worker's fetch
   handler has already stored it by the time we can look, so it is hunted down
   across whatever caches this origin has and removed. */
async function offlinePurge(url){
  try{
    const names=await caches.keys();
    for(const n of names){ const c=await caches.open(n); await c.delete(url); }
  }catch(_){ }
}
/* caches.match() with no cache named searches every cache the origin has, so
   this asks the same question the worker's fetch handler asks, without needing
   to know what the worker called its cache. */
async function offlineSurvey(){
  if(!offlineCapable()) return offlineJob;
  const urls=offlineFigures();
  offlineJob.total=urls.length;
  let have=0;
  for(let i=0;i<urls.length;i+=24){
    const batch=urls.slice(i,i+24);
    const hits=await Promise.all(batch.map(u=>
      caches.match(u).then(r=>offlineIsImage(r)).catch(()=>false)));
    have+=hits.filter(Boolean).length;
  }
  offlineJob.have=have; offlineJob.counted=true;
  offlinePaint();
  return offlineJob;
}
/* Six at a time. Enough to saturate a laptop on the same wifi, few enough that
   the tab stays responsive and a phone hotspot is not hammered. */
async function offlineDownload(){
  if(!offlineCapable()||offlineJob.busy) return;
  const urls=offlineFigures();
  offlineJob={have:offlineJob.have,total:urls.length,bad:0,busy:true,stop:false,counted:true};
  offlinePaint();
  const todo=[];
  for(const u of urls) if(!offlineIsImage(await caches.match(u).catch(()=>null))) todo.push(u);
  offlineJob.have=urls.length-todo.length;
  let i=0;
  async function worker(){
    while(i<todo.length&&!offlineJob.stop){
      const u=todo[i++];
      /* The response is discarded on purpose: the worker's fetch handler has
         already put a clone in the cache by the time this resolves, and
         holding 19 MB of decoded image in the tab would be the one way to
         make this feature worse than the problem. A failure is skipped
         rather than fatal — one missing figure is not a reason to abandon
         the other four hundred. */
      try{
        const r=await fetch(u,{cache:'no-store'});
        if(offlineIsImage(r)) offlineJob.have++;
        else { offlineJob.bad++; await offlinePurge(u); }
      }catch(_){ offlineJob.bad++; }
      offlinePaint();
    }
  }
  await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
  offlineJob.busy=false; offlineJob.stop=false;
  offlinePaint();
}
function offlineStop(){ offlineJob.stop=true; }
/* Repainted in place. render() would remount the hero — an ECG canvas and a
   WebGL heart — several hundred times over the course of a download. */
function offlinePaint(){
  const card=document.getElementById('offlineCard'); if(!card) return;
  const pct=offlineJob.total?Math.round(offlineJob.have/offlineJob.total*100):0;
  const done=offlineJob.counted&&offlineJob.total>0&&offlineJob.have>=offlineJob.total;
  card.classList.toggle('all-here',done);
  const bar=card.querySelector('.off-fill'); if(bar) bar.style.width=pct+'%';
  const val=card.querySelector('.off-val');
  if(val) val.textContent=!offlineJob.counted?'checking…'
    :done?`all ${offlineJob.total} figures on this device`
    :`${offlineJob.have} of ${offlineJob.total} figures here`;
  /* Said out loud rather than swallowed: a silent shortfall is how you end up
     revising from a bank of broken images. */
  const note=card.querySelector('.off-note');
  if(note) note.textContent=offlineJob.bad
    ?`${offlineJob.bad} did not come back as an image — if this is behind a sign-in, open it in a browser tab, sign in again, and retry.`
    :done?'This device has the whole bank. It works with no network at all.'
    :'Pull every figure down once and the bank works with no network at all.';
  card.classList.toggle('has-trouble',offlineJob.bad>0);
  const btn=card.querySelector('.off-btn');
  if(btn){
    btn.textContent=offlineJob.busy?'Stop':done?'Up to date':'Download the rest';
    btn.disabled=!offlineJob.busy&&done;
    btn.onclick=offlineJob.busy?offlineStop:offlineDownload;
  }
}
/* Counts every .hp-num up from 0 to its data-count over the same window the
   bar spends growing. A no-op wherever the card is not on screen — called
   unconditionally from renderNow(), the same as every other mount* here. */
function mountHomeProgress(){
  const nums=document.querySelectorAll('#homeProgress .hp-num');
  if(!nums.length)return;
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  nums.forEach(el=>{
    const target=+el.dataset.count||0;
    if(reduced){ el.textContent=target; return; }
    const dur=900,start=performance.now();
    const tick=now=>{
      /* CLAMPED AT BOTH ENDS, and the lower end is not theoretical. start is
         a performance.now() taken when the animation is scheduled; now is
         the timestamp requestAnimationFrame hands the callback, which is the
         START of that frame. Schedule from inside a frame's own task — which
         is exactly what happens here, because render() runs this from a view
         transition callback — and the next callback can carry a timestamp
         EARLIER than start. t then goes negative, 1-(1-t)^3 goes negative
         with it, and the card paints "-2" before counting up. Caught by
         verify-homeprog about one run in three, with data-count reading a
         perfectly valid 91 and 100 while the text read -1 and -2. */
      const t=Math.max(0,Math.min(1,(now-start)/dur));
      const eased=1-Math.pow(1-t,3);
      el.textContent=Math.round(target*eased);
      if(t<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

   in a place where they are the subject rather than the remainder. The markup
   is the home screen's own, moved rather than rewritten — same classes, same

/* Sets every .ct-bar to its real width after the tiles it belongs to are in

   transition to run from. Two animation frames, not one: the first commits
   the width:0 the markup shipped, the second sets the target, so the browser
   has actually painted the starting state before the transition is asked to

  const bars=document.querySelectorAll('.ct-bar i[data-w]');
  if(!bars.length)return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bars.forEach(b=>{ b.style.width=(b.dataset.w||'0')+'%'; });
  }));
}
function buildStudy(){
  const dueN=dueQuestions().length, seenN=startedCount();

  const stories=CHAPTERS.map(ch=>{
    const m=masteryFor(ch), col=CH_COLORS[ch]||'var(--teal)';
    const R=27,C=2*Math.PI*R;
    return `<button class="story" onclick="startQuiz(${JSON.stringify(ch).replace(/"/g,'&quot;')})"
        style="--accent:${col}" aria-label="${e(ch)}, ${Math.round(m*100)} percent mastered">
      <span class="story-ring">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--border)" stroke-width="4"/>
          <circle cx="32" cy="32" r="${R}" fill="none" stroke="${col}" stroke-width="4"
            stroke-dasharray="${C}" stroke-dashoffset="${C*(1-m)}" stroke-linecap="round"
            transform="rotate(-90 32 32)"/>
        </svg>
        <span class="story-ico">${chIcon(ch)}</span>
      </span>
      <span class="story-lbl">${e(CH_SHORT[ch]||ch.split(' ')[0])}</span>

  }).join('');

  const reviewCard=`<button class="feed-card review-card${dueN?' live':''}" onclick="startQuiz(null,'due')">
    <div class="fc-glow"></div>
    <div class="fc-top">
      <span class="fc-badge">${dueN?'DUE NOW':'SPACED REPETITION'}</span>
      ${S.reviewStreak>0?`<span class="fc-streak">${S.reviewStreak}d ${icon("flame","icon-sm")}</span>`:''}
    </div>
    <div class="fc-title">${dueN?`${dueN} card${dueN===1?'':'s'} ready`:seenN?'All caught up':'Start your review queue'}</div>
    <div class="fc-sub">${dueN?'Recall them before the curve drops':seenN?'Next reviews are scheduled':'Active recall, scheduled by FSRS-5'}</div>
    <div class="fc-cta">${dueN?'Review now':'Begin'} ${icon('arrow-right','icon-sm')}</div>
  </button>`;

  const planPreview=planNow(20), ready=StudyPlan.readiness({pool:POOL,srs:S.srs,chStats:S.chStats,recentPerDay:recentPerDay(),examDate:S.examDate});
  const readyLine=ready.status==='no-data'?'':ready.text;
  /* Two rings: the outer is how much of the bank has been seen, the inner how much of that is remembered today. */
  const seenF=ready.total?ready.seen/ready.total:0, recallF=ready.retention==null?0:ready.retention;
  const recallPct=ready.retention==null?null:Math.round(ready.retention*100);
  const PACE={ahead:['Ahead','good'],'on-track':['On track','ok'],behind:['Behind','warn']}[ready.status];
  const daysLeft=examDaysLeft();
  const planCard=`<div class="feed-card plan-card" id="planCard" role="group" aria-label="Study plan">
    <div class="fc-glow" aria-hidden="true"></div>
    <div class="fc-top"><span class="fc-badge">${icon('clock')} STUDY PLAN</span>${PACE?`<span class="pace-pill ${PACE[1]}" id="pacePill" data-status="${ready.status}">${PACE[0]}</span>`:''}</div>
    <div class="plan-hero">
      <div class="plan-gauge" id="planGauge" role="img" aria-label="Seen ${Math.round(seenF*100)}% of the bank${recallPct==null?'':`, remembering about ${recallPct}% of it today`}">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="pg-track" cx="60" cy="60" r="52"/>${arc('pg-seen',60,60,52,seenF)}
          <circle class="pg-track" cx="60" cy="60" r="40"/>${arc('pg-recall',60,60,40,recallF)}
        </svg>
        <div class="pg-mid"><b>${recallPct==null?Math.round(seenF*100)+'%':recallPct+'%'}</b><span>${recallPct==null?'seen':'recall'}</span></div>
      </div>
      <div class="plan-copy">
        <div class="fc-title">I have…</div>
        <div class="fc-sub" id="planSub">${e(planPreview.text)}</div>
        <div class="pg-legend"><span class="lg-seen">Seen ${ready.seen} of ${ready.total}</span>${recallPct==null?'':`<span class="lg-recall">Recall ${recallPct}%</span>`}</div>
      </div>
    </div>
    ${readyLine?`<div class="fc-sub plan-ready" id="planReady">${e(readyLine)}</div>`:''}
    <div class="chips plan-chips">${[10,20,40].map(m=>`<button class="chip plan-chip" data-plan="${m}" onclick="startPlan(${m})" aria-label="${m} minutes">
      <svg class="mini-ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="mr-track" cx="12" cy="12" r="9"/>${arc('mr-arc',12,12,9,m/40)}</svg>
      <b>${m}</b><span>min</span></button>`).join('')}</div>
    <div class="exam-tile${daysLeft!=null&&daysLeft>0?' set':''}">
      <span class="exam-ico" aria-hidden="true">${icon('calendar')}</span>
      <div class="exam-main">
        <label for="examDate">Exam date</label>
        <div class="exam-ctl"><input type="date" id="examDate" value="${S.examDate||''}" onchange="setExamDate(this.value)">
          ${S.examDate?`<button class="exam-x" id="examClear" onclick="setExamDate('')" aria-label="Clear the exam date" title="Clear">${icon('x')}</button>`:''}</div>
        <span class="exam-left" id="examLeft">${e(examLeftText())}</span>
      </div>
      ${daysLeft!=null&&daysLeft>0?`<div class="exam-count" aria-hidden="true"><b id="examDays">${daysLeft}</b><span>${daysLeft===1?'day':'days'}</span></div>`:''}
    </div>
  </div>`;

  _runsShown=topicRunsNow();
  const runCard=_runsShown.length?`<div class="feed-card run-card" id="runCard" role="group" aria-label="Topic runs">
    <div class="fc-top"><span class="fc-badge">${icon('layers')} TOPIC RUNS</span></div>
    <div class="fc-title">Same topic, back to back</div>
    <div class="fc-sub">Three to five questions about one thing, from what you most need.</div>
    <div class="run-list">${_runsShown.map((r,i)=>{
      const words=r.shared.slice(0,3).join(' · ');
      return `<button class="run-btn" data-run="${i}" data-ch="${e(r.ch)}" style="--ch:${CH_COLORS[r.ch]||'var(--teal)'}" onclick="startRun(${i})">
        <span class="run-ico" aria-hidden="true">${icon(CH_ICONS[r.ch]||'layers')}</span>
        <span class="run-t"><b>${e(CH_SHORT[r.ch]||r.ch)}</b>${words?`<span class="run-w"> — ${e(words)}</span>`:''}</span>
        <span class="run-side"><span class="run-pips" aria-hidden="true">${'<i></i>'.repeat(r.ids.length)}</span><span class="run-n">${r.ids.length} questions</span></span>
      </button>`;}).join('')}</div>
  </div>`:'';

  const voiceCard=voiceAvailable()?`<div class="feed-card voice-card" id="voiceCard" role="group" aria-label="Voice session">
    <div class="fc-top"><span class="fc-badge">${icon('mic')} VOICE</span></div>
    <div class="voice-hero">
      <span class="voice-orb" aria-hidden="true"><span class="vo-ring"></span><span class="vo-ring r2"></span>${icon('mic')}</span>
      <div><div class="fc-title">Hands full? Answer out loud</div>
      <div class="fc-sub">Ten questions, read aloud. Needs the microphone.</div></div>
    </div>
    <div class="voice-wave" aria-hidden="true">${Array.from({length:28},(_,k)=>`<i style="--k:${k}"></i>`).join('')}</div>
    <div class="voice-say">Say <kbd>A</kbd>–<kbd>E</kbd> <kbd>repeat</kbd> <kbd>skip</kbd> <kbd>explain</kbd> <kbd>stop</kbd></div>
    <button class="voice-go" id="voiceStart" onclick="startVoice()">${icon('mic')}<span>Start a voice session</span></button>
  </div>`:'';

  const missCard=S.missed.size>0?`<button class="feed-card miss-card" onclick="startQuiz(null,'missed')">
    <div class="fc-top"><span class="fc-badge red">WEAK SPOTS</span></div>
    <div class="fc-title">${S.missed.size} to reclaim</div>
    <div class="fc-sub">Questions you have missed at least once</div>
    <div class="fc-cta">Drill them ${icon('arrow-right','icon-sm')}</div>
  </button>`:'';

  const chCards=CHAPTERS.map(ch=>{
    const cnt=POOL.filter(q=>q.ch===ch).length;
    const fig=POOL.filter(q=>q.ch===ch&&q.img).length;
    const st=S.chStats[ch]||{correct:0,total:0};
    const cp=st.total>0?Math.round(st.correct/st.total*100):-1;
    const m=masteryFor(ch);
    const col=CH_COLORS[ch]||'#5EEAD4';
    return `<button class="ch-tile" onclick="startQuiz(${JSON.stringify(ch).replace(/"/g,'&quot;')})"
        style="--accent:${col}">
      <span class="ct-ico">${chIcon(ch)}</span>
      <span class="ct-name">${e(ch)}</span>
      <span class="ct-meta">${cnt} Q${fig?` · ${fig} figures`:''}</span>
      <span class="ct-bar"><i style="width:0" data-w="${Math.round(m*100)}"></i></span>

  return `<div class="home-wrap anim-fade study-wrap">
    <div class="study-head">
      <button class="study-back" onclick="goHome()">${icon('arrow-left','icon-sm')} Home</button>
    </div>

    <div class="study-title">
      <h2>Chapters</h2>
      <p>${TOTAL_Q} questions across ${CHAPTERS.length} chapters, the review queue
         scheduled by FSRS-5, and the full shuffle.</p>
    </div>

    <div class="story-rail">${stories}</div>

    <div class="feed">
      ${reviewCard}
      ${planCard}
      ${runCard}
      ${voiceCard}

      <button class="feed-card all-card" onclick="startQuiz(null)">

        <div class="fc-title">Shuffle all ${TOTAL_Q}</div>
        <div class="fc-sub">Every chapter, random order</div>
        <div class="fc-cta">Start ${icon('arrow-right','icon-sm')}</div>
